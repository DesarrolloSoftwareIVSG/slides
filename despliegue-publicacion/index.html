</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-significa-desplegar">¿Qué significa &quot;desplegar&quot;?</h2>
<ul>
<li><strong>Desplegar</strong> es llevar el código desde la máquina del equipo hasta un lugar donde <strong>los usuarios reales</strong> puedan usarlo</li>
<li><strong>Publicar</strong> (en móvil) es hacerlo llegar a una <strong>tienda</strong> que lo distribuye a los dispositivos</li>
</ul>
<pre><code class="language-text"> código ──► empaquetado ──► artefacto ──► hospedaje ──► servidor web ──► dominio ──► <img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> usuario
 (repo)     (build)         (dist/,       (dónde        (quién sirve      (cómo lo
                             imagen,       vive)         las peticiones)   encuentra)
                             AAB / IPA)
</code></pre>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A6-empaquetado"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Empaquetado</h3>
<p>Transformar el código fuente en algo <strong>ejecutable y optimizado</strong></p>
</div>
<div>
<h3 id="%F0%9F%8F%A0-hospedaje"><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e0.svg" data-marp-twemoji=""/> Hospedaje</h3>
<p>Elegir <strong>dónde</strong> corre: CDN, PaaS, VPS, contenedores</p>
</div>
<div>
<h3 id="%F0%9F%8C%90-servidor-web"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Servidor web</h3>
<p>El programa que <strong>atiende</strong> HTTP/HTTPS: Nginx, Apache, Caddy</p>
</div>
<div>
<h3 id="%F0%9F%94%A4-dominio"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f524.svg" data-marp-twemoji=""/> Dominio</h3>
<p>El <strong>nombre</strong> que se traduce, vía DNS, a una dirección IP</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="entornos-no-todo-se-prueba-en-producci%C3%B3n">Entornos: no todo se prueba en producción</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.88rem;">
<div>
<table>
<thead>
<tr>
<th style="text-align:left">Entorno</th>
<th style="text-align:left">Para qué</th>
<th style="text-align:left">Datos</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>Local</strong></td>
<td style="text-align:left">Desarrollar</td>
<td style="text-align:left">Ficticios (<em>seeders</em>)</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <strong>Pruebas / CI</strong></td>
<td style="text-align:left">Ejecutar las pruebas automáticas</td>
<td style="text-align:left">Efímeros</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> <strong>Staging</strong></td>
<td style="text-align:left">Ensayo general, idéntico a producción</td>
<td style="text-align:left">Anonimizados</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>Producción</strong></td>
<td style="text-align:left">Usuarios reales</td>
<td style="text-align:left">Reales</td>
</tr>
</tbody>
</table>
</div>
<div>
<ul>
<li>Cada entorno tiene su <strong>propio</strong> <code>.env</code>, base de datos y claves</li>
<li><em>Staging</em> debe parecerse a producción lo <strong>más posible</strong>: misma versión de PHP, Node, BD y servidor web</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> &quot;En mi máquina sí funciona&quot; casi siempre es una <strong>diferencia de entorno</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los <strong>12 factores</strong> (<a href="https://12factor.net/es/">12factor.net</a>): la configuración vive en <strong>variables de entorno</strong>, no en el código</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-desplegamos-en-el-proyecto-del-curso">¿Qué desplegamos en el proyecto del curso?</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-front-end-spa-vue--vite"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> Front-end SPA (Vue + Vite)</h3>
<p>Archivos <strong>estáticos</strong>: HTML, CSS, JS e imágenes. Cualquier CDN los sirve</p>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-api-laravel-13"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> API (Laravel 13)</h3>
<p>Proceso <strong>dinámico</strong>: PHP-FPM + base de datos + colas. Necesita un servidor</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-sitio-ssr--ssg-astro-nuxt"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Sitio SSR / SSG (Astro, Nuxt)</h3>
<p>SSG = estático. SSR = necesita un <strong>runtime</strong> (Node, <em>edge</em>)</p>
</div>
<div>
<h3 id="%F0%9F%93%B1-app-m%C3%B3vil-ionic--capacitor"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> App móvil (Ionic + Capacitor)</h3>
<p>Un <strong>AAB</strong> para Google Play y un <strong>IPA</strong> para la App Store, firmados</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> La pregunta que decide todo: <strong>¿hay código que se ejecuta en el servidor por cada petición?</strong> Si no, el despliegue es mucho más simple y barato</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-RXdKHjPW="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="5" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="711-empaquetado">7.1.1 Empaquetado</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Qué hace un <em>build</em> de producción</li>
<li>Vite: <code>dist/</code>, variables de entorno y <code>base</code></li>
<li>Empaquetado de Laravel</li>
<li>Contenedores como artefacto</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-hace-un-build-de-producci%C3%B3n">¿Qué hace un <em>build</em> de producción?</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.88rem;">
<div>
<h3 id="%F0%9F%94%A7-transformaciones"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Transformaciones</h3>
<ul>
<li><strong>Transpilar</strong>: TypeScript, <code>.vue</code>, JSX → JavaScript que entiende el navegador</li>
<li><strong>Empaquetar</strong> (<em>bundling</em>): cientos de módulos → pocos archivos</li>
<li><strong>Minificar</strong>: quitar espacios, acortar nombres</li>
<li><strong>Tree shaking</strong>: eliminar código que nunca se usa</li>
<li><strong>Code splitting</strong>: un <em>chunk</em> por ruta con <code>import()</code> dinámico</li>
<li><strong>Optimizar</strong> imágenes y CSS</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8F%B7%EF%B8%8F-nombres-con-hash"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> Nombres con <em>hash</em></h3>
<pre><code class="language-text">dist/
├── index.html
└── assets/
    ├── index-B4x9kQ2a.js
    ├── index-D8fLm1zc.css
    └── PedidosView-Cq3pT7.js
</code></pre>
<ul>
<li>El <em>hash</em> cambia <strong>solo si cambia el contenido</strong></li>
<li>Permite caché agresiva: <code>Cache-Control: max-age=31536000, immutable</code></li>
<li><code>index.html</code> <strong>nunca</strong> se cachea: es el que apunta a los nuevos archivos</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Lo medimos en <em>Rendimiento web</em>: el tamaño del <em>bundle</em> impacta directamente en LCP e INP</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="build-con-vite">Build con Vite</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-bash">pnpm run build     <span class="hljs-comment"># vite build → genera dist/</span>
pnpm run preview   <span class="hljs-comment"># sirve dist/ localmente</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// vite.config.js</span>
<span class="hljs-keyword">import</span> { defineConfig } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vite&#x27;</span>;
<span class="hljs-keyword">import</span> vue <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@vitejs/plugin-vue&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">defineConfig</span>({
  <span class="hljs-attr">plugins</span>: [<span class="hljs-title function_">vue</span>()],
  <span class="hljs-attr">base</span>: <span class="hljs-string">&#x27;/&#x27;</span>,            <span class="hljs-comment">// &#x27;/repo/&#x27; en GitHub Pages</span>
  <span class="hljs-attr">build</span>: {
    <span class="hljs-attr">outDir</span>: <span class="hljs-string">&#x27;dist&#x27;</span>,
    <span class="hljs-attr">sourcemap</span>: <span class="hljs-literal">false</span>,   <span class="hljs-comment">// no publicar el código fuente</span>
  },
});
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>Nunca</strong> se despliega lo que sirve <code>pnpm dev</code>: es un servidor de desarrollo, sin optimizar</li>
<li><strong>Siempre</strong> probar con <code>preview</code> antes de subir: aparecen errores de rutas y de <code>base</code></li>
<li><code>base</code> es la <strong>ruta</strong> donde vivirá el sitio. En GitHub Pages es <code>/nombre-repo/</code> (lo vimos en <em>JS avanzado</em>)</li>
<li>Los <em>source maps</em> ayudan a depurar, pero exponen el código: súbelos a la herramienta de errores (Sentry), no al público</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="variables-de-entorno-en-el-front-end">Variables de entorno en el front-end</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># .env.development</span>
VITE_API_URL=http://localhost:8000/api

<span class="hljs-comment"># .env.production</span>
VITE_API_URL=https://api.proyecto.ucr.ac.cr/api
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> api = <span class="hljs-keyword">import</span>.<span class="hljs-property">meta</span>.<span class="hljs-property">env</span>.<span class="hljs-property">VITE_API_URL</span>;
</code></pre>
<pre><code class="language-bash">vite build                  <span class="hljs-comment"># usa .env.production</span>
vite build --mode staging   <span class="hljs-comment"># usa .env.staging</span>
</code></pre>
</div>
<div>
<ul>
<li>Vite <strong>reemplaza</strong> las variables <code>VITE_*</code> en el momento del <em>build</em>: quedan <strong>escritas</strong> en el JS final</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Por eso <strong>no son secretas</strong>: cualquiera las lee con las DevTools</li>
<li>Solo van aquí datos <strong>públicos</strong>: URL de la API, clave pública de mapas, nombre del entorno</li>
<li>Cambiar una variable exige <strong>volver a compilar</strong> el front-end</li>
<li><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Los secretos viven <strong>solo</strong> en el servidor (<code>.env</code> de Laravel), nunca en el <em>bundle</em></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="empaquetado-de-una-aplicaci%C3%B3n-laravel">Empaquetado de una aplicación Laravel</h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.82rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># 1. Dependencias de PHP, sin las de desarrollo</span>
composer install --no-dev --optimize-autoloader

<span class="hljs-comment"># 2. Recursos del front-end (si Laravel los sirve)</span>
pnpm install --frozen-lockfile
pnpm run build          <span class="hljs-comment"># public/build/ + manifest</span>

<span class="hljs-comment"># 3. Cachés de producción</span>
php artisan optimize    <span class="hljs-comment"># config, rutas, vistas y eventos</span>

<span class="hljs-comment"># 4. Base de datos</span>
php artisan migrate --force

<span class="hljs-comment"># 5. Enlace del almacenamiento público</span>
php artisan storage:<span class="hljs-built_in">link</span>
</code></pre>
</div>
<div>
<ul>
<li>El <strong>artefacto</strong> es la carpeta del proyecto <strong>sin</strong> <code>node_modules</code>, <code>tests/</code> ni <code>.env</code></li>
<li><code>--no-dev</code> deja fuera Pest, Faker y herramientas de depuración</li>
<li><code>optimize</code> acelera el arranque, pero tras cambiar <code>.env</code> hay que <strong>volver a ejecutarlo</strong> (<code>optimize:clear</code>)</li>
<li><code>--force</code> es obligatorio: en producción Artisan <strong>pide confirmación</strong> antes de migrar</li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Recuerda de <em>Seguridad</em>: <code>APP_ENV=production</code> y <code>APP_DEBUG=false</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="contenedores-el-artefacto-que-corre-igual-en-todos-lados">Contenedores: el artefacto que corre igual en todos lados</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-dockerfile"><span class="hljs-comment"># Etapa 1: compilar el front-end</span>
<span class="hljs-keyword">FROM</span> node:<span class="hljs-number">24</span>-alpine AS front
<span class="hljs-keyword">WORKDIR</span><span class="language-bash"> /app</span>
<span class="hljs-keyword">COPY</span><span class="language-bash"> package.json pnpm-lock.yaml ./</span>
<span class="hljs-keyword">RUN</span><span class="language-bash"> corepack <span class="hljs-built_in">enable</span> &amp;&amp; pnpm install --frozen-lockfile</span>
<span class="hljs-keyword">COPY</span><span class="language-bash"> . .</span>
<span class="hljs-keyword">RUN</span><span class="language-bash"> pnpm run build</span>

<span class="hljs-comment"># Etapa 2: servirlo con Nginx</span>
<span class="hljs-keyword">FROM</span> nginx:<span class="hljs-number">1.28</span>-alpine
<span class="hljs-keyword">COPY</span><span class="language-bash"> --from=front /app/dist /usr/share/nginx/html</span>
<span class="hljs-keyword">COPY</span><span class="language-bash"> nginx.conf /etc/nginx/conf.d/default.conf</span>
<span class="hljs-keyword">EXPOSE</span> <span class="hljs-number">80</span>
</code></pre>
<pre><code class="language-bash">docker build -t proyecto-web:1.4.0 .
docker run -p 8080:80 proyecto-web:1.4.0
</code></pre>
</div>
<div>
<ul>
<li>Una <strong>imagen</strong> empaqueta el código <strong>y</strong> su entorno: SO base, runtime, dependencias</li>
<li><strong>Multi-etapa</strong>: la imagen final no lleva Node ni <code>node_modules</code>, solo el resultado</li>
<li>Etiquetar con la <strong>versión</strong>, no solo <code>latest</code></li>
<li><code>.dockerignore</code> para no copiar <code>.env</code>, <code>.git</code> ni <code>node_modules</code></li>
<li><img class="emoji" draggable="false" alt="🐳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f433.svg" data-marp-twemoji=""/> <strong>Docker Compose</strong> levanta API + BD + Redis en local con un solo comando</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="versionado-sem%C3%A1ntico-del-artefacto">Versionado semántico del artefacto</h2>
<ul>
<li>Cada despliegue debe poder responder: <strong>¿qué versión está en producción?</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%94%A2-semver"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> SemVer</h3>
<p><code>MAYOR.MENOR.PARCHE</code> → <code>2.3.1</code><br />

La etiqueta apunta al commit <strong>exacto</strong> desplegado</p>

<h2 id="modelos-de-hospedaje">Modelos de hospedaje</h2>

<table>
<thead>
<tr>
<th style="text-align:left">Modelo</th>
<th style="text-align:left">Qué te dan</th>
<th style="text-align:left">Ejemplos</th>
<th style="text-align:left">Ideal para</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> <strong>Estático / CDN</strong></td>
<td style="text-align:left">Archivos servidos desde cientos de nodos</td>
<td style="text-align:left">GitHub Pages, Netlify, Cloudflare, Vercel</td>
<td style="text-align:left">SPA, SSG, documentación</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> <strong>PaaS</strong></td>
<td style="text-align:left">Subes el código, la plataforma ejecuta y escala</td>
<td style="text-align:left">Laravel Cloud, Render, Railway, Heroku, Fly.io</td>
<td style="text-align:left">APIs, equipos pequeños</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>Serverless / Edge</strong></td>
<td style="text-align:left">Funciones que corren por petición, pagas por uso</td>

<td style="text-align:left">SSR, picos de tráfico</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🐳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f433.svg" data-marp-twemoji=""/> <strong>Contenedores</strong></td>

<td style="text-align:left">Varios servicios</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5a5.svg" data-marp-twemoji=""/> <strong>VPS / IaaS</strong></td>
<td style="text-align:left">Una máquina virtual con <em>root</em>: todo lo instalas tú</td>

<td style="text-align:left">Control total, costo fijo</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🏚️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3da.svg" data-marp-twemoji=""/> <strong>Compartido</strong></td>
<td style="text-align:left">Un espacio en un servidor con cPanel</td>

<td style="text-align:left">Sitios PHP sencillos</td>
</tr>

</table>
<ul>

</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="el-modelo-de-responsabilidad-compartida">El modelo de responsabilidad compartida</h2>
<pre><code class="language-text">                    On-premise     IaaS / VPS     PaaS          Serverless     SaaS
 Aplicación y datos    TÚ             TÚ           TÚ            TÚ            proveedor*
 Runtime (PHP, Node)   TÚ             TÚ           proveedor     proveedor     proveedor
 Sistema operativo     TÚ             TÚ           proveedor     proveedor     proveedor
 Virtualización        TÚ             proveedor    proveedor     proveedor     proveedor
 Hardware y red        TÚ             proveedor    proveedor     proveedor     proveedor
</code></pre>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<ul>
<li>En un <strong>VPS</strong> tú actualizas el SO, configuras el firewall, instalas PHP y renuevas certificados</li>
<li>En un <strong>PaaS</strong> la plataforma se encarga de eso; tú solo del código y la configuración</li>
</ul>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En <strong>todos</strong> los modelos, tus <strong>datos</strong> y el <strong>control de acceso</strong> son tu responsabilidad</li>
<li>* Incluso en SaaS sigues decidiendo quién tiene acceso</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="opciones-para-el-proyecto-del-curso">Opciones para el proyecto del curso</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-front-end-vue--vite"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> Front-end (Vue + Vite)</h3>
<ul>
<li><strong>GitHub Pages</strong> — gratis, ideal para repos públicos; ruta <code>/repo/</code></li>
<li><strong>Netlify / Vercel</strong> — despliegue por cada <code>push</code>, URL de vista previa por cada PR</li>
<li><strong>Cloudflare Workers</strong> (<em>static assets</em>) — Cloudflare ya recomienda Workers sobre Pages para proyectos nuevos</li>
</ul>
<h3 id="%F0%9F%93%B1-pwa"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> PWA</h3>
<ul>
<li>Igual que un sitio estático, pero <strong>exige HTTPS</strong> para el <em>service worker</em></li>
</ul>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-api-laravel-13-1"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> API (Laravel 13)</h3>
<ul>
<li><strong>Laravel Cloud</strong> — PaaS oficial, plan inicial por uso, BD y colas administradas</li>
<li><strong>Laravel Forge</strong> — administra <strong>tu propio</strong> VPS (DigitalOcean, Hetzner, AWS)</li>
<li><strong>Render / Railway / Fly.io</strong> — con un <code>Dockerfile</code></li>
<li><strong>VPS manual</strong> — Nginx + PHP-FPM + MySQL/PostgreSQL: el más didáctico</li>
</ul>
<h3 id="%F0%9F%97%84%EF%B8%8F-base-de-datos"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Base de datos</h3>
<ul>
<li>Administrada (Neon, Supabase, PlanetScale, RDS) o en el mismo VPS</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Los planes gratuitos <strong>cambian seguido</strong> y suelen &quot;dormir&quot; la app tras inactividad: revisa los términos vigentes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="c%C3%B3mo-elegir-un-hospedaje">Cómo elegir un hospedaje</h2>
<div class="grid">
<div>
<h3 id="%E2%9A%99%EF%B8%8F-tipo-de-app"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> Tipo de app</h3>
<p>¿Estática, SSR, API con BD, colas, <em>websockets</em>?</p>
</div>
<div>
<h3 id="%F0%9F%92%B0-costo"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> Costo</h3>
<p>Fijo (VPS) vs. por uso (serverless). Cuidado con la <strong>transferencia</strong> de datos y los límites</p>
</div>
<div>
<h3 id="%F0%9F%93%8D-regi%C3%B3n-y-latencia"><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> Región y latencia</h3>
<p>Cerca de los usuarios. Para Costa Rica: regiones de EE. UU. este o México</p>
</div>
<div>
<h3 id="%F0%9F%93%88-escalado"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Escalado</h3>
<p>¿Escala solo? ¿Escala a cero? ¿Cuánto tarda el arranque en frío?</p>
</div>
<div>
<h3 id="%F0%9F%A7%91%E2%80%8D%F0%9F%94%A7-operaci%C3%B3n"><img class="emoji" draggable="false" alt="🧑‍🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1-200d-1f527.svg" data-marp-twemoji=""/> Operación</h3>
<p>¿Quién parcha el SO, hace respaldos y renueva TLS?</p>
</div>
<div>
<h3 id="%F0%9F%94%92-cumplimiento"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Cumplimiento</h3>
<p>Dónde se guardan los datos personales (<strong>Ley 8968</strong>), SLA, soporte</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Evitar el <strong>encierro</strong> con el proveedor (<em>vendor lock-in</em>): un <code>Dockerfile</code> y variables de entorno hacen la app <strong>portable</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-VHgVeZln="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="17" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="713-servidores-web">7.1.3 Servidores web</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Qué hace un servidor web</li>
<li>Nginx, Apache, Caddy y FrankenPHP</li>
<li>Configuración para una SPA y para Laravel</li>
<li>Proxy inverso, HTTPS, compresión y caché</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFqu%C3%A9-hace-un-servidor-web">¿Qué hace un servidor web?</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text"> navegador ──HTTPS:443──► ┌───────────────┐
                          │  Servidor web │──► archivos estáticos (dist/)
                          │    (Nginx)    │
                          └───────┬───────┘
                                  │ proxy / FastCGI
                     ┌────────────┴───────────┐
                     ▼                        ▼
               PHP-FPM (Laravel)       Node (SSR, NestJS)
                     │
                     ▼
                  MySQL / PostgreSQL
</code></pre>
</div>
<div>
<ul>
<li><strong>Escucha</strong> en los puertos 80 (HTTP) y 443 (HTTPS)</li>
<li><strong>Termina TLS</strong>: descifra HTTPS y gestiona el certificado</li>
<li><strong>Sirve estáticos</strong> muy rápido, sin pasar por PHP ni Node</li>
<li><strong>Proxy inverso</strong>: reenvía las peticiones dinámicas a la aplicación</li>
<li>Comprime, cachea, limita peticiones y agrega <strong>encabezados</strong> de seguridad</li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> La aplicación (Express, Laravel) <strong>no</strong> debería exponerse directamente a Internet</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="servidores-web-m%C3%A1s-usados">Servidores web más usados</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9F%A9-nginx"><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Nginx</h3>
<p>El más usado en la web. Basado en <strong>eventos</strong>, muy eficiente con miles de conexiones. Proxy inverso por excelencia</p>
</div>
<div>
<h3 id="%F0%9F%AA%B6-apache-http-server"><img class="emoji" draggable="false" alt="🪶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fab6.svg" data-marp-twemoji=""/> Apache HTTP Server</h3>
<p>El clásico del stack <strong>LAMP</strong>. Configuración por carpeta con <code>.htaccess</code> (común en hosting compartido)</p>
</div>
<div>
<h3 id="%F0%9F%94%92-caddy"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Caddy</h3>
<p>Escrito en Go. <strong>HTTPS automático</strong> con Let's Encrypt sin configurar nada. Archivo de configuración mínimo</p>
</div>
<div>
<h3 id="%F0%9F%90%98-frankenphp"><img class="emoji" draggable="false" alt="🐘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f418.svg" data-marp-twemoji=""/> FrankenPHP</h3>
<p>Servidor moderno sobre Caddy que <strong>incrusta PHP</strong>. Soportado por Laravel Octane para mantener la app en memoria</p>
</div>
<div>
<h3 id="%F0%9F%AA%9F-iis--kestrel"><img class="emoji" draggable="false" alt="🪟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa9f.svg" data-marp-twemoji=""/> IIS / Kestrel</h3>
<p>IIS en Windows Server; <strong>Kestrel</strong> es el servidor de ASP.NET Core (detrás de un proxy)</p>
</div>
<div>
<h3 id="%E2%98%81%EF%B8%8F-gestionados"><img class="emoji" draggable="false" alt="☁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2601.svg" data-marp-twemoji=""/> Gestionados</h3>
<p>Los CDN y PaaS traen su propio servidor: <strong>no</strong> lo configuras tú</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="nginx-para-una-spa">Nginx para una SPA</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-nginx"><span class="hljs-section">server</span> {
    <span class="hljs-attribute">listen</span> <span class="hljs-number">80</span>;
    <span class="hljs-attribute">server_name</span> proyecto.ucr.ac.cr;
    <span class="hljs-attribute">root</span> /var/www/proyecto/dist;
    <span class="hljs-attribute">index</span> index.html;

    <span class="hljs-comment"># Rutas del cliente: /pedidos/42 → index.html</span>
    <span class="hljs-section">location</span> / {
        <span class="hljs-attribute">try_files</span> <span class="hljs-variable">$uri</span> <span class="hljs-variable">$uri</span>/ /index.html;
    }

    <span class="hljs-comment"># Archivos con hash: caché de un año</span>
    <span class="hljs-section">location</span> /assets/ {
        <span class="hljs-attribute">expires</span> <span class="hljs-number">1y</span>;
        <span class="hljs-attribute">add_header</span> Cache-Control <span class="hljs-string">&quot;public, immutable&quot;</span>;
    }

    <span class="hljs-comment"># index.html siempre fresco</span>
    <span class="hljs-section">location</span> = /index.html {
        <span class="hljs-attribute">add_header</span> Cache-Control <span class="hljs-string">&quot;no-cache&quot;</span>;
    }

    <span class="hljs-attribute">gzip</span> <span class="hljs-literal">on</span>;
    <span class="hljs-attribute">gzip_types</span> text/css application/javascript image/svg+xml;
}
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>El error clásico</strong>: la app funciona al navegar, pero al <strong>recargar</strong> <code>/pedidos/42</code> da <strong>404</strong></li>
<li>La causa: ese archivo no existe en disco; la ruta la resuelve <strong>Vue Router</strong> en el navegador</li>
<li><code>try_files</code> devuelve <code>index.html</code> para cualquier ruta desconocida</li>
<li>En Netlify: <code>_redirects</code> con <code>/* /index.html 200</code></li>
<li>En GitHub Pages: copiar <code>index.html</code> como <code>404.html</code> o usar <code>createWebHashHistory</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="nginx-para-laravel">Nginx para Laravel</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-nginx"><span class="hljs-section">server</span> {
    <span class="hljs-attribute">listen</span> <span class="hljs-number">80</span>;
    <span class="hljs-attribute">server_name</span> api.proyecto.ucr.ac.cr;
    <span class="hljs-attribute">root</span> /var/www/api/public;      <span class="hljs-comment"># ⚠ solo public/</span>

    <span class="hljs-attribute">add_header</span> X-Frame-Options <span class="hljs-string">&quot;SAMEORIGIN&quot;</span>;
    <span class="hljs-attribute">add_header</span> X-Content-Type-Options <span class="hljs-string">&quot;nosniff&quot;</span>;
    <span class="hljs-attribute">index</span> index.php;
    <span class="hljs-attribute">charset</span> utf-<span class="hljs-number">8</span>;

    <span class="hljs-section">location</span> / {
        <span class="hljs-attribute">try_files</span> <span class="hljs-variable">$uri</span> <span class="hljs-variable">$uri</span>/ /index.php?<span class="hljs-variable">$query_string</span>;
    }

    <span class="hljs-section">location</span> <span class="hljs-regexp">~ ^/index\.php(/|$)</span> {
        <span class="hljs-attribute">fastcgi_pass</span> unix:/var/run/php/php8.4-fpm.sock;
        <span class="hljs-attribute">fastcgi_param</span> SCRIPT_FILENAME <span class="hljs-variable">$realpath_root</span><span class="hljs-variable">$fastcgi_script_name</span>;
        <span class="hljs-attribute">include</span> fastcgi_params;
        <span class="hljs-attribute">fastcgi_hide_header</span> X-Powered-By;
    }

    <span class="hljs-section">location</span> <span class="hljs-regexp">~ /\.(?!well-known).*</span> {
        <span class="hljs-attribute">deny</span> all;                  <span class="hljs-comment"># .env, .git</span>
    }
}
</code></pre>
</div>
<div>
<ul>
<li>La <strong>raíz</strong> es <code>public/</code>: así <code>.env</code>, <code>storage/</code> y el código <strong>no</strong> son accesibles por URL</li>
<li><strong>PHP-FPM</strong> es un proceso aparte que ejecuta PHP; Nginx le habla por <strong>FastCGI</strong></li>
<li>Toda petición que no sea un archivo real entra por <code>public/index.php</code></li>
<li>Bloquear archivos ocultos excepto <code>/.well-known/</code> (lo usa Let's Encrypt)</li>
<li>Base: la configuración recomendada en la <a href="https://laravel.com/docs/13.x/deployment">documentación de Laravel</a></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="proxy-inverso-para-node-y-caddy">Proxy inverso para Node y Caddy</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%9F%A9-nginx-delante-de-node-ssr-nestjs"><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> Nginx delante de Node (SSR, NestJS)</h3>
<pre><code class="language-nginx"><span class="hljs-section">server</span> {
    <span class="hljs-attribute">server_name</span> app.proyecto.ucr.ac.cr;
    <span class="hljs-section">location</span> / {
        <span class="hljs-attribute">proxy_pass</span> http://127.0.0.1:3000;
        <span class="hljs-attribute">proxy_set_header</span> Host <span class="hljs-variable">$host</span>;
        <span class="hljs-attribute">proxy_set_header</span> X-Forwarded-For <span class="hljs-variable">$proxy_add_x_forwarded_for</span>;
        <span class="hljs-attribute">proxy_set_header</span> X-Forwarded-Proto <span class="hljs-variable">$scheme</span>;
    }
}
</code></pre>
<ul>
<li>El proceso Node lo mantiene vivo <strong>PM2</strong> o <strong>systemd</strong>; Nginx solo reenvía</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%92-la-misma-spa-con-caddy"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> La misma SPA con Caddy</h3>
<pre><code class="language-text">proyecto.ucr.ac.cr {
    root * /var/www/proyecto/dist
    encode zstd gzip
    try_files {path} /index.html
    file_server
}

api.proyecto.ucr.ac.cr {
    reverse_proxy 127.0.0.1:8000
}
</code></pre>
<ul>
<li>Con solo poner el <strong>dominio</strong>, Caddy obtiene y <strong>renueva</strong> el certificado HTTPS</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="https-con-lets-encrypt">HTTPS con Let's Encrypt</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># Ubuntu + Nginx</span>
<span class="hljs-built_in">sudo</span> apt install certbot python3-certbot-nginx
<span class="hljs-built_in">sudo</span> certbot --nginx -d proyecto.ucr.ac.cr \
                     -d api.proyecto.ucr.ac.cr

<span class="hljs-comment"># Probar la renovación automática</span>
<span class="hljs-built_in">sudo</span> certbot renew --dry-run
</code></pre>
<pre><code class="language-nginx"><span class="hljs-comment"># Certbot agrega la redirección 80 → 443</span>
<span class="hljs-section">server</span> {
    <span class="hljs-attribute">listen</span> <span class="hljs-number">80</span>;
    <span class="hljs-attribute">return</span> <span class="hljs-number">301</span> https://<span class="hljs-variable">$host</span><span class="hljs-variable">$request_uri</span>;
}
</code></pre>
</div>
<div>
<ul>
<li><strong>Let's Encrypt</strong>: autoridad certificadora <strong>gratuita</strong> y automatizada (protocolo <strong>ACME</strong>)</li>
<li>Verifica que controlas el dominio con un archivo en <code>/.well-known/acme-challenge/</code> o un registro DNS</li>
<li>Los certificados duran <strong>90 días</strong> y el ecosistema avanza hacia vigencias <strong>más cortas</strong>: la renovación <strong>debe</strong> ser automática</li>
<li>HTTPS es requisito para PWA, <em>service workers</em>, geolocalización, cámara y cookies <code>Secure</code></li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Luego agregar <strong>HSTS</strong> (tema de <em>Seguridad</em>) y verificar con <a href="https://www.ssllabs.com/ssltest/">SSL Labs</a></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-c8Rx7hzH="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="24" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="714-dominios">7.1.4 Dominios</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Anatomía de un nombre de dominio</li>
<li>Cómo funciona DNS</li>
<li>Tipos de registro</li>
<li>Registrar y conectar un dominio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="anatom%C3%ADa-de-un-nombre-de-dominio">Anatomía de un nombre de dominio</h2>
<pre><code class="language-text">   https://api.proyecto.ac.cr/pedidos
           │   │        │  └─ TLD de país (ccTLD): .cr
           │   │        └──── segundo nivel: .ac.cr (académico)
           │   └───────────── nombre registrado
           └───────────────── subdominio (lo creas tú, gratis)
</code></pre>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-gtld"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> gTLD</h3>
<p>Genéricos: <code>.com</code>, <code>.org</code>, <code>.net</code>, <code>.dev</code>, <code>.app</code></p>
</div>
<div>
<h3 id="%F0%9F%87%A8%F0%9F%87%B7-cctld"><img class="emoji" draggable="false" alt="🇨🇷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f1e8-1f1f7.svg" data-marp-twemoji=""/> ccTLD</h3>
<p>De país: <code>.cr</code>, <code>.co.cr</code>, <code>.ac.cr</code>, <code>.go.cr</code>, <code>.or.cr</code></p>
</div>
<div>
<h3 id="%F0%9F%8F%A2-registro-registry"><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> Registro (<em>registry</em>)</h3>
<p>Administra un TLD. Para <code>.cr</code>: <strong>NIC Costa Rica</strong> (<a href="https://www.nic.cr">nic.cr</a>)</p>
</div>
<div>
<h3 id="%F0%9F%9B%92-registrador-registrar"><img class="emoji" draggable="false" alt="🛒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6d2.svg" data-marp-twemoji=""/> Registrador (<em>registrar</em>)</h3>
<p>Te vende el dominio: Cloudflare, Namecheap, Porkbun…</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> En <em>Fundamentos de la web</em> vimos las partes de una <strong>URL</strong>; el dominio es solo una de ellas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="%C2%BFc%C3%B3mo-funciona-dns">¿Cómo funciona DNS?</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.82rem;">
<div>
<pre><code class="language-text"> navegador: ¿IP de api.proyecto.ac.cr?
     │
     ▼
 ① caché del navegador / del SO
     │ no está
     ▼
 ② resolvedor recursivo (ISP, 1.1.1.1, 8.8.8.8)
     │
     ├──► ③ servidor raíz (.)      → &quot;pregunta a .cr&quot;
     ├──► ④ servidor de .cr        → &quot;pregunta a NS de proyecto.ac.cr&quot;
     └──► ⑤ servidor autoritativo  → &quot;A 203.0.113.10&quot;
     │
     ▼
 navegador abre conexión TCP/TLS con 203.0.113.10
</code></pre>
</div>
<div>
<ul>
<li><strong>DNS</strong> es la &quot;agenda telefónica&quot; de Internet: traduce <strong>nombres</strong> a <strong>direcciones IP</strong></li>
<li>El servidor <strong>autoritativo</strong> es el que tiene la respuesta oficial; lo define el registro <strong>NS</strong></li>
<li>Cada respuesta se guarda en caché según su <strong>TTL</strong> (segundos)</li>
<li><img class="emoji" draggable="false" alt="🕒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f552.svg" data-marp-twemoji=""/> La famosa <strong>&quot;propagación&quot;</strong> no es más que esperar a que expiren las cachés</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Antes de migrar, <strong>baja el TTL</strong> (p. ej. a 300 s) un día antes</li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> <code>dns-prefetch</code> y <code>preconnect</code> (<em>Rendimiento web</em>) adelantan este paso</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-scope-0RMVsbZA="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="tipos-de-registro-dns">Tipos de registro DNS</h2>

<table>
<thead>
<tr>
<th style="text-align:left">Registro</th>
<th style="text-align:left">Para qué</th>
<th style="text-align:left">Ejemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>A</strong></td>
<td style="text-align:left">Nombre → dirección <strong>IPv4</strong></td>
<td style="text-align:left"><code>api  A  203.0.113.10</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>AAAA</strong></td>
<td style="text-align:left">Nombre → dirección <strong>IPv6</strong></td>
<td style="text-align:left"><code>api  AAAA  2001:db8::10</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>CNAME</strong></td>
<td style="text-align:left">Alias de <strong>otro nombre</strong> (no se usa en la raíz)</td>
<td style="text-align:left"><code>www  CNAME  usuario.github.io.</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>ALIAS / ANAME</strong></td>
<td style="text-align:left">Como CNAME pero en la raíz (lo ofrecen algunos proveedores)</td>
<td style="text-align:left"><code>@  ALIAS  proyecto.netlify.app.</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>MX</strong></td>
<td style="text-align:left">Servidores de <strong>correo</strong> del dominio</td>
<td style="text-align:left"><code>@  MX  10 mail.proveedor.com.</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>TXT</strong></td>
<td style="text-align:left">Texto: verificación de dominio, SPF, DKIM, DMARC</td>
<td style="text-align:left"><code>@  TXT  &quot;v=spf1 include:_spf.google.com ~all&quot;</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>NS</strong></td>
<td style="text-align:left">Qué servidores son <strong>autoritativos</strong></td>
<td style="text-align:left"><code>@  NS  ana.ns.cloudflare.com.</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>CAA</strong></td>
<td style="text-align:left">Qué autoridades pueden emitir certificados</td>
<td style="text-align:left"><code>@  CAA  0 issue &quot;letsencrypt.org&quot;</code></td>
</tr>
</tbody>
</table>
<ul>
<li><code>@</code> representa el dominio raíz (<em>apex</em>): <code>proyecto.ac.cr</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="registrar-y-conectar-un-dominio">Registrar y conectar un dominio</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.84rem;">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-registrar"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Registrar</h3>
<ul>
<li>Buscar disponibilidad y pagar <strong>por año</strong> (renovación anual)</li>
<li><code>.cr</code> y <code>.co.cr</code> se registran en <strong>NIC Costa Rica</strong> (<a href="https://www.dominios.cr">dominios.cr</a>); exige al menos <strong>dos</strong> servidores DNS</li>
<li>Activar <strong>renovación automática</strong> y bloqueo de transferencia</li>
<li>Datos de contacto reales: si vence, <strong>otro puede comprarlo</strong></li>
</ul>
<h3 id="2%EF%B8%8F%E2%83%A3-delegar-el-dns"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Delegar el DNS</h3>
<ul>
<li>Usar los DNS del registrador <strong>o</strong> apuntar los <strong>NS</strong> a otro proveedor (Cloudflare, Route 53)</li>
</ul>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-crear-los-registros"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Crear los registros</h3>
<pre><code class="language-text">@     A      203.0.113.10        ; API / VPS
www   CNAME  proyecto.ac.cr.
app   CNAME  equipo.github.io.   ; front-end
</code></pre>
<h3 id="4%EF%B8%8F%E2%83%A3-verificar"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Verificar</h3>
<pre><code class="language-bash">dig proyecto.ac.cr A +short
dig app.proyecto.ac.cr CNAME
nslookup proyecto.ac.cr 1.1.1.1
</code></pre>
<ul>
<li>Después configurar el dominio en el proveedor (GitHub Pages → <em>Custom domain</em>) y activar <strong>HTTPS</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="dominio-subdominios-y-cors">Dominio, subdominios y CORS</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-front-y-api-en-subdominios"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Front y API en subdominios</h3>
<p><code>app.proyecto.ac.cr</code> y <code>api.proyecto.ac.cr</code>: <strong>mismo sitio</strong>, distinto <strong>origen</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%80-cors"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> CORS</h3>
<p>La API debe permitir <strong>explícitamente</strong> el origen del front-end (nunca <code>*</code> con credenciales)</p>
</div>
<div>
<h3 id="%F0%9F%8D%AA-cookies"><img class="emoji" draggable="false" alt="🍪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f36a.svg" data-marp-twemoji=""/> Cookies</h3>
<p>Sanctum SPA necesita <code>SANCTUM_STATEFUL_DOMAINS</code> y <code>SESSION_DOMAIN=.proyecto.ac.cr</code></p>
</div>
<div>
<h3 id="%F0%9F%93%B1-app-m%C3%B3vil"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> App móvil</h3>
<p>Sus orígenes son <code>capacitor://localhost</code> (iOS) y <code>https://localhost</code> (Android): agrégalos a CORS</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Un cambio de dominio rompe <strong>CORS</strong>, cookies, enlaces profundos de la app y el <code>redirect_uri</code> de OAuth: planifícalo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-WdMVB2d8="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="30" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="715-despliegue">7.1.5 Despliegue</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Del despliegue manual a CI/CD</li>
<li>GitHub Actions: front-end y API</li>
<li>Estrategias de despliegue</li>
<li>Reversión, verificación y monitoreo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="formas-de-desplegar">Formas de desplegar</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B3-manual"><img class="emoji" draggable="false" alt="🧳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f3.svg" data-marp-twemoji=""/> Manual</h3>
<p>Copiar archivos por FTP/SFTP o <code>scp</code>. Propenso a errores y no repetible. <strong>Evitar</strong></p>
</div>
<div>
<h3 id="%F0%9F%8C%BF-por-rama"><img class="emoji" draggable="false" alt="🌿" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f33f.svg" data-marp-twemoji=""/> Por rama</h3>
<p><code>gh-pages -d dist</code> publica la carpeta en una rama (lo usamos en este curso)</p>
</div>
<div>
<h3 id="%F0%9F%94%97-integraci%C3%B3n-con-git"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Integración con Git</h3>
<p>Netlify, Vercel, Laravel Cloud: cada <code>push</code> a <code>main</code> <strong>despliega solo</strong>, y cada PR tiene su URL de vista previa</p>
</div>
<div>
<h3 id="%F0%9F%A4%96-cicd-propio"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> CI/CD propio</h3>
<p>Un <em>pipeline</em> (GitHub Actions, GitLab CI) compila, prueba y despliega</p>
</div>
</div>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<ul>
<li><strong>CI</strong> (<em>integración continua</em>): cada cambio se compila y se <strong>prueba</strong> automáticamente</li>
</ul>
</div>
<div>
<ul>
<li><strong>CD</strong> (<em>entrega / despliegue continuo</em>): lo que pasa las pruebas queda <strong>listo</strong> o se <strong>despliega</strong> solo</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="github-actions-spa-a-github-pages">GitHub Actions: SPA a GitHub Pages</h2>
<split-slide style="--left: 58%; --right: 42%; --font-size: 0.75rem;">
<div>
<pre><code class="language-yaml"><span class="hljs-comment"># .github/workflows/deploy.yml</span>
<span class="hljs-attr">name:</span> <span class="hljs-string">Desplegar</span> <span class="hljs-string">front-end</span>
<span class="hljs-attr">on:</span>
  <span class="hljs-attr">push:</span>
    <span class="hljs-attr">branches:</span> [<span class="hljs-string">main</span>]

<span class="hljs-attr">permissions:</span>
  <span class="hljs-attr">contents:</span> <span class="hljs-string">read</span>
  <span class="hljs-attr">pages:</span> <span class="hljs-string">write</span>
  <span class="hljs-attr">id-token:</span> <span class="hljs-string">write</span>

<span class="hljs-attr">jobs:</span>
  <span class="hljs-attr">build:</span>
    <span class="hljs-attr">runs-on:</span> <span class="hljs-string">ubuntu-latest</span>
    <span class="hljs-attr">steps:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">actions/checkout@v5</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">pnpm/action-setup@v4</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">actions/setup-node@v5</span>
        <span class="hljs-attr">with:</span> { <span class="hljs-attr">node-version:</span> <span class="hljs-number">24</span>, <span class="hljs-attr">cache:</span> <span class="hljs-string">pnpm</span> }
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">pnpm</span> <span class="hljs-string">install</span> <span class="hljs-string">--frozen-lockfile</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">pnpm</span> <span class="hljs-string">test</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">run:</span> <span class="hljs-string">pnpm</span> <span class="hljs-string">run</span> <span class="hljs-string">build</span>
        <span class="hljs-attr">env:</span>
          <span class="hljs-attr">VITE_API_URL:</span> <span class="hljs-string">${{</span> <span class="hljs-string">vars.VITE_API_URL</span> <span class="hljs-string">}}</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">actions/upload-pages-artifact@v4</span>
        <span class="hljs-attr">with:</span> { <span class="hljs-attr">path:</span> <span class="hljs-string">dist</span> }

  <span class="hljs-attr">deploy:</span>
    <span class="hljs-attr">needs:</span> <span class="hljs-string">build</span>
    <span class="hljs-attr">runs-on:</span> <span class="hljs-string">ubuntu-latest</span>
    <span class="hljs-attr">environment:</span> <span class="hljs-string">github-pages</span>
    <span class="hljs-attr">steps:</span>
      <span class="hljs-bullet">-</span> <span class="hljs-attr">uses:</span> <span class="hljs-string">actions/deploy-pages@v4</span>
</code></pre>
</div>
<div>
<ul>
<li>Se dispara con cada <code>push</code> a <code>main</code></li>
<li><strong>Si las pruebas fallan, no se despliega</strong></li>
<li><code>permissions</code> con <strong>mínimo privilegio</strong></li>
<li><code>--frozen-lockfile</code>: instala <strong>exactamente</strong> lo del <em>lockfile</em></li>
<li>Valores públicos en <code>vars</code>; secretos en <code>secrets</code></li>
<li>Activar en <em>Settings → Pages → Source: GitHub Actions</em></li>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> En <em>Seguridad</em> vimos fijar acciones de terceros por <strong>hash</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="despliegue-de-laravel-sin-tiempo-fuera-de-servicio">Despliegue de Laravel sin tiempo fuera de servicio</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<pre><code class="language-text">/var/www/api/
├── releases/
│   ├── 20261103-1530/
│   ├── 20261110-0915/
│   └── 20261110-1420/   ← nueva versión
├── shared/
│   ├── .env
│   └── storage/
└── current → releases/20261110-1420   (enlace)
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Script de despliegue (Forge, Envoy, Deployer)</span>
<span class="hljs-built_in">cd</span> releases/<span class="hljs-variable">$NUEVA</span>
composer install --no-dev --optimize-autoloader
<span class="hljs-built_in">ln</span> -s ../../shared/.env .<span class="hljs-built_in">env</span>
php artisan migrate --force
php artisan optimize
<span class="hljs-built_in">ln</span> -sfn releases/<span class="hljs-variable">$NUEVA</span> ../current   <span class="hljs-comment"># cambio atómico</span>
php artisan queue:restart
<span class="hljs-built_in">sudo</span> systemctl reload php8.4-fpm
</code></pre>
</div>
<div>
<ul>
<li>Cada versión en <strong>su propia carpeta</strong>; <code>current</code> es un enlace simbólico</li>
<li>El cambio de enlace es <strong>atómico</strong>: no hay un momento con la app a medias</li>
<li><code>.env</code> y <code>storage/</code> viven en <code>shared/</code> y se <strong>comparten</strong> entre versiones</li>
<li><code>queue:restart</code>: los <em>workers</em> cargan el código nuevo</li>
<li><strong>Revertir</strong> = apuntar <code>current</code> a la carpeta anterior</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Las migraciones deben ser <strong>compatibles hacia atrás</strong>: primero agregar columnas, después borrar las viejas en otro despliegue</li>
<li>Herramientas: Laravel Forge, Envoyer, <a href="https://deployer.org">Deployer</a></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="estrategias-de-despliegue">Estrategias de despliegue</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%81-recrear"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Recrear</h3>
<p>Se apaga la versión vieja y se levanta la nueva. Simple, pero hay <strong>tiempo fuera de servicio</strong></p>
</div>
<div>
<h3 id="%F0%9F%8C%8A-rodante-rolling"><img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30a.svg" data-marp-twemoji=""/> Rodante (<em>rolling</em>)</h3>
<p>Se reemplazan las instancias <strong>de a poco</strong>. Conviven dos versiones un rato</p>
</div>
<div>
<h3 id="%F0%9F%94%B5%F0%9F%9F%A2-azul--verde"><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> Azul / verde</h3>
<p>Dos entornos idénticos; se cambia el tráfico <strong>de golpe</strong>. Revertir es instantáneo</p>
</div>
<div>
<h3 id="%F0%9F%90%A4-canario"><img class="emoji" draggable="false" alt="🐤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f424.svg" data-marp-twemoji=""/> Canario</h3>
<p>La versión nueva recibe primero un <strong>5 %</strong> del tráfico; si las métricas están bien, se amplía</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-feature-flags"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <em>Feature flags</em></h3>
<p>El código se despliega <strong>apagado</strong> y se activa por usuario o porcentaje (Laravel <strong>Pennant</strong>)</p>
</div>
<div>
<h3 id="%F0%9F%91%80-vista-previa"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> Vista previa</h3>
<p>Un despliegue <strong>temporal</strong> por cada PR para revisarlo antes de fusionar</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Desplegar ≠ liberar</strong>: con <em>feature flags</em> se puede desplegar el lunes y activar la función el jueves</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="despu%C3%A9s-del-despliegue">Después del despliegue</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%E2%9C%85-verificar"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Verificar</h3>
<ul>
<li><strong>Health check</strong>: Laravel trae la ruta <code>/up</code></li>
<li>Pruebas de humo: login, listado, crear un recurso</li>
<li>Revisar la consola del navegador y los registros del servidor</li>
<li>Comprobar HTTPS, encabezados y CORS desde el dominio real</li>
</ul>
<h3 id="%E2%86%A9%EF%B8%8F-plan-de-reversi%C3%B3n"><img class="emoji" draggable="false" alt="↩️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/21a9.svg" data-marp-twemoji=""/> Plan de reversión</h3>
<ul>
<li>Saber <strong>antes</strong> cómo volver a la versión anterior, y haberlo <strong>probado</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%88-monitorear"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Monitorear</h3>
<ul>
<li><strong>Errores</strong>: Sentry, Flare, Laravel Nightwatch</li>
<li><strong>Disponibilidad</strong>: UptimeRobot, Better Stack</li>
<li><strong>Rendimiento real</strong>: Core Web Vitals de usuarios reales</li>
<li>Alertas ante picos de 5xx o de latencia</li>
</ul>
<h3 id="%F0%9F%92%BE-respaldos"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4be.svg" data-marp-twemoji=""/> Respaldos</h3>
<ul>
<li>BD respaldada <strong>antes</strong> de migrar, automáticos y con restauración probada</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="lista-de-verificaci%C3%B3n-de-despliegue-web">Lista de verificación de despliegue web</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%93%A6-antes"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Antes</h3>
<ul>
<li>[ ] Pruebas en verde en CI</li>
<li>[ ] <code>pnpm run build</code> y <code>preview</code> sin errores</li>
<li>[ ] <code>.env</code> de producción: <code>APP_DEBUG=false</code>, <code>APP_URL</code> correcta</li>
<li>[ ] <code>composer install --no-dev</code> + <code>php artisan optimize</code></li>
<li>[ ] Migraciones compatibles hacia atrás y respaldo de la BD</li>
<li>[ ] Versión etiquetada en Git</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%80-despu%C3%A9s"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Después</h3>
<ul>
<li>[ ] Dominio resuelve (<code>dig</code>) y HTTPS válido</li>
<li>[ ] Recargar una ruta interna de la SPA <strong>no</strong> da 404</li>
<li>[ ] CORS permite solo los orígenes del front y la app</li>
<li>[ ] <code>/.env</code> y <code>/.git/</code> devuelven 403/404</li>
<li>[ ] <code>/up</code> responde 200</li>
<li>[ ] Errores llegando a la herramienta de monitoreo</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-HEsJ0UnX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="37" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="53">
<h1 id="72-publicaci%C3%B3n-de-aplicaciones-m%C3%B3viles">7.2 Publicación de aplicaciones móviles</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Compilación de <em>release</em> con Capacitor</li>
<li>Versionado y firma</li>
<li>Google Play</li>
<li>App Store</li>
<li>Actualizaciones, PWA y distribución alternativa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="del-c%C3%B3digo-a-la-tienda">Del código a la tienda</h2>
<pre><code class="language-text"> pnpm build ──► npx cap sync ──► build release ──► firmar ──► subir ──► pruebas ──► revisión ──► <img class="emoji" draggable="false" alt="🏪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ea.svg" data-marp-twemoji=""/> publicada
  (dist/)       (copia a          (Gradle /          (keystore /  (Play Console /  (cerradas /   (horas a
                android/ e ios/)   Xcode)             certificado)  App Store       TestFlight)   días)
                                                                    Connect)
</code></pre>
<div class="grid">
<div>
<h3 id="%F0%9F%A4%96-android"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android</h3>
<p>Artefacto <strong>AAB</strong> (<em>Android App Bundle</em>). Play genera los APK optimizados para cada dispositivo</p>
</div>
<div>
<h3 id="%F0%9F%8D%8E-ios"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS</h3>
<p>Artefacto <strong>IPA</strong>, generado con <strong>Xcode en una Mac</strong>, o en la nube (Xcode Cloud, Codemagic, Bitrise)</p>
</div>
<div>
<h3 id="%F0%9F%86%94-identificador"><img class="emoji" draggable="false" alt="🆔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f194.svg" data-marp-twemoji=""/> Identificador</h3>
<p><code>cr.ac.ucr.pedidos</code>: <strong>permanente</strong>. Si cambia, para la tienda es otra app</p>
</div>
<div>
<h3 id="%E2%8F%B1%EF%B8%8F-tiempo-real"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> Tiempo real</h3>
<p>Una publicación <strong>no</strong> es inmediata: planifica días, no minutos</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="compilar-una-versi%C3%B3n-de-release-con-capacitor">Compilar una versión de <em>release</em> con Capacitor</h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.8rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># 1. Web de producción</span>
pnpm run build

<span class="hljs-comment"># 2. Copiar a los proyectos nativos</span>
npx <span class="hljs-built_in">cap</span> <span class="hljs-built_in">sync</span>

<span class="hljs-comment"># 3a. Android: AAB firmado desde la terminal</span>
npx <span class="hljs-built_in">cap</span> build android \
  --androidreleasetype AAB \
  --keystorepath ../release.jks \
  --keystorealias upload

<span class="hljs-comment"># 3b. o con Gradle / Android Studio</span>
<span class="hljs-built_in">cd</span> android &amp;&amp; ./gradlew bundleRelease
<span class="hljs-comment">#   → app/build/outputs/bundle/release/app-release.aab</span>

<span class="hljs-comment"># 4. iOS: abrir Xcode → Product → Archive</span>
npx <span class="hljs-built_in">cap</span> open ios
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Antes de compilar: quitar <code>server.url</code> de <code>capacitor.config.ts</code> (recarga en vivo) o la app apuntará a tu laptop</li>
<li><code>VITE_API_URL</code> debe apuntar a la API <strong>pública</strong> con HTTPS</li>
<li>Íconos y pantalla de inicio: <code>@capacitor/assets generate</code> desde un logo de 1024×1024</li>
<li>Revisar los <strong>permisos</strong> declarados: cada uno se justifica ante la tienda</li>
<li>Probar el <em>release</em> en un <strong>dispositivo real</strong>, no solo en el emulador</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="versionado-de-la-app">Versionado de la app</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.84rem;">
<div>
<h3 id="%F0%9F%A4%96-android--androidappbuildgradle"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android — <code>android/app/build.gradle</code></h3>
<pre><code class="language-groovy">defaultConfig {
    applicationId <span class="hljs-string">&quot;cr.ac.ucr.pedidos&quot;</span>
    minSdkVersion <span class="hljs-number">24</span>
    targetSdkVersion <span class="hljs-number">36</span>
    versionCode <span class="hljs-number">12</span>          <span class="hljs-comment">// entero, siempre sube</span>
    versionName <span class="hljs-string">&quot;1.4.0&quot;</span>     <span class="hljs-comment">// lo que ve el usuario</span>
}
</code></pre>
<h3 id="%F0%9F%8D%8E-ios--xcode-%E2%86%92-general"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS — Xcode → <em>General</em></h3>
<ul>
<li><strong>Version</strong> (<code>CFBundleShortVersionString</code>): <code>1.4.0</code></li>
<li><strong>Build</strong> (<code>CFBundleVersion</code>): <code>12</code></li>
</ul>
</div>
<div>
<ul>
<li>Hay <strong>dos</strong> números: uno <strong>para personas</strong> (SemVer) y uno <strong>interno</strong> que la tienda usa para ordenar</li>
<li><code>versionCode</code> / <em>Build</em> debe <strong>aumentar</strong> en cada subida, aunque solo cambie un texto</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> La tienda <strong>rechaza</strong> un archivo con un número que ya usaste</li>
<li>Automatizar: el número de <em>build</em> puede ser el número de ejecución de CI</li>
<li>Mantener la misma <code>versionName</code> en web, Android e iOS facilita el soporte</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="firma-de-la-aplicaci%C3%B3n">Firma de la aplicación</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%A4%96-android-1"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android</h3>
<pre><code class="language-bash">keytool -genkey -v -keystore release.jks \
  -<span class="hljs-built_in">alias</span> upload -keyalg RSA -keysize 2048 \
  -validity 10000
</code></pre>
<ul>
<li>Con <strong>Play App Signing</strong>, Google guarda la <strong>clave de la app</strong> y tú firmas con una <strong>clave de subida</strong></li>
<li>Si pierdes la clave de subida, Google puede <strong>restablecerla</strong>; sin Play App Signing, perderla significa no poder actualizar <strong>nunca</strong></li>
<li><code>release.jks</code> y su contraseña: <strong>fuera del repositorio</strong>, en un gestor de secretos</li>
</ul>
</div>
<div>
