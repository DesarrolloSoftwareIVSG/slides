<h3 id="%F0%9F%8D%8E-ios-1"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS</h3>
<ul>
<li><strong>Certificado</strong> de distribución: identifica al desarrollador</li>
<li><strong>Perfil de aprovisionamiento</strong>: une certificado + <em>App ID</em> + capacidades (push, Apple Pay…)</li>
<li>Xcode con <em>Automatically manage signing</em> los crea y renueva por ti</li>
<li>En CI se usan claves de la <strong>API de App Store Connect</strong> (Fastlane <code>match</code>)</li>
</ul>
<h3 id="%F0%9F%94%81-de-seguridad"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> De <em>Seguridad</em></h3>
<p>La firma garantiza que la actualización viene <strong>del mismo autor</strong>: es un control de integridad</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="google-play-requisitos">Google Play: requisitos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.83rem;">
<div>
<h3 id="%F0%9F%91%A4-cuenta-de-desarrollador"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> Cuenta de desarrollador</h3>
<ul>
<li><strong>Play Console</strong>: pago único de <strong>USD 25</strong></li>
<li><strong>Verificación de identidad</strong> obligatoria (documento; dirección y D-U-N-S en cuentas de organización)</li>
<li><strong>Cuentas personales nuevas</strong>: prueba cerrada con al menos <strong>12 testers</strong> durante <strong>14 días seguidos</strong> antes de pedir acceso a producción</li>
<li>Las cuentas de <strong>organización</strong> no tienen ese requisito</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%8B-requisitos-t%C3%A9cnicos-2026"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Requisitos técnicos (2026)</h3>
<ul>
<li>Formato <strong>AAB</strong></li>
<li>Desde el 31 de agosto de 2026, apps nuevas y actualizaciones deben apuntar a <strong>Android 16 (API 36)</strong></li>
<li>Las apps existentes deben apuntar al menos a <strong>API 35</strong> para seguir visibles a usuarios nuevos</li>
<li>Firmado con Play App Signing</li>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> <strong>Verificación de desarrolladores de Android</strong>: Google la exige también para apps distribuidas <strong>fuera</strong> de Play (primero en algunos países desde septiembre de 2026, global desde 2027)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="google-play-la-ficha-y-las-declaraciones">Google Play: la ficha y las declaraciones</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-ficha-de-la-tienda"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> Ficha de la tienda</h3>
<p>Nombre (30 car.), descripción corta y larga, ícono 512×512, gráfico destacado 1024×500 y capturas</p>
</div>
<div>
<h3 id="%F0%9F%94%90-seguridad-de-los-datos"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Seguridad de los datos</h3>
<p>Qué datos recolecta y comparte la app, y si viajan <strong>cifrados</strong>. Debe coincidir con la realidad</p>
</div>
<div>
<h3 id="%F0%9F%93%9C-pol%C3%ADtica-de-privacidad"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> Política de privacidad</h3>
<p>URL pública <strong>obligatoria</strong>. En Costa Rica, acorde con la <strong>Ley 8968</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%9E-clasificaci%C3%B3n-de-contenido"><img class="emoji" draggable="false" alt="🔞" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f51e.svg" data-marp-twemoji=""/> Clasificación de contenido</h3>
<p>Cuestionario IARC: violencia, compras, interacción entre usuarios</p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-p%C3%BAblico-objetivo"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Público objetivo</h3>
<p>Si incluye niños, se aplican las políticas de <strong>Familias</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%91-acceso-para-revisores"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Acceso para revisores</h3>
<p>Si hay login, credenciales de <strong>prueba</strong> para que Google pueda revisar la app</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Si la app permite crear cuentas, debe ofrecer <strong>eliminarlas</strong> desde la app y desde la web</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="google-play-tracks-de-prueba-y-lanzamiento">Google Play: tracks de prueba y lanzamiento</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.84rem;">
<div>
<pre><code class="language-text"> Prueba interna  ──►  Prueba cerrada  ──►  Prueba abierta  ──►  Producción
  hasta 100            listas de             cualquiera           todos
  personas, sin        correos o grupos      puede unirse         (o un %)
  revisión larga       de Google
</code></pre>
</div>
<div>
<ul>
<li><strong>Interna</strong>: el equipo, en minutos. Ideal para cada <em>sprint</em></li>
<li><strong>Cerrada</strong>: clientes o el profesor; aquí se cumplen los 12 testers × 14 días</li>
<li><strong>Abierta</strong>: beta pública desde la ficha de la tienda</li>
<li><strong>Producción</strong> con <strong>lanzamiento por etapas</strong>: 5 % → 20 % → 50 % → 100 %, y se puede <strong>detener</strong> si aparecen fallos</li>
<li><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> Revisar <em>Android vitals</em>: <em>crashes</em> y ANR (app que no responde)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="app-store-requisitos">App Store: requisitos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.83rem;">
<div>
<h3 id="%F0%9F%91%A4-cuenta"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> Cuenta</h3>
<ul>
<li><strong>Apple Developer Program</strong>: <strong>USD 99 al año</strong> (organizaciones necesitan número D-U-N-S)</li>
<li>Si la membresía vence, las apps <strong>salen</strong> de la tienda</li>
<li>Programa de exención de cuota para instituciones educativas y ONG</li>
</ul>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-requisitos-t%C3%A9cnicos-2026"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Requisitos técnicos (2026)</h3>
<ul>
<li>Desde el 28 de abril de 2026, compilar con <strong>Xcode 26</strong> y el <strong>SDK de iOS 26</strong></li>
<li>Requiere una <strong>Mac</strong> (o un servicio de compilación en la nube)</li>
<li><em>Privacy manifest</em> (<code>PrivacyInfo.xcprivacy</code>) en la app y en los SDK de terceros que lo exigen</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%AD-flujo"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Flujo</h3>
<ol>
<li>Crear la app en <strong>App Store Connect</strong> con el <em>Bundle ID</em></li>
<li>Xcode → <em>Archive</em> → <em>Distribute App</em> → subir el <em>build</em></li>
<li>Probar con <strong>TestFlight</strong>: hasta 100 testers internos y 10 000 externos (los externos pasan una revisión breve)</li>
<li>Completar ficha, capturas, <strong>etiquetas de privacidad</strong> y clasificación por edad</li>
<li>Enviar a <strong>revisión</strong> (normalmente 24–48 h)</li>
<li>Publicar manual, automática o <strong>por fases</strong> en 7 días</li>
</ol>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="la-revisi%C3%B3n-de-apple-motivos-de-rechazo-frecuentes">La revisión de Apple: motivos de rechazo frecuentes</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-solo-un-sitio-web"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> &quot;Solo un sitio web&quot;</h3>
<p>Guía <strong>4.2</strong>: una app que solo envuelve una web sin valor nativo se rechaza. Usa capacidades del dispositivo</p>
</div>
<div>
<h3 id="%F0%9F%90%9E-fallos-y-enlaces-rotos"><img class="emoji" draggable="false" alt="🐞" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f41e.svg" data-marp-twemoji=""/> Fallos y enlaces rotos</h3>
<p>La app se cae, hay pantallas vacías o botones que no hacen nada</p>
</div>
<div>
<h3 id="%F0%9F%94%91-sin-cuenta-de-prueba"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Sin cuenta de prueba</h3>
<p>El revisor no puede entrar: siempre dar usuario y contraseña de demostración</p>
</div>
<div>
<h3 id="%F0%9F%94%90-permisos-sin-justificar"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Permisos sin justificar</h3>
<p>Cada <code>NS…UsageDescription</code> debe explicar <strong>para qué</strong> se usa la cámara o la ubicación</p>
</div>
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-sin-borrar-la-cuenta"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Sin borrar la cuenta</h3>
<p>Si se puede crear una cuenta, debe poder <strong>eliminarse</strong> dentro de la app</p>
</div>
<div>
<h3 id="%F0%9F%92%B3-pagos-externos"><img class="emoji" draggable="false" alt="💳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b3.svg" data-marp-twemoji=""/> Pagos externos</h3>
<p>Bienes digitales se cobran con compras dentro de la app, salvo las excepciones por región</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Leer las <a href="https://developer.apple.com/app-store/review/guidelines/">App Review Guidelines</a> <strong>antes</strong> de diseñar, no antes de publicar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-odDO7eOE="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="google-play-vs-app-store">Google Play vs. App Store</h2>

<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Google Play</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> App Store</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Costo de la cuenta</strong></td>
<td style="text-align:left">USD 25, pago único</td>
<td style="text-align:left">USD 99 al año</td>
</tr>
<tr>
<td style="text-align:left"><strong>Artefacto</strong></td>
<td style="text-align:left">AAB</td>
<td style="text-align:left">IPA (vía Xcode)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Herramienta de compilación</strong></td>
<td style="text-align:left">Android Studio en cualquier SO</td>
<td style="text-align:left">Xcode, <strong>solo macOS</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Consola</strong></td>
<td style="text-align:left">Play Console</td>
<td style="text-align:left">App Store Connect</td>
</tr>
<tr>
<td style="text-align:left"><strong>Pruebas</strong></td>
<td style="text-align:left">Interna, cerrada, abierta</td>
<td style="text-align:left">TestFlight interno y externo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Requisito 2026</strong></td>
<td style="text-align:left">Apuntar a API 36</td>
<td style="text-align:left">SDK de iOS 26</td>
</tr>
<tr>
<td style="text-align:left"><strong>Revisión</strong></td>
<td style="text-align:left">Automatizada + humana; horas a días</td>
<td style="text-align:left">Humana; normalmente 24–48 h</td>
</tr>
<tr>
<td style="text-align:left"><strong>Lanzamiento gradual</strong></td>
<td style="text-align:left">Por porcentaje, se puede detener</td>
<td style="text-align:left">Por fases en 7 días</td>
</tr>
<tr>
<td style="text-align:left"><strong>Comisión</strong></td>
<td style="text-align:left">15 % el primer millón al año, 30 % después</td>
<td style="text-align:left">15 % (Small Business Program) / 30 %</td>
</tr>
<tr>
<td style="text-align:left"><strong>Fuera de la tienda</strong></td>
<td style="text-align:left">Permitido, con verificación del desarrollador</td>
<td style="text-align:left">Solo en la UE (mercados alternativos)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="actualizaciones-despu%C3%A9s-de-publicar">Actualizaciones después de publicar</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.84rem;">
<div>
<h3 id="%F0%9F%8F%AA-por-la-tienda"><img class="emoji" draggable="false" alt="🏪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ea.svg" data-marp-twemoji=""/> Por la tienda</h3>
<ul>
<li>Necesarias si cambia <strong>código nativo</strong>: plugins, permisos, versión de Capacitor, íconos</li>
<li>Pasan otra vez por <strong>revisión</strong></li>
<li>Recordatorio dentro de la app: plugin de <em>in-app updates</em> de Android o aviso propio que consulta la versión mínima a la API</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A1-en-vivo-live-updates-ota"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> En vivo (<em>live updates</em>, OTA)</h3>
<ul>
<li>Como la UI de Ionic es <strong>web</strong>, se puede descargar un nuevo <code>dist/</code> sin pasar por la tienda (Capgo, Capawesome Cloud)</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Permitido para <strong>correcciones</strong> de HTML/CSS/JS</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>No</strong> se permite cambiar el propósito de la app ni agregar funciones que eludan la revisión</li>
<li>Firmar los paquetes y poder <strong>revertir</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> La API debe ser <strong>compatible hacia atrás</strong>: siempre habrá usuarios con versiones viejas de la app</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="otras-formas-de-distribuir">Otras formas de distribuir</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%B2-pwa"><img class="emoji" draggable="false" alt="📲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f2.svg" data-marp-twemoji=""/> PWA</h3>
<p>Se &quot;publica&quot; <strong>desplegando</strong> la web con HTTPS y un <em>manifest</em>. Se instala desde el navegador, sin tienda ni comisiones</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-pwa-en-tiendas"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> PWA en tiendas</h3>
<p>Con <strong>Bubblewrap</strong> / <strong>PWABuilder</strong> se empaqueta como TWA para Google Play o para Microsoft Store</p>
</div>
<div>
<h3 id="%F0%9F%8F%A2-distribuci%C3%B3n-empresarial"><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> Distribución empresarial</h3>
<p><strong>Managed Google Play</strong> y <strong>Apple Business Manager</strong> para apps internas de una organización</p>
</div>
<div>
<h3 id="%F0%9F%8C%8F-tiendas-alternativas"><img class="emoji" draggable="false" alt="🌏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30f.svg" data-marp-twemoji=""/> Tiendas alternativas</h3>
<p>Huawei AppGallery, Samsung Galaxy Store, F-Droid (código abierto), Amazon Appstore</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-para-pruebas"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Para pruebas</h3>
<p><strong>Firebase App Distribution</strong> o un APK directo para el equipo (Android)</p>
</div>
<div>
<h3 id="%F0%9F%87%AA%F0%9F%87%BA-uni%C3%B3n-europea"><img class="emoji" draggable="false" alt="🇪🇺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f1ea-1f1fa.svg" data-marp-twemoji=""/> Unión Europea</h3>
<p>La Ley de Mercados Digitales permite mercados alternativos en iOS</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="lista-de-verificaci%C3%B3n-de-publicaci%C3%B3n-m%C3%B3vil">Lista de verificación de publicación móvil</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%94%A7-t%C3%A9cnico"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Técnico</h3>
<ul>
<li>[ ] <code>server.url</code> eliminado de <code>capacitor.config.ts</code></li>
<li>[ ] API de producción con HTTPS y CORS para <code>capacitor://localhost</code> y <code>https://localhost</code></li>
<li>[ ] <code>versionCode</code> / <em>Build</em> incrementado</li>
<li>[ ] <code>targetSdkVersion 36</code> · Xcode 26</li>
<li>[ ] Firmado con la clave de subida; clave <strong>fuera</strong> del repo</li>
<li>[ ] Probado en un Android de gama baja y en un iPhone reales</li>
<li>[ ] Ningún secreto en el <em>bundle</em></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%8B-tienda"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Tienda</h3>
<ul>
<li>[ ] Ícono, capturas y textos</li>
<li>[ ] Política de privacidad publicada</li>
<li>[ ] Seguridad de los datos / etiquetas de privacidad</li>
<li>[ ] Clasificación de contenido</li>
<li>[ ] Cuenta de prueba para los revisores</li>
<li>[ ] Opción para eliminar la cuenta</li>
<li>[ ] Justificación de cada permiso</li>
<li>[ ] Prueba cerrada / TestFlight completada</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="errores-m%C3%A1s-frecuentes">Errores más frecuentes</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%A9-404-al-recargar"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> 404 al recargar</h3>
<p>Falta <code>try_files</code> o la regla de reescritura para la SPA</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-pantalla-en-blanco"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Pantalla en blanco</h3>
<p><code>base</code> incorrecta en Vite: los JS se piden en la ruta equivocada</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-la-api-no-responde"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> La API &quot;no responde&quot;</h3>
<p><code>VITE_API_URL</code> apunta a <code>localhost</code> en producción o CORS no incluye el dominio real</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-contenido-mixto"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Contenido mixto</h3>
<p>Página HTTPS que llama a una API HTTP: el navegador lo <strong>bloquea</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-env-cacheado"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>.env</code> cacheado</h3>
<p>Cambiaste <code>.env</code> pero no ejecutaste <code>php artisan optimize</code> de nuevo</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-clave-de-firma-perdida"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Clave de firma perdida</h3>
<p>Sin Play App Signing, la app ya <strong>no</strong> se puede actualizar</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-dominio-vencido"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Dominio vencido</h3>
<p>Nadie activó la renovación automática</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-desplegar-el-viernes-a-las-5-p-m"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Desplegar el viernes a las 5 p. m.</h3>
<p>Sin monitoreo ni plan de reversión <img class="emoji" draggable="false" alt="😅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f605.svg" data-marp-twemoji=""/></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="53">
<h2 id="actividad-de-cierre">Actividad de cierre</h2>
<steps>
<step>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-front-end"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Front-end</h3>
<p>Desplegar la SPA del proyecto con <strong>GitHub Actions</strong> y verificar que recargar una ruta interna funciona</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-api"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> API</h3>
<p>Desplegar la API Laravel en un PaaS o VPS con HTTPS, <code>APP_DEBUG=false</code> y <code>/up</code> respondiendo 200</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-dns"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> DNS</h3>
<p>Con <code>dig</code>, documentar los registros <strong>A / CNAME</strong> del front y la API (dominio propio o subdominio del proveedor)</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-m%C3%B3vil"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Móvil</h3>
<p>Generar un <strong>AAB firmado</strong> y subirlo a la <strong>prueba interna</strong> de Play (o un <em>build</em> a TestFlight)</p>
</div>
</div>
</step>
<step>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <strong>Entregable</strong>: URL pública del front y de la API, captura del <em>pipeline</em> en verde, salida de <code>dig</code> y captura del <em>track</em> de prueba</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Bonus: un <strong>segundo despliegue</strong> que cambie algo visible, y una <strong>reversión</strong> a la versión anterior documentada</li>
</ul>
</step>
</steps>
</section>
