<h2 id="%C2%BFqu%C3%A9-es-un-framework">¿Qué es un framework?</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%9A-librer%C3%ADa"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> Librería</h3>
<ul>
<li><strong>Tú</strong> llamas al código de la librería</li>
<li>Resuelve <strong>un problema concreto</strong></li>
<li>Tú controlas el flujo del programa</li>
<li>Ej.: <code>date-fns</code>, <code>zod</code>, <code>lodash</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-framework"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Framework</h3>
<ul>
<li>El <strong>framework</strong> llama a tu código → <em>inversión de control</em></li>
<li>Define la <strong>estructura</strong> de la aplicación</li>
<li>Impone convenciones: dónde van los archivos, cómo se enruta, cómo se construye</li>
<li>Ej.: Angular, Django, Laravel</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <em>&quot;Don't call us, we'll call you&quot;</em> — el <strong>principio de Hollywood</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFpor-qu%C3%A9-usar-un-framework">¿Por qué usar un framework?</h2>
<div class="grid">
<div>
<h3 id="%E2%8F%B1%EF%B8%8F-productividad"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/23f1.svg" data-marp-twemoji=""/> Productividad</h3>
<p>No reescribes enrutamiento, formularios ni renderizado</p>
</div>
<div>
<h3 id="%F0%9F%A7%B1-estructura"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Estructura</h3>
<p>Convenciones compartidas → equipos que se entienden</p>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-seguridad-1"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Seguridad</h3>
<p>Protecciones por defecto (XSS, CSRF, inyección)</p>
</div>
<div>
<h3 id="%F0%9F%8C%8D-ecosistema"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f30d.svg" data-marp-twemoji=""/> Ecosistema</h3>
<p>Documentación, plugins, comunidad, contrataciones</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> El costo: <strong>curva de aprendizaje</strong>, dependencia del ecosistema y <strong>actualizaciones</strong> que hay que seguir</li>
<li><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2753.svg" data-marp-twemoji=""/> ¿Siempre hace falta uno? → <spoiler>no: para un sitio pequeño, HTML+CSS+JS estándar es más rápido y dura más</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="frameworks-de-front-end">Frameworks de front-end</h2>
<div class="grid">
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-react"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/269b.svg" data-marp-twemoji=""/> React</h3>
<p>El más usado (~40-45 % de cuota, &gt;30 M descargas semanales). Librería de UI + un ecosistema enorme</p>
</div>
<div>
<h3 id="%F0%9F%92%9A-vue"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</h3>
<p>~15-20 %, curva de aprendizaje suave, muy fuerte en Asia-Pacífico</p>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</h3>
<p>~12-15 %, framework <strong>completo</strong> y opinado, fuerte en el mundo empresarial</p>
</div>
<div>
<h3 id="%F0%9F%94%A5-svelte"><img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f525.svg" data-marp-twemoji=""/> Svelte</h3>
<p>Compila a JavaScript sin <em>runtime</em>; la satisfacción más alta entre desarrolladores (~88 %)</p>
</div>
<div>
<h3 id="%F0%9F%A7%A9-web-components"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Web Components</h3>
<p>El estándar del navegador: <code>custom elements</code>, Shadow DOM. Sin framework</p>
</div>
<div>
<h3 id="%F0%9F%AA%B6-alpine--htmx"><img class="emoji" draggable="false" alt="🪶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fab6.svg" data-marp-twemoji=""/> Alpine / HTMX</h3>
<p>Interactividad ligera sobre HTML del servidor, sin <em>bundle</em></p>
</div>
</div>
<ul>
<li>Comparativa → <a href="../assets/webcomponents-vs-frameworks.png">Web Components vs. frameworks</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="meta-frameworks">Meta-frameworks</h2>
<ul>
<li>La tendencia dominante: ya no se elige <em>React</em> o <em>Vue</em> a secas, sino <strong>React + Next</strong>, <strong>Vue + Nuxt</strong>, <strong>Svelte + SvelteKit</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>El <strong>enrutamiento</strong>, el <strong>renderizado</strong>, la <strong>carga de datos</strong>, el <strong>caché</strong> y el <strong>despliegue</strong> viven a este nivel</li>
<li><strong>Next.js</strong> — el dominante sobre React</li>
<li><strong>Nuxt</strong> — el equivalente en Vue</li>
<li><strong>SvelteKit</strong> — sobre Svelte</li>
</ul>
</div>
<div>
<ul>
<li><strong>Astro</strong> — orientado a contenido, envía <strong>cero JavaScript por defecto</strong>; permite islas de React/Vue/Svelte</li>
<li><strong>Remix / TanStack Start</strong> — enfoque en estándares web y tipado extremo a extremo</li>
<li><strong>React Server Components</strong> — renderizar en el servidor sin enviar JS al cliente</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="frameworks-de-back-end">Frameworks de back-end</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9F%A2-nodejs"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e2.svg" data-marp-twemoji=""/> Node.js</h3>
<p><strong>Express</strong> (minimalista), <strong>Fastify</strong> (rendimiento), <strong>NestJS</strong> (arquitectura tipo Angular), <strong>Hono</strong> (edge)</p>
</div>
<div>
<h3 id="%F0%9F%90%8D-python"><img class="emoji" draggable="false" alt="🐍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f40d.svg" data-marp-twemoji=""/> Python</h3>

<h3 id="%F0%9F%90%98-php"><img class="emoji" draggable="false" alt="🐘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f418.svg" data-marp-twemoji=""/> PHP</h3>
<p><strong>Laravel</strong> (el más popular hoy), <strong>Symfony</strong></p>
</div>
<div>
<h3 id="%E2%98%95-java--kotlin"><img class="emoji" draggable="false" alt="☕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2615.svg" data-marp-twemoji=""/> Java / Kotlin</h3>
<p><strong>Spring Boot</strong>, <strong>Quarkus</strong> — el estándar corporativo</p>
</div>
<div>
<h3 id="%F0%9F%92%9C-c"><img class="emoji" draggable="false" alt="💜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f49c.svg" data-marp-twemoji=""/> C#</h3>
<p><strong>ASP.NET Core</strong> — muy integrado con el ecosistema Microsoft</p>
</div>
<div>
<h3 id="%F0%9F%A6%AB-go--rust"><img class="emoji" draggable="false" alt="🦫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ab.svg" data-marp-twemoji=""/> Go / Rust</h3>
<p><strong>Gin</strong>, <strong>Echo</strong>, <strong>Axum</strong> — cuando el rendimiento manda</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los meta-frameworks <em>full stack</em> (Next, Nuxt, Laravel) <strong>borran la frontera</strong> entre front y back</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="otros-frameworks-del-ecosistema">Otros frameworks del ecosistema</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%A8-css-y-ui"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3a8.svg" data-marp-twemoji=""/> CSS y UI</h3>
<p><strong>Tailwind CSS</strong> (utilidades), <strong>Bootstrap</strong> (componentes), <strong>Material UI</strong>, <strong>shadcn/ui</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%B1-multiplataforma"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Multiplataforma</h3>
<p><strong>React Native</strong>, <strong>Flutter</strong>, <strong>Ionic</strong> (con Capacitor), <strong>.NET MAUI</strong></p>
</div>
<div>
<h3 id="%F0%9F%96%A5%EF%B8%8F-escritorio"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> Escritorio</h3>
<p><strong>Electron</strong>, <strong>Tauri</strong>, <strong>Neutralino</strong></p>
</div>
<div>
<h3 id="%F0%9F%94%A7-herramientas-de-build"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f527.svg" data-marp-twemoji=""/> Herramientas de build</h3>
<p><strong>Vite</strong> (98 % de satisfacción), <strong>esbuild</strong>, <strong>Rollup</strong>, <strong>Turbopack</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-testing"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Testing</h3>
<p><strong>Vitest</strong>, <strong>Jest</strong>, <strong>Playwright</strong>, <strong>Cypress</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-estado-y-datos"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Estado y datos</h3>
<p><strong>TanStack Query</strong>, <strong>Zustand</strong>, <strong>Pinia</strong>, <strong>Redux</strong></p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> En <strong>Flutter</strong> y <strong>React Native</strong> la unidad de construcción es el <strong>widget</strong> / componente prediseñado, con consistencia visual con el sistema operativo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFc%C3%B3mo-elegir-un-framework">¿Cómo elegir un framework?</h2>
<steps>
<step>
<h3 id="%F0%9F%94%8D-criterios-t%C3%A9cnicos"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50d.svg" data-marp-twemoji=""/> Criterios técnicos</h3>
<ul>
<li>¿Encaja con el <strong>tipo de aplicación</strong> (contenido, dashboard, tiempo real)?</li>
<li>¿Qué modalidad de <strong>renderizado</strong> necesito?</li>
<li><strong>Rendimiento</strong> y tamaño del <em>bundle</em></li>
<li><strong>Tipado</strong> (TypeScript ya es ~40 % de adopción exclusiva)</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%91%A5-criterios-de-equipo-y-negocio"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f465.svg" data-marp-twemoji=""/> Criterios de equipo y negocio</h3>
<ul>
<li>¿Qué <strong>sabe ya</strong> el equipo? ¿Qué se contrata fácil en el mercado local?</li>
<li><strong>Madurez</strong>: ¿cuántos años lleva? ¿Quién lo mantiene? ¿Tiene <em>LTS</em>?</li>
<li><strong>Documentación</strong> y comunidad</li>
<li><strong>Costo de salida</strong>: ¿qué tan atrapados quedamos?</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Mala razón para elegir: <em>&quot;es lo nuevo&quot;</em>. Buena razón: <em>&quot;resuelve nuestro problema y podemos sostenerlo 5 años&quot;</em></p>
</blockquote>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="tendencias-2026">Tendencias 2026</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A4%96-desarrollo-asistido-por-ia"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f916.svg" data-marp-twemoji=""/> Desarrollo asistido por IA</h3>
<p>Una parte creciente del código se genera con asistentes</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-meta-frameworks-por-defecto"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Meta-frameworks por defecto</h3>
<p>Next, Nuxt y SvelteKit como punto de partida</p>
</div>
<div>
<h3 id="%F0%9F%94%A4-typescript"><img class="emoji" draggable="false" alt="🔤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f524.svg" data-marp-twemoji=""/> TypeScript</h3>
<p>Adopción exclusiva creciente en proyectos nuevos</p>
</div>
<div>
<h3 id="%E2%9A%A1-vite-en-todas-partes"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> Vite en todas partes</h3>
<p>El estándar de facto para el <em>tooling</em></p>
</div>
<div>
<h3 id="%F0%9F%8C%8D-edge-computing"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f30d.svg" data-marp-twemoji=""/> Edge computing</h3>
<p>Ejecutar el render cerca del usuario</p>
</div>
<div>
<h3 id="%F0%9F%AA%B6-menos-javascript"><img class="emoji" draggable="false" alt="🪶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1fab6.svg" data-marp-twemoji=""/> Menos JavaScript</h3>
<p>Islas, RSC y <em>zero-JS by default</em> (Astro)</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="actividad-final">Actividad final</h2>
<ul>
<li>Retomen la aplicación de <strong>reservas de laboratorios</strong> de la Actividad 2 y decidan:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%AD-tendencia"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Tendencia</h3>
<p>¿MPA, SPA, PWA o <em>native web app</em>? ¿Por qué?</p>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-frameworks"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Frameworks</h3>
<p>Uno de front y uno de back. Justifiquen con <strong>criterios</strong>, no con modas</p>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-riesgos-1"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Riesgos</h3>
<p>¿Qué se rompe si el equipo cambia o el framework se abandona?</p>
</div>
</div>
<ul>
<li>Preparen <strong>3 minutos</strong> de defensa oral de sus decisiones</li>
</ul>
</section>
