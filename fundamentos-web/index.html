<h2 id="contenidos">Contenidos</h2>
<ul>
<li>Aplicaciones web</li>
<li>Enfoque de pila completa (<em>Full Stack</em>)</li>
<li>Tendencias: MPA, SPA, PWA y <em>native web apps</em></li>
<li>Frameworks</li>
</ul>
<blockquote>

</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-marpit-scope-rkZCsKSh="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="2" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="60">
<h1 id="aplicaciones-web">Aplicaciones web</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Internet, la Web y los protocolos</li>
<li>De la página estática a la aplicación web</li>
<li>Arquitectura cliente-servidor y HTTP</li>
<li>Aplicación web vs. aplicación móvil</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFqu%C3%A9-es-internet">¿Qué es Internet?</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-la-red"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> La red</h3>
<ul>
<li>Conjunto <strong>descentralizado</strong> de redes de comunicación <strong>interconectadas</strong></li>
<li>Una red permite que dos computadoras <strong>se comuniquen</strong></li>
<li>Funciona como una <strong>red lógica única</strong> de alcance mundial, aunque esté formada por multitud de redes físicas heterogéneas</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%8C-los-servicios"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> Los servicios</h3>
<p>Sobre esa red se han desarrollado <strong>servicios</strong>: aplicaciones que se comunican para un fin determinado.</p>
<p>El servicio que más éxito ha tenido es la <strong>World Wide Web</strong>.</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>Web ≠ Internet</strong> → la Web es <em>un</em> servicio de Internet, no Internet</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="web-%E2%89%A0-internet">Web ≠ Internet</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%AC-internet"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ec.svg" data-marp-twemoji=""/> Internet</h3>
<ul>
<li>Inventado por <strong>Vint Cerf</strong> y Bob Kahn (protocolos TCP/IP, 1974)</li>
<li>La <strong>infraestructura</strong>: cables, routers, direcciones IP</li>
<li>Sobre ella viajan muchos servicios distintos</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%95%B8%EF%B8%8F-la-web"><img class="emoji" draggable="false" alt="🕸️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f578.svg" data-marp-twemoji=""/> La Web</h3>
<ul>
<li>Inventada por <strong>Tim Berners-Lee</strong> (CERN, 1989)</li>
<li>Un conjunto de <strong>protocolos, estándares y tecnologías</strong> basados en Internet</li>
<li>Diseñada originalmente para la <strong>consulta remota de información</strong> en archivos de hipertexto</li>
</ul>
</div>
</split-slide>
<ul>
<li>Primera web de la historia → <a href="http://info.cern.ch/hypertext/WWW/TheProject.html">info.cern.ch</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="otros-servicios-de-internet">Otros servicios de Internet</h2>
<ul>
<li>Un <strong>protocolo</strong> es un conjunto de reglas y procedimientos que deben respetarse para el <strong>envío y la recepción</strong> de datos a través de una red</li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9C%89%EF%B8%8F-correo-electr%C3%B3nico"><img class="emoji" draggable="false" alt="✉️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2709.svg" data-marp-twemoji=""/> Correo electrónico</h3>
<p><code>POP3</code>, <code>IMAP</code>, <code>SMTP</code></p>
</div>
<div>
<h3 id="%F0%9F%93%81-transferencia-de-archivos"><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Transferencia de archivos</h3>
<p><code>FTP</code>, <code>SFTP</code>, <code>P2P</code>, <code>HTTP</code></p>
</div>
<div>
<h3 id="%F0%9F%92%AC-mensajer%C3%ADa-instant%C3%A1nea"><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4ac.svg" data-marp-twemoji=""/> Mensajería instantánea</h3>
<p><code>IRC</code>, <code>XMPP</code>, <code>MQTT</code></p>
</div>
<div>
<h3 id="%F0%9F%8E%AC-contenido-multimedia"><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3ac.svg" data-marp-twemoji=""/> Contenido multimedia</h3>
<p><code>VoIP</code>, <code>IPTV</code>, <code>RTP</code>, <code>WebRTC</code></p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-consola-remota"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2328.svg" data-marp-twemoji=""/> Consola remota</h3>
<p><code>SSH</code>, <code>Telnet</code></p>
</div>
<div>
<h3 id="%F0%9F%96%A5%EF%B8%8F-escritorio-remoto"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> Escritorio remoto</h3>
<p><code>VNC</code>, <code>RDP</code></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="un-poco-de-historia">Un poco de historia</h2>
<steps>
<step>
<h3 id="1962--el-origen-militar">1962 — El origen militar</h3>
<ul>
<li>A causa de la guerra fría, las Fuerzas Aéreas de EE.UU. piden una red de comunicaciones que <strong>resista un ataque nuclear</strong></li>
<li>En 1964 <strong>Paul Baran</strong> propone una red en forma de telaraña: un sistema <strong>descentralizado</strong>, capaz de seguir funcionando aunque se destruyan uno o varios equipos</li>
</ul>
</step>
<step>
<h3 id="1969-1983--arpanet-%E2%86%92-internet">1969-1983 — ARPANET → Internet</h3>
<ul>
<li>ARPANET conecta las primeras universidades</li>
<li>1983: TCP/IP se convierte en el protocolo oficial → <strong>nace Internet</strong></li>
</ul>
</step>
<step>
<h3 id="1989-1991--nace-la-web">1989-1991 — Nace la Web</h3>
<ul>
<li>Tim Berners-Lee propone en el CERN un sistema de <strong>hipertexto</strong> para compartir documentos</li>
<li>Los tres pilares: <strong>HTML</strong> + <strong>URL</strong> + <strong>HTTP</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="web-10--p%C3%A1ginas-est%C3%A1ticas">Web 1.0 — Páginas estáticas</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<ul>
<li>El usuario <strong>solo leía</strong> contenido publicado por otros</li>
<li>Contenido <strong>muy estático</strong>, muy difícil de editar por el propio usuario</li>
<li>El navegador web era la única aplicación <em>&quot;conectada&quot;</em></li>
<li>Los sitios eran conjuntos de <strong>archivos HTML</strong> en un disco</li>
</ul>
</div>
<div>
<ul>
<li>Eran como <strong>libros</strong>, pero con navegación mediante <strong>enlaces</strong> en vez de secuencial</li>
<li>Se editaban con herramientas parecidas a un procesador de textos (<em>Microsoft FrontPage</em>, <em>Dreamweaver</em>)</li>
</ul>
<blockquote>
<p>A estas páginas se les llama <strong>páginas web estáticas</strong></p>
</blockquote>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Museo de sitios web → <a href="https://www.webdesignmuseum.org/">webdesignmuseum.org</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="las-cosas-empiezan-a-cambiar">Las cosas empiezan a cambiar</h2>
<steps>
<step>
<ul>
<li>Poco a poco las tecnologías se desarrollan y los usuarios ganan <strong>facilidades para editar el contenido</strong></li>
<li>Google se populariza; nacen <strong>Blogger</strong>, <strong>WordPress</strong>, <strong>Wikipedia</strong>, <strong>LinkedIn</strong>...</li>
</ul>
</step>
<step>
<h3 id="p%C3%A1ginas-din%C3%A1micas">Páginas dinámicas</h3>
<ul>
<li>En vez de ser <strong>archivos HTML</strong> en el disco, empiezan a ser <strong>pequeños programas</strong> que se ejecutan cada vez que un usuario pide una página</li>
<li>Cambios mínimos al inicio (contador de visitas, fecha actual, cabecera variable) con lenguajes de script como <strong>PERL</strong> y <strong>PHP</strong></li>
</ul>
</step>
<step>
<h3 id="2004--nace-la-web-20">2004 — Nace la Web 2.0</h3>
<ul>
<li><strong>Dale Dougherty</strong> (O'Reilly) acuña el término para referirse a la Web como una <strong>plataforma</strong> con aplicaciones ligeras, dinámicas y en constante evolución</li>
<li>Las páginas dejan de ser documentos online para convertirse en <strong>aplicaciones web</strong>, y los usuarios <strong>toman el control de los contenidos</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFqu%C3%A9-es-una-aplicaci%C3%B3n-web">¿Qué es una aplicación web?</h2>
<ul>
<li>Una <strong>aplicación web</strong> es aquella que los usuarios utilizan accediendo a un <strong>servidor web</strong> a través de Internet mediante un <strong>navegador</strong></li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9C%85-independiente-del-so"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Independiente del SO</h3>
<p>Corre en cualquier dispositivo con navegador</p>
</div>
<div>
<h3 id="%E2%9C%85-f%C3%A1cil-de-actualizar"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Fácil de actualizar</h3>
<p>Se despliega una vez, en el servidor</p>
</div>
<div>
<h3 id="%E2%9C%85-sin-instalaci%C3%B3n"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Sin instalación</h3>
<p>Basta una URL para empezar a usarla</p>
</div>
</div>
<ul>
<li>Ejemplos: Gmail, Google Docs, Figma, Spotify Web, Netflix, la Ematrícula de la UCR</li>
<li>¿Y qué diferencia hay entre un <strong>sitio web</strong> y una <strong>aplicación web</strong>? → <spoiler>la interacción: un sitio se consulta, una aplicación se usa (lee y escribe estado del usuario)</spoiler></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFc%C3%B3mo-funciona-la-web--arquitectura">¿Cómo funciona la Web? — Arquitectura</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-%C2%BFqu%C3%A9-es-una-arquitectura"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3db.svg" data-marp-twemoji=""/> ¿Qué es una arquitectura?</h3>
<ul>
<li>Un <strong>diseño a alto nivel</strong> de cómo va a trabajar un sistema</li>
<li>Determina <strong>componentes</strong>, <strong>roles</strong> y <strong>comunicación</strong>, a nivel lógico y físico</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%80-arquitectura-distribuida"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f500.svg" data-marp-twemoji=""/> Arquitectura distribuida</h3>
<ul>
<li>Los sistemas web proponen una arquitectura <strong>distribuida</strong></li>
<li>Los componentes se reparten en dos tipos de nodos:
<ul>
<li><strong>Clientes</strong> (muchos)</li>
<li><strong>Servidores</strong> (uno, al menos a nivel lógico)</li>
</ul>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f30a.svg" data-marp-twemoji=""/> Internet es una red <strong>intercontinental</strong> gracias a los grandes cables submarinos de fibra óptica, con transmisiones de hasta <strong>60 Tb/s</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="60" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;../assets/request-response.png&quot;);background-size:contain;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="60" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="cliente-servidor">Cliente-Servidor</h2>

<ul>
<li>La web responde a una arquitectura <strong>cliente-servidor</strong> que utiliza un protocolo de <strong>pedido-respuesta</strong>: HTTP</li>
<li>El <strong>cliente</strong> hace un pedido <em>(request)</em></li>
<li>El <strong>servidor</strong> lo procesa y <strong>responde</strong> <em>(response)</em></li>
<li>El cliente es responsable de <strong>presentar</strong> la información al usuario</li>
</ul>
<br />
<ul>
<li>Un solo servidor atiende a <strong>miles</strong> de clientes → escalabilidad y disponibilidad son problemas del servidor</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="" data-marpit-pagination-total="60" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="http--hypertext-transfer-protocol">HTTP — HyperText Transfer Protocol</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li>Protocolo que nos permite <strong>pedir datos y recursos</strong></li>
<li>Basado en el principio <strong>cliente-servidor</strong></li>
<li>Utiliza <strong>cabeceras</strong> <em>(headers)</em> para enviar metadatos</li>
<li>Es <strong>stateless</strong>: no recuerda qué página pidió cada cliente</li>
</ul>
</div>
<div>
<ul>
<li>En <strong>HTTP/1.1</strong> y anteriores los mensajes eran de <strong>formato texto</strong></li>
<li>En <strong>HTTP/2</strong> están estructurados en <strong>formato binario</strong> (y HTTP/3 va sobre QUIC/UDP)</li>
<li>Existen <strong>dos tipos</strong> de mensajes:
<ul>
<li><strong>Peticiones</strong> <em>(requests)</em></li>
<li><strong>Respuestas</strong> <em>(responses)</em></li>
</ul>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://developer.mozilla.org/es/docs/Web/HTTP/Overview">HTTP en MDN</a> — el estado se recupera con <strong>cookies</strong>, <em>tokens</em> o sesiones</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="m%C3%A9todos-http">Métodos HTTP</h2>
<ul>
<li>HTTP define un conjunto de <strong>métodos de petición</strong> para indicar la acción que se desea realizar sobre un recurso. Cada uno implementa una <strong>semántica</strong> diferente</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Método</th>
<th style="text-align:left">Acción</th>
<th style="text-align:center">Idempotente</th>
<th style="text-align:center">Con cuerpo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>GET</strong></td>
<td style="text-align:left">Solicita un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left"><strong>POST</strong></td>
<td style="text-align:left">Crea un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left"><strong>PUT</strong></td>
<td style="text-align:left">Reemplaza un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left"><strong>PATCH</strong></td>
<td style="text-align:left">Modifica parcialmente un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left"><strong>DELETE</strong></td>
<td style="text-align:left">Elimina un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>
<ul>
<li>Hay otros: <code>HEAD</code>, <code>OPTIONS</code>, <code>CONNECT</code>, <code>TRACE</code> → <a href="https://developer.mozilla.org/es/docs/Web/HTTP/Methods">Métodos HTTP en MDN</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="c%C3%B3digos-de-estado-y-url">Códigos de estado y URL</h2>
<split-slide style="--left: 45%; --right: 55%;">
<div>
<h3 id="%F0%9F%94%A2-familias-de-c%C3%B3digos"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f522.svg" data-marp-twemoji=""/> Familias de códigos</h3>
<ul>
<li><strong>1xx</strong> — Informativo</li>
<li><strong>2xx</strong> — Éxito (<code>200 OK</code>, <code>201 Created</code>)</li>
<li><strong>3xx</strong> — Redirección (<code>301</code>, <code>304</code>)</li>
<li><strong>4xx</strong> — Error del <strong>cliente</strong> (<code>400</code>, <code>401</code>, <code>403</code>, <code>404</code>)</li>
<li><strong>5xx</strong> — Error del <strong>servidor</strong> (<code>500</code>, <code>502</code>, <code>503</code>)</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%97-anatom%C3%ADa-de-una-url"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Anatomía de una URL</h3>
<pre><code class="language-text">https://www.ucr.ac.cr:443/carreras?id=7#plan
└─┬─┘   └──────┬─────┘ └┬┘ └───┬──┘ └─┬─┘ └┬─┘
protocolo   dominio   puerto  ruta  query fragment
</code></pre>
<ul>
<li>Partes de una URL → <a href="../assets/url-parts.png" target="_blank">(I)</a> · <a href="../assets/url-parts-optionals.png" target="_blank">(II)</a> · <a href="../assets/query-strings.png" target="_blank">(III)</a></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="aplicaci%C3%B3n-web-vs-aplicaci%C3%B3n-m%C3%B3vil-nativa">Aplicación web vs. aplicación móvil nativa</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Criterio</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> Aplicación web</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Aplicación móvil nativa</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Accesibilidad</strong></td>
<td style="text-align:left">Acceso universal por navegador, sin instalación</td>
<td style="text-align:left">Requiere instalación desde una tienda</td>
</tr>
<tr>
<td style="text-align:left"><strong>Conexión</strong></td>
<td style="text-align:left">Depende de la conexión a Internet</td>
<td style="text-align:left">Puede funcionar sin conexión</td>
</tr>
<tr>
<td style="text-align:left"><strong>Actualizaciones</strong></td>
<td style="text-align:left">Inmediatas para todos los usuarios</td>
<td style="text-align:left">Manuales o automáticas, vía tienda</td>
</tr>
<tr>

<div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-aBrCOS4Y="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="18" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="60">
<h1 id="desarrollo-de-pila-completa">Desarrollo de pila completa</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>¿Qué es <em>Full Stack</em>?</li>
<li>Back-end</li>
<li>Front-end</li>
<li>El perfil de la persona desarrolladora</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFqu%C3%A9-es-el-desarrollo-full-stack">¿Qué es el desarrollo <em>Full Stack</em>?</h2>
<ul>
<li>El <strong>stack</strong> (pila) es el conjunto de tecnologías que se apilan para construir una aplicación completa</li>
<li>Desarrollo <strong>full stack</strong> = ser capaz de trabajar en <strong>todas las capas</strong>, del navegador a la base de datos</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%A8-capa-de-presentaci%C3%B3n"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Capa de presentación</h3>
<p>Lo que el usuario ve y toca — <strong>front-end</strong></p>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-capa-de-l%C3%B3gica"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Capa de lógica</h3>
<p>Reglas de negocio, autenticación, procesamiento — <strong>back-end</strong></p>
</div>
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-capa-de-datos"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Capa de datos</h3>
<p>Persistencia y recuperación de información — <strong>bases de datos</strong></p>
</div>
</div>
<ul>
<li>Stacks históricos: <strong>LAMP</strong> (Linux+Apache+MySQL+PHP), <strong>MEAN/MERN</strong> (Mongo+Express+Angular/React+Node), <strong>JAMstack</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="una-p%C3%A1gina-web-es-un-sistema-de-software">Una página web es un sistema de software</h2>
<ul>
<li>Son al menos <strong>5 lenguajes</strong> diferentes que <strong>interactúan entre sí</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%96%A5%EF%B8%8F-en-el-cliente"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> En el cliente</h3>
<ul>
<li><strong>HTML</strong> → estructura y contenido</li>
<li><strong>CSS</strong> → estilo (apariencia)</li>
<li><strong>JavaScript</strong> → comportamiento (interactividad)</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%97%83%EF%B8%8F-en-el-servidor"><img class="emoji" draggable="false" alt="🗃️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5c3.svg" data-marp-twemoji=""/> En el servidor</h3>
<ul>
<li><strong>Lenguaje de servidor</strong> → procesa código para crear páginas con contenido variable</li>
<li><strong>SQL / lenguaje de consulta</strong> → contiene y recupera los datos</li>
</ul>
</div>
</split-slide>
<ul>
<li>Conviene mantenerlos <strong>separados</strong>, cada uno en su tarea → se puede <strong>dividir el trabajo</strong> en partes</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-WGJnHeo6="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="21" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="60">
<h1 id="back-end">Back-end</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Servidores estáticos y dinámicos</li>
<li>Componentes del back-end</li>
<li>Bases de datos</li>
<li>APIs</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="web-10--servidores-est%C3%A1ticos">Web 1.0 — Servidores estáticos</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<ol>
<li>El navegador hace una <strong>petición</strong> al servidor mediante HTTP</li>
<li>El servidor transforma la <strong>URL</strong> en una <strong>ruta del sistema de archivos</strong></li>
<li>Devuelve el archivo al navegador</li>
</ol>
</div>
<div>
<blockquote>
<p>Para una misma URL, el servidor siempre devuelve el <strong>mismo recurso</strong>: ficheros HTML, CSS, JavaScript, imágenes...</p>
</blockquote>
</div>
</split-slide>
<p><img src="../assets/server.png" alt="contain" style="width:600px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="web-20--servidores-din%C3%A1micos">Web 2.0 — Servidores dinámicos</h2>
<steps>
<step>
<ul>
<li>La mayoría de servidores web permiten que en cada petición se <strong>ejecute un programa</strong> que genera dinámicamente el recurso que se envía al usuario → <em>server-side scripting</em></li>
<li>Ahora, <strong>para una misma URL el servidor puede devolver un recurso distinto</strong></li>
<li>A este contenido generado <em>&quot;al vuelo&quot;</em> se le llama <strong>contenido dinámico</strong>, en contraposición al contenido estático obtenido del sistema de archivos</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="📧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e7.svg" data-marp-twemoji=""/> Ejemplo: en Gmail, cada usuario ve <strong>sus</strong> correos</p>
</blockquote>
</step>
<step>
<ul>
<li>Es normal que el contenido dinámico se genere con la información de una <strong>base de datos</strong></li>
<li>Los servidores con contenido dinámico no solo <strong>envían</strong> recursos: también <strong>procesan</strong> información que les llega del navegador
<ul>
<li>Datos completados por el usuario en formularios</li>
<li>Archivos enviados</li>
<li>Información codificada en los enlaces que pulsan los usuarios</li>
</ul>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFqu%C3%A9-hace-el-back-end">¿Qué hace el back-end?</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%90-autenticaci%C3%B3n-y-autorizaci%C3%B3n"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f510.svg" data-marp-twemoji=""/> Autenticación y autorización</h3>
<p>Quién eres y qué puedes hacer</p>
</div>
<div>
<h3 id="%F0%9F%93%90-l%C3%B3gica-de-negocio"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Lógica de negocio</h3>
<p>Las reglas del dominio: matricular, cobrar, reservar</p>
</div>
<div>
<h3 id="%F0%9F%92%BE-persistencia"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4be.svg" data-marp-twemoji=""/> Persistencia</h3>
<p>Guardar y consultar datos de forma consistente</p>
</div>
<div>
<h3 id="%F0%9F%94%97-integraciones"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f517.svg" data-marp-twemoji=""/> Integraciones</h3>
<p>Pasarelas de pago, correo, servicios externos</p>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-seguridad"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Seguridad</h3>
<p>Validación, cifrado, control de acceso, auditoría</p>
</div>
<div>
<h3 id="%F0%9F%93%88-escalabilidad"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c8.svg" data-marp-twemoji=""/> Escalabilidad</h3>
<p>Caché, colas, balanceo de carga, observabilidad</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla de oro: <strong>nunca confíes en el cliente</strong>. Toda validación crítica se repite en el servidor</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="tecnolog%C3%ADas-en-el-servidor">Tecnologías en el servidor</h2>
<ul>
<li>Los <strong>estándares no son tan necesarios</strong> en el servidor: cada organización desarrolla con la tecnología de su elección</li>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="bases-de-datos">Bases de datos</h2>
<ul>
<li>Se encargan de <strong>almacenar los datos de forma ordenada</strong> y devolverlos rápidamente</li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%A7%AE-relacionales-sql"><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ee.svg" data-marp-twemoji=""/> Relacionales (SQL)</h3>
<ul>
<li>Datos en <strong>tablas</strong> con esquema fijo y relaciones</li>
<li>Garantías <strong>ACID</strong>, consultas complejas con <code>JOIN</code></li>
<li>PostgreSQL, MySQL, SQL Server, Oracle, SQLite</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%A6-nosql"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> NoSQL</h3>
<ul>
<li>Documentos, clave-valor, grafos o columnas</li>
<li>Esquema <strong>flexible</strong>, diseñadas para <strong>alta carga</strong> y escalado horizontal</li>
<li>MongoDB, Redis, Cassandra, Neo4j, DynamoDB</li>
</ul>
</div>
</split-slide>
<ul>
<li>Las relacionales han sido las más populares, pero cada vez se usan más las NoSQL. <strong>No compiten: se combinan</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="apis--el-contrato-entre-capas">APIs — el contrato entre capas</h2>
<ul>
<li>Una <strong>API</strong> <em>(Application Programming Interface)</em> define <strong>cómo</strong> el front-end le pide cosas al back-end</li>
</ul>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<pre><code class="language-http"><span class="hljs-keyword">GET</span> <span class="hljs-string">/api/cursos/SC-701</span> <span class="hljs-meta">HTTP/1.1</span>
<span class="hljs-attribute">Host</span><span class="hljs-punctuation">: </span>api.ucr.ac.cr
<span class="hljs-attribute">Accept</span><span class="hljs-punctuation">: </span>application/json
<span class="hljs-attribute">Authorization</span><span class="hljs-punctuation">: </span>Bearer eyJhbGciOi...
</code></pre>
<pre><code class="language-json">HTTP/<span class="hljs-number">1.1</span> <span class="hljs-number">200</span> OK
Content-Type<span class="hljs-punctuation">:</span> application/json

<span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;sigla&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;SC-701&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;nombre&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Desarrollo de Software IV&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;creditos&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">4</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<ul>
<li><strong>REST</strong> — recursos + métodos HTTP. El estándar de facto</li>
<li><strong>GraphQL</strong> — el cliente pide exactamente los campos que necesita</li>
<li><strong>gRPC / tRPC</strong> — llamadas tipadas entre servicios</li>
<li><strong>WebSockets / SSE</strong> — comunicación en tiempo real</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-1ZypbM3Q="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="28" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="60">
<h1 id="front-end">Front-end</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>El cliente web: los navegadores</li>
<li>HTML, CSS y JavaScript</li>
<li>Estándares web</li>
<li>Modalidades de renderizado</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="el-cliente-web-los-navegadores">El cliente web: los navegadores</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%95%B0%EF%B8%8F-historia"><img class="emoji" draggable="false" alt="🕰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f570.svg" data-marp-twemoji=""/> Historia</h3>
<ul>
<li><strong>Mosaic</strong> (1993)</li>
<li><strong>Netscape</strong> (1994)</li>
<li><strong>Internet Explorer</strong> (1995)</li>
<li><strong>Opera</strong> (1996)</li>
<li><strong>Mozilla Firefox</strong> (2002)</li>
<li><strong>iPhone / Safari móvil</strong> (2007)</li>
<li><strong>Android</strong> (2008) · <strong>Chrome</strong> (2008)</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-qu%C3%A9-hay-dentro"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Qué hay dentro</h3>
<ul>
<li><strong>Motor de renderizado</strong> — convierte HTML+CSS en píxeles (<em>Blink</em>, <em>Gecko</em>, <em>WebKit</em>)</li>
<li><strong>Motor de JavaScript</strong> — ejecuta el código (<em>V8</em>, <em>SpiderMonkey</em>, <em>JavaScriptCore</em>)</li>
<li><strong>APIs web</strong> — red, almacenamiento, cámara, geolocalización...</li>
</ul>
</div>
</split-slide>
<ul>
<li>Cuota de mercado histórica → <a href="https://gs.statcounter.com/browser-market-share">StatCounter</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="p%C3%A1ginas-est%C3%A1ticas-vs-p%C3%A1ginas-din%C3%A1micas-en-el-cliente">Páginas estáticas vs. páginas dinámicas (en el cliente)</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%93%84-cliente-est%C3%A1tico"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c4.svg" data-marp-twemoji=""/> Cliente estático</h3>
<ul>
<li>El navegador renderiza el <strong>HTML con CSS e imágenes, pero sin JavaScript</strong></li>
<li>Cada clic en un enlace <strong>recarga por completo</strong> la página</li>
<li>Se siguen usando mucho: páginas personales, <em>landing pages</em>, <em>home pages</em>, documentación</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A1-cliente-din%C3%A1mico"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a1.svg" data-marp-twemoji=""/> Cliente dinámico</h3>
<ul>
<li>Las páginas incluyen <strong>JavaScript</strong> que se ejecuta en el navegador</li>
<li>Se usa para:
<ul>
<li>Efectos gráficos e interactividad</li>
<li><strong>Peticiones en segundo plano</strong> (AJAX / <code>fetch</code>)</li>
<li><strong>Single Page Applications</strong></li>
</ul>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="los-tres-lenguajes-del-front-end">Los tres lenguajes del front-end</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%90-html"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> HTML</h3>
<p>Proporciona la información <strong>estructurada</strong>: secciones, párrafos, títulos, imágenes.</p>
<p>La versión actual es <strong>HTML5</strong>: multimedia, comunicaciones, concurrencia y almacenamiento.</p>
</div>
<div>
<h3 id="%F0%9F%8E%A8-css"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3a8.svg" data-marp-twemoji=""/> CSS</h3>
<p>Define la <strong>presentación</strong> de un documento estructurado: distribución, colores, tipografías, fondos, efectos.</p>
<p>Sirve para HTML, XML, SVG e incluso interfaces de otras tecnologías.</p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-javascript"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e0.svg" data-marp-twemoji=""/> JavaScript</h3>
<p>Permite <strong>modificar la página</strong> y ejecutar código cuando se interactúa con ella.</p>
<p>Nació interpretado; hoy se ejecuta en <strong>máquinas virtuales</strong> optimizadas dentro del navegador.</p>
</div>
</div>
<ul>
<li>Hoy los navegadores son bastante <strong>compatibles entre sí</strong>... en el pasado no fue así <img class="emoji" draggable="false" alt="😅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f605.svg" data-marp-twemoji=""/></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="est%C3%A1ndares-web">Estándares web</h2>
<split-slide style="--left: 55%; --right: 45%;">
<div>
<ul>
<li>Existen estándares que indican <strong>cómo es cada tecnología</strong> usada en los navegadores (HTML, CSS, JavaScript)</li>
<li>Intentan que la web sea <strong>compatible con cualquier dispositivo</strong></li>
<li>Quién los define:
<ul>
<li><strong>W3C</strong> y <strong>WHATWG</strong> → HTML, CSS y APIs web</li>
<li><strong>ECMA TC39</strong> → el lenguaje JavaScript (ECMAScript)</li>
<li><strong>IETF</strong> → HTTP, TLS, URL</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%8C-tecnolog%C3%ADas-no-est%C3%A1ndar"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> Tecnologías no estándar</h3>
<ul>
<li>La web avanzó también gracias a tecnologías <strong>no estándar</strong> añadidas mediante <strong>plugins</strong></li>
<li>Algunas llegaron a ser estándares <em>&quot;de facto&quot;</em>, como <strong>Adobe Flash</strong></li>
<li>Los dispositivos móviles, las SmartTVs y la estandarización de <strong>HTML5</strong> las dejaron <strong>en desuso</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="%C2%BFd%C3%B3nde-se-renderiza-la-p%C3%A1gina">¿Dónde se renderiza la página?</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<ul>
<li><strong>CSR</strong> <em>(Client Side Rendering)</em> — el servidor manda un HTML casi vacío y JS construye todo en el navegador</li>
<li><strong>SSR</strong> <em>(Server Side Rendering)</em> — el HTML se genera en el servidor <strong>en cada petición</strong></li>
<li><strong>SSG</strong> <em>(Static Site Generation)</em> — el HTML se genera <strong>en el build</strong> y se sirve como archivo</li>
<li><strong>ISR / streaming</strong> — mezclas de las anteriores</li>
</ul>
</div>
<div>
<ul>
<li>Es una decisión con consecuencias reales en <strong>SEO</strong>, <strong>tiempo de carga</strong> y <strong>coste de servidor</strong></li>
<li>Comparativa visual → <a href="../assets/ssr-ssg-csr.png">Modalidades de renderizado</a></li>
</ul>
<blockquote>
<p>Hoy casi ningún proyecto elige <em>una sola</em>: se decide <strong>por ruta</strong></p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="el-perfil-full-stack">El perfil <em>Full Stack</em></h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9C%85-ventajas"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Ventajas</h3>
<ul>
<li><strong>Visión completa</strong> del sistema, de la UI a la base de datos</li>
<li>Menos fricción de comunicación entre capas</li>
<li>Muy valorado en <strong>equipos pequeños</strong> y startups</li>
<li>Facilita prototipar y llevar una idea de punta a punta</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-riesgos"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Riesgos</h3>
<ul>
<li><em>&quot;Aprendiz de todo, maestro de nada&quot;</em> si no hay profundidad</li>
<li>El ecosistema es <strong>enorme</strong> y cambia rápido</li>
<li>En equipos grandes se prefiere <strong>especialización</strong> con base full stack</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Recomendación: <strong>base amplia + una especialidad profunda</strong> (perfil en «T»)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="actividad-2">Actividad 2</h2>
<ul>
<li>En parejas, diseñen el <em>stack</em> de una aplicación de <strong>reservas de laboratorios</strong> para la Escuela:</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8E%A8-front-end"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Front-end</h3>
<p>¿Qué necesita la interfaz? ¿CSR, SSR o SSG?</p>
</div>
<div>
<h3 id="%E2%9A%99%EF%B8%8F-back-end"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Back-end</h3>
<p>¿Qué lenguaje? ¿Qué endpoints expone la API?</p>
</div>
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-datos"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Datos</h3>
<p>¿SQL o NoSQL? ¿Qué entidades guardan?</p>
</div>
</div>
<ul>
<li>Justifiquen <strong>cada decisión</strong> en una frase. No hay una única respuesta correcta</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-scope-ZiXrMbFA="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="36" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="60">
<h1 id="tendencias">Tendencias</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Multi-Page Applications (MPA)</li>
<li>Single-Page Applications (SPA)</li>
<li>Progressive Web Applications (PWA)</li>
<li>Native Web Applications</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="el-panorama">El panorama</h2>
<ul>
<li>Todas son formas de <strong>entregar</strong> una aplicación web. No son excluyentes entre sí</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%9A-mpa"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> MPA</h3>
<p>Muchas páginas HTML, el servidor manda cada una</p>
</div>
<div>
<h3 id="%F0%9F%94%84-spa"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f504.svg" data-marp-twemoji=""/> SPA</h3>
<p>Una sola página, JavaScript reescribe el contenido</p>
</div>
<div>
<h3 id="%F0%9F%93%B2-pwa"><img class="emoji" draggable="false" alt="📲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f2.svg" data-marp-twemoji=""/> PWA</h3>
<p>Una web <strong>instalable</strong> que funciona offline</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-native-web-app"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Native web app</h3>
<p>Web empaquetada como app <strong>nativa</strong> de escritorio o móvil</p>
</div>
</div>
<ul>
<li>Una misma aplicación puede ser <strong>SPA + PWA</strong>, o <strong>MPA + PWA</strong>, o una <strong>SPA empaquetada</strong> con Capacitor <img class="emoji" draggable="false" alt="🤯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f92f.svg" data-marp-twemoji=""/></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="131-multi-page-applications-mpa">1.3.1 Multi-Page Applications (MPA)</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9A%99%EF%B8%8F-c%C3%B3mo-funciona"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Cómo funciona</h3>
<ul>
<li>Aplicación web <strong>tradicional</strong>: cada vista es un documento HTML distinto</li>
<li>Cada navegación provoca una <strong>petición al servidor</strong> y una <strong>recarga completa</strong> de la página</li>
<li>El servidor arma el HTML (SSR o SSG)</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-balance"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> Balance</h3>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>SEO</strong> excelente: cada página tiene su URL y su HTML</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Carga inicial rápida y simple</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Menos JavaScript en el cliente</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Navegación con parpadeo y recargas</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Estado compartido más difícil</li>
</ul>
</div>
</split-slide>
<ul>
<li>Buenas para: <strong>e-commerce</strong>, portales de noticias, documentación, sitios con <strong>mucho contenido</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="single-page-applications-spa">Single-Page Applications (SPA)</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9A%99%EF%B8%8F-c%C3%B3mo-funciona-1"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Cómo funciona</h3>
<ul>
<li>Se carga <strong>una sola</strong> página HTML</li>
<li>Cuando hay que mostrar contenido nuevo, JavaScript usa <code>fetch</code> para pedir <strong>datos</strong> (no HTML) y <strong>actualiza el DOM</strong></li>
<li>El <strong>enrutamiento</strong> ocurre en el cliente (History API)</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-balance-1"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2696.svg" data-marp-twemoji=""/> Balance</h3>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Navegación <strong>fluida</strong>, sin recargas</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Sensación de aplicación de escritorio</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> El back-end se reduce a una <strong>API</strong></li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Carga inicial pesada (<em>bundle</em> de JS)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> SEO y accesibilidad más costosos</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Hay que reimplementar historial, foco, errores...</li>
</ul>
</div>
</split-slide>
<ul>
<li>Buenas para: <strong>dashboards</strong>, editores, correo, herramientas internas → Gmail, Figma, Trello</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="mpa-vs-spa">MPA vs. SPA</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> MPA</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f504.svg" data-marp-twemoji=""/> SPA</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Navegación</strong></td>
<td style="text-align:left">Recarga completa del documento</td>
<td style="text-align:left">Reescritura del DOM sin recargar</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dónde se renderiza</strong></td>
<td style="text-align:left">Servidor</td>
<td style="text-align:left">Cliente (o híbrido)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Carga inicial</strong></td>
<td style="text-align:left">Ligera</td>
<td style="text-align:left">Pesada (<em>bundle</em>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Navegación posterior</strong></td>
<td style="text-align:left">Más lenta</td>
<td style="text-align:left">Casi instantánea</td>
</tr>
<tr>
<td style="text-align:left"><strong>SEO</strong></td>
<td style="text-align:left">Nativo</td>
<td style="text-align:left">Requiere SSR o prerender</td>
</tr>
<tr>
<td style="text-align:left"><strong>Complejidad del front</strong></td>
<td style="text-align:left">Baja</td>
<td style="text-align:left">Alta</td>
</tr>
<tr>
<td style="text-align:left"><strong>Consumo de datos</strong></td>
<td style="text-align:left">Repite HTML en cada vista</td>
<td style="text-align:left">Solo datos (JSON)</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Los <strong>meta-frameworks</strong> modernos (Next, Nuxt, Astro) difuminan la frontera: SSR en la primera carga + navegación tipo SPA después</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="progressive-web-applications-pwa">Progressive Web Applications (PWA)</h2>
<ul>
<li>Una <strong>PWA</strong> es una aplicación construida con tecnologías web que ofrece una experiencia <strong>similar a la de una app nativa</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%F0%9F%8C%90-como-una-web"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f310.svg" data-marp-twemoji=""/> Como una web</h3>
<ul>
<li>Un <strong>único código base</strong> para todas las plataformas</li>
<li>Se accede por una <strong>URL</strong></li>
<li><strong>Indexable</strong> por buscadores</li>
<li>Sin tiendas de aplicaciones ni comisiones</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%B1-como-una-app-nativa"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Como una app nativa</h3>
<ul>
<li>Se <strong>instala</strong> en el dispositivo</li>
<li>Funciona <strong>offline</strong> y en segundo plano</li>
<li>Se <strong>integra</strong> con el sistema y otras apps</li>
<li>Notificaciones, iconos, pantalla completa</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d6.svg" data-marp-twemoji=""/> <a href="https://developer.mozilla.org/es/docs/Web/Progressive_web_apps">Progressive web apps en MDN</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="pwa--los-ingredientes">PWA — Los ingredientes</h2>
<steps>
<step>
<h3 id="1%EF%B8%8F%E2%83%A3-web-app-manifest"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Web App Manifest</h3>
<p>Un JSON que le dice al sistema <strong>cómo instalar</strong> la aplicación</p>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Reservas de Laboratorios UCR&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;short_name&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Reservas&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;start_url&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;display&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;standalone&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;background_color&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;#0d1117&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;theme_color&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;#fe704d&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;icons&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;src&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/icon-512.png&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;sizes&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;512x512&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;image/png&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">]</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</step>
<step>
<h3 id="2%EF%B8%8F%E2%83%A3-service-worker"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Service Worker</h3>
<p>Un script que corre <strong>en segundo plano</strong> e <strong>intercepta</strong> las peticiones de red</p>
<pre><code class="language-js"><span class="hljs-comment">// sw.js — estrategia &quot;cache first&quot;</span>
self.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;install&quot;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  event.<span class="hljs-title function_">waitUntil</span>(caches.<span class="hljs-title function_">open</span>(<span class="hljs-string">&quot;v1&quot;</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">cache</span>) =&gt;</span> cache.<span class="hljs-title function_">addAll</span>([<span class="hljs-string">&quot;/&quot;</span>, <span class="hljs-string">&quot;/app.css&quot;</span>, <span class="hljs-string">&quot;/app.js&quot;</span>])));
});

self.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&quot;fetch&quot;</span>, <span class="hljs-function">(<span class="hljs-params">event</span>) =&gt;</span> {
  event.<span class="hljs-title function_">respondWith</span>(caches.<span class="hljs-title function_">match</span>(event.<span class="hljs-property">request</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function">(<span class="hljs-params">hit</span>) =&gt;</span> hit ?? <span class="hljs-title function_">fetch</span>(event.<span class="hljs-property">request</span>)));
});
</code></pre>
</step>
<step>
<h3 id="3%EF%B8%8F%E2%83%A3-https-y-registro"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/33-20e3.svg" data-marp-twemoji=""/> HTTPS y registro</h3>
<pre><code class="language-js"><span class="hljs-comment">// main.js</span>
<span class="hljs-keyword">if</span> (<span class="hljs-string">&quot;serviceWorker&quot;</span> <span class="hljs-keyword">in</span> navigator) {
  <span class="hljs-keyword">await</span> navigator.<span class="hljs-property">serviceWorker</span>.<span class="hljs-title function_">register</span>(<span class="hljs-string">&quot;/sw.js&quot;</span>);
}
</code></pre>
<ul>
<li>Los service workers <strong>solo funcionan bajo HTTPS</strong> (o <code>localhost</code>)</li>
<li>Sin los tres ingredientes, el navegador <strong>no ofrece instalar</strong> la aplicación</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="pwa--capacidades">PWA — Capacidades</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A5-instalable"><img class="emoji" draggable="false" alt="📥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e5.svg" data-marp-twemoji=""/> Instalable</h3>
<p>Icono en el escritorio o el <em>home screen</em>, ventana sin barra del navegador</p>
</div>
<div>
<h3 id="%E2%9C%88%EF%B8%8F-offline"><img class="emoji" draggable="false" alt="✈️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2708.svg" data-marp-twemoji=""/> Offline</h3>
<p><code>Cache API</code> + <code>IndexedDB</code> para trabajar sin conexión</p>
</div>
<div>
<h3 id="%F0%9F%94%94-notificaciones"><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f514.svg" data-marp-twemoji=""/> Notificaciones</h3>
<p><code>Notifications API</code> + <code>Push API</code></p>
</div>
<div>
<h3 id="%F0%9F%94%81-sincronizaci%C3%B3n"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f501.svg" data-marp-twemoji=""/> Sincronización</h3>
<p><code>Background Sync</code> para reintentar cuando vuelva la red</p>
</div>
<div>
<h3 id="%F0%9F%93%A4-integraci%C3%B3n"><img class="emoji" draggable="false" alt="📤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e4.svg" data-marp-twemoji=""/> Integración</h3>
<p><code>Web Share</code>, asociación de tipos de archivo, <em>badges</em>, atajos</p>
</div>
<div>
<h3 id="%F0%9F%9A%80-actualizaci%C3%B3n"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f680.svg" data-marp-twemoji=""/> Actualización</h3>
<p>Se actualiza sola desde el servidor, sin pasar por una tienda</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26a0.svg" data-marp-twemoji=""/> Limitaciones: soporte <strong>desigual en iOS</strong>, acceso al hardware más restringido que una app nativa</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="native-web-applications">Native Web Applications</h2>
<ul>
<li>Aplicaciones construidas con <strong>tecnología web</strong> pero <strong>empaquetadas y distribuidas</strong> como aplicaciones nativas</li>
</ul>
<steps>
<step>
<h3 id="%F0%9F%93%A6-web-empaquetada-h%C3%ADbridas"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Web empaquetada (híbridas)</h3>
<ul>
<li>El código web se ejecuta dentro de un <strong>contenedor nativo</strong> (<em>WebView</em>)</li>
<li><strong>Plugins nativos</strong> dan acceso a las APIs del dispositivo (cámara, GPS, biometría)</li>
<li>Se publica en las tiendas como cualquier otra app</li>
<li>Escritorio: <strong>Electron</strong>, <strong>Tauri</strong> · Móvil: <strong>Capacitor</strong>, Cordova (Ionic)</li>
</ul>
</step>
<step>
<h3 id="%E2%9A%99%EF%B8%8F-pseudo-nativas-multiplataforma"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Pseudo-nativas (multiplataforma)</h3>
<ul>
<li><strong>Compilan a código nativo</strong> y usan <strong>componentes nativos</strong> reales, no un WebView</li>
<li>Mejor rendimiento que las híbridas, un solo código base</li>
<li><strong>React Native</strong>, <strong>Flutter</strong>, .NET MAUI</li>
<li>Requieren conocer los <strong>paradigmas y componentes</strong> de cada plataforma</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="native-web-apps--electron-vs-tauri">Native web apps — Electron vs. Tauri</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/269b.svg" data-marp-twemoji=""/> Electron</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🦀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f980.svg" data-marp-twemoji=""/> Tauri</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Motor de render</strong></td>
<td style="text-align:left">Empaqueta <strong>Chromium</strong> completo</td>
<td style="text-align:left">Usa el <strong>WebView del sistema</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Tamaño de la app</strong></td>
<td style="text-align:left">~150 MB en un <em>&quot;hola mundo&quot;</em></td>
<td style="text-align:left">Habitualmente <strong>&lt; 10 MB</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Memoria</strong></td>
<td style="text-align:left">Alta</td>
<td style="text-align:left">~30-40 MB en reposo</td>
</tr>
<tr>
<td style="text-align:left"><strong>Backend nativo</strong></td>
<td style="text-align:left">Node.js</td>
<td style="text-align:left">Rust</td>
</tr>
<tr>
<td style="text-align:left"><strong>Consistencia visual</strong></td>
<td style="text-align:left">Idéntica en todo SO</td>
<td style="text-align:left">Depende del WebView de cada SO</td>
</tr>
<tr>
<td style="text-align:left"><strong>Ejemplos</strong></td>
<td style="text-align:left">VS Code, Slack, Discord, Figma</td>
<td style="text-align:left">Apps recientes centradas en tamaño y seguridad</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f9e9.svg" data-marp-twemoji=""/> En móvil, <strong>Capacitor</strong> hace lo equivalente: envuelve tu web (que además puede seguir siendo una PWA) en un proyecto iOS/Android</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="ventajas-y-desventajas-de-las-h%C3%ADbridas">Ventajas y desventajas de las híbridas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9C%85-ventajas-1"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> Ventajas</h3>
<ul>
<li>Desarrollo <strong>multiplataforma</strong> con un solo código base</li>
<li><strong>Menor costo</strong> de desarrollo</li>
<li><strong>Reutilización</strong> de conocimientos web</li>
<li>Acceso a características nativas vía plugins</li>
<li>Mantenimiento simplificado</li>
</ul>
</div>
<div>
<h3 id="%E2%9D%8C-desventajas"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Desventajas</h3>
<ul>
<li><strong>Rendimiento inferior</strong> al nativo</li>
<li>Experiencia de usuario menos pulida</li>
<li>Limitaciones en funcionalidades avanzadas</li>
<li>Mayor consumo de recursos</li>
<li>Dependencia de plugins de terceros</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="60">
<h2 id="comparativa-general">Comparativa general</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:center"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4da.svg" data-marp-twemoji=""/> MPA</th>
<th style="text-align:center"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f504.svg" data-marp-twemoji=""/> SPA</th>

<h2 id="%C2%BFc%C3%B3mo-elegir">¿Cómo elegir?</h2>
<steps>
<step>
<ul>
<li>¿El contenido es <strong>público</strong> y el SEO es crítico? → <strong>MPA</strong> (o meta-framework con SSR/SSG)</li>
<li>¿Es una <strong>herramienta</strong> con mucha interacción y estado? → <strong>SPA</strong></li>
<li>¿Necesitas <strong>offline</strong>, notificaciones o presencia en el escritorio, y la web te alcanza? → <strong>PWA</strong></li>
</ul>
</step>
<step>
<ul>
<li>¿Necesitas <strong>APIs nativas</strong> que la web no expone, o <strong>presencia en la tienda</strong>? → <strong>Capacitor / Electron / Tauri</strong></li>
<li>¿El <strong>rendimiento</strong> o la integración con la plataforma <strong>son el producto</strong>? → <strong>nativo</strong> o <strong>React Native / Flutter</strong></li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La decisión rara vez es técnica pura: pesan el <strong>presupuesto</strong>, el <strong>tiempo al mercado</strong> y el <strong>equipo disponible</strong></p>
</blockquote>
</step>
</steps>
</section>
