<h2 id="%F0%9F%93%8B-laboratorio-5--api-rest-y-documentaci%C3%B3n"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Laboratorio 5 — API REST y documentación</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="qu%C3%A9-se-entrega-1">Qué se entrega</h3>
<ul>
<li>Rutas <strong>orientadas a recursos</strong>, con anidamiento</li>
<li><strong>Recursos de API</strong>: ningún modelo se serializa directo</li>
<li>Códigos correctos: <code>200</code>, <code>201</code> + <code>Location</code>, <code>204</code>, <code>400</code>, <code>401</code>, <code>403</code>, <code>404</code>, <code>409</code>, <code>422</code></li>
<li><strong>Manejo centralizado</strong> de excepciones, sin trazas de pila</li>
<li>Metadatos de paginación consistentes</li>
<li><strong>OpenAPI</strong> exportado a <code>docs/openapi.yaml</code></li>
<li>Colección del cliente HTTP con <strong>15+ solicitudes</strong></li>
<li>Contrato de un <strong>microservicio</strong> justificado</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AF-hito-1--porci%C3%B3n-vertical-en-nestjs"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Hito 1 — Porción vertical en NestJS</h3>
<p>Con el contrato estable y la referencia terminada en Laravel, se replica en NestJS:</p>
<ul>
<li>Los <strong>seis endpoints</strong> con los mismos códigos y estructuras</li>
<li>Validación, manejo centralizado de errores y autenticación por token</li>
<li><strong>Tres pruebas</strong> equivalentes</li>
<li><strong>Mediciones</strong>: tiempo de puesta en marcha, archivos y líneas, esfuerzo por aspecto</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-scope-SAKiY2IA="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="58" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="93">
<h1 id="manejo-de-errores">Manejo de errores</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>Manejo centralizado de excepciones</li>
<li>Traducción a códigos HTTP</li>
<li>Qué nunca debe salir en una respuesta</li>
<li>Registro y observabilidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="por-qu%C3%A9-centralizar-el-manejo-de-errores">Por qué centralizar el manejo de errores</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%E2%9D%8C-disperso"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Disperso</h3>
<pre><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params"><span class="hljs-variable">$id</span></span>) </span>{
    <span class="hljs-keyword">try</span> {
        <span class="hljs-variable">$p</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">find</span>(<span class="hljs-variable">$id</span>);
        <span class="hljs-keyword">if</span> (!<span class="hljs-variable">$p</span>) {
            <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">json</span>(
                [<span class="hljs-string">&#x27;error&#x27;</span> =&gt; <span class="hljs-string">&#x27;no existe&#x27;</span>], <span class="hljs-number">404</span>);
        }
        <span class="hljs-comment">// ...</span>
    } <span class="hljs-keyword">catch</span> (<span class="hljs-built_in">Exception</span> <span class="hljs-variable">$e</span>) {
        <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">json</span>(
            [<span class="hljs-string">&#x27;error&#x27;</span> =&gt; <span class="hljs-variable">$e</span>-&gt;<span class="hljs-title function_ invoke__">getMessage</span>()], <span class="hljs-number">500</span>);
    }
}
</code></pre>
<p>Repetido en <strong>cada</strong> método. Formatos inconsistentes</p>
</div>
<div>
<h3 id="%E2%9C%85-centralizado"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Centralizado</h3>
<pre><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>) </span>{
    <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable">$pedido</span>);
}
</code></pre>
<ul>
<li>El <em>model binding</em> lanza <code>ModelNotFoundException</code> → <strong>404</strong></li>
<li><code>authorize</code> lanza <code>AuthorizationException</code> → <strong>403</strong></li>
<li>Ambas se traducen <strong>en un solo lugar</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="bootstrapappphp--el-punto-%C3%BAnico">bootstrap/app.php — el punto único</h2>
<split-slide style="--left: 58%; --right: 42%; --font-size: 0.72rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// bootstrap/app.php</span>
-&gt;<span class="hljs-title function_ invoke__">withExceptions</span>(function (Exceptions <span class="hljs-variable">$exceptions</span>): <span class="hljs-keyword">void</span> {

    <span class="hljs-comment">// Regla de negocio → 409</span>
    <span class="hljs-variable">$exceptions</span>-&gt;<span class="hljs-title function_ invoke__">render</span>(function (ReglaNegocioException <span class="hljs-variable">$e</span>) {
        <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">json</span>([
            <span class="hljs-string">&#x27;mensaje&#x27;</span> =&gt; <span class="hljs-variable">$e</span>-&gt;<span class="hljs-title function_ invoke__">getMessage</span>(),
            <span class="hljs-string">&#x27;codigo&#x27;</span>  =&gt; <span class="hljs-string">&#x27;REGLA_NEGOCIO&#x27;</span>,
        ], <span class="hljs-number">409</span>);
    });

    <span class="hljs-comment">// Recurso inexistente en la API → 404 limpio</span>
    <span class="hljs-variable">$exceptions</span>-&gt;<span class="hljs-title function_ invoke__">render</span>(function (NotFoundHttpException <span class="hljs-variable">$e</span>, Request <span class="hljs-variable">$r</span>) {
        <span class="hljs-keyword">if</span> (<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">is</span>(<span class="hljs-string">&#x27;api/*&#x27;</span>)) {
            <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">json</span>([<span class="hljs-string">&#x27;mensaje&#x27;</span> =&gt; <span class="hljs-string">&#x27;Recurso no encontrado.&#x27;</span>], <span class="hljs-number">404</span>);
        }
    });

    <span class="hljs-comment">// Siempre JSON bajo /api</span>
    <span class="hljs-variable">$exceptions</span>-&gt;<span class="hljs-title function_ invoke__">shouldRenderJsonWhen</span>(fn (Request <span class="hljs-variable">$r</span>, <span class="hljs-built_in">Throwable</span> <span class="hljs-variable">$e</span>) =&gt;
        <span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">is</span>(<span class="hljs-string">&#x27;api/*&#x27;</span>) || <span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">expectsJson</span>());

    <span class="hljs-comment">// No inundar la bitácora</span>
    <span class="hljs-variable">$exceptions</span>-&gt;<span class="hljs-title function_ invoke__">dontReport</span>([<span class="hljs-title class_">ReglaNegocioException</span>::<span class="hljs-variable language_">class</span>]);
});
</code></pre>
</div>
<div>
<ul>
<li><code>render()</code> — cómo se <strong>muestra</strong> al cliente</li>
<li><code>report()</code> — cómo se <strong>registra</strong></li>
<li><code>level()</code> — con qué severidad</li>
<li><code>dontReport()</code> — qué se ignora</li>
<li><code>context()</code> — datos comunes a toda bitácora</li>
<li><code>throttle()</code> — limita el volumen de errores registrados</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> Laravel 13: marcar la excepción con la interfaz <code>ShouldntReport</code> equivale a <code>dontReport</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="traducci%C3%B3n-excepci%C3%B3n-%E2%86%92-c%C3%B3digo-de-estado">Traducción excepción → código de estado</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Excepción</th>
<th style="text-align:center">Código</th>
<th style="text-align:left">Cuándo ocurre</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>ValidationException</code></td>
<td style="text-align:center"><strong>422</strong></td>
<td style="text-align:left">El Form Request rechazó los datos</td>
</tr>
<tr>
<td style="text-align:left"><code>AuthenticationException</code></td>
<td style="text-align:center"><strong>401</strong></td>
<td style="text-align:left">No hay token o venció</td>
</tr>
<tr>
<td style="text-align:left"><code>AuthorizationException</code></td>
<td style="text-align:center"><strong>403</strong></td>
<td style="text-align:left">El token es válido pero la política lo niega</td>
</tr>
<tr>
<td style="text-align:left"><code>ModelNotFoundException</code></td>
<td style="text-align:center"><strong>404</strong></td>
<td style="text-align:left">El <em>model binding</em> no encontró el registro</td>
</tr>
<tr>
<td style="text-align:left"><code>ReglaNegocioException</code> <em>(propia)</em></td>
<td style="text-align:center"><strong>409</strong></td>
<td style="text-align:left">Una regla del dominio lo impide</td>
</tr>
<tr>
<td style="text-align:left"><code>ThrottleRequestsException</code></td>
<td style="text-align:center"><strong>429</strong></td>
<td style="text-align:left">Se superó el límite de tasa</td>
</tr>
<tr>
<td style="text-align:left">Cualquier otra</td>
<td style="text-align:center"><strong>500</strong></td>
<td style="text-align:left">Error no previsto</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Que exista una <strong>excepción propia por familia de error</strong> es lo que permite traducir sin <code>if</code> encadenados</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="qu%C3%A9-nunca-debe-salir-en-una-respuesta">Qué nunca debe salir en una respuesta</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%AB-trazas-de-pila"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Trazas de pila</h3>
<p>Revelan rutas del servidor, versiones y estructura interna del código</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-mensajes-de-la-base-de-datos"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Mensajes de la base de datos</h3>
<p><code>SQLSTATE[23000]: Duplicate entry...</code> expone el esquema</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-datos-de-otras-personas"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Datos de otras personas</h3>
<p>Un mensaje de error nunca debe filtrar información de otro registro</p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-credenciales-o-tokens"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Credenciales o tokens</h3>
<p>Ni en la respuesta ni en la bitácora</p>
</div>
</div>
<pre><code class="language-bash"><span class="hljs-comment"># .env en producción — no negociable</span>
APP_DEBUG=<span class="hljs-literal">false</span>
APP_ENV=production
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>APP_DEBUG=true</code> en producción expone <strong>valores de configuración sensibles</strong> a cualquier visitante. Es un hallazgo de seguridad, no un descuido menor</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="registro-de-errores-y-observabilidad">Registro de errores y observabilidad</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%F0%9F%93%8B-qu%C3%A9-registrar"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Qué registrar</h3>
<ul>
<li>Marca de tiempo</li>
<li>Identificador de la persona usuaria o de la sesión</li>
<li>Dirección de origen</li>
<li>Operación y resultado</li>
<li>Identificador de correlación de la petición</li>
</ul>
<h3 id="%F0%9F%99%88-qu%C3%A9-enmascarar"><img class="emoji" draggable="false" alt="🙈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f648.svg" data-marp-twemoji=""/> Qué enmascarar</h3>
<ul>
<li>Contraseñas (aunque vengan en el cuerpo)</li>
<li>Tokens completos</li>
<li>Datos personales sensibles</li>
</ul>
</div>
<div>
<pre><code class="language-php"><span class="hljs-comment">// Contexto global en toda la bitácora</span>
<span class="hljs-variable">$exceptions</span>-&gt;<span class="hljs-title function_ invoke__">context</span>(fn () =&gt; [
    <span class="hljs-string">&#x27;usuario&#x27;</span> =&gt; <span class="hljs-title function_ invoke__">auth</span>()-&gt;<span class="hljs-title function_ invoke__">id</span>(),
    <span class="hljs-string">&#x27;ip&#x27;</span>      =&gt; <span class="hljs-title function_ invoke__">request</span>()-&gt;<span class="hljs-title function_ invoke__">ip</span>(),
]);
</code></pre>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Hallazgo típico del Laboratorio 12: <em>&quot;la bitácora imprime el cuerpo de la solicitud de inicio de sesión&quot;</em> → hay que <strong>enmascarar</strong> antes de registrar</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52d.svg" data-marp-twemoji=""/> Herramientas: <strong>Telescope</strong> (desarrollo), <strong>Pulse</strong>, <strong>Nightwatch</strong>, <strong>Sentry</strong> (producción)</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="manejo-de-errores-comparado">Manejo de errores comparado</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>

<h1 id="autenticaci%C3%B3n-autorizaci%C3%B3n-y-sesiones">Autenticación, autorización y sesiones</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Autenticación por token</li>
<li>Autorización: roles y políticas</li>
<li>Defensa en profundidad</li>
<li>Seguridad en el manejo de sesiones</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="66" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="autenticaci%C3%B3n-%E2%89%A0-autorizaci%C3%B3n">Autenticación ≠ Autorización</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.92rem;">
<div>
<h3 id="%F0%9F%AA%AA-autenticaci%C3%B3n--%C2%BFqui%C3%A9n-eres"><img class="emoji" draggable="false" alt="🪪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faaa.svg" data-marp-twemoji=""/> Autenticación — <em>¿quién eres?</em></h3>
<ul>
<li>Verificar la identidad</li>
<li>Contraseña, token, <em>passkey</em>, biometría</li>
<li>Falla → <strong>401 Unauthorized</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%91-autorizaci%C3%B3n--%C2%BFqu%C3%A9-puedes-hacer"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Autorización — <em>¿qué puedes hacer?</em></h3>
<ul>
<li>Verificar los permisos de una identidad <strong>ya conocida</strong></li>
<li>Roles, políticas, permisos por recurso</li>
<li>Falla → <strong>403 Forbidden</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> El proyecto exige <strong>al menos tres roles</strong> con permisos diferenciados <strong>y</strong> autorización <strong>a nivel de recurso</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> No basta con <em>&quot;solo los administradores pueden ver pedidos&quot;</em>: hace falta <em>&quot;cada cliente solo ve <strong>sus</strong> pedidos&quot;</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="67" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="sesiones-con-estado-vs-tokens">Sesiones con estado vs. tokens</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%F0%9F%8D%AA-sesi%C3%B3n-con-estado-cookie"><img class="emoji" draggable="false" alt="🍪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f36a.svg" data-marp-twemoji=""/> Sesión con estado (cookie)</h3>
<ul>
<li>El servidor guarda la sesión y manda un identificador en una <strong>cookie</strong></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Revocación inmediata: se borra del servidor</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> La cookie puede ser <code>HttpOnly</code> (invisible a JavaScript)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> El servidor debe <strong>recordar</strong>: complica el escalado horizontal</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Vulnerable a <strong>CSRF</strong> si no se protege</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AB-token-bearer"><img class="emoji" draggable="false" alt="🎫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ab.svg" data-marp-twemoji=""/> Token (Bearer)</h3>
<ul>
<li>El servidor emite un token; el cliente lo manda en <code>Authorization</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Sin estado</strong>: cualquier instancia lo valida</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Sirve igual para web, móvil y otros servicios</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Revocar es más difícil (por eso: expiración corta + rotación)</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Si se guarda en <code>localStorage</code>, <strong>XSS lo roba</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> En este curso usamos <strong>tokens</strong> porque la misma API sirve a la aplicación web <strong>y</strong> a la aplicación móvil Ionic</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="68" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="sanctum-emisi%C3%B3n-de-tokens">Sanctum: emisión de tokens</h2>
<split-slide style="--left: 58%; --right: 42%; --font-size: 0.72rem;">
<div>
<pre><code class="language-bash">php artisan install:api   <span class="hljs-comment"># instala Sanctum y crea routes/api.php</span>
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// LoginController</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__invoke</span>(<span class="hljs-params">LoginRequest <span class="hljs-variable">$request</span></span>): <span class="hljs-title">JsonResponse</span>
</span>{
    <span class="hljs-variable">$usuario</span> = <span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;email&#x27;</span>, <span class="hljs-variable">$request</span>-&gt;email)-&gt;<span class="hljs-title function_ invoke__">first</span>();

    <span class="hljs-comment">// Mensaje idéntico exista o no la cuenta</span>
    <span class="hljs-keyword">if</span> (! <span class="hljs-variable">$usuario</span> || ! <span class="hljs-title class_">Hash</span>::<span class="hljs-title function_ invoke__">check</span>(<span class="hljs-variable">$request</span>-&gt;password, <span class="hljs-variable">$usuario</span>-&gt;password)) {
        <span class="hljs-keyword">throw</span> <span class="hljs-title class_">ValidationException</span>::<span class="hljs-title function_ invoke__">withMessages</span>([
            <span class="hljs-string">&#x27;email&#x27;</span> =&gt; [<span class="hljs-string">&#x27;Las credenciales proporcionadas son incorrectas.&#x27;</span>],
        ]);
    }

    <span class="hljs-variable">$token</span> = <span class="hljs-variable">$usuario</span>-&gt;<span class="hljs-title function_ invoke__">createToken</span>(
        <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;api&#x27;</span>,
        <span class="hljs-attr">abilities</span>: [<span class="hljs-string">&#x27;pedidos:leer&#x27;</span>, <span class="hljs-string">&#x27;pedidos:escribir&#x27;</span>],
        <span class="hljs-attr">expiresAt</span>: <span class="hljs-title function_ invoke__">now</span>()-&gt;<span class="hljs-title function_ invoke__">addMinutes</span>(<span class="hljs-number">30</span>)
    );

    <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">json</span>([<span class="hljs-string">&#x27;token&#x27;</span> =&gt; <span class="hljs-variable">$token</span>-&gt;plainTextToken], <span class="hljs-number">200</span>);
}
</code></pre>
<pre><code class="language-php"><span class="hljs-title class_">Route</span>::<span class="hljs-title function_ invoke__">post</span>(<span class="hljs-string">&#x27;/login&#x27;</span>, <span class="hljs-title class_">LoginController</span>::<span class="hljs-variable language_">class</span>)-&gt;<span class="hljs-title function_ invoke__">middleware</span>(<span class="hljs-string">&#x27;throttle:5,1&#x27;</span>);
<span class="hljs-title class_">Route</span>::<span class="hljs-title function_ invoke__">middleware</span>(<span class="hljs-string">&#x27;auth:sanctum&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">group</span>(function () {
    <span class="hljs-title class_">Route</span>::<span class="hljs-title function_ invoke__">apiResource</span>(<span class="hljs-string">&#x27;pedidos&#x27;</span>, <span class="hljs-title class_">PedidoController</span>::<span class="hljs-variable language_">class</span>);
});
</code></pre>
</div>
<div>
<h3 id="%F0%9F%94%92-tres-controles-en-una-pantalla"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Tres controles en una pantalla</h3>
<ol>
<li><strong>Expiración</strong> del token (30 min)</li>
<li><strong>Capacidades</strong> asociadas (<em>abilities</em>)</li>
<li><strong>Limitación de intentos</strong> (<code>throttle:5,1</code>)</li>
</ol>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> El mensaje de error <strong>no distingue</strong> entre cuenta inexistente y contraseña incorrecta: distinguirlas permite <strong>enumerar cuentas</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="69" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="contrase%C3%B1as">Contraseñas</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Laravel deriva la contraseña automáticamente</span>
<span class="hljs-keyword">protected</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">casts</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
</span>{
    <span class="hljs-keyword">return</span> [<span class="hljs-string">&#x27;password&#x27;</span> =&gt; <span class="hljs-string">&#x27;hashed&#x27;</span>];  <span class="hljs-comment">// bcrypt / argon2</span>
}

<span class="hljs-comment">// Verificación</span>
<span class="hljs-title class_">Hash</span>::<span class="hljs-title function_ invoke__">check</span>(<span class="hljs-variable">$request</span>-&gt;password, <span class="hljs-variable">$usuario</span>-&gt;password);
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Política de complejidad</span>
<span class="hljs-keyword">use</span> <span class="hljs-title">Illuminate</span>\<span class="hljs-title">Validation</span>\<span class="hljs-title">Rules</span>\<span class="hljs-title">Password</span>;

<span class="hljs-string">&#x27;password&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>, <span class="hljs-string">&#x27;confirmed&#x27;</span>,
    <span class="hljs-title class_">Password</span>::<span class="hljs-title function_ invoke__">min</span>(<span class="hljs-number">12</span>)
        -&gt;<span class="hljs-title function_ invoke__">letters</span>()-&gt;<span class="hljs-title function_ invoke__">mixedCase</span>()
        -&gt;<span class="hljs-title function_ invoke__">numbers</span>()-&gt;<span class="hljs-title function_ invoke__">symbols</span>()
        -&gt;<span class="hljs-title function_ invoke__">uncompromised</span>(),   <span class="hljs-comment">// ¿apareció en una filtración?</span>
];
</code></pre>
</div>
<div>
<ul>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <strong>Nunca</strong> se guarda la contraseña: se guarda su <strong>derivación</strong> con <code>bcrypt</code> o <code>argon2id</code></p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🧂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9c2.svg" data-marp-twemoji=""/> El algoritmo incluye una <strong>sal</strong> distinta por contraseña: dos personas con la misma clave tienen derivaciones distintas</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>uncompromised()</code> consulta la base de <em>Have I Been Pwned</em> sin enviar la contraseña (k-anonimato)</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>md5()</code> y <code>sha1()</code> <strong>no</strong> son algoritmos de contraseñas: son demasiado rápidos</p>
</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="70" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="autorizaci%C3%B3n-roles-y-pol%C3%ADticas">Autorización: roles y políticas</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.75rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Política por recurso</span>
<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoPolicy</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">view</span>(<span class="hljs-params">User <span class="hljs-variable">$user</span>, Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">bool</span>
    </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable">$user</span>-&gt;<span class="hljs-title function_ invoke__">hasRole</span>(<span class="hljs-string">&#x27;admin&#x27;</span>)
            || <span class="hljs-variable">$pedido</span>-&gt;cliente-&gt;user_id === <span class="hljs-variable">$user</span>-&gt;id;
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">delete</span>(<span class="hljs-params">User <span class="hljs-variable">$user</span>, Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">bool</span>
    </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable">$user</span>-&gt;<span class="hljs-title function_ invoke__">hasRole</span>(<span class="hljs-string">&#x27;admin&#x27;</span>)
            &amp;&amp; <span class="hljs-variable">$pedido</span>-&gt;estado === <span class="hljs-string">&#x27;borrador&#x27;</span>;
    }
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Capa 1 — en el controlador</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">PedidoResource</span>
</span>{
    <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);   <span class="hljs-comment">// 403 si no procede</span>
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">load</span>(<span class="hljs-string">&#x27;detalles&#x27;</span>));
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Laravel 13 — con atributos</span>
<span class="hljs-meta">#[Authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-string">&#x27;pedido&#x27;</span>)<span class="hljs-meta">]</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>) </span>{ }
</code></pre>
</div>
<div>
<h3 id="%F0%9F%8E%AD-roles-vs-pol%C3%ADticas"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Roles vs. políticas</h3>
<ul>
<li><strong>Rol</strong> — <em>¿puede esta persona ver pedidos en general?</em></li>
<li><strong>Política</strong> — <em>¿puede ver <strong>este</strong> pedido?</em></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Solo con roles se produce la vulnerabilidad más común de la OWASP: <strong>control de acceso roto</strong>. <code>GET /api/pedidos/42</code> devolvería el pedido de cualquiera con solo cambiar el número</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="71" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="defensa-en-profundidad-verificar-en-dos-capas">Defensa en profundidad: verificar en dos capas</h2>
<steps>
<step>
<pre><code class="language-php"><span class="hljs-comment">// Capa 1 — ruta o controlador</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">PedidoResource</span>
</span>{
    <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable language_">$this</span>-&gt;service-&gt;<span class="hljs-title function_ invoke__">obtener</span>(<span class="hljs-variable">$pedido</span>, <span class="hljs-title function_ invoke__">auth</span>()-&gt;<span class="hljs-title function_ invoke__">user</span>()));
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Capa 2 — dentro del servicio</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">obtener</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span>, User <span class="hljs-variable">$actor</span></span>): <span class="hljs-title">Pedido</span>
</span>{
    <span class="hljs-title class_">Gate</span>::<span class="hljs-title function_ invoke__">forUser</span>(<span class="hljs-variable">$actor</span>)-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);  <span class="hljs-comment">// responde 403</span>
    <span class="hljs-keyword">return</span> <span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">load</span>(<span class="hljs-string">&#x27;detalles&#x27;</span>);
}
</code></pre>
</step>
<step>
<h3 id="%C2%BFpor-qu%C3%A9-dos-veces">¿Por qué dos veces?</h3>
<blockquote>
<p><em>&quot;Un error frecuente es proteger la ruta pero no el servicio: si otro componente invoca el servicio directamente, la restricción se evade.&quot;</em></p>
</blockquote>
<ul>
<li>Un comando de consola, un trabajo en cola o <strong>otro controlador</strong> pueden llamar al servicio <strong>sin pasar por la ruta protegida</strong></li>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio lo evalúa de forma <strong>explícita</strong>: hay que <strong>demostrar</strong> que la invocación directa al servicio también es rechazada</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="72" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="seguridad-en-el-manejo-de-sesiones">Seguridad en el manejo de sesiones</h2>
<div class="grid">
<div>
<h3 id="%E2%8F%B1%EF%B8%8F-expiraci%C3%B3n-corta"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> Expiración corta</h3>
<p>El token vive minutos, no meses. Un token robado tiene ventana limitada</p>
</div>
<div>
<h3 id="%F0%9F%94%84-rotaci%C3%B3n-en-la-renovaci%C3%B3n"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Rotación en la renovación</h3>
<p>Al renovar, la credencial anterior <strong>se invalida</strong></p>
</div>
<div>
<h3 id="%F0%9F%97%91%EF%B8%8F-revocaci%C3%B3n-al-cerrar-sesi%C3%B3n"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Revocación al cerrar sesión</h3>
<p><code>currentAccessToken()-&gt;delete()</code></p>
</div>
<div>
<h3 id="%F0%9F%8E%AF-capacidades-m%C3%ADnimas"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Capacidades mínimas</h3>
<p>El token solo puede lo que necesita: <code>pedidos:leer</code> ≠ acceso total</p>
</div>
<div>
<h3 id="%F0%9F%94%90-almacenamiento-seguro"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Almacenamiento seguro</h3>
<p>En móvil: almacenamiento <strong>cifrado</strong> del dispositivo, no <code>localStorage</code></p>
</div>
<div>
<h3 id="%F0%9F%9A%AB-nunca-en-la-url"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Nunca en la URL</h3>
<p>Queda en bitácoras del servidor, historial y encabezado <code>Referer</code></p>
</div>
</div>
<pre><code class="language-php"><span class="hljs-comment">// Cierre de sesión con revocación</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">logout</span>(<span class="hljs-params">Request <span class="hljs-variable">$request</span></span>): <span class="hljs-title">Response</span>
</span>{
    <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">user</span>()-&gt;<span class="hljs-title function_ invoke__">currentAccessToken</span>()-&gt;<span class="hljs-title function_ invoke__">delete</span>();
    <span class="hljs-keyword">return</span> <span class="hljs-title function_ invoke__">response</span>()-&gt;<span class="hljs-title function_ invoke__">noContent</span>();   <span class="hljs-comment">// 204</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="73" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="controles-de-la-api-laboratorio-13">Controles de la API (Laboratorio 13)</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.7rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// config/cors.php — orígenes explícitos</span>
<span class="hljs-string">&#x27;paths&#x27;</span>   =&gt; [<span class="hljs-string">&#x27;api/*&#x27;</span>],
<span class="hljs-string">&#x27;allowed_origins&#x27;</span> =&gt; [<span class="hljs-string">&#x27;https://proyecto.ucr.ac.cr&#x27;</span>,
                      <span class="hljs-string">&#x27;http://localhost:5173&#x27;</span>],
<span class="hljs-string">&#x27;allowed_methods&#x27;</span> =&gt; [<span class="hljs-string">&#x27;GET&#x27;</span>,<span class="hljs-string">&#x27;POST&#x27;</span>,<span class="hljs-string">&#x27;PUT&#x27;</span>,<span class="hljs-string">&#x27;DELETE&#x27;</span>],
<span class="hljs-string">&#x27;allowed_headers&#x27;</span> =&gt; [<span class="hljs-string">&#x27;Authorization&#x27;</span>,<span class="hljs-string">&#x27;Content-Type&#x27;</span>],
<span class="hljs-string">&#x27;supports_credentials&#x27;</span> =&gt; <span class="hljs-literal">true</span>,   <span class="hljs-comment">// incompatible con &#x27;*&#x27;</span>
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Limitación de tasa: general y de autenticación</span>
<span class="hljs-title class_">RateLimiter</span>::<span class="hljs-keyword">for</span>(<span class="hljs-string">&#x27;api&#x27;</span>, <span class="hljs-function"><span class="hljs-keyword">fn</span> (<span class="hljs-params"><span class="hljs-variable">$r</span></span>) =&gt;</span>
    <span class="hljs-title class_">Limit</span>::<span class="hljs-title function_ invoke__">perMinute</span>(<span class="hljs-number">60</span>)-&gt;<span class="hljs-title function_ invoke__">by</span>(<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">user</span>()?-&gt;id ?: <span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">ip</span>()));

<span class="hljs-title class_">RateLimiter</span>::<span class="hljs-keyword">for</span>(<span class="hljs-string">&#x27;login&#x27;</span>, <span class="hljs-function"><span class="hljs-keyword">fn</span> (<span class="hljs-params"><span class="hljs-variable">$r</span></span>) =&gt;</span>
    <span class="hljs-title class_">Limit</span>::<span class="hljs-title function_ invoke__">perMinute</span>(<span class="hljs-number">5</span>)-&gt;<span class="hljs-title function_ invoke__">by</span>(<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">ip</span>()));   <span class="hljs-comment">// → 429</span>
</code></pre>
<pre><code class="language-http"><span class="hljs-attribute">Content-Security-Policy</span><span class="hljs-punctuation">: </span>default-src &#x27;self&#x27;; frame-ancestors &#x27;none&#x27;
<span class="hljs-attribute">Strict-Transport-Security</span><span class="hljs-punctuation">: </span>max-age=31536000; includeSubDomains
<span class="hljs-attribute">X-Content-Type-Options</span><span class="hljs-punctuation">: </span>nosniff
<span class="hljs-attribute">Referrer-Policy</span><span class="hljs-punctuation">: </span>strict-origin-when-cross-origin
<span class="hljs-attribute">Permissions-Policy</span><span class="hljs-punctuation">: </span>geolocation=(), camera=()
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9A%A9-malentendido-frecuente"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Malentendido frecuente</h3>
<blockquote>
<p><em>&quot;La política de origen cruzado <strong>no es un control de autorización</strong>: protege al navegador de la persona usuaria, no a la API. Un cliente que no sea un navegador la ignora.&quot;</em></p>
</blockquote>
<br />
<ul>
<li>El <strong>comodín <code>*</code> con credenciales</strong> es rechazado por los navegadores y es una configuración insegura</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> Laravel 13 formaliza <code>PreventRequestForgery</code>, con verificación <strong>por origen</strong> además del token CSRF</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="74" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="owasp-los-cinco-hallazgos-que-verificaremos">OWASP: los cinco hallazgos que verificaremos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Vulnerabilidad</th>
<th style="text-align:left">Cómo se manifiesta en el proyecto</th>
<th style="text-align:left">Mitigación</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Control de acceso roto</strong></td>
<td style="text-align:left"><code>GET /api/pedidos/42</code> devuelve el pedido de otra persona</td>
<td style="text-align:left">Verificar la pertenencia <strong>en el servicio</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Inyección</strong></td>
<td style="text-align:left">Consultas construidas por concatenación</td>
<td style="text-align:left">Parámetros vinculados; el ORM ya lo hace</td>
</tr>
<tr>
<td style="text-align:left"><strong>Exposición de datos sensibles</strong></td>
<td style="text-align:left">La respuesta incluye la contraseña derivada o campos internos</td>
<td style="text-align:left"><strong>Recursos de API</strong> explícitos, nunca la entidad</td>
</tr>
<tr>
<td style="text-align:left"><strong>Configuración deficiente</strong></td>
<td style="text-align:left">Trazas visibles, CORS abierto, documentación pública sin control</td>
<td style="text-align:left">Perfiles diferenciados por entorno</td>
</tr>
<tr>
<td style="text-align:left"><strong>Fallo de autenticación</strong></td>
<td style="text-align:left">Sin límite de intentos, tokens sin expiración</td>
<td style="text-align:left"><code>throttle</code> + expiración corta con rotación</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> <strong>Advertencia</strong>: las pruebas se realizan <strong>únicamente sobre la aplicación del propio equipo</strong>, en entorno local. Probar sistemas de terceros sin autorización es una falta grave con consecuencias legales</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="75" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="autenticaci%C3%B3n-comparada">Autenticación comparada</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel 13</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Paquete</strong></td>
<td style="text-align:left"><strong>Sanctum</strong> (con <code>install:api</code>)</td>
<td style="text-align:left"><code>@nestjs/passport</code> + <code>passport-jwt</code></td>
<td style="text-align:left"><code>JwtBearer</code> (integrado)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Tipo de token</strong></td>
<td style="text-align:left">Opaco en base de datos, o JWT con Passport</td>
<td style="text-align:left"><strong>JWT</strong></td>
<td style="text-align:left"><strong>JWT</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Revocación</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Nativa: se borra la fila</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Requiere lista de revocación</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Requiere lista de revocación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Autorización</strong></td>
<td style="text-align:left"><em>Gates</em> y <em>Policies</em></td>
<td style="text-align:left"><em>Guards</em> + <code>@Roles()</code></td>
<td style="text-align:left">Políticas + <code>[Authorize]</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Contraseñas</strong></td>
<td style="text-align:left"><code>Hash::make</code> (bcrypt/argon2)</td>
<td style="text-align:left"><code>bcrypt</code> / <code>argon2</code> manual</td>
<td style="text-align:left"><code>PasswordHasher&lt;T&gt;</code> (PBKDF2)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Límite de intentos</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>throttle</code> integrado</td>
<td style="text-align:left"><code>@nestjs/throttler</code></td>
<td style="text-align:left"><em>Rate limiting</em> integrado</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Ventaja real de Sanctum: los tokens <strong>viven en la base de datos</strong>, así que <strong>revocarlos es inmediato</strong>. Con JWT puro hay que esperar a que expiren</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-marpit-scope-Ncdy4fUX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="76" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="93">
<h1 id="pruebas-de-unidad">Pruebas de unidad</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Qué es una prueba automatizada</li>
<li>Unidad vs. integración</li>
<li>Dobles de prueba</li>
<li>Cobertura y aislamiento</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="77" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="%C2%BFqu%C3%A9-es-la-automatizaci%C3%B3n-de-pruebas">¿Qué es la automatización de pruebas?</h2>
<blockquote>
<p><em>&quot;Consiste en el uso de software especial —casi siempre separado del software que se prueba— para controlar la ejecución de pruebas y la comparación entre los resultados obtenidos y los resultados esperados.&quot;</em></p>
</blockquote>
<div class="grid">
<div>
<h3 id="%F0%9F%94%AC-prueba-unitaria"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> Prueba unitaria</h3>
<p>Verifica <strong>una unidad</strong> de código en aislamiento. Rápida y precisa: cuando falla, sabes <strong>exactamente</strong> dónde</p>
</div>
<div>
<h3 id="%F0%9F%94%97-prueba-de-integraci%C3%B3n"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Prueba de integración</h3>
<p>Verifica que <strong>varias piezas</strong> funcionan juntas: servicio + base de datos, controlador + servicio</p>
</div>
<div>
<h3 id="%F0%9F%8C%90-prueba-de-extremo-a-extremo"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Prueba de extremo a extremo</h3>
<p>Recorre el sistema completo desde la interfaz. Lenta, frágil, pero valiosa en los flujos críticos</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <em>&quot;Una prueba unitaria de la capa de servicio <strong>no debe tocar la base de datos</strong>: eso la convierte en una prueba de integración, más lenta y menos precisa para localizar el defecto.&quot;</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="78" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="pest-el-ejecutor-de-pruebas-de-laravel">Pest: el ejecutor de pruebas de Laravel</h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.75rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// tests/Feature/PedidoApiTest.php</span>
<span class="hljs-title function_ invoke__">it</span>(<span class="hljs-string">&#x27;crea un pedido y devuelve 201 con Location&#x27;</span>, function () {
    <span class="hljs-variable">$usuario</span> = <span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">factory</span>()-&gt;<span class="hljs-title function_ invoke__">create</span>();
    <span class="hljs-variable">$cliente</span> = <span class="hljs-title class_">Cliente</span>::<span class="hljs-title function_ invoke__">factory</span>()-&gt;<span class="hljs-title function_ invoke__">create</span>();

    <span class="hljs-title function_ invoke__">actingAs</span>(<span class="hljs-variable">$usuario</span>)
        -&gt;<span class="hljs-title function_ invoke__">postJson</span>(<span class="hljs-string">&#x27;/api/pedidos&#x27;</span>, [
            <span class="hljs-string">&#x27;codigo&#x27;</span>     =&gt; <span class="hljs-string">&#x27;PED-0001&#x27;</span>,
            <span class="hljs-string">&#x27;cliente_id&#x27;</span> =&gt; <span class="hljs-variable">$cliente</span>-&gt;id,

        ])

        -&gt;<span class="hljs-title function_ invoke__">assertHeader</span>(<span class="hljs-string">&#x27;Location&#x27;</span>)
        -&gt;<span class="hljs-title function_ invoke__">assertJsonStructure</span>([<span class="hljs-string">&#x27;data&#x27;</span> =&gt; [<span class="hljs-string">&#x27;id&#x27;</span>,<span class="hljs-string">&#x27;codigo&#x27;</span>,<span class="hljs-string">&#x27;estado&#x27;</span>,<span class="hljs-string">&#x27;total&#x27;</span>]]);
});

<span class="hljs-title function_ invoke__">it</span>(<span class="hljs-string">&#x27;impide ver el pedido de otra persona usuaria&#x27;</span>, function () {
    <span class="hljs-variable">$otro</span>   = <span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">factory</span>()-&gt;<span class="hljs-title function_ invoke__">create</span>();
    <span class="hljs-variable">$pedido</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">factory</span>()-&gt;<span class="hljs-title function_ invoke__">create</span>();

    <span class="hljs-title function_ invoke__">actingAs</span>(<span class="hljs-variable">$otro</span>)

        -&gt;<span class="hljs-title function_ invoke__">assertForbidden</span>();                 <span class="hljs-comment">// 403</span>
});

<pre><code class="language-php"><span class="hljs-title function_ invoke__">it</span>(<span class="hljs-string">&#x27;descuenta inventario al confirmar&#x27;</span>, function () {

<div>
<h3 id="%F0%9F%8E%AD-tipos-de-doble"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Tipos de doble</h3>
<ul>

<li><strong>Mock</strong> — además <strong>verifica</strong> que fue llamado como se esperaba</li>

<h2 id="el-contrato-com%C3%BAn">El contrato común</h2>
<ul>
<li>Las tres implementaciones deben cumplir <strong>exactamente lo mismo</strong>. Sin eso, la comparación no mide nada</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Operación</th>
<th style="text-align:left">Método y ruta</th>
<th style="text-align:left">Respuesta esperada</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Inicio de sesión</td>
<td style="text-align:left"><code>POST /api/login</code></td>
<td style="text-align:left"><code>200</code> con token · <code>422</code> datos inválidos · <code>401</code> credenciales incorrectas</td>
</tr>
<tr>
<td style="text-align:left">Listado paginado</td>
<td style="text-align:left"><code>GET /api/recursos?page=&amp;per_page=&amp;q=</code></td>
<td style="text-align:left"><code>200</code> con datos y metadatos · <code>401</code> sin token</td>
</tr>
<tr>
<td style="text-align:left">Detalle</td>
<td style="text-align:left"><code>GET /api/recursos/{id}</code></td>
<td style="text-align:left"><code>200</code> · <code>404</code> si no existe · <code>403</code> si no le corresponde</td>
</tr>
<tr>
<td style="text-align:left">Creación</td>
<td style="text-align:left"><code>POST /api/recursos</code></td>
<td style="text-align:left"><code>201</code> con encabezado <code>Location</code> · <code>422</code> datos inválidos</td>
</tr>
<tr>
<td style="text-align:left">Actualización</td>
<td style="text-align:left"><code>PUT /api/recursos/{id}</code></td>
<td style="text-align:left"><code>200</code> · <code>404</code> · <code>422</code></td>
</tr>
<tr>
<td style="text-align:left">Eliminación</td>
<td style="text-align:left"><code>DELETE /api/recursos/{id}</code></td>
<td style="text-align:left"><code>204</code> · <code>404</code> · <code>409</code> si tiene dependencias</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Una entidad con <strong>máximo 8 campos y una relación</strong>. <strong>Misma</strong> base de datos y <strong>mismos</strong> datos de prueba en las tres</li>

<thead>

<th style="text-align:left">Criterio</th>
<th style="text-align:left">Cómo se mide</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Tiempo de puesta en marcha</td>
<td style="text-align:left">Minutos desde el proyecto vacío hasta el primer endpoint respondiendo</td>
</tr>
<tr>
<td style="text-align:left">Tamaño de la porción</td>
<td style="text-align:left">Archivos y líneas de código <strong>propias</strong>, excluyendo dependencias</td>
</tr>
<tr>
<td style="text-align:left">Esfuerzo de validación</td>
<td style="text-align:left">Líneas y archivos para validar la entrada y devolver errores por campo</td>
</tr>
<tr>
<td style="text-align:left">Esfuerzo de autenticación</td>
<td style="text-align:left">Líneas y dependencias para emitir, validar y revocar el token</td>
</tr>
<tr>
<td style="text-align:left">Documentación automática</td>
<td style="text-align:left">Esfuerzo para producir OpenAPI y completitud del resultado</td>
</tr>
<tr>
<td style="text-align:left">Pruebas</td>
<td style="text-align:left">Herramienta y esfuerzo para escribir tres pruebas equivalentes</td>
</tr>
<tr>
<td style="text-align:left">Rendimiento</td>
<td style="text-align:left">Peticiones por segundo y <strong>latencia p95</strong> bajo carga idéntica</td>
</tr>
<tr>
<td style="text-align:left">Huella de ejecución</td>
<td style="text-align:left">Memoria residente en reposo y tamaño del artefacto desplegable</td>
</tr>
<tr>
<td style="text-align:left"><em>Seguridad por omisión</em></td>
<td style="text-align:left">Protecciones activas sin configuración adicional</td>
</tr>
<tr>
<td style="text-align:left"><em>Ecosistema y curva</em></td>
<td style="text-align:left">Valoración argumentada con evidencia de la experiencia del equipo</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <em>&quot;Una medición no reproducible se evalúa como no presentada.&quot;</em> Misma máquina, misma base de datos, mismo escenario</li>
</ul>
</section>

<h2 id="c%C3%B3mo-medir-el-rendimiento">Cómo medir el rendimiento</h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.78rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># Prueba de carga idéntica en los tres</span>
<span class="hljs-comment"># k6, autocannon, bombardier o wrk</span>

k6 run --vus 50 --duration 60s carga.js

autocannon -c 50 -d 60 \
  -H <span class="hljs-string">&quot;Authorization: Bearer <span class="hljs-variable">$TOKEN</span>&quot;</span> \
  http://localhost:8000/api/recursos
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Huella de memoria en reposo</span>
ps -o rss= -p $(pgrep -f <span class="hljs-string">&quot;php artisan serve&quot;</span>)
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Tamaño del artefacto desplegable</span>
<span class="hljs-built_in">du</span> -sh vendor/                  <span class="hljs-comment"># Laravel</span>
<span class="hljs-built_in">du</span> -sh dist/ node_modules/      <span class="hljs-comment"># NestJS</span>
dotnet publish -c Release       <span class="hljs-comment"># ASP.NET Core</span>
</code></pre>
</div>
<div>
<h3 id="%F0%9F%93%8F-qu%C3%A9-reportar"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Qué reportar</h3>
<ul>
<li><strong>Peticiones por segundo</strong></li>
<li><strong>Latencia p95</strong> (no el promedio: el promedio esconde la cola)</li>
<li>Condiciones: máquina, versión, datos, concurrencia</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Reportar el <strong>procedimiento completo</strong>. Un número sin procedimiento no es una medición: es una opinión con decimales</li>
</ul>
</div>
</split-slide>
</section>

<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS 11</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core</th>

<h2 id="c%C3%B3mo-elegir-un-back-end-m%C3%A1s-all%C3%A1-del-curso">Cómo elegir un back-end (más allá del curso)</h2>
<steps>
<step>
<h3 id="%F0%9F%94%8D-criterios-t%C3%A9cnicos"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Criterios técnicos</h3>
<ul>
<li>¿El <strong>rendimiento</strong> es un requisito del producto o una preferencia estética?</li>
<li>¿Cuánto pesa la <strong>huella de ejecución</strong> en el costo de infraestructura?</li>
<li>¿Necesito <strong>tipado estático</strong> por el tamaño del equipo o del dominio?</li>
<li>¿Qué trae <strong>por omisión</strong> y qué tendré que construir?</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%91%A5-criterios-de-equipo-y-negocio"><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> Criterios de equipo y negocio</h3>
<ul>
<li>¿Qué <strong>sabe ya</strong> el equipo? ¿Qué se contrata en el mercado local?</li>
<li>¿Cuál es el <strong>calendario de soporte</strong>? ¿Hay versiones LTS?</li>
<li>¿Cuál es el <strong>costo de salida</strong> si nos equivocamos?</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Mala razón: <em>&quot;es lo más rápido en un banco de pruebas sintético&quot;</em><br />
<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Buena razón: <em>&quot;resuelve nuestro problema, el equipo lo sostiene y tiene soporte hasta 2028&quot;</em></p>
</blockquote>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="91" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="errores-m%C3%A1s-frecuentes">Errores más frecuentes</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%A9-l%C3%B3gica-en-el-controlador"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Lógica en el controlador</h3>
<p>El error más frecuente del Lab 4. El controlador <strong>traduce</strong>, no decide</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-migraci%C3%B3n-no-reversible"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Migración no reversible</h3>
<p>Si el <code>rollback</code> falla, el esquema no es reproducible</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-n1-sin-medir"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> N+1 sin medir</h3>
<p>Se exige el <strong>dato numérico</strong>, no la afirmación</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-devolver-el-modelo-directo"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Devolver el modelo directo</h3>
<p>Acopla la API al esquema y filtra campos sensibles</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-autorizar-solo-en-la-ruta"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Autorizar solo en la ruta</h3>
<p>Si otro componente llama al servicio, la restricción se evade</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-env-en-el-repositorio"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>.env</code> en el repositorio</h3>
<p>La falta más frecuente del Lab 2</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-updaterequest-all"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>update($request-&gt;all())</code></h3>
<p>Asignación masiva sin control</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-prueba-unitaria-que-toca-la-base-de-datos"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Prueba unitaria que toca la base de datos</h3>
<p>Deja de ser unitaria: es de integración</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-200-con-un-error-en-el-cuerpo"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> 200 con un error en el cuerpo</h3>
<p>El cliente no puede reaccionar sin leer el JSON</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="92" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="actividad-de-cierre">Actividad de cierre</h2>
<ul>
<li>En equipo, tomen <strong>una</strong> entidad de su proyecto y respondan por escrito:</li>
</ul>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-recorrido"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> Recorrido</h3>

</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-c%C3%B3digos"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> Códigos</h3>

</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-reglas"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Reglas</h3>
<p>Identifiquen dos <strong>validaciones</strong> y dos <strong>reglas de negocio</strong>. ¿Por qué cada una está donde está?</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-pruebas"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Pruebas</h3>

</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si no logran nombrar las cinco pruebas, probablemente el endpoint todavía no está bien definido</li>
</ul>
</section>
