</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-9Oa4QnNg="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="31" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="93">
<h1 id="capa-de-negocios">Capa de negocios</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Separación de responsabilidades</li>
<li>Manejo de validaciones</li>
<li>Reglas de dominio</li>
<li>Transacciones</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="%C2%BFqu%C3%A9-es-la-capa-de-negocios">¿Qué es la capa de negocios?</h2>
<ul>
<li>Es donde viven las <strong>reglas del dominio</strong>: lo que el sistema puede y no puede hacer, expresado en el lenguaje de la organización</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%A6-controlador"><img class="emoji" draggable="false" alt="🚦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a6.svg" data-marp-twemoji=""/> Controlador</h3>
<p><em>&quot;Llegó un POST con este cuerpo&quot;</em></p>
<p>Traduce HTTP. <strong>No decide</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-servicio"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Servicio</h3>
<p><em>&quot;No se puede confirmar un pedido sin detalle&quot;</em></p>
<p><strong>Decide</strong>. No sabe qué es HTTP</p>
</div>
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-modelo"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> Modelo</h3>
<p><em>&quot;Guarda esta fila&quot;</em></p>
<p>Persiste. No conoce reglas</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Prueba de fuego: <strong>¿podría llamar a mi lógica de negocio desde un comando de consola, sin HTTP?</strong> Si no, está en la capa equivocada</li>
<li><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Regla del curso: <strong>ningún método de controlador supera 15 líneas</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="manejo-de-validaciones">Manejo de validaciones</h2>
<ul>
<li>Validar es <strong>rechazar datos mal formados antes de que toquen el negocio</strong>. No es lo mismo que una regla de negocio</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%E2%9C%85-validaci%C3%B3n-declarativa"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Validación (declarativa)</h3>
<ul>
<li>El campo <code>codigo</code> es obligatorio</li>
<li>Tiene máximo 20 caracteres</li>
<li><code>cliente_id</code> existe en la tabla clientes</li>
<li><code>cantidad</code> es un entero entre 1 y 999</li>
</ul>
<p>→ Responde <strong>422 Unprocessable Content</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-regla-de-negocio-imperativa"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Regla de negocio (imperativa)</h3>
<ul>
<li>No se puede confirmar un pedido <strong>sin detalle</strong></li>
<li>No se elimina un cliente <strong>con pedidos activos</strong></li>
<li>El descuento se aplica <strong>sobre cierto umbral</strong></li>
</ul>
<p>→ Responde <strong>409 Conflict</strong></p>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si puede expresarse como una lista de condiciones sobre un campo, es <strong>validación</strong>. Si necesita consultar el estado del sistema, es <strong>regla de negocio</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="validaci%C3%B3n-en-laravel-form-request">Validación en Laravel: Form Request</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.75rem;">
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">GuardarPedidoRequest</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">FormRequest</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">rules</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
    </span>{
        <span class="hljs-keyword">return</span> [
            <span class="hljs-string">&#x27;codigo&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;string&#x27;</span>,<span class="hljs-string">&#x27;max:20&#x27;</span>,
                <span class="hljs-title class_">Rule</span>::<span class="hljs-title function_ invoke__">unique</span>(<span class="hljs-string">&#x27;pedidos&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">ignore</span>(<span class="hljs-variable">$this</span>-&gt;pedido)],
            <span class="hljs-string">&#x27;cliente_id&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;exists:clientes,id&#x27;</span>],
            <span class="hljs-string">&#x27;fecha&#x27;</span>      =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;date&#x27;</span>,<span class="hljs-string">&#x27;after_or_equal:today&#x27;</span>],
            <span class="hljs-string">&#x27;detalles&#x27;</span>   =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;array&#x27;</span>,<span class="hljs-string">&#x27;min:1&#x27;</span>],
            <span class="hljs-string">&#x27;detalles.*.producto_id&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;exists:productos,id&#x27;</span>],
            <span class="hljs-string">&#x27;detalles.*.cantidad&#x27;</span>    =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;integer&#x27;</span>,<span class="hljs-string">&#x27;min:1&#x27;</span>,<span class="hljs-string">&#x27;max:999&#x27;</span>],
        ];
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">messages</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
    </span>{
        <span class="hljs-keyword">return</span> [
            <span class="hljs-string">&#x27;detalles.min&#x27;</span>  =&gt; <span class="hljs-string">&#x27;El pedido debe incluir al menos una línea de detalle.&#x27;</span>,
            <span class="hljs-string">&#x27;codigo.unique&#x27;</span> =&gt; <span class="hljs-string">&#x27;Ya existe un pedido con ese código.&#x27;</span>,
        ];
    }
}
</code></pre>
</div>
<div>
<ul>
<li>Se <strong>inyecta</strong> en el método del controlador: si falla, Laravel devuelve <strong>422</strong> con el detalle <strong>por campo</strong> y el controlador nunca se ejecuta</li>
</ul>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;The given data was invalid.&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;errors&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;codigo&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;Ya existe un pedido con ese código.&quot;</span><span class="hljs-punctuation">]</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;detalles&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span><span class="hljs-string">&quot;El pedido debe incluir...&quot;</span><span class="hljs-punctuation">]</span>
  <span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">}</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio exige mensajes <strong>en español</strong> y <strong>asociados a cada campo</strong>, no un texto único</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="validaci%C3%B3n-comparada">Validación comparada</h2>
<steps>
<step>
<h3 id="%F0%9F%94%B4-laravel--form-request"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel — Form Request</h3>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">GuardarPedidoRequest</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">FormRequest</span> </span>{
  <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">rules</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span> </span>{
    <span class="hljs-keyword">return</span> [<span class="hljs-string">&#x27;codigo&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>,<span class="hljs-string">&#x27;max:20&#x27;</span>]];
  }
}
</code></pre>
<p>Reglas como <strong>arreglo</strong>. 422 nativo</p>
</step>
<step>
<h3 id="%F0%9F%9F%A2-nestjs--dto--class-validator"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS — DTO + class-validator</h3>
<pre><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CrearPedidoDto</span> {
  <span class="hljs-meta">@IsString</span>() <span class="hljs-meta">@MaxLength</span>(<span class="hljs-number">20</span>)
  <span class="hljs-attr">codigo</span>: <span class="hljs-built_in">string</span>;

  <span class="hljs-meta">@IsInt</span>() <span class="hljs-meta">@Min</span>(<span class="hljs-number">1</span>)
  <span class="hljs-attr">clienteId</span>: <span class="hljs-built_in">number</span>;
}
</code></pre>
<p>Reglas como <strong>decoradores</strong></p>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En NestJS el DTO debe ser una <strong>clase</strong>, no una interfaz: las interfaces se borran al compilar y no hay prototipo donde leer los decoradores</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> NestJS <strong>no valida por defecto</strong>: hay que registrar el <code>ValidationPipe</code> global en <code>main.ts</code></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%9F%A3-aspnet-core--data-annotations"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core — Data Annotations</h3>
<pre><code class="language-csharp"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title">CrearPedidoDto</span> {
  [<span class="hljs-meta">Required, MaxLength(20)</span>]
  <span class="hljs-keyword">public</span> <span class="hljs-built_in">string</span> Codigo { <span class="hljs-keyword">get</span>; <span class="hljs-keyword">set</span>; }

  [<span class="hljs-meta">Range(1, int.MaxValue)</span>]
  <span class="hljs-keyword">public</span> <span class="hljs-built_in">int</span> ClienteId { <span class="hljs-keyword">get</span>; <span class="hljs-keyword">set</span>; }
}
</code></pre>
<p>Atributos, o <strong>FluentValidation</strong></p>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="servicios-y-reglas-de-negocio">Servicios y reglas de negocio</h2>
<split-slide style="--left: 58%; --right: 42%; --font-size: 0.72rem;">
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoService</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">__construct</span>(<span class="hljs-params">
        <span class="hljs-keyword">private</span> InventarioService <span class="hljs-variable">$inventario</span>
    </span>) </span>{}

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">confirmar</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">Pedido</span>
    </span>{
        <span class="hljs-comment">// Regla 1: no se confirma un pedido vacío</span>
        <span class="hljs-keyword">if</span> (<span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">detalles</span>()-&gt;<span class="hljs-title function_ invoke__">doesntExist</span>()) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ReglaNegocioException</span>(<span class="hljs-string">&#x27;No se puede confirmar un pedido sin detalle.&#x27;</span>);
        }

        <span class="hljs-comment">// Regla 2: no se reconfirma</span>
        <span class="hljs-keyword">if</span> (<span class="hljs-variable">$pedido</span>-&gt;estado === <span class="hljs-string">&#x27;confirmado&#x27;</span>) {
            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ReglaNegocioException</span>(<span class="hljs-string">&#x27;El pedido ya fue confirmado.&#x27;</span>);
        }

        <span class="hljs-keyword">return</span> DB::<span class="hljs-title function_ invoke__">transaction</span>(function () <span class="hljs-keyword">use</span> ($<span class="hljs-title">pedido</span>) {
            $<span class="hljs-title">pedido</span>-&gt;<span class="hljs-title">update</span>([
                &#x27;<span class="hljs-title">estado</span>&#x27;        =&gt; &#x27;<span class="hljs-title">confirmado</span>&#x27;,
                &#x27;<span class="hljs-title">confirmado_en</span>&#x27; =&gt; <span class="hljs-title">now</span>(),
            ]);
            <span class="hljs-variable language_">$this</span>-&gt;inventario-&gt;<span class="hljs-title function_ invoke__">descontar</span>(<span class="hljs-variable">$pedido</span>-&gt;detalles);
            <span class="hljs-keyword">return</span> <span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">fresh</span>(<span class="hljs-string">&#x27;detalles&#x27;</span>);
        });
    }
}
</code></pre>
</div>
<div>
<ul>
<li>El servicio recibe <strong>dependencias por el constructor</strong> — el contenedor de Laravel las resuelve solo</li>
</ul>
<br />
<ul>
<li>Lanza una <strong>excepción propia</strong> (<code>ReglaNegocioException</code>), no un <code>abort(409)</code>: el servicio <strong>no sabe qué es HTTP</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio exige <strong>cuatro o más reglas</strong> que <strong>no puedan expresarse de forma declarativa</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="transacciones">Transacciones</h2>
<steps>
<step>
<ul>
<li>Una <strong>transacción</strong> garantiza que un conjunto de escrituras ocurra <strong>por completo o no ocurra</strong></li>
</ul>
<pre><code class="language-php">DB::<span class="hljs-title function_ invoke__">transaction</span>(function () <span class="hljs-keyword">use</span> ($<span class="hljs-title">pedido</span>) {
    $<span class="hljs-title">pedido</span>-&gt;<span class="hljs-title">update</span>([&#x27;<span class="hljs-title">estado</span>&#x27; =&gt; &#x27;<span class="hljs-title">confirmado</span>&#x27;]);
    <span class="hljs-variable language_">$this</span>-&gt;inventario-&gt;<span class="hljs-title function_ invoke__">descontar</span>(<span class="hljs-variable">$pedido</span>-&gt;detalles);  <span class="hljs-comment">// si esto falla...</span>
    <span class="hljs-variable language_">$this</span>-&gt;bitacora-&gt;<span class="hljs-title function_ invoke__">registrar</span>(<span class="hljs-variable">$pedido</span>);
});
<span class="hljs-comment">// ...nada de lo anterior queda escrito</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla del curso: <strong>toda operación que escriba en más de una tabla va dentro de una transacción</strong></li>
</ul>
</step>
<step>
<h3 id="c%C3%B3mo-se-verifica-y-el-laboratorio-lo-exige">Cómo se verifica (y el laboratorio lo exige)</h3>
<pre><code class="language-php"><span class="hljs-title function_ invoke__">it</span>(<span class="hljs-string">&#x27;revierte todo si falla el descuento de inventario&#x27;</span>, function () {
    <span class="hljs-variable">$pedido</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">factory</span>()-&gt;<span class="hljs-title function_ invoke__">has</span>(<span class="hljs-title class_">DetallePedido</span>::<span class="hljs-title function_ invoke__">factory</span>(<span class="hljs-number">2</span>))-&gt;<span class="hljs-title function_ invoke__">create</span>();

    <span class="hljs-comment">// Forzamos el fallo en el segundo paso</span>
    <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">mock</span>(<span class="hljs-title class_">InventarioService</span>::<span class="hljs-variable language_">class</span>)
         -&gt;<span class="hljs-title function_ invoke__">shouldReceive</span>(<span class="hljs-string">&#x27;descontar&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">andThrow</span>(<span class="hljs-keyword">new</span> <span class="hljs-built_in">RuntimeException</span>());

    <span class="hljs-title function_ invoke__">expect</span>(fn () =&gt; <span class="hljs-title function_ invoke__">app</span>(<span class="hljs-title class_">PedidoService</span>::<span class="hljs-variable language_">class</span>)-&gt;<span class="hljs-title function_ invoke__">confirmar</span>(<span class="hljs-variable">$pedido</span>))
        -&gt;<span class="hljs-title function_ invoke__">toThrow</span>(<span class="hljs-title class_">RuntimeException</span>::<span class="hljs-variable language_">class</span>);

    <span class="hljs-comment">// Ninguna de las dos tablas conserva el cambio</span>
    <span class="hljs-title function_ invoke__">expect</span>(<span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">fresh</span>()-&gt;estado)-&gt;<span class="hljs-title function_ invoke__">toBe</span>(<span class="hljs-string">&#x27;borrador&#x27;</span>);
    <span class="hljs-title function_ invoke__">expect</span>(<span class="hljs-title class_">Movimiento</span>::<span class="hljs-title function_ invoke__">count</span>())-&gt;<span class="hljs-title function_ invoke__">toBe</span>(<span class="hljs-number">0</span>);
});
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="transacciones-comparadas">Transacciones comparadas</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS + TypeORM</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core + EF Core</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Sintaxis</strong></td>
<td style="text-align:left"><code>DB::transaction(fn () =&gt; ...)</code></td>
<td style="text-align:left"><code>dataSource.transaction(async m =&gt; ...)</code></td>
<td style="text-align:left"><code>ctx.Database.BeginTransaction()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Reversión</strong></td>
<td style="text-align:left">Automática al lanzar excepción</td>
<td style="text-align:left">Automática al lanzar excepción</td>
<td style="text-align:left">Manual: <code>Commit()</code> / <code>Rollback()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Reintentos</strong></td>
<td style="text-align:left"><code>DB::transaction(fn, 3)</code></td>
<td style="text-align:left">Manual</td>
<td style="text-align:left">Estrategia de ejecución configurable</td>
</tr>
<tr>
<td style="text-align:left"><strong>Anidamiento</strong></td>
<td style="text-align:left"><em>Savepoints</em> automáticos</td>
<td style="text-align:left"><em>Savepoints</em></td>
<td style="text-align:left"><em>Savepoints</em></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En EF Core, <code>SaveChanges()</code> <strong>ya es transaccional</strong> por sí mismo: solo hace falta una transacción explícita si se combinan varios <code>SaveChanges()</code> o SQL crudo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="%F0%9F%93%8B-laboratorio-4--capa-de-negocios"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Laboratorio 4 — Capa de negocios</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%90-separaci%C3%B3n-de-capas"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Separación de capas</h3>
<p>Controladores delgados. Validación, negocio y persistencia cada uno en su capa</p>
</div>
<div>
<h3 id="%E2%9C%85-validaciones"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Validaciones</h3>
<p>Form Requests para creación y actualización de dos entidades, con mensajes en español por campo</p>
</div>
<div>
<h3 id="%F0%9F%A7%A0-reglas-de-negocio"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Reglas de negocio</h3>
<p>Cuatro o más reglas en la capa de servicio, con excepción propia</p>
</div>
<div>
<h3 id="%F0%9F%94%92-transacciones"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Transacciones</h3>
<p>Toda escritura múltiple es transaccional, con reversión <strong>verificada</strong></p>
</div>
<div>
<h3 id="%F0%9F%93%84-crud-completo"><img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> CRUD completo</h3>
<p>Con paginación, ordenamiento por dos campos, filtros combinables y <strong>tope de página</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-primeras-pruebas"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Primeras pruebas</h3>
<p>Una prueba por cada regla implementada</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <em>&quot;Reglas de negocio dentro del controlador se penalizan como falta de separación de responsabilidades: es el error más frecuente de este laboratorio.&quot;</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-DA3niRIp="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="40" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="93">
<h1 id="capa-de-controladores">Capa de controladores</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Aspectos básicos de HTTP</li>
<li>Creación de servicios web (API REST)</li>
<li>Creación de microservicios</li>
<li>Documentación y librerías esenciales</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="http--m%C3%A9todos">HTTP — Métodos</h2>
<ul>
<li>HTTP define métodos de petición que indican <strong>la acción deseada</strong> sobre un recurso. Cada uno tiene una <strong>semántica</strong> distinta</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left">Método</th>
<th style="text-align:left">Acción</th>
<th style="text-align:center">Seguro</th>
<th style="text-align:center">Idempotente</th>
<th style="text-align:center">Cuerpo</th>
<th style="text-align:left">Éxito</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>GET</strong></td>
<td style="text-align:left">Solicita un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><code>200</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>POST</strong></td>
<td style="text-align:left">Crea un recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><code>201</code> + <code>Location</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>PUT</strong></td>
<td style="text-align:left">Reemplaza el recurso completo</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><code>200</code> / <code>204</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>PATCH</strong></td>
<td style="text-align:left">Modifica parcialmente</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><code>200</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>DELETE</strong></td>
<td style="text-align:left">Elimina el recurso</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><code>204</code></td>
</tr>
</tbody>
</table>
<ul>
<li><strong>Seguro</strong> = no modifica estado · <strong>Idempotente</strong> = repetirlo produce el mismo resultado</li>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> <code>DELETE</code> dos veces debe dar el mismo estado final. <code>POST</code> dos veces crea <strong>dos</strong> recursos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="http--c%C3%B3digos-de-estado">HTTP — Códigos de estado</h2>
<div class="grid">
<div>
<h3 id="%E2%9C%85-2xx--%C3%A9xito"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 2xx — Éxito</h3>
<ul>
<li><code>200 OK</code> — consulta o actualización</li>
<li><code>201 Created</code> — creación, <strong>con <code>Location</code></strong></li>
<li><code>204 No Content</code> — eliminación</li>
</ul>
</div>
<div>
<h3 id="%E2%86%A9%EF%B8%8F-3xx--redirecci%C3%B3n"><img class="emoji" draggable="false" alt="↩️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/21a9.svg" data-marp-twemoji=""/> 3xx — Redirección</h3>
<ul>
<li><code>301</code> permanente · <code>302</code> temporal</li>
<li><code>304 Not Modified</code> — caché válida</li>
</ul>
</div>
<div>
<h3 id="%E2%9A%A0%EF%B8%8F-4xx--error-del-cliente"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 4xx — Error del cliente</h3>
<ul>
<li><code>400</code> petición mal formada</li>
<li><code>401</code> <strong>no autenticado</strong> (¿quién eres?)</li>
<li><code>403</code> <strong>no autorizado</strong> (te conozco, no puedes)</li>
<li><code>404</code> no existe</li>
<li><code>409</code> conflicto: <strong>regla de negocio</strong></li>
<li><code>422</code> validación fallida</li>
<li><code>429</code> demasiadas peticiones</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%92%A5-5xx--error-del-servidor"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 5xx — Error del servidor</h3>
<ul>
<li><code>500</code> error no controlado</li>
<li><code>502</code> / <code>503</code> / <code>504</code> — infraestructura</li>
</ul>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Devolver <code>200</code> con <code>{&quot;error&quot;: &quot;...&quot;}</code> en el cuerpo es un <strong>error de diseño</strong>: el cliente no puede reaccionar sin leer el JSON</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="401-vs-403--400-vs-422--409">401 vs 403 · 400 vs 422 · 409</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.92rem;">
<div>
<h3 id="%F0%9F%94%90-401-vs-403"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> 401 vs 403</h3>
<ul>
<li><strong>401 Unauthorized</strong> — <em>no sé quién eres</em>. Falta el token o está vencido</li>
<li><strong>403 Forbidden</strong> — <em>sé quién eres y no puedes</em>. El token es válido pero el rol o la política lo impide</li>
</ul>
<h3 id="%F0%9F%93%9D-400-vs-422"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 400 vs 422</h3>
<ul>
<li><strong>400 Bad Request</strong> — el cuerpo <strong>no se puede interpretar</strong> (JSON malformado)</li>
<li><strong>422 Unprocessable Content</strong> — el cuerpo se entiende pero <strong>no pasa las validaciones</strong></li>
</ul>
</div>
<div>
<h3 id="%E2%9A%94%EF%B8%8F-409-conflict"><img class="emoji" draggable="false" alt="⚔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2694.svg" data-marp-twemoji=""/> 409 Conflict</h3>
<ul>
<li>La petición es válida y la persona tiene permiso, pero <strong>el estado del sistema lo impide</strong></li>
<li><em>&quot;No se puede confirmar un pedido sin detalle&quot;</em></li>
<li><em>&quot;No se puede eliminar un cliente con pedidos activos&quot;</em></li>
</ul>
<br />
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> En Laravel la validación fallida devuelve <strong>422 de forma nativa</strong>, no 400. Debe respetarse esa semántica y documentarse</p>
</blockquote>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="http--encabezados">HTTP — Encabezados</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A5-de-petici%C3%B3n"><img class="emoji" draggable="false" alt="📥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e5.svg" data-marp-twemoji=""/> De petición</h3>
<pre><code class="language-http"><span class="hljs-attribute">Authorization</span><span class="hljs-punctuation">: </span>Bearer eyJhbGci...
<span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/json
<span class="hljs-attribute">Accept</span><span class="hljs-punctuation">: </span>application/json
<span class="hljs-attribute">Accept-Language</span><span class="hljs-punctuation">: </span>es-CR
<span class="hljs-attribute">If-None-Match</span><span class="hljs-punctuation">: </span>&quot;a1b2c3&quot;
</code></pre>
</div>
<div>
<h3 id="%F0%9F%93%A4-de-respuesta"><img class="emoji" draggable="false" alt="📤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e4.svg" data-marp-twemoji=""/> De respuesta</h3>
<pre><code class="language-http"><span class="hljs-attribute">Content-Type</span><span class="hljs-punctuation">: </span>application/json
<span class="hljs-attribute">Location</span><span class="hljs-punctuation">: </span>/api/pedidos/42
<span class="hljs-attribute">ETag</span><span class="hljs-punctuation">: </span>&quot;a1b2c3&quot;
<span class="hljs-attribute">Cache-Control</span><span class="hljs-punctuation">: </span>no-store
<span class="hljs-attribute">X-RateLimit-Remaining</span><span class="hljs-punctuation">: </span>57
<span class="hljs-attribute">Retry-After</span><span class="hljs-punctuation">: </span>60
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-de-seguridad"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> De seguridad</h3>
<pre><code class="language-http"><span class="hljs-attribute">Content-Security-Policy</span><span class="hljs-punctuation">: </span>default-src &#x27;self&#x27;
<span class="hljs-attribute">Strict-Transport-Security</span><span class="hljs-punctuation">: </span>max-age=31536000
<span class="hljs-attribute">X-Content-Type-Options</span><span class="hljs-punctuation">: </span>nosniff
<span class="hljs-attribute">Referrer-Policy</span><span class="hljs-punctuation">: </span>strict-origin-when-cross-origin
<span class="hljs-attribute">Permissions-Policy</span><span class="hljs-punctuation">: </span>geolocation=()
</code></pre>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> El token viaja en <code>Authorization</code>, <strong>nunca en la URL</strong>: la URL queda registrada en las bitácoras del servidor y en el historial del navegador</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="dise%C3%B1o-de-una-api-rest">Diseño de una API REST</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.88rem;">
<div>
<h3 id="%E2%9C%85-rutas-orientadas-a-recursos"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Rutas orientadas a recursos</h3>
<pre><code class="language-http">GET    /api/pedidos
GET    /api/pedidos/{pedido}
POST   /api/pedidos
PUT    /api/pedidos/{pedido}
DELETE /api/pedidos/{pedido}
GET    /api/clientes/{cliente}/pedidos
</code></pre>
<ul>
<li><strong>Sustantivos en plural</strong></li>
<li><strong>Sin verbos</strong> en la ruta</li>
<li>Recursos <strong>anidados</strong> para las relaciones</li>
</ul>
</div>
<div>
<h3 id="%E2%9D%8C-rutas-orientadas-a-acciones"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Rutas orientadas a acciones</h3>
<pre><code class="language-http">GET  /api/obtenerPedidos
POST /api/pedido/eliminar/1
GET  /api/getPedidoById?id=5
POST /api/crearNuevoPedido
</code></pre>
<ul>
<li>El <strong>verbo</strong> ya lo dice el método HTTP</li>
<li>Repetirlo en la ruta es redundante y rompe la uniformidad</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si el nombre del endpoint necesita un verbo, probablemente sea un <strong>recurso que no ha sido modelado</strong> (<code>POST /api/pedidos/{id}/confirmacion</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="rutas-y-controladores-en-laravel-13">Rutas y controladores en Laravel 13</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// routes/api.php</span>
<span class="hljs-title class_">Route</span>::<span class="hljs-title function_ invoke__">apiResource</span>(<span class="hljs-string">&#x27;pedidos&#x27;</span>, <span class="hljs-title class_">PedidoController</span>::<span class="hljs-variable language_">class</span>);
<span class="hljs-title class_">Route</span>::<span class="hljs-title function_ invoke__">apiResource</span>(<span class="hljs-string">&#x27;clientes.pedidos&#x27;</span>, <span class="hljs-title class_">ClientePedidoController</span>::<span class="hljs-variable language_">class</span>)
     -&gt;<span class="hljs-title function_ invoke__">only</span>([<span class="hljs-string">&#x27;index&#x27;</span>]);
</code></pre>
<pre><code class="language-text">apiResource genera 5 rutas:
GET    /pedidos            index
POST   /pedidos            store
GET    /pedidos/{pedido}   show
PUT    /pedidos/{pedido}   update
DELETE /pedidos/{pedido}   destroy
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Controlador delgado: recibe, delega, responde</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">store</span>(<span class="hljs-params">GuardarPedidoRequest <span class="hljs-variable">$request</span></span>): <span class="hljs-title">JsonResponse</span>
</span>{
    <span class="hljs-variable">$pedido</span> = <span class="hljs-variable language_">$this</span>-&gt;service-&gt;<span class="hljs-title function_ invoke__">crear</span>(<span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">validated</span>());

    <span class="hljs-keyword">return</span> (<span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable">$pedido</span>))
        -&gt;<span class="hljs-title function_ invoke__">response</span>()
        -&gt;<span class="hljs-title function_ invoke__">setStatusCode</span>(<span class="hljs-number">201</span>)
        -&gt;<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&#x27;Location&#x27;</span>, <span class="hljs-title function_ invoke__">route</span>(<span class="hljs-string">&#x27;pedidos.show&#x27;</span>, <span class="hljs-variable">$pedido</span>));
}
</code></pre>
</div>
<div>
<ul>
<li>La <strong>validación</strong> ya ocurrió al inyectar el <code>FormRequest</code></li>
<li>El <strong>negocio</strong> está en <code>$this-&gt;service</code></li>
<li>El controlador solo elige el <strong>código de estado</strong> y el <strong>encabezado</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> En Laravel 13 el middleware y la autorización pueden declararse con <strong>atributos</strong>:</li>
</ul>
<pre><code class="language-php"><span class="hljs-meta">#[Middleware</span>(<span class="hljs-string">&#x27;auth:sanctum&#x27;</span>)<span class="hljs-meta">]</span>
<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoController</span> </span>{ }
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="recursos-de-api-desacoplar-la-respuesta-del-esquema">Recursos de API: desacoplar la respuesta del esquema</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoResource</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">JsonResource</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">toArray</span>(<span class="hljs-params"><span class="hljs-variable">$request</span></span>): <span class="hljs-title">array</span>
    </span>{
        <span class="hljs-keyword">return</span> [
            <span class="hljs-string">&#x27;id&#x27;</span>      =&gt; <span class="hljs-variable language_">$this</span>-&gt;id,
            <span class="hljs-string">&#x27;codigo&#x27;</span>  =&gt; <span class="hljs-variable language_">$this</span>-&gt;codigo,
            <span class="hljs-string">&#x27;estado&#x27;</span>  =&gt; <span class="hljs-variable language_">$this</span>-&gt;estado,
            <span class="hljs-string">&#x27;total&#x27;</span>   =&gt; (<span class="hljs-keyword">float</span>) <span class="hljs-variable language_">$this</span>-&gt;total,
            <span class="hljs-string">&#x27;cliente&#x27;</span> =&gt; <span class="hljs-keyword">new</span> <span class="hljs-title class_">ClienteResource</span>(
                             <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">whenLoaded</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>)),
            <span class="hljs-string">&#x27;creado&#x27;</span>  =&gt; <span class="hljs-variable language_">$this</span>-&gt;created_at-&gt;<span class="hljs-title function_ invoke__">toIso8601String</span>(),
        ];
    }
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Uso</span>
<span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable">$pedido</span>);
<span class="hljs-keyword">return</span> <span class="hljs-title class_">PedidoResource</span>::<span class="hljs-title function_ invoke__">collection</span>(<span class="hljs-variable">$pedidos</span>);  <span class="hljs-comment">// con meta y links</span>
</code></pre>
</div>
<div>
<h3 id="%F0%9F%8E%AF-por-qu%C3%A9-importa"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Por qué importa</h3>
<ul>
<li>El <strong>contrato</strong> de la API deja de depender del <strong>esquema</strong> de la base de datos</li>
<li>Si renombro la columna <code>costo_interno</code>, la respuesta <strong>no cambia</strong></li>
<li>Los campos sensibles simplemente <strong>no aparecen</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Criterio de evaluación: <em>&quot;si al renombrar una columna cambia la respuesta de la API, el desacoplamiento no se logró&quot;</em></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="novedad-de-laravel-13-recursos-jsonapi">Novedad de Laravel 13: recursos JSON:API</h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.78rem;">
<div>
<pre><code class="language-bash">php artisan make:resource PostResource --json-api
</code></pre>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;data&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;posts&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;1&quot;</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;attributes&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Hola&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;body&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;...&quot;</span> <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;relationships&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
      <span class="hljs-attr">&quot;author&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;data&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;users&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;7&quot;</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span>
    <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;links&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;self&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;/api/posts/1&quot;</span> <span class="hljs-punctuation">}</span>
  <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;included&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;users&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;7&quot;</span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">]</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<ul>
<li>
<p><strong>JSON:API</strong> es una especificación que estandariza cómo se ven las respuestas: tipos, relaciones, <code>included</code>, <em>sparse fieldsets</em> y enlaces</p>
</li>
<li>
<p>Laravel 13 lo trae <strong>de primera mano</strong>: maneja la serialización, la inclusión de relaciones, los campos dispersos y los encabezados conformes</p>
</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Para el proyecto <strong>no es obligatorio</strong>: lo importante es que la estructura sea <strong>consistente en toda la API</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="metadatos-de-paginaci%C3%B3n-en-la-respuesta">Metadatos de paginación en la respuesta</h2>

<div>
<pre><code class="language-php"><span class="hljs-keyword">return</span> <span class="hljs-title class_">PedidoResource</span>::<span class="hljs-title function_ invoke__">collection</span>(
    <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">with</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-variable">$porPagina</span>)
);
</code></pre>
</div>
<div>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>

    <span class="hljs-attr">&quot;last&quot;</span><span class="hljs-punctuation">:</span>  <span class="hljs-string">&quot;https://api.../pedidos?page=9&quot;</span><span class="hljs-punctuation">,</span>

  <span class="hljs-attr">&quot;meta&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>

  <span class="hljs-punctuation">}</span>

</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio exige <strong>página actual, total de páginas, total de registros y enlaces</strong>, con una estructura <strong>consistente en toda la API</strong></li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En Laravel esto es automático. En NestJS y ASP.NET Core hay que <strong>construirlo a mano</strong> — otro punto medible del comparativo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="microservicios">Microservicios</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.88rem;">
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-monolito"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> Monolito</h3>
<ul>
<li><strong>Un</strong> despliegue, <strong>una</strong> base de datos, <strong>un</strong> repositorio</li>
<li>Transacciones locales y sencillas</li>
<li>Refactorizar es barato</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Es lo correcto para empezar</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%A9-microservicios"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Microservicios</h3>
<ul>
<li>Servicios pequeños, <strong>desplegables por separado</strong></li>
<li>Cada uno <strong>dueño de sus datos</strong></li>
<li>Se comunican por HTTP, gRPC o mensajería</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Consistencia eventual, trazabilidad distribuida, más operación</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>No</strong> se adoptan microservicios por moda. Se adoptan cuando hay un <strong>problema concreto</strong> que el monolito no resuelve: escalado independiente, equipos autónomos, ciclos de despliegue distintos o aislamiento de fallas</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <em>&quot;Empiece con un monolito bien modularizado. Si las costuras están bien puestas, extraer un servicio después es mecánico.&quot;</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="cu%C3%A1ndo-extraer-un-microservicio">Cuándo extraer un microservicio</h2>
<steps>
<step>
<h3 id="%F0%9F%8E%AF-se%C3%B1ales-leg%C3%ADtimas"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Señales legítimas</h3>
<ul>
<li>La responsabilidad tiene un <strong>perfil de carga distinto</strong> (generación de reportes que satura el servidor web)</li>
<li>Necesita <strong>escalar por separado</strong> del resto</li>
<li>Tiene un <strong>ciclo de vida propio</strong>: cambia mucho más o mucho menos que el núcleo</li>
<li>Es un <strong>punto de falla</strong> que conviene aislar (envío de notificaciones a un proveedor externo)</li>
<li>Usa una <strong>tecnología distinta</strong> justificadamente</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%A7%AA-el-ejercicio-del-laboratorio-5"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> El ejercicio del Laboratorio 5</h3>
<blockquote>
<p><em>&quot;Diseñe y documente el contrato de un microservicio que resuelva una responsabilidad acotada del proyecto (por ejemplo, notificaciones o generación de reportes), justificando técnicamente su separación.&quot;</em></p>
</blockquote>
<ul>
<li>No se pide <strong>implementarlo</strong>: se pide <strong>diseñar el contrato</strong> y <strong>justificar</strong> la separación</li>
<li>El contrato define: endpoints, formato de mensajes, manejo de fallas y <strong>qué pasa si el servicio está caído</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="comunicaci%C3%B3n-entre-servicios">Comunicación entre servicios</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%84-s%C3%ADncrona--http--rest"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Síncrona — HTTP / REST</h3>
<p>Simple y universal. El llamador <strong>espera</strong>. Si el destino cae, el origen falla</p>
</div>
<div>
<h3 id="%E2%9A%A1-s%C3%ADncrona--grpc"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Síncrona — gRPC</h3>
<p>Contratos tipados con <em>protobuf</em>, binario y rápido. Ideal entre servicios internos</p>
</div>
<div>
<h3 id="%F0%9F%93%AC-as%C3%ADncrona--colas"><img class="emoji" draggable="false" alt="📬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ec.svg" data-marp-twemoji=""/> Asíncrona — Colas</h3>
<p>RabbitMQ, Redis, SQS. El origen <strong>no espera</strong>. Tolera caídas del destino</p>
</div>
</div>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Laravel: trabajo en cola</span>
<span class="hljs-title class_">ProcesarReporte</span>::<span class="hljs-title function_ invoke__">dispatch</span>(<span class="hljs-variable">$pedido</span>)
    -&gt;<span class="hljs-title function_ invoke__">onQueue</span>(<span class="hljs-string">&#x27;reportes&#x27;</span>);

<span class="hljs-comment">// Laravel 13: enrutamiento centralizado</span>
<span class="hljs-title class_">Queue</span>::<span class="hljs-title function_ invoke__">route</span>(<span class="hljs-title class_">ProcesarReporte</span>::<span class="hljs-variable language_">class</span>,
    <span class="hljs-attr">connection</span>: <span class="hljs-string">&#x27;redis&#x27;</span>, <span class="hljs-attr">queue</span>: <span class="hljs-string">&#x27;reportes&#x27;</span>);
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> <strong>NestJS</strong> trae microservicios de primera mano: <code>@nestjs/microservices</code> con transportes TCP, Redis, NATS, Kafka y gRPC</li>
<li><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> <strong>ASP.NET Core</strong> se apoya en <strong>.NET Aspire</strong> para orquestar, y en gRPC nativo</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="documentaci%C3%B3n-efectiva-openapi">Documentación efectiva: OpenAPI</h2>
<ul>
<li><strong>OpenAPI</strong> (antes <em>Swagger</em>) es una especificación para describir una API REST en un archivo legible por máquinas y humanos</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%C2%BFpara-qu%C3%A9-sirve">¿Para qué sirve?</h3>
<ul>
<li><img class="emoji" draggable="false" alt="📖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d6.svg" data-marp-twemoji=""/> Otra persona puede <strong>consumir la API sin leer el código fuente</strong></li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Genera un cliente de prueba navegable</li>
<li><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Genera <strong>SDK de cliente</strong> automáticamente</li>
<li><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f91d.svg" data-marp-twemoji=""/> Es el <strong>contrato</strong> entre el back-end y los equipos web y móvil</li>
</ul>
</div>
<div>
<h3 id="el-criterio-del-curso">El criterio del curso</h3>
<blockquote>
<p><em>&quot;La documentación debe permitir que otra persona consuma la API sin leer el código fuente: ese es el criterio de documentación efectiva.&quot;</em></p>
</blockquote>
<ul>
<li>No basta con generar el archivo: hay que <strong>enriquecerlo</strong> con descripciones, ejemplos de solicitud y respuesta, y <strong>los códigos de error de cada operación</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="herramientas-de-openapi-en-laravel">Herramientas de OpenAPI en Laravel</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Herramienta</th>
<th style="text-align:left">Enfoque</th>
<th style="text-align:left">Ventaja</th>
<th style="text-align:left">Costo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Scramble</strong></td>
<td style="text-align:left"><strong>Cero anotaciones</strong>: analiza el código, los Form Requests y los Resources</td>
<td style="text-align:left">Documentación al día sin esfuerzo manual</td>
<td style="text-align:left">Menos control fino</td>
</tr>
<tr>
<td style="text-align:left"><strong>Scribe</strong></td>
<td style="text-align:left">Analiza el código + anotaciones opcionales</td>
<td style="text-align:left">Genera además una página HTML muy completa</td>
<td style="text-align:left">Configuración inicial mayor</td>
</tr>
<tr>
<td style="text-align:left"><strong>L5-Swagger</strong></td>
<td style="text-align:left">Anotaciones PHPDoc explícitas</td>
<td style="text-align:left">Control total sobre cada detalle</td>
<td style="text-align:left">Hay que escribir y mantener las anotaciones</td>
</tr>
</tbody>
</table>
<pre><code class="language-bash">composer require dedoc/scramble          <span class="hljs-comment"># documentación en /docs/api</span>
php artisan scramble:<span class="hljs-built_in">export</span> --path=docs/openapi.yaml
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio pide <strong>exportar la especificación</strong> a <code>docs/openapi.yaml</code> y <strong>versionarla</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="documentaci%C3%B3n-comparada">Documentación comparada</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%B4-laravel-1"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel</h3>
<p><strong>Scramble</strong> (cero anotaciones), <strong>Scribe</strong> o <strong>L5-Swagger</strong>.</p>
<p>No viene nada de fábrica: hay que instalar un paquete</p>
</div>
<div>
<h3 id="%F0%9F%9F%A2-nestjs"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS</h3>
<p><strong><code>@nestjs/swagger</code></strong> es <strong>oficial</strong>. Lee los DTO y sus decoradores de <code>class-validator</code></p>
<pre><code class="language-ts"><span class="hljs-meta">@ApiProperty</span>({ <span class="hljs-attr">example</span>: <span class="hljs-string">&#x27;PED-0001&#x27;</span> })
<span class="hljs-attr">codigo</span>: <span class="hljs-built_in">string</span>;
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9F%A3-aspnet-core"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core</h3>
<p>Desde .NET 9 usa <strong><code>Microsoft.AspNetCore.OpenApi</code></strong> integrado (reemplazó a Swashbuckle por defecto)</p>
<pre><code class="language-csharp">builder.Services.AddOpenApi();
app.MapOpenApi();
</code></pre>
</div>
</div>
<ul>

<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Aquí NestJS y ASP.NET Core parten con ventaja: la documentación es <strong>de primera mano</strong></li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="librer%C3%ADas-esenciales-para-back-end">Librerías esenciales para back-end</h2>

<div>
