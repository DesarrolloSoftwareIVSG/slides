<h2 id="arquitectura-por-capas-1">Arquitectura por capas</h2>
<ul>
<li>Cada capa tiene <strong>una</strong> responsabilidad y solo conoce a la que está inmediatamente debajo</li>
</ul>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.9rem;">
<div>
<pre><code class="language-text">   Cliente (web / móvil)
            │  HTTP
            ▼
  ┌─────────────────────┐
  │  Controladores      │ ← HTTP
  ├─────────────────────┤
  │  Servicios (negocio)│ ← reglas
  ├─────────────────────┤
  │  Modelos / ORM      │ ← datos
  └─────────────────────┘
            │  SQL
            ▼
      Base de datos
</code></pre>
</div>
<div>
<ul>
<li><strong>Controlador</strong> — traduce HTTP a llamadas de negocio. No decide nada</li>
<li><strong>Servicio</strong> — dueño de las reglas del dominio. No sabe qué es HTTP</li>
<li><strong>Modelo / repositorio</strong> — persistencia. No conoce reglas de negocio</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> El error más frecuente del curso: <strong>meter la lógica de negocio en el controlador</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="el-recorrido-de-una-petici%C3%B3n">El recorrido de una petición</h2>
<steps>
<step>
<pre><code class="language-text">1. Ruta            routes/api.php         →  ¿existe este endpoint?
2. Middleware      auth, throttle, cors   →  ¿puede pasar?
3. FormRequest     validación declarativa →  ¿los datos son válidos?  → 422
4. Controlador     traduce y delega       →  llama al servicio
5. Servicio        reglas de negocio      →  ¿la operación es legal?  → 409
6. Modelo / ORM    persistencia           →  SQL con parámetros
7. Recurso (API)   transforma la salida   →  JSON estable
8. Respuesta       código + encabezados   →  200 / 201 / 204
</code></pre>
</step>
<step>
<ul>
<li>Cada paso es <strong>un punto de falla distinto</strong> y devuelve <strong>un código de estado distinto</strong></li>
<li>Si algo se rompe, saber en qué paso ocurrió es la mitad de la depuración</li>
</ul>
<div class="grid">
<div>
<h3 id="401">401</h3>
<p>Falló el paso 2: no hay identidad</p>
</div>
<div>
<h3 id="422">422</h3>
<p>Falló el paso 3: datos mal formados</p>
</div>
<div>
<h3 id="403">403</h3>
<p>Falló el paso 4 o 5: identidad sin permiso</p>
</div>
<div>
<h3 id="409">409</h3>
<p>Falló el paso 5: regla de negocio violada</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">

<h2 id="estructura-de-un-proyecto-laravel-13">Estructura de un proyecto Laravel 13</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text">app/
 ├── Http/
 │    ├── Controllers/   ← capa de controladores
 │    ├── Requests/      ← validaciones
 │    └── Resources/     ← transformación de salida
 ├── Models/             ← Eloquent
 ├── Services/           ← capa de negocio (la creamos)
 ├── Policies/           ← autorización
 └── Exceptions/         ← excepciones propias
bootstrap/app.php        ← rutas, middleware, errores
config/
database/
 ├── migrations/  factories/  seeders/
routes/  api.php  web.php
tests/   Feature/  Unit/
</code></pre>
</div>
<div>
<ul>
<li>Desde <strong>Laravel 11</strong> desaparecieron <code>app/Http/Kernel.php</code> y <code>app/Exceptions/Handler.php</code></li>
<li>Todo eso se configura ahora en un único <strong><code>bootstrap/app.php</code></strong></li>
</ul>
<br />
<ul>
<li><code>app/Services/</code> <strong>no</strong> viene por defecto: es una convención que adoptamos en el curso para que la capa de negocio tenga un lugar propio</li>
</ul>
</div>
</split-slide>

<h2 id="%C2%BFqu%C3%A9-es-un-framework-de-persistencia">¿Qué es un framework de persistencia?</h2>
<ul>
<li>Un <strong>ORM</strong> (<em>Object-Relational Mapping</em>) es una técnica para convertir datos entre el sistema de tipos de un lenguaje <strong>orientado a objetos</strong> y una base de datos <strong>relacional</strong> usada como motor de persistencia</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%F0%9F%98%96-sin-orm"><img class="emoji" draggable="false" alt="😖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f616.svg" data-marp-twemoji=""/> Sin ORM</h3>
<pre><code class="language-php"><span class="hljs-variable">$sql</span> = <span class="hljs-string">&quot;SELECT * FROM pedidos
        WHERE cliente_id = &quot;</span> . <span class="hljs-variable">$id</span>;
<span class="hljs-variable">$rows</span> = <span class="hljs-title function_ invoke__">mysqli_query</span>(<span class="hljs-variable">$conn</span>, <span class="hljs-variable">$sql</span>);
<span class="hljs-comment">// arreglos asociativos sueltos</span>
<span class="hljs-comment">// SQL concatenado → inyección</span>
</code></pre>
</div>
<div>
<h3 id="%F0%9F%98%8C-con-orm"><img class="emoji" draggable="false" alt="😌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f60c.svg" data-marp-twemoji=""/> Con ORM</h3>
<pre><code class="language-php"><span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;cliente_id&#x27;</span>, <span class="hljs-variable">$id</span>)
                 -&gt;<span class="hljs-title function_ invoke__">with</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>)
                 -&gt;<span class="hljs-title function_ invoke__">get</span>();
<span class="hljs-comment">// objetos Pedido, tipados</span>
<span class="hljs-comment">// parámetros vinculados siempre</span>
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> <strong>Navego objetos, no tablas</strong>: <code>$user-&gt;roles</code> recorre la tabla pivote sin que yo escriba el <code>JOIN</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="los-tres-orm-del-curso">Los tres ORM del curso</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel 13</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>ORM</strong></td>
<td style="text-align:left">Eloquent</td>
<td style="text-align:left">TypeORM / Prisma</td>
<td style="text-align:left">Entity Framework Core</td>
</tr>
<tr>
<td style="text-align:left"><strong>Patrón</strong></td>
<td style="text-align:left"><em>Active Record</em></td>
<td style="text-align:left"><em>Data Mapper</em> / cliente generado</td>
<td style="text-align:left"><em>Data Mapper</em> + <code>DbContext</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Migraciones</strong></td>
<td style="text-align:left"><code>php artisan make:migration</code></td>
<td style="text-align:left"><code>typeorm migration:generate</code> · <code>prisma migrate</code></td>
<td style="text-align:left"><code>dotnet ef migrations add</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Definición</strong></td>
<td style="text-align:left">Clase PHP + migración</td>
<td style="text-align:left">Entidad decorada / <code>schema.prisma</code></td>
<td style="text-align:left">Clase C# + <code>DbContext</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Consulta</strong></td>
<td style="text-align:left"><code>Pedido::where(...)</code></td>
<td style="text-align:left"><code>repo.find({ where })</code></td>
<td style="text-align:left"><code>ctx.Pedidos.Where(...)</code> (LINQ)</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> <strong>Active Record</strong>: el modelo <em>es</em> la fila y sabe guardarse. Menos código, más acoplamiento</li>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> <strong>Data Mapper</strong>: la entidad es un objeto plano y un repositorio la persiste. Más ceremonia, más testeable</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="migraciones-control-de-versiones-para-la-base-de-datos">Migraciones: control de versiones para la base de datos</h2>
<steps>
<step>
<h3 id="el-problema">El problema</h3>
<ul>
<li>Versionar la base de datos es <strong>más complejo</strong> que versionar el código:
<ul>
<li>En producción <strong>existen datos</strong></li>
<li>No podemos borrarlos porque cambiamos las tablas</li>
<li>Debemos <strong>transformar</strong> los datos</li>
</ul>
</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> Ejemplo: pasar una relación 1:N a N:M. Cambiar el modelo entidad-relación es fácil —separo la tabla en dos—, pero además debo <strong>detectar los estudiantes duplicados y unificarlos</strong>. Sería trivial si no hubiera datos.</p>
</blockquote>
</step>
<step>
<h3 id="la-soluci%C3%B3n">La solución</h3>
<ul>
<li>
<p>Las <strong>migraciones</strong> son el control de versiones de tu esquema</p>
</li>
<li>
<p>Permiten modificar la base de datos y <strong>compartir esos cambios con el equipo</strong></p>
</li>
<li>
<p>La creación del esquema también se hace con migraciones</p>
</li>
<li>
<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla del curso: <strong>una migración debe ser reversible</strong>. Si el retroceso falla, el esquema no es reproducible</p>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="migraci%C3%B3n-en-laravel-13">Migración en Laravel 13</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// database/migrations/..._create_pedidos_table.php</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">up</span>(<span class="hljs-params"></span>): <span class="hljs-title">void</span>
</span>{
    <span class="hljs-title class_">Schema</span>::<span class="hljs-title function_ invoke__">create</span>(<span class="hljs-string">&#x27;pedidos&#x27;</span>, function (Blueprint <span class="hljs-variable">$table</span>) {
        <span class="hljs-variable">$table</span>-&gt;<span class="hljs-title function_ invoke__">id</span>();
        <span class="hljs-variable">$table</span>-&gt;<span class="hljs-keyword">string</span>(<span class="hljs-string">&#x27;codigo&#x27;</span>, <span class="hljs-number">20</span>)-&gt;<span class="hljs-title function_ invoke__">unique</span>();
        <span class="hljs-variable">$table</span>-&gt;<span class="hljs-title function_ invoke__">foreignId</span>(<span class="hljs-string">&#x27;cliente_id&#x27;</span>)
              -&gt;<span class="hljs-title function_ invoke__">constrained</span>()
              -&gt;<span class="hljs-title function_ invoke__">restrictOnDelete</span>();
        <span class="hljs-variable">$table</span>-&gt;<span class="hljs-title function_ invoke__">decimal</span>(<span class="hljs-string">&#x27;total&#x27;</span>, <span class="hljs-number">12</span>, <span class="hljs-number">2</span>)-&gt;<span class="hljs-keyword">default</span>(<span class="hljs-number">0</span>);
        <span class="hljs-variable">$table</span>-&gt;<span class="hljs-class"><span class="hljs-keyword">enum</span>(&#x27;<span class="hljs-title">estado</span>&#x27;, [&#x27;<span class="hljs-title">borrador</span>&#x27;,&#x27;<span class="hljs-title">confirmado</span>&#x27;,&#x27;<span class="hljs-title">anulado</span>&#x27;])
              -&gt;<span class="hljs-title">index</span>();
        $<span class="hljs-title">table</span>-&gt;<span class="hljs-title">timestamps</span>();
    });
}

<span class="hljs-title">public</span> <span class="hljs-title">function</span> <span class="hljs-title">down</span>(): <span class="hljs-title">void</span>
</span>{
    <span class="hljs-title class_">Schema</span>::<span class="hljs-title function_ invoke__">dropIfExists</span>(<span class="hljs-string">&#x27;pedidos&#x27;</span>);
}
</code></pre>
</div>
<div>
<ul>
<li><strong>Tipos y longitudes</strong> explícitos</li>
<li><strong>Restricciones de nulidad</strong> e <strong>índices</strong></li>
<li><strong>Claves foráneas</strong> con política de borrado (<code>restrictOnDelete</code> o <code>cascadeOnDelete</code>)</li>
</ul>
<pre><code class="language-bash">php artisan migrate
php artisan migrate:rollback  <span class="hljs-comment"># ¿funciona?</span>
php artisan migrate           <span class="hljs-comment"># ¿reaplica?</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Si el <code>rollback</code> falla, se penaliza: es la diferencia entre un esquema <strong>versionado</strong> y uno <strong>improvisado</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="migraciones-en-los-tres-frameworks">Migraciones en los tres frameworks</h2>
<split-slide style="--left: 34%; --right: 66%; --font-size: 0.78rem;">
<div>
<h3 id="%F0%9F%94%B4-laravel"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel</h3>
<pre><code class="language-bash">php artisan make:migration create_pedidos_table
php artisan migrate
php artisan migrate:rollback
</code></pre>
</div>
<div>
<div class="grid">
<div>
<h3 id="%F0%9F%9F%A2-nestjs--typeorm"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS + TypeORM</h3>
<pre><code class="language-bash">npm run typeorm migration:generate -- -n CreatePedidos
npm run typeorm migration:run
npm run typeorm migration:revert
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9F%A3-aspnet-core--ef-core"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core + EF Core</h3>
<pre><code class="language-bash">dotnet ef migrations add CreatePedidos
dotnet ef database update
dotnet ef migrations remove
</code></pre>
</div>
</div>
<ul>
<li>Los tres resuelven el mismo problema con el mismo ciclo: <strong>generar → aplicar → revertir</strong></li>
<li>Diferencia práctica: Laravel y EF Core <strong>generan la migración desde el código</strong>; TypeORM la <strong>compara contra el esquema actual</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="modelos-eloquent">Modelos Eloquent</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">Pedido</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">Model</span>
</span>{
    <span class="hljs-comment">// Asignación masiva protegida</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-variable">$fillable</span> = [<span class="hljs-string">&#x27;codigo&#x27;</span>, <span class="hljs-string">&#x27;cliente_id&#x27;</span>, <span class="hljs-string">&#x27;estado&#x27;</span>];

    <span class="hljs-comment">// Nunca se serializan</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-variable">$hidden</span> = [<span class="hljs-string">&#x27;costo_interno&#x27;</span>];

    <span class="hljs-comment">// Conversores de tipo (Laravel 11+: método, no propiedad)</span>
    <span class="hljs-keyword">protected</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">casts</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
    </span>{
        <span class="hljs-keyword">return</span> [
            <span class="hljs-string">&#x27;total&#x27;</span>         =&gt; <span class="hljs-string">&#x27;decimal:2&#x27;</span>,
            <span class="hljs-string">&#x27;confirmado_en&#x27;</span> =&gt; <span class="hljs-string">&#x27;datetime&#x27;</span>,
        ];
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">cliente</span>(<span class="hljs-params"></span>): <span class="hljs-title">BelongsTo</span>
    </span>{ 
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">belongsTo</span>(<span class="hljs-title class_">Cliente</span>::<span class="hljs-variable language_">class</span>); 
    }

    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">detalles</span>(<span class="hljs-params"></span>): <span class="hljs-title">HasMany</span>
    </span>{ 
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">hasMany</span>(<span class="hljs-title class_">DetallePedido</span>::<span class="hljs-variable language_">class</span>); 
    }

    <span class="hljs-comment">// Alcance reutilizable</span>
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">scopeConfirmados</span>(<span class="hljs-params"><span class="hljs-variable">$q</span></span>)
    </span>{ 
        <span class="hljs-keyword">return</span> <span class="hljs-variable">$q</span>-&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;estado&#x27;</span>, <span class="hljs-string">&#x27;confirmado&#x27;</span>); 
    }
}
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-fillable"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> <code>$fillable</code></h3>
<p>Sin él, una solicitud podría modificar <strong>campos no previstos</strong> — por ejemplo el <strong>rol</strong> de la persona usuaria. Es una vulnerabilidad real</p>
<h3 id="%F0%9F%99%88-hidden"><img class="emoji" draggable="false" alt="🙈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f648.svg" data-marp-twemoji=""/> <code>$hidden</code></h3>
<p>Contraseñas y tokens deben ocultarse en la serialización, o <strong>se filtran</strong> en cualquier respuesta que devuelva el modelo completo</p>
<h3 id="%F0%9F%94%81-scope"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> <code>scope</code></h3>
<p>Encapsula un filtro con nombre de negocio y lo hace reutilizable</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="relaciones">Relaciones</h2>
<steps>
<step>
<h3 id="1%EF%B8%8F%E2%83%A3-%E2%9E%A1%EF%B8%8F-n-hasmany"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> N <code>hasMany</code></h3>
<p>Un pedido tiene muchos detalles</p>
<pre><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">detalles</span>(<span class="hljs-params"></span>): <span class="hljs-title">HasMany</span>
</span>{
  <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">hasMany</span>(<span class="hljs-title class_">DetallePedido</span>::<span class="hljs-variable language_">class</span>);
}
</code></pre>
</step>
<step>
<h3 id="n-%E2%9E%A1%EF%B8%8F-1%EF%B8%8F%E2%83%A3-belongsto">N <img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> <code>belongsTo</code></h3>
<p>Un pedido pertenece a un cliente</p>
<pre><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">cliente</span>(<span class="hljs-params"></span>): <span class="hljs-title">BelongsTo</span>
</span>{
  <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">belongsTo</span>(<span class="hljs-title class_">Cliente</span>::<span class="hljs-variable language_">class</span>);
}
</code></pre>
</step>
<step>
<h3 id="n-%E2%86%94%EF%B8%8F-m-belongstomany">N <img class="emoji" draggable="false" alt="↔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2194.svg" data-marp-twemoji=""/> M <code>belongsToMany</code></h3>
<p>Con tabla pivote y datos adicionales</p>
<pre><code class="language-php"><span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">roles</span>(<span class="hljs-params"></span>): <span class="hljs-title">BelongsToMany</span>
</span>{
  <span class="hljs-keyword">return</span> <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">belongsToMany</span>(<span class="hljs-title class_">Role</span>::<span class="hljs-variable language_">class</span>)
              -&gt;<span class="hljs-title function_ invoke__">withPivot</span>(<span class="hljs-string">&#x27;asignado_en&#x27;</span>)
              -&gt;<span class="hljs-title function_ invoke__">withTimestamps</span>();
}
</code></pre>
</step>
</steps>
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El proyecto exige <strong>mínimo seis entidades</strong> con una relación <strong>1:N</strong>, una <strong>N:M</strong> y una <strong>N:M con datos adicionales en el pivote</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="el-problema-n1">El problema N+1</h2>
<steps>
<step>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 21 consultas para listar 20 pedidos</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">all</span>();          <span class="hljs-comment">// 1 consulta</span>
<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$pedidos</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$pedido</span>) {
    <span class="hljs-keyword">echo</span> <span class="hljs-variable">$pedido</span>-&gt;cliente-&gt;nombre; <span class="hljs-comment">// +1 consulta por cada pedido</span>
}
</code></pre>
<ul>
<li>Una consulta para la lista, <strong>más una consulta por cada elemento</strong></li>
<li>Con 20 registros son 21 consultas; con 2 000 registros son <strong>2 001</strong></li>
<li>No se nota en desarrollo con datos de prueba. <strong>Se nota en producción</strong></li>
</ul>
</step>
<step>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 2 consultas: carga anticipada (eager loading)</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">with</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>, <span class="hljs-string">&#x27;detalles.producto&#x27;</span>)
                 -&gt;<span class="hljs-title function_ invoke__">confirmados</span>()
                 -&gt;<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-number">15</span>);
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// AppServiceProvider::boot() — que el framework falle en desarrollo</span>
<span class="hljs-title class_">Model</span>::<span class="hljs-title function_ invoke__">preventLazyLoading</span>(! <span class="hljs-title function_ invoke__">app</span>()-&gt;<span class="hljs-title function_ invoke__">isProduction</span>());
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> El laboratorio exige el <strong>dato numérico</strong>: consultas <strong>antes</strong> y <strong>después</strong>. Una afirmación sin conteo no cuenta</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="c%C3%B3mo-medir-las-consultas">Cómo medir las consultas</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Registro de consultas en una ruta de prueba</span>
DB::<span class="hljs-title function_ invoke__">enableQueryLog</span>();

<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">all</span>();
<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$pedidos</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$p</span>) { <span class="hljs-variable">$p</span>-&gt;cliente-&gt;nombre; }

<span class="hljs-title function_ invoke__">dd</span>(<span class="hljs-title function_ invoke__">count</span>(DB::<span class="hljs-title function_ invoke__">getQueryLog</span>()));  <span class="hljs-comment">// 21</span>
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Con carga anticipada</span>
DB::<span class="hljs-title function_ invoke__">enableQueryLog</span>();

<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">with</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">get</span>();
<span class="hljs-keyword">foreach</span> (<span class="hljs-variable">$pedidos</span> <span class="hljs-keyword">as</span> <span class="hljs-variable">$p</span>) { <span class="hljs-variable">$p</span>-&gt;cliente-&gt;nombre; }

<span class="hljs-title function_ invoke__">dd</span>(<span class="hljs-title function_ invoke__">count</span>(DB::<span class="hljs-title function_ invoke__">getQueryLog</span>()));  <span class="hljs-comment">// 2</span>
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🔭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52d.svg" data-marp-twemoji=""/> Alternativas: <strong>Laravel Telescope</strong>, <strong>Laravel Debugbar</strong> o <strong>Pulse</strong> muestran el conteo en cada petición sin tocar el código</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> En NestJS: <code>logging: true</code> en TypeORM</li>
<li><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> En EF Core: <code>optionsBuilder.LogTo(Console.WriteLine)</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="f%C3%A1bricas-y-pobladores">Fábricas y pobladores</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// database/factories/PedidoFactory.php</span>
<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoFactory</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">Factory</span>
</span>{

    </span>{
        <span class="hljs-keyword">return</span> [
            <span class="hljs-string">&#x27;codigo&#x27;</span>     =&gt; <span class="hljs-title function_ invoke__">fake</span>()-&gt;<span class="hljs-title function_ invoke__">unique</span>()-&gt;<span class="hljs-title function_ invoke__">bothify</span>(<span class="hljs-string">&#x27;PED-####&#x27;</span>),

                                [<span class="hljs-string">&#x27;borrador&#x27;</span>,<span class="hljs-string">&#x27;confirmado&#x27;</span>]),
            <span class="hljs-string">&#x27;total&#x27;</span>      =&gt; <span class="hljs-title function_ invoke__">fake</span>()-&gt;<span class="hljs-title function_ invoke__">randomFloat</span>(<span class="hljs-number">2</span>, <span class="hljs-number">1000</span>, <span class="hljs-number">500000</span>),
        ];
    }
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// database/seeders/DatabaseSeeder.php</span>
<span class="hljs-title class_">Cliente</span>::<span class="hljs-title function_ invoke__">factory</span>(<span class="hljs-number">10</span>)
       -&gt;<span class="hljs-title function_ invoke__">has</span>(<span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">factory</span>(<span class="hljs-number">3</span>)-&gt;<span class="hljs-title function_ invoke__">has</span>(<span class="hljs-title class_">DetallePedido</span>::<span class="hljs-title function_ invoke__">factory</span>(<span class="hljs-number">4</span>)))

</div>
<div>
<ul>
<li>Las fábricas usan <strong>Faker</strong> para generar datos <strong>realistas</strong>, no <code>aaa</code>, <code>test1</code>, <code>asdf</code></li>

<br />
<ul>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> El laboratorio exige <strong>mínimo 20 registros</strong> en la entidad principal y <strong>datos coherentes</strong> en las relacionadas</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los datos de prueba también son el insumo de las <strong>pruebas automatizadas</strong> y del <strong>contrato comparativo</strong></li>

<h2 id="consumo-de-procedimientos-almacenados">Consumo de procedimientos almacenados</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Ejecutar un procedimiento sin resultado</span>
DB::<span class="hljs-title function_ invoke__">statement</span>(<span class="hljs-string">&#x27;CALL recalcular_totales(?)&#x27;</span>, [<span class="hljs-variable">$pedidoId</span>]);

<span class="hljs-comment">// Procedimiento que devuelve filas</span>
<span class="hljs-variable">$filas</span> = DB::<span class="hljs-title function_ invoke__">select</span>(<span class="hljs-string">&#x27;CALL reporte_ventas_mes(?, ?)&#x27;</span>,
                    [<span class="hljs-variable">$anio</span>, <span class="hljs-variable">$mes</span>]);

<span class="hljs-comment">// Varios conjuntos de resultados a la vez</span>
[<span class="hljs-variable">$opciones</span>, <span class="hljs-variable">$notificaciones</span>] = DB::<span class="hljs-title function_ invoke__">selectResultSets</span>(
    <span class="hljs-string">&quot;CALL get_user_options_and_notifications(?)&quot;</span>,
    <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">user</span>()-&gt;id
);

<span class="hljs-comment">// Consultar una vista como si fuera una tabla</span>
<span class="hljs-variable">$ventas</span> = DB::<span class="hljs-title function_ invoke__">table</span>(<span class="hljs-string">&#x27;v_ventas_por_cliente&#x27;</span>)
            -&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;anio&#x27;</span>, <span class="hljs-number">2026</span>)
            -&gt;<span class="hljs-title function_ invoke__">get</span>();
</code></pre>
</div>
<div>
<h3 id="%E2%9C%85-cu%C3%A1ndo-usarlos"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Cuándo usarlos</h3>

</ul>
<h3 id="%E2%9A%A0%EF%B8%8F-cu%C3%A1ndo-evitarlos"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Cuándo evitarlos</h3>

<p><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Siempre con <strong>parámetros vinculados</strong> (<code>?</code>), nunca concatenando texto</p>

<h2 id="procedimientos-almacenados-en-los-tres-frameworks">Procedimientos almacenados en los tres frameworks</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Laravel / Eloquent</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS / TypeORM</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> ASP.NET Core / EF Core</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Sin resultado</strong></td>
<td style="text-align:left"><code>DB::statement('CALL sp(?)', [$x])</code></td>
<td style="text-align:left"><code>dataSource.query('CALL sp(?)', [x])</code></td>
<td style="text-align:left"><code>ctx.Database.ExecuteSqlAsync(...)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Con filas</strong></td>
<td style="text-align:left"><code>DB::select('CALL sp(?)', [$x])</code></td>
<td style="text-align:left"><code>repo.query('CALL sp(?)', [x])</code></td>
<td style="text-align:left"><code>ctx.Pedidos.FromSql(...)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Múltiples resultados</strong></td>
<td style="text-align:left"><code>DB::selectResultSets(...)</code></td>
<td style="text-align:left">Manual según el <em>driver</em></td>
<td style="text-align:left"><code>DbCommand</code> manual</td>
</tr>
<tr>
<td style="text-align:left"><strong>Vistas</strong></td>
<td style="text-align:left"><code>DB::table('v_ventas')</code></td>
<td style="text-align:left"><code>@ViewEntity()</code></td>
<td style="text-align:left">Entidad con <code>ToView(&quot;v_ventas&quot;)</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> En el <strong>Laboratorio 3</strong> se pide implementar <strong>tres consultas</strong>: una con el constructor de consultas y alcances, una con <strong>agregación y agrupación</strong>, y una que <strong>consuma un procedimiento almacenado o una vista</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="operaciones-crud-con-eloquent">Operaciones CRUD con Eloquent</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%E2%9E%95-create"><img class="emoji" draggable="false" alt="➕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2795.svg" data-marp-twemoji=""/> Create</h3>
<pre><code class="language-php"><span class="hljs-variable">$pedido</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">create</span>(<span class="hljs-variable">$datosValidados</span>);
</code></pre>
<h3 id="%F0%9F%94%8D-read"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Read</h3>
<pre><code class="language-php"><span class="hljs-variable">$pedido</span>  = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">findOrFail</span>(<span class="hljs-variable">$id</span>);   <span class="hljs-comment">// 404 si no existe</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">with</span>(<span class="hljs-string">&#x27;cliente&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-number">15</span>);
<span class="hljs-variable">$uno</span>     = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;codigo&#x27;</span>, <span class="hljs-variable">$c</span>)-&gt;<span class="hljs-title function_ invoke__">first</span>();
</code></pre>
</div>
<div>
<h3 id="%E2%9C%8F%EF%B8%8F-update"><img class="emoji" draggable="false" alt="✏️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/270f.svg" data-marp-twemoji=""/> Update</h3>
<pre><code class="language-php"><span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">update</span>(<span class="hljs-variable">$datosValidados</span>);   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
<span class="hljs-comment">// $pedido-&gt;update($request-&gt;all()); // <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> vulnerable</span>
</code></pre>
<h3 id="%F0%9F%97%91%EF%B8%8F-delete"><img class="emoji" draggable="false" alt="🗑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5d1.svg" data-marp-twemoji=""/> Delete</h3>
<pre><code class="language-php"><span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">delete</span>();          <span class="hljs-comment">// borrado</span>
<span class="hljs-variable">$pedido</span>-&gt;<span class="hljs-title function_ invoke__">forceDelete</span>();     <span class="hljs-comment">// definitivo</span>
<span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">withTrashed</span>()-&gt;<span class="hljs-title function_ invoke__">find</span>(<span class="hljs-variable">$id</span>);  <span class="hljs-comment">// SoftDeletes</span>
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>update($request-&gt;all())</code> es <strong>asignación masiva sin control</strong>: acepta cualquier campo que venga en la petición. Siempre <code>validated()</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="crud-comparado">CRUD comparado</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Operación</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> Eloquent</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> TypeORM</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> EF Core</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Crear</strong></td>
<td style="text-align:left"><code>Pedido::create($d)</code></td>
<td style="text-align:left"><code>repo.save(repo.create(d))</code></td>
<td style="text-align:left"><code>ctx.Add(p); ctx.SaveChanges()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Leer uno</strong></td>
<td style="text-align:left"><code>Pedido::findOrFail($id)</code></td>
<td style="text-align:left"><code>repo.findOneByOrFail({id})</code></td>
<td style="text-align:left"><code>ctx.Pedidos.FindAsync(id)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Leer lista</strong></td>
<td style="text-align:left"><code>Pedido::with('cliente')-&gt;get()</code></td>
<td style="text-align:left"><code>repo.find({relations:['cliente']})</code></td>
<td style="text-align:left"><code>ctx.Pedidos.Include(p=&gt;p.Cliente)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Actualizar</strong></td>
<td style="text-align:left"><code>$pedido-&gt;update($d)</code></td>
<td style="text-align:left"><code>repo.update(id, d)</code></td>
<td style="text-align:left"><code>ctx.Update(p); ctx.SaveChanges()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Eliminar</strong></td>
<td style="text-align:left"><code>$pedido-&gt;delete()</code></td>
<td style="text-align:left"><code>repo.remove(pedido)</code></td>
<td style="text-align:left"><code>ctx.Remove(p); ctx.SaveChanges()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Borrado lógico</strong></td>
<td style="text-align:left"><code>SoftDeletes</code> (rasgo)</td>
<td style="text-align:left"><code>@DeleteDateColumn()</code></td>
<td style="text-align:left">Filtro global manual</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Note quién <strong>confirma</strong> la escritura: Eloquent y TypeORM guardan al llamar; EF Core acumula cambios y los persiste en <code>SaveChanges()</code> (<em>unit of work</em>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="paginaci%C3%B3n">Paginación</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Paginación completa: sabe cuántas páginas hay</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-number">15</span>);
<span class="hljs-comment">// → 2 consultas: COUNT(*) + SELECT ... LIMIT/OFFSET</span>

<span class="hljs-comment">// Paginación simple: solo anterior / siguiente</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">simplePaginate</span>(<span class="hljs-number">15</span>);
<span class="hljs-comment">// → 1 consulta, sin COUNT(*)</span>

<span class="hljs-comment">// Paginación por cursor: para grandes volúmenes</span>
<span class="hljs-variable">$pedidos</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">orderBy</span>(<span class="hljs-string">&#x27;id&#x27;</span>)-&gt;<span class="hljs-title function_ invoke__">cursorPaginate</span>(<span class="hljs-number">15</span>);
<span class="hljs-comment">// → sin OFFSET, ideal para scroll infinito</span>
</code></pre>
</div>
<div>
<table>
<thead>
<tr>
<th style="text-align:left">Método</th>
<th style="text-align:center">Consultas</th>
<th style="text-align:center">Total</th>
<th style="text-align:left">Uso típico</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>paginate</code></td>
<td style="text-align:center">2</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:left">Tablas con numeración</td>
</tr>
<tr>
<td style="text-align:left"><code>simplePaginate</code></td>
<td style="text-align:center">1</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:left">Listas largas</td>
</tr>
<tr>
<td style="text-align:left"><code>cursorPaginate</code></td>
<td style="text-align:center">1</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td style="text-align:left"><em>Scroll</em> infinito</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> <code>OFFSET 100000</code> obliga al motor a <strong>descartar 100 000 filas</strong>. El cursor no: filtra por el valor de la última fila vista</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="limitaci%C3%B3n-de-resultados-el-tope-de-p%C3%A1gina">Limitación de resultados: el tope de página</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> El cliente decide cuántos registros trae</span>
<span class="hljs-variable">$porPagina</span> = <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;per_page&#x27;</span>, <span class="hljs-number">15</span>);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> El servidor impone un techo</span>
<span class="hljs-variable">$porPagina</span> = <span class="hljs-title function_ invoke__">min</span>((<span class="hljs-keyword">int</span>) <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;per_page&#x27;</span>, <span class="hljs-number">15</span>), <span class="hljs-number">100</span>);

<span class="hljs-comment">// Listado con filtros condicionales, orden y tope</span>
<span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">query</span>()
    -&gt;<span class="hljs-title function_ invoke__">when</span>(<span class="hljs-variable">$request</span>-&gt;q, fn (<span class="hljs-variable">$q</span>, <span class="hljs-variable">$t</span>) =&gt;
        <span class="hljs-variable">$q</span>-&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;codigo&#x27;</span>, <span class="hljs-string">&#x27;like&#x27;</span>, <span class="hljs-string">&quot;%<span class="hljs-subst">{$t}</span>%&quot;</span>))
    -&gt;<span class="hljs-title function_ invoke__">when</span>(<span class="hljs-variable">$request</span>-&gt;estado, fn (<span class="hljs-variable">$q</span>, <span class="hljs-variable">$e</span>) =&gt;
        <span class="hljs-variable">$q</span>-&gt;<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;estado&#x27;</span>, <span class="hljs-variable">$e</span>))
    -&gt;<span class="hljs-title function_ invoke__">orderBy</span>(<span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;sort&#x27;</span>, <span class="hljs-string">&#x27;created_at&#x27;</span>),
              <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;dir&#x27;</span>, <span class="hljs-string">&#x27;desc&#x27;</span>))
    -&gt;<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-variable">$porPagina</span>);
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-por-qu%C3%A9-es-un-control-de-seguridad"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Por qué es un control de seguridad</h3>
<ul>
<li>Sin tope, una sola petición con <code>?per_page=999999</code> puede <strong>agotar la memoria</strong> del servidor</li>
<li>Es un vector de <strong>denegación de servicio</strong> trivial de explotar</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Los filtros se construyen <strong>condicionalmente</strong> sobre el constructor de consultas y con <strong>parámetros vinculados</strong>. Nunca concatenando texto</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">

<th style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> NestJS</th>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="93">
<h2 id="%F0%9F%93%8B-laboratorio-3--capa-de-datos"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Laboratorio 3 — Capa de datos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.92rem;">
<div>
<h3 id="qu%C3%A9-se-entrega">Qué se entrega</h3>
<ul>
<li>Modelo entidad-relación con <strong>6+ entidades</strong>: 1:N, N:M y pivote con datos adicionales</li>
<li>Migraciones con tipos, índices, claves foráneas y política de borrado — <strong>reversibles</strong></li>
<li>Modelos con relaciones, <code>$fillable</code>, <code>casts()</code> y <code>$hidden</code></li>
<li>Fábricas y pobladores: <strong>20+ registros</strong></li>
<li>Tres consultas: alcances, agregación.</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AF-hito-0--contrato-comparativo"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Hito 0 — Contrato comparativo</h3>
<p>Antes de cerrar la semana se <strong>congela</strong> <code>docs/contrato-comparativo.md</code>:</p>
<ul>
<li>Una entidad con <strong>máximo 8 campos</strong> y <strong>una relación</strong></li>
<li>Los <strong>seis endpoints</strong> del contrato común</li>
<li>Los <strong>datos de prueba</strong> idénticos para las tres implementaciones</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> No puede modificarse después del Hito 1: es lo que hace <strong>comparables</strong> las tres implementaciones</p>
</blockquote>
</div>
