<p><strong>React 19</strong>, <strong>Vue 3</strong> y <strong>Angular 22</strong> de forma comparativa <br />Curso <em>Desarrollo de Software IV</em> · II Ciclo 2026</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%C2%BFqu%C3%A9-construimos-en-este-tema">¿Qué construimos en este tema?</h2>
<ul>
<li>El <strong>front-end</strong> es la aplicación que corre en el navegador: dibuja la interfaz, reacciona a lo que hace la persona usuaria y conversa con la API del back-end</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A9-componentes"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Componentes</h3>
<p>Cómo partir una interfaz en piezas reutilizables con vista, lógica y estilo</p>
</div>
<div>
<h3 id="%F0%9F%A7%AD-navegaci%C3%B3n"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Navegación</h3>
<p>Cómo pasar de &quot;una página&quot; a una <strong>SPA</strong> con rutas, parámetros y guardas</p>
</div>
<div>
<h3 id="%F0%9F%94%8C-datos"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Datos</h3>
<p>Cómo consumir la <strong>API REST</strong> del tema de back-end y mantener el estado coherente</p>
</div>
<div>
<h3 id="%E2%9C%85-calidad"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Calidad</h3>
<p>Cómo probar componentes, servicios y flujos completos</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Al final del tema cada equipo tendrá un <strong>cliente web</strong> que consume su API: listado, detalle, formulario y pruebas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="los-tres-protagonistas">Los tres protagonistas</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-react--la-librer%C3%ADa"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — la librería</h3>
<ul>
<li>Creada por <strong>Meta</strong> (2013)</li>
<li><strong>JSX</strong> + funciones + <em>hooks</em></li>
<li>Solo resuelve la <strong>vista</strong>: el resto lo elige usted (router, estado, HTTP)</li>
</ul>
<h3 id="%F0%9F%92%9A-vue--el-progresivo"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — el progresivo</h3>
<ul>
<li>Creado por <strong>Evan You</strong> (2014), comunidad independiente</li>
<li>Plantillas HTML + <strong>Composition API</strong></li>
<li>Núcleo pequeño + piezas <strong>oficiales</strong> (Vue Router, Pinia)</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--el-framework-completo"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — el framework completo</h3>
<ul>
<li>Mantenido por <strong>Google</strong> (2016, reescritura de AngularJS)</li>
<li><strong>TypeScript</strong> obligatorio, decoradores, inyección de dependencias</li>
<li>Trae <strong>todo</strong>: router, HTTP, formularios, pruebas, CLI</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Los tres resuelven el mismo problema: <strong>mantener la interfaz sincronizada con el estado</strong>. Cambia el <em>cómo</em> y cuánto deciden por usted</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-scope-MoLiwDhG="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="4" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="frameworks-vs-librer%C3%ADas">Frameworks vs librerías</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Inversión de control</li>
<li>El espectro librería ↔ framework</li>
<li>Metaframeworks</li>
<li>Cómo elegir</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="librer%C3%ADa-vs-framework-%C2%BFqui%C3%A9n-llama-a-qui%C3%A9n">Librería vs framework: ¿quién llama a quién?</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%F0%9F%93%9A-librer%C3%ADa"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> Librería</h3>
<ul>
<li><strong>Usted</strong> llama al código de la librería cuando lo necesita</li>
<li>Usted decide la arquitectura, la estructura de carpetas y el resto de piezas</li>
<li>Ej.: <code>lodash</code>, <code>axios</code>, <strong>React</strong></li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { format } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;date-fns&#x27;</span>;

<span class="hljs-comment">// Yo decido cuándo y dónde</span>
<span class="hljs-keyword">const</span> texto = <span class="hljs-title function_">format</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Date</span>(), <span class="hljs-string">&#x27;dd/MM/yyyy&#x27;</span>);
</code></pre>
</div>
<div>
<h3 id="%F0%9F%8F%97%EF%B8%8F-framework"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Framework</h3>
<ul>
<li>El <strong>framework</strong> llama a su código: usted rellena huecos que él define</li>
<li>Impone estructura, convenciones y ciclo de vida</li>
<li>Ej.: <strong>Angular</strong>, Laravel, NestJS</li>
</ul>
<pre><code class="language-ts"><span class="hljs-meta">@Component</span>({ <span class="hljs-attr">selector</span>: <span class="hljs-string">&#x27;app-hola&#x27;</span>, <span class="hljs-attr">template</span>: <span class="hljs-string">&#x27;...&#x27;</span> })
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Hola</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">OnInit</span> {
  <span class="hljs-comment">// Angular decide cuándo ejecutarlo</span>
  <span class="hljs-title function_">ngOnInit</span>(<span class="hljs-params"></span>) { <span class="hljs-comment">/* ... */</span> }
}
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🎬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ac.svg" data-marp-twemoji=""/> <em>Principio de Hollywood</em>: &quot;no nos llame, nosotros le llamamos&quot; — eso es la <strong>inversión de control</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="el-espectro-no-es-blanco-o-negro">El espectro: no es blanco o negro</h2>
<pre><code class="language-text"> Librería ◄───────────────────────────────────────────────────► Framework completo
   │                         │                                            │
 React                      Vue                                        Angular
 &quot;solo la vista&quot;            &quot;progresivo&quot;                               &quot;baterías incluidas&quot;
 Usted elige router,        Núcleo + piezas oficiales                  Todo viene en la caja
 estado, HTTP, forms        que se adoptan por partes                  y con una forma de hacerlo
</code></pre>
<div class="grid">
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-libertad"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> Libertad</h3>
<p>Máxima flexibilidad… y máxima cantidad de decisiones. Dos proyectos React pueden no parecerse en nada</p>
</div>
<div>
<h3 id="%F0%9F%92%9A-adopci%C3%B3n-gradual"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Adopción gradual</h3>
<p>Se puede usar en <strong>un</strong> <code>&lt;div&gt;</code> de una página existente o como SPA completa</p>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-consistencia"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Consistencia</h3>
<p>Dos proyectos Angular se parecen mucho entre sí: ideal para equipos grandes y proyectos largos</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="comparaci%C3%B3n-general">Comparación general</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="metaframeworks-el-siguiente-escal%C3%B3n">Metaframeworks: el siguiente escalón</h2>
<ul>
<li>Un <strong>metaframework</strong> se monta sobre uno de estos y agrega <strong>renderizado en servidor (SSR)</strong>, generación estática, enrutamiento por archivos y <em>endpoints</em> de API</li>
</ul>
<div class="grid">
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-react"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</h3>
<p><strong>Next.js</strong>, <strong>React Router</strong> en &quot;modo framework&quot; (antes Remix)</p>
</div>
<div>
<h3 id="%F0%9F%92%9A-vue"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</h3>
<p><strong>Nuxt</strong></p>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</h3>
<p><strong>Angular SSR</strong> (integrado en el CLI), <strong>Analog</strong></p>
</div>
<div>
<h3 id="%F0%9F%9A%80-agn%C3%B3stico"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Agnóstico</h3>
<p><strong>Astro</strong> — islas con cualquiera de los tres (ver tema <em>Astro</em>)</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Recuerden la imagen del tema <em>WebComponents</em>: tecnología base → librerías → frameworks → metaframeworks</li>
<li>En este curso trabajamos en modo <strong>SPA</strong> (CSR) porque la lógica y los datos viven en <strong>nuestra API</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%C2%BFc%C3%B3mo-elegir">¿Cómo elegir?</h2>
<div class="grid">
<div>
<h3 id="elija-%E2%9A%9B%EF%B8%8F-react-si">Elija <img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React si…</h3>
<ul>
<li>El equipo ya domina JavaScript y quiere libertad</li>
<li>Necesita el ecosistema más grande (y React Native)</li>
<li>El mercado laboral local lo pide</li>
</ul>
</div>
<div>
<h3 id="elija-%F0%9F%92%9A-vue-si">Elija <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue si…</h3>
<ul>
<li>Quiere la curva de aprendizaje más suave</li>
<li>Va a &quot;enriquecer&quot; un sitio existente poco a poco</li>
<li>Prefiere plantillas HTML y piezas oficiales</li>
</ul>
</div>
<div>
<h3 id="elija-%F0%9F%85%B0%EF%B8%8F-angular-si">Elija <img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular si…</h3>
<ul>
<li>El equipo es grande o rota con frecuencia</li>
<li>Necesita convenciones fuertes y todo integrado</li>
<li>Viene de Java / C# (DI, decoradores, tipos)</li>
</ul>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>Mala razón</strong> para elegir: &quot;es el más rápido&quot;. En aplicaciones reales la diferencia la hace el <strong>código del equipo</strong>, no el framework</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-scope-vQ6n3lvk="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="10" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="historia-de-los-frameworks-front-end">Historia de los frameworks front-end</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>Del DOM a mano a los componentes</li>
<li>Las cuatro eras</li>
<li>Versiones actuales</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="l%C3%ADnea-de-tiempo">Línea de tiempo</h2>
<steps>
<step>
<pre><code class="language-text">2006  jQuery ................ manipular el DOM sin pelear con cada navegador
2010  Backbone, Knockout .... primeros MVC/MVVM en el cliente
2010  AngularJS (Google) .... data binding bidireccional + inyección de dependencias
2011  Ember ................. convenciones fuertes, router
2013  React (Facebook) ...... componentes + Virtual DOM + &quot;la UI es una función del estado&quot;
2014  Vue (Evan You) ........ lo mejor de AngularJS, más simple
2016  Angular 2 ............. reescritura total en TypeScript (rompe con AngularJS)
2016  Svelte ................ el framework como compilador
</code></pre>
</step>
<step>
<pre><code class="language-text">2019  React Hooks (16.8) .... adiós a las clases
2020  Vue 3 ................. Composition API + reactividad con Proxies
2021  AngularJS fin de vida . soporte terminado en diciembre
2022  Angular 14 ............ componentes standalone (sin NgModule)
2023  Angular 16-17 ......... signals + nuevo control de flujo (@if, @for)
2024  React 19 .............. Actions, use(), Server Components estables
2025  React Compiler 1.0 .... memorización automática
2025  Angular 21 ............ zoneless por defecto, Vitest, Signal Forms experimental
2026  Angular 22 ............ Signal Forms estable, OnPush por defecto
2026  React 19.3 · Vue 3.6 RC (Vapor Mode: sin Virtual DOM)
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="las-cuatro-eras">Las cuatro eras</h2>
<div class="grid">
<div>
<h3 id="1%EF%B8%8F%E2%83%A3-dom-imperativo-2006%E2%80%932010"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> DOM imperativo (2006–2010)</h3>
<p><code>$('#total').text(x)</code>: cada cambio de datos se refleja <strong>a mano</strong> en el DOM. Funciona… hasta que la app crece</p>
</div>
<div>
<h3 id="2%EF%B8%8F%E2%83%A3-mvc-en-el-cliente-2010%E2%80%932013"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> MVC en el cliente (2010–2013)</h3>
<p>Modelos, vistas y <em>data binding</em>. AngularJS sincroniza solo, pero con <strong>dirty checking</strong> costoso</p>
</div>
<div>
<h3 id="3%EF%B8%8F%E2%83%A3-componentes--virtual-dom-2013%E2%80%932020"><img class="emoji" draggable="false" alt="3️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/33-20e3.svg" data-marp-twemoji=""/> Componentes + Virtual DOM (2013–2020)</h3>
<p>React: la UI es <code>f(estado)</code>. Se re-renderiza y se compara un árbol virtual (<em>diffing</em>)</p>
</div>
<div>
<h3 id="4%EF%B8%8F%E2%83%A3-compiladores-y-signals-2020%E2%80%93hoy"><img class="emoji" draggable="false" alt="4️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/34-20e3.svg" data-marp-twemoji=""/> Compiladores y signals (2020–hoy)</h3>
<p>Reactividad <strong>fina</strong>: solo se actualiza el nodo que depende del dato. Angular signals, Vue Vapor, Svelte, Solid</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La tendencia es clara: <strong>menos JavaScript en el navegador</strong> y <strong>actualizaciones más precisas</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="versiones-actuales-octubre-2026">Versiones actuales (octubre 2026)</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Framework</th>
<th style="text-align:left">Versión estable</th>
<th style="text-align:left">Publicación</th>
<th style="text-align:left">Requisitos / notas</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</td>
<td style="text-align:left"><strong>19.3</strong></td>
<td style="text-align:left">set 2026</td>
<td style="text-align:left"><code>&lt;ViewTransition&gt;</code>, <em>refs</em> en <code>Fragment</code>; React 20 aún no anunciado</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</td>
<td style="text-align:left"><strong>3.5</strong></td>
<td style="text-align:left">2024 (parches 2026)</td>
<td style="text-align:left"><strong>3.6</strong> en RC con Vapor Mode y nueva reactividad (<em>alien-signals</em>)</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue Router</td>
<td style="text-align:left"><strong>5</strong></td>
<td style="text-align:left">2026</td>
<td style="text-align:left">Rutas por archivos integradas en el núcleo</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</td>
<td style="text-align:left"><strong>22</strong></td>
<td style="text-align:left">jun 2026</td>
<td style="text-align:left"><strong>Node 22+</strong>, <strong>TypeScript 6</strong>; versión mayor cada 6 meses</td>
</tr>
</tbody>
</table>
<ul>
<li>Angular publica <strong>dos versiones mayores al año</strong> (~mayo y ~noviembre) con 18 meses de soporte</li>
<li>React y Vue no tienen calendario fijo: versiones mayores cada varios años, menores frecuentes</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Lo que encuentren en tutoriales de 2022 probablemente use <code>NgModule</code>, <code>*ngIf</code>, <code>class components</code> u Options API: <strong>funciona, pero ya no es la forma recomendada</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-SawrwZ5g="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="14" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="modularizaci%C3%B3n-del-proyecto">Modularización del proyecto</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>¿Qué es un componente?</li>
<li>Árbol de componentes y flujo de datos</li>
<li>Módulos y estructura de carpetas</li>
<li>Crear el proyecto</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%C2%BFqu%C3%A9-es-un-componente">¿Qué es un componente?</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text">┌───────────────── App ─────────────────┐
│ ┌────────────── Encabezado ─────────┐ │
│ │  Logo   Menu        Carrito (3)   │ │
│ └───────────────────────────────────┘ │
│ ┌──── Filtros ──┐ ┌── ListaProductos ┐│
│ │               │ │ ┌TarjetaProducto┐││
│ │               │ │ └───────────────┘││
│ │               │ │ ┌TarjetaProducto┐││
│ │               │ │ └───────────────┘││
│ └───────────────┘ └──────────────────┘│
└───────────────────────────────────────┘
</code></pre>
</div>
<div>
<ul>
<li>Una <strong>pieza reutilizable</strong> de interfaz que encapsula:
<ul>
<li><strong>Vista</strong> — qué se dibuja</li>
<li><strong>Lógica</strong> — estado y comportamiento</li>
<li><strong>Estilo</strong> — cómo se ve</li>
</ul>
</li>
<li>Recibe datos de <strong>entrada</strong> (<em>props</em> / <em>inputs</em>)</li>
<li>Emite <strong>eventos</strong> de salida hacia su padre</li>
<li>Se compone con otros: la aplicación es un <strong>árbol</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Es la misma idea de los <em>custom elements</em> del tema <em>WebComponents</em>, con más ayuda del framework</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="flujo-de-datos-props-hacia-abajo-eventos-hacia-arriba">Flujo de datos: props hacia abajo, eventos hacia arriba</h2>
<pre><code class="language-text">                  App  (estado: carrito)
                 ╱                        ╲
   props: cantidad                          props: productos
             ▼                                     ▼
        Encabezado                          ListaProductos
                                                   │ props: producto
                                                   ▼
                                           TarjetaProducto
                                                   │
                                  evento: agregar(producto)  ▲ sube hasta App
</code></pre>
<ul>
<li>El <strong>dueño</strong> del dato es quien lo modifica; los hijos solo lo <strong>leen</strong> y <strong>avisan</strong></li>
<li>Este <em>flujo unidireccional</em> es lo que hace predecible la aplicación</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Si un hijo modifica directamente un <em>prop</em>, el framework le avisará (o fallará en silencio)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="entradas-y-salidas-comparadas">Entradas y salidas comparadas</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react--props-y-callbacks"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — props y <em>callbacks</em></h3>
<pre><code class="language-jsx"><span class="hljs-comment">// TarjetaProducto.jsx</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">TarjetaProducto</span>(<span class="hljs-params">{ producto, onAgregar }</span>) {
  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">h3</span>&gt;</span>{producto.nombre}<span class="hljs-tag">&lt;/<span class="hljs-name">h3</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">onClick</span>=<span class="hljs-string">{()</span> =&gt;</span> onAgregar(producto)}&gt;Agregar<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span></span>
  );
}

<span class="hljs-comment">// Uso en el padre</span>
&lt;<span class="hljs-title class_">TarjetaProducto</span> producto={p} onAgregar={agregarAlCarrito} /&gt;
</code></pre>
<ul>
<li>No hay &quot;eventos&quot;: se pasa una <strong>función</strong> como <em>prop</em></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue--defineprops-y-defineemits"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — <code>defineProps</code> y <code>defineEmits</code></h3>
<pre><code class="language-ts">&lt;!-- <span class="hljs-title class_">TarjetaProducto</span>.<span class="hljs-property">vue</span> --&gt;
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span>&gt;</span><span class="language-javascript">
<span class="hljs-keyword">const</span> props = <span class="hljs-title function_">defineProps</span>({ <span class="hljs-attr">producto</span>: { <span class="hljs-attr">type</span>: <span class="hljs-title class_">Object</span>, <span class="hljs-attr">required</span>: <span class="hljs-literal">true</span> } });
<span class="hljs-keyword">const</span> emit = <span class="hljs-title function_">defineEmits</span>([<span class="hljs-string">&#x27;agregar&#x27;</span>]);
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">article</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">h3</span>&gt;</span>{{ producto.nombre }}<span class="hljs-tag">&lt;/<span class="hljs-name">h3</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">button</span> @<span class="hljs-attr">click</span>=<span class="hljs-string">&quot;emit(&#x27;agregar&#x27;, producto)&quot;</span>&gt;</span>Agregar<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">article</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span></span>

&lt;!-- <span class="hljs-title class_">Uso</span> en el padre --&gt;
<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">TarjetaProducto</span> <span class="hljs-attr">:producto</span>=<span class="hljs-string">&quot;p&quot;</span> @<span class="hljs-attr">agregar</span>=<span class="hljs-string">&quot;agregarAlCarrito&quot;</span> /&gt;</span></span>
</code></pre>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--input-y-output"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — <code>input()</code> y <code>output()</code></h3>
<pre><code class="language-ts"><span class="hljs-comment">// tarjeta-producto.ts</span>
<span class="hljs-meta">@Component</span>({
  <span class="hljs-attr">selector</span>: <span class="hljs-string">&#x27;app-tarjeta-producto&#x27;</span>,
  <span class="hljs-attr">template</span>: <span class="hljs-string">`
    &lt;article&gt;
      &lt;h3&gt;{{ producto().nombre }}&lt;/h3&gt;
      &lt;button (click)=&quot;agregar.emit(producto())&quot;&gt;Agregar&lt;/button&gt;
    &lt;/article&gt;`</span>,
})
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TarjetaProducto</span> {
  producto = input.<span class="hljs-property">required</span>&lt;<span class="hljs-title class_">Producto</span>&gt;();
  agregar = output&lt;<span class="hljs-title class_">Producto</span>&gt;();
}
</code></pre>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Uso en el padre --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">app-tarjeta-producto</span> [<span class="hljs-attr">producto</span>]=<span class="hljs-string">&quot;p&quot;</span> (<span class="hljs-attr">agregar</span>)=<span class="hljs-string">&quot;agregarAlCarrito($event)&quot;</span> /&gt;</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="contenido-proyectado-componentes-envoltorio">Contenido proyectado: componentes &quot;envoltorio&quot;</h2>
<ul>
<li>A veces el padre quiere pasar <strong>marcado</strong>, no datos: una tarjeta, un modal, un <em>layout</em></li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Mecanismo</td>
<td style="text-align:left"><code>children</code></td>
<td style="text-align:left"><strong>slots</strong></td>
<td style="text-align:left"><strong>content projection</strong></td>
</tr>
<tr>
<td style="text-align:left">Componente</td>
<td style="text-align:left"><code>&lt;div className=&quot;card&quot;&gt;{children}&lt;/div&gt;</code></td>
<td style="text-align:left"><code>&lt;div class=&quot;card&quot;&gt;&lt;slot /&gt;&lt;/div&gt;</code></td>
<td style="text-align:left"><code>&lt;div class=&quot;card&quot;&gt;&lt;ng-content /&gt;&lt;/div&gt;</code></td>
</tr>
<tr>
<td style="text-align:left">Con nombre</td>
<td style="text-align:left"><em>props</em> con JSX: <code>header={&lt;h2/&gt;}</code></td>
<td style="text-align:left"><code>&lt;slot name=&quot;header&quot; /&gt;</code></td>
<td style="text-align:left"><code>&lt;ng-content select=&quot;[header]&quot; /&gt;</code></td>
</tr>
<tr>
<td style="text-align:left">Uso</td>
<td style="text-align:left"><code>&lt;Card&gt;&lt;p&gt;Hola&lt;/p&gt;&lt;/Card&gt;</code></td>
<td style="text-align:left"><code>&lt;Card&gt;&lt;p&gt;Hola&lt;/p&gt;&lt;/Card&gt;</code></td>
<td style="text-align:left"><code>&lt;app-card&gt;&lt;p&gt;Hola&lt;/p&gt;&lt;/app-card&gt;</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Idéntico al <code>&lt;slot&gt;</code> de <em>Shadow DOM</em> visto en <em>WebComponents</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="m%C3%B3dulos-de-ngmodule-a-standalone">Módulos: de NgModule a standalone</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<ul>
<li>Los tres usan <strong>módulos ES</strong> (<code>import</code> / <code>export</code>) para organizar el código (ver tema <em>Módulos ESM</em>)</li>
<li><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> y <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/>: <strong>un archivo = un componente</strong>, se importa y se usa</li>
<li><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular tenía además <strong>NgModule</strong>: una capa extra para declarar qué componentes existen</li>
</ul>
<pre><code class="language-ts"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Antes (Angular ≤ 16): NgModule</span>
<span class="hljs-meta">@NgModule</span>({
  <span class="hljs-attr">declarations</span>: [<span class="hljs-title class_">TarjetaProducto</span>],
  <span class="hljs-attr">imports</span>: [<span class="hljs-title class_">CommonModule</span>],
  <span class="hljs-attr">exports</span>: [<span class="hljs-title class_">TarjetaProducto</span>],
})
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProductosModule</span> {}
</code></pre>
</div>
<div>
<pre><code class="language-ts"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Hoy: componentes standalone (por defecto desde v19)</span>
<span class="hljs-meta">@Component</span>({
  <span class="hljs-attr">selector</span>: <span class="hljs-string">&#x27;app-lista-productos&#x27;</span>,
  <span class="hljs-attr">imports</span>: [<span class="hljs-title class_">TarjetaProducto</span>, <span class="hljs-title class_">CurrencyPipe</span>],
  <span class="hljs-attr">templateUrl</span>: <span class="hljs-string">&#x27;./lista-productos.html&#x27;</span>,
})
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ListaProductos</span> {}
</code></pre>
<ul>
<li>Cada componente declara <strong>sus propias dependencias</strong> en <code>imports</code></li>
<li>La &quot;modularización&quot; ahora se hace por <strong>carpetas de funcionalidad</strong> y <strong>carga diferida</strong> de rutas</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En código legado aún verá <code>NgModule</code>; existe la migración <code>ng generate @angular/core:standalone</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="estructura-de-carpetas-por-funcionalidad">Estructura de carpetas por funcionalidad</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text">src/
├── app/               (o src/ directo en React/Vue)
│   ├── core/          ← una sola vez en toda la app
│   │   ├── auth/          interceptor, guard, sesión
│   │   └── layout/        encabezado, menú
│   ├── shared/        ← reutilizable y &quot;tonto&quot;
│   │   ├── ui/            botón, modal, tarjeta
│   │   └── pipes/         formatos
│   └── features/      ← una carpeta por caso de uso
│       ├── productos/
│       │   ├── lista-productos/
│       │   ├── detalle-producto/
│       │   ├── productos.service.ts
│       │   └── productos.routes.ts
│       └── pedidos/
└── environments/
</code></pre>
</div>
<div>
<ul>
<li>Agrupe por <strong>funcionalidad</strong>, no por tipo de archivo (<code>components/</code>, <code>services/</code>, <code>utils/</code>… no escala)</li>
<li>Cada <em>feature</em> se puede cargar de forma <strong>diferida</strong> cuando se visita su ruta</li>
<li><strong>Componentes presentacionales</strong> (<code>shared/ui</code>): reciben <em>props</em>, emiten eventos, no saben de la API</li>
<li><strong>Componentes contenedores</strong> (<code>features/*</code>): obtienen datos y coordinan</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Si el proyecto final tiene entidades <code>Producto</code>, <code>Pedido</code>, <code>Cliente</code>… esas son sus carpetas de <code>features</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="crear-el-proyecto">Crear el proyecto</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># ⚛ React con Vite (plantilla TypeScript)</span>
npm create vite@latest tienda-react -- --template react-ts
<span class="hljs-built_in">cd</span> tienda-react &amp;&amp; npm install
npm run dev            <span class="hljs-comment"># http://localhost:5173</span>

<span class="hljs-comment"># <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue con create-vue (pregunta por Router, Pinia, Vitest…)</span>
npm create vue@latest tienda-vue
<span class="hljs-built_in">cd</span> tienda-vue &amp;&amp; npm install
npm run dev            <span class="hljs-comment"># http://localhost:5173</span>
</code></pre>
</div>
<div>
<pre><code class="language-bash"><span class="hljs-comment"># 🅰 Angular CLI (requiere Node 22+)</span>
npm install -g @angular/cli
ng new tienda-angular --style=css --ssr=<span class="hljs-literal">false</span>
<span class="hljs-built_in">cd</span> tienda-angular
ng serve               <span class="hljs-comment"># http://localhost:4200</span>

<span class="hljs-comment"># Generadores</span>
ng generate component features/productos/lista-productos
ng generate service  features/productos/productos
ng generate pipe     shared/pipes/colones
</code></pre>
</div>
</split-slide>
<ul>
<li>Puertos del curso: front-end <strong>5173</strong> (Vite) / <strong>4200</strong> (Angular) · API Laravel <strong>8000</strong> — los mismos del tema de back-end</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-PHxWYqLX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="22" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="estructura-de-un-componente">Estructura de un componente</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Vista, lógica y estilo</li>
<li>El mismo componente en los tres</li>
<li>Plantillas: condicionales y listas</li>
<li>Ciclo de vida</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="vista-l%C3%B3gica-y-estilo-%C2%BFd%C3%B3nde-vive-cada-cosa">Vista, lógica y estilo: ¿dónde vive cada cosa?</h2>
<div class="grid">
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-react--todo-es-javascript"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — todo es JavaScript</h3>
<ul>
<li><strong>Vista</strong>: JSX devuelto por la función</li>
<li><strong>Lógica</strong>: <em>hooks</em> (<code>useState</code>, <code>useEffect</code>…)</li>
<li><strong>Estilo</strong>: CSS Modules, Tailwind, CSS-in-JS</li>
<li>Un archivo <code>.jsx</code> / <code>.tsx</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%92%9A-vue--single-file-component"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — Single File Component</h3>
<ul>
<li><strong>Vista</strong>: <code>&lt;template&gt;</code></li>
<li><strong>Lógica</strong>: <code>&lt;script setup&gt;</code></li>
<li><strong>Estilo</strong>: <code>&lt;style scoped&gt;</code></li>
<li>Un archivo <code>.vue</code> con tres bloques</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--archivos-separados"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — archivos separados</h3>
<ul>
<li><strong>Vista</strong>: <code>contador.html</code></li>
<li><strong>Lógica</strong>: clase en <code>contador.ts</code></li>
<li><strong>Estilo</strong>: <code>contador.css</code> (encapsulado)</li>
<li>Tres archivos unidos por <code>@Component</code></li>
</ul>
</div>
</div>
<ul>
<li>La <strong>separación de responsabilidades</strong> existe en los tres: React separa por <strong>componente</strong>, Angular por <strong>tipo de archivo</strong>, Vue en <strong>bloques</strong> dentro del mismo archivo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="el-mismo-contador-en-los-tres">El mismo contador en los tres</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react-1"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { useState } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;react&#x27;</span>;
<span class="hljs-keyword">import</span> styles <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./Contador.module.css&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">Contador</span>(<span class="hljs-params">{ inicial = <span class="hljs-number">0</span> }</span>) {
  <span class="hljs-keyword">const</span> [cuenta, setCuenta] = <span class="hljs-title function_">useState</span>(inicial);           <span class="hljs-comment">// estado</span>
  <span class="hljs-keyword">const</span> doble = cuenta * <span class="hljs-number">2</span>;                                <span class="hljs-comment">// derivado: se recalcula en cada render</span>

  <span class="hljs-keyword">return</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">className</span>=<span class="hljs-string">{styles.caja}</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{cuenta} (doble: {doble})<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">button</span> <span class="hljs-attr">onClick</span>=<span class="hljs-string">{()</span> =&gt;</span> setCuenta(c =&gt; c + 1)}&gt;+1<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span></span>
  );
}
</code></pre>
<ul>
<li>Cada <code>setCuenta</code> <strong>vuelve a ejecutar</strong> la función completa y React compara el resultado</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue-1"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</h3>
<pre><code class="language-ts">&lt;script setup&gt;
<span class="hljs-keyword">import</span> { ref, computed } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;
<span class="hljs-keyword">const</span> props = <span class="hljs-title function_">defineProps</span>({ <span class="hljs-attr">inicial</span>: { <span class="hljs-attr">type</span>: <span class="hljs-title class_">Number</span>, <span class="hljs-attr">default</span>: <span class="hljs-number">0</span> } });

<span class="hljs-keyword">const</span> cuenta = <span class="hljs-title function_">ref</span>(props.<span class="hljs-property">inicial</span>);                 <span class="hljs-comment">// estado reactivo</span>
<span class="hljs-keyword">const</span> doble = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> cuenta.<span class="hljs-property">value</span> * <span class="hljs-number">2</span>);    <span class="hljs-comment">// derivado y cacheado</span>
&lt;/script&gt;

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;caja&quot;</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ cuenta }} (doble: {{ doble }})<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">button</span> @<span class="hljs-attr">click</span>=<span class="hljs-string">&quot;cuenta++&quot;</span>&gt;</span>+1<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span></span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span> <span class="hljs-attr">scoped</span>&gt;</span><span class="language-css">
<span class="hljs-selector-class">.caja</span> { <span class="hljs-attribute">padding</span>: <span class="hljs-number">1rem</span>; <span class="hljs-attribute">border</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#ccc</span>; }
</span><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span></span>
</code></pre>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular-1"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</h3>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// contador.ts</span>
<span class="hljs-meta">@Component</span>({
  <span class="hljs-attr">selector</span>: <span class="hljs-string">&#x27;app-contador&#x27;</span>,
  <span class="hljs-attr">templateUrl</span>: <span class="hljs-string">&#x27;./contador.html&#x27;</span>,
  <span class="hljs-attr">styleUrl</span>: <span class="hljs-string">&#x27;./contador.css&#x27;</span>,
})
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Contador</span> {
  inicial = <span class="hljs-title function_">input</span>(<span class="hljs-number">0</span>);
  cuenta = <span class="hljs-title function_">linkedSignal</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">inicial</span>());  <span class="hljs-comment">// estado</span>
  doble = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">cuenta</span>() * <span class="hljs-number">2</span>);    <span class="hljs-comment">// derivado</span>

  <span class="hljs-title function_">incrementar</span>(<span class="hljs-params"></span>) {
    <span class="hljs-variable language_">this</span>.<span class="hljs-property">cuenta</span>.<span class="hljs-title function_">update</span>(<span class="hljs-function"><span class="hljs-params">c</span> =&gt;</span> c + <span class="hljs-number">1</span>);
  }
}
</code></pre>
</div>
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- contador.html --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">div</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;caja&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ cuenta() }} (doble: {{ doble() }})<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">button</span> (<span class="hljs-attr">click</span>)=<span class="hljs-string">&quot;incrementar()&quot;</span>&gt;</span>+1<span class="hljs-tag">&lt;/<span class="hljs-name">button</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">div</span>&gt;</span>
</code></pre>
<pre><code class="language-css"><span class="hljs-comment">/* contador.css — solo afecta a este componente */</span>
<span class="hljs-selector-class">.caja</span> { <span class="hljs-attribute">padding</span>: <span class="hljs-number">1rem</span>; <span class="hljs-attribute">border</span>: <span class="hljs-number">1px</span> solid <span class="hljs-number">#ccc</span>; }
</code></pre>
</div>
</split-slide>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="estilos-encapsulados">Estilos encapsulados</h2>
<ul>
<li>El problema: en CSS todo es <strong>global</strong>. Un <code>.caja</code> en un componente afecta a todos los <code>.caja</code> de la app</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Por defecto</td>
<td style="text-align:left"><strong>Global</strong> (<code>import './x.css'</code>)</td>
<td style="text-align:left">Global</td>
<td style="text-align:left"><strong>Encapsulado</strong></td>
</tr>
<tr>
<td style="text-align:left">Encapsular</td>
<td style="text-align:left"><code>x.module.css</code> → <code>styles.caja</code></td>
<td style="text-align:left"><code>&lt;style scoped&gt;</code></td>
<td style="text-align:left"><code>ViewEncapsulation.Emulated</code> (defecto)</td>
</tr>
<tr>
<td style="text-align:left">Cómo lo hace</td>
<td style="text-align:left">Renombra clases: <code>caja_a1b2</code></td>
<td style="text-align:left">Atributo <code>data-v-a1b2</code></td>
<td style="text-align:left">Atributo <code>_ngcontent-a1b2</code></td>
</tr>
<tr>
<td style="text-align:left">Shadow DOM real</td>
<td style="text-align:left">—</td>
<td style="text-align:left">—</td>
<td style="text-align:left"><code>ViewEncapsulation.ShadowDom</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Los tres conviven bien con <strong>Tailwind</strong> y con <strong>variables CSS</strong> para temas (ver <em>CSS avanzado</em>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="plantillas-interpolaci%C3%B3n-eventos-y-binding">Plantillas: interpolación, eventos y <em>binding</em></h2>
<table>
<thead>
<tr>
<th style="text-align:left">Necesidad</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React (JSX)</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Mostrar valor</td>
<td style="text-align:left"><code>{nombre}</code></td>
<td style="text-align:left"><code>{{ nombre }}</code></td>
<td style="text-align:left"><code>{{ nombre() }}</code></td>
</tr>
<tr>
<td style="text-align:left">Atributo dinámico</td>
<td style="text-align:left"><code>src={url}</code></td>
<td style="text-align:left"><code>:src=&quot;url&quot;</code></td>
<td style="text-align:left"><code>[src]=&quot;url&quot;</code></td>
</tr>
<tr>
<td style="text-align:left">Evento</td>
<td style="text-align:left"><code>onClick={fn}</code></td>
<td style="text-align:left"><code>@click=&quot;fn&quot;</code></td>
<td style="text-align:left"><code>(click)=&quot;fn()&quot;</code></td>
</tr>
<tr>
<td style="text-align:left">Clase condicional</td>
<td style="text-align:left"><code>className={activo ? 'on' : ''}</code></td>
<td style="text-align:left"><code>:class=&quot;{ on: activo }&quot;</code></td>
<td style="text-align:left"><code>[class.on]=&quot;activo()&quot;</code></td>
</tr>
<tr>
<td style="text-align:left">Doble vía (input)</td>
<td style="text-align:left"><code>value</code> + <code>onChange</code></td>
<td style="text-align:left"><code>v-model=&quot;nombre&quot;</code></td>
<td style="text-align:left"><code>[(ngModel)]</code> o Signal Forms (<code>form()</code>)</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> JSX <strong>es JavaScript</strong>: no hay sintaxis especial que aprender, pero tampoco atajos</li>
<li><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> y <img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> usan una <strong>plantilla HTML extendida</strong> que el compilador transforma en JavaScript</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="condicionales-y-listas">Condicionales y listas</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react--javascript-puro"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — JavaScript puro</h3>
<pre><code class="language-jsx">{cargando ? <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Spinner</span> /&gt;</span></span> : <span class="hljs-literal">null</span>}
{error &amp;&amp; <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">className</span>=<span class="hljs-string">&quot;error&quot;</span>&gt;</span>{error}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>}

&lt;ul&gt;
  {productos.<span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">p</span> =&gt;</span> (
    <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">li</span> <span class="hljs-attr">key</span>=<span class="hljs-string">{p.id}</span>&gt;</span>{p.nombre}<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span></span>
  ))}
&lt;/ul&gt;
{productos.<span class="hljs-property">length</span> === <span class="hljs-number">0</span> &amp;&amp; <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>Sin productos<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>}
</code></pre>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue--directivas-v-if--v-for"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — directivas <code>v-if</code> / <code>v-for</code></h3>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">Spinner</span> <span class="hljs-attr">v-if</span>=<span class="hljs-string">&quot;cargando&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">v-else-if</span>=<span class="hljs-string">&quot;error&quot;</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;error&quot;</span>&gt;</span>{{ error }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">ul</span> <span class="hljs-attr">v-else</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">li</span> <span class="hljs-attr">v-for</span>=<span class="hljs-string">&quot;p in productos&quot;</span> <span class="hljs-attr">:key</span>=<span class="hljs-string">&quot;p.id&quot;</span>&gt;</span>{{ p.nombre }}<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">v-if</span>=<span class="hljs-string">&quot;!productos.length&quot;</span>&gt;</span>Sin productos<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--control-de-flujo-integrado-v17"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — control de flujo integrado (v17+)</h3>
<pre><code class="language-html">@if (cargando()) {
  <span class="hljs-tag">&lt;<span class="hljs-name">app-spinner</span> /&gt;</span>
} @else if (error()) {
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">class</span>=<span class="hljs-string">&quot;error&quot;</span>&gt;</span>{{ error() }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
} @else {
  <span class="hljs-tag">&lt;<span class="hljs-name">ul</span>&gt;</span>
    @for (p of productos(); track p.id) {
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>{{ p.nombre }}<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    } @empty {
      <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>Sin productos<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span>
    }
  <span class="hljs-tag">&lt;/<span class="hljs-name">ul</span>&gt;</span>
}
</code></pre>
<ul>
<li><code>track</code> es <strong>obligatorio</strong>: equivale a <code>key</code> en React y Vue. Reemplaza a <code>*ngIf</code> / <code>*ngFor</code></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="ciclo-de-vida-comparado">Ciclo de vida comparado</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Momento</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Al crearse</td>
<td style="text-align:left">cuerpo de la función</td>
<td style="text-align:left"><code>&lt;script setup&gt;</code></td>
<td style="text-align:left"><code>constructor</code> / <code>inject()</code></td>
</tr>
<tr>
<td style="text-align:left">Montado en el DOM</td>
<td style="text-align:left"><code>useEffect(fn, [])</code></td>
<td style="text-align:left"><code>onMounted</code></td>
<td style="text-align:left"><code>ngOnInit</code> / <code>afterNextRender</code></td>
</tr>
<tr>
<td style="text-align:left">Cuando cambia un dato</td>
<td style="text-align:left"><code>useEffect(fn, [dato])</code></td>
<td style="text-align:left"><code>watch(dato, fn)</code></td>
<td style="text-align:left"><code>effect()</code> / <code>ngOnChanges</code></td>
</tr>
<tr>
<td style="text-align:left">Antes de destruirse</td>
<td style="text-align:left"><code>return () =&gt; {…}</code> en <code>useEffect</code></td>
<td style="text-align:left"><code>onUnmounted</code></td>
<td style="text-align:left"><code>ngOnDestroy</code> / <code>DestroyRef</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> El error clásico en React: olvidar el arreglo de dependencias de <code>useEffect</code> → <strong>bucle infinito</strong> de peticiones</li>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> En los tres, prefiera <strong>valores derivados</strong> (<code>computed</code>, cálculo en render) antes que efectos que copian datos</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-hykfBRt3="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="29" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="enrutamiento">Enrutamiento</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>SPA y la History API</li>
<li>Definir rutas en los tres</li>
<li>Parámetros y navegación</li>
<li>Guardas y carga diferida</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%C2%BFqu%C3%A9-es-el-enrutamiento-en-una-spa">¿Qué es el enrutamiento en una SPA?</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text">Sitio tradicional (MPA)
  /productos   → petición → HTML nuevo completo
  /productos/7 → petición → HTML nuevo completo

SPA (Single Page Application)
  index.html se descarga UNA vez
  /productos   → el router muestra &lt;ListaProductos&gt;
  /productos/7 → el router muestra &lt;DetalleProducto id=7&gt;
                 (solo se piden datos JSON a la API)
</code></pre>
</div>
<div>
<ul>
<li>El <em>router</em> escucha la URL (<strong>History API</strong>: <code>pushState</code>, <code>popstate</code>) y decide <strong>qué componente</strong> dibujar</li>
<li>La URL sigue siendo la <strong>fuente de verdad</strong>: se puede compartir, recargar y usar &quot;atrás&quot;</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> En producción el servidor debe responder <code>index.html</code> para <strong>cualquier</strong> ruta (si no, <code>/productos/7</code> da <strong>404</strong> al recargar)</li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Paquete</td>
<td style="text-align:left"><code>react-router</code> (v7)</td>
<td style="text-align:left"><code>vue-router</code> (v5)</td>
<td style="text-align:left"><code>@angular/router</code></td>
</tr>
<tr>
<td style="text-align:left">Dónde se dibuja</td>
<td style="text-align:left"><code>&lt;Outlet /&gt;</code></td>
<td style="text-align:left"><code>&lt;RouterView /&gt;</code></td>
<td style="text-align:left"><code>&lt;router-outlet /&gt;</code></td>
</tr>
<tr>
<td style="text-align:left">Enlace</td>
<td style="text-align:left"><code>&lt;Link to=&quot;/x&quot;&gt;</code></td>
<td style="text-align:left"><code>&lt;RouterLink to=&quot;/x&quot;&gt;</code></td>
<td style="text-align:left"><code>&lt;a routerLink=&quot;/x&quot;&gt;</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="definir-rutas">Definir rutas</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react-router-7"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React Router 7</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { createBrowserRouter, <span class="hljs-title class_">RouterProvider</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;react-router&#x27;</span>;

<span class="hljs-keyword">const</span> router = <span class="hljs-title function_">createBrowserRouter</span>([
  {
    <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/&#x27;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Layout</span> /&gt;</span></span>,              <span class="hljs-comment">// Layout contiene &lt;Outlet /&gt;</span>
    <span class="hljs-attr">children</span>: [
      { <span class="hljs-attr">index</span>: <span class="hljs-literal">true</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Inicio</span> /&gt;</span></span> },
      { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;productos&#x27;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">ListaProductos</span> /&gt;</span></span> },
      { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;productos/:id&#x27;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">DetalleProducto</span> /&gt;</span></span> },
      { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;*&#x27;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">NoEncontrado</span> /&gt;</span></span> },
    ],
  },
]);

<span class="hljs-title function_">createRoot</span>(<span class="hljs-variable language_">document</span>.<span class="hljs-title function_">getElementById</span>(<span class="hljs-string">&#x27;root&#x27;</span>)).<span class="hljs-title function_">render</span>(<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">RouterProvider</span> <span class="hljs-attr">router</span>=<span class="hljs-string">{router}</span> /&gt;</span></span>);
</code></pre>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue-router-5"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue Router 5</h3>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { createRouter, createWebHistory } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue-router&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> router = <span class="hljs-title function_">createRouter</span>({
  <span class="hljs-attr">history</span>: <span class="hljs-title function_">createWebHistory</span>(),
  <span class="hljs-attr">routes</span>: [
    { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">Inicio</span> },
    { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/productos&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">ListaProductos</span> },
    { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/productos/:id&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">DetalleProducto</span>, <span class="hljs-attr">props</span>: <span class="hljs-literal">true</span> },
    { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/:pathMatch(.*)*&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">NoEncontrado</span> },
  ],
});

<span class="hljs-title function_">createApp</span>(<span class="hljs-title class_">App</span>).<span class="hljs-title function_">use</span>(router).<span class="hljs-title function_">mount</span>(<span class="hljs-string">&#x27;#app&#x27;</span>);      <span class="hljs-comment">// App.vue contiene &lt;RouterView /&gt;</span>
</code></pre>
<ul>
<li>Novedad de la v5: rutas <strong>por archivos</strong> (<code>src/pages/productos/[id].vue</code>) integradas vía <code>vue-router/vite</code></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular-router"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular Router</h3>
<pre><code class="language-ts"><span class="hljs-comment">// app.routes.ts</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-attr">routes</span>: <span class="hljs-title class_">Routes</span> = [
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">Inicio</span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;productos&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">ListaProductos</span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;productos/:id&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">DetalleProducto</span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;**&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">NoEncontrado</span> },
];

<span class="hljs-comment">// app.config.ts</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-attr">appConfig</span>: <span class="hljs-title class_">ApplicationConfig</span> = {
  <span class="hljs-attr">providers</span>: [<span class="hljs-title function_">provideRouter</span>(routes, <span class="hljs-title function_">withComponentInputBinding</span>())],
};
</code></pre>
<ul>
<li><code>withComponentInputBinding()</code> pasa <code>:id</code> directamente a un <code>input()</code> del componente</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="par%C3%A1metros-y-navegaci%C3%B3n-program%C3%A1tica">Parámetros y navegación programática</h2>
<steps>
<step>
<h3 id="leer-id-de-la-url">Leer <code>:id</code> de la URL</h3>
<table>
<thead>
<tr>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>const { id } = useParams();</code></td>
<td style="text-align:left"><code>const route = useRoute();</code> <br /> <code>route.params.id</code> <br /> (o <code>props: true</code> → <code>defineProps</code>)</td>
<td style="text-align:left"><code>id = input.required&lt;string&gt;();</code> <br /> (con <code>withComponentInputBinding</code>)</td>
</tr>
<tr>
<td style="text-align:left"><code>useSearchParams()</code> para <code>?q=</code></td>
<td style="text-align:left"><code>route.query.q</code></td>
<td style="text-align:left"><code>queryParams</code> como <code>input()</code></td>
</tr>
</tbody>
</table>
</step>
<step>
<h3 id="navegar-desde-c%C3%B3digo-despu%C3%A9s-de-guardar-un-formulario">Navegar desde código (después de guardar un formulario)</h3>
<pre><code class="language-js"><span class="hljs-comment">// ⚛ React</span>
<span class="hljs-keyword">const</span> navigate = <span class="hljs-title function_">useNavigate</span>();
<span class="hljs-title function_">navigate</span>(<span class="hljs-string">`/productos/<span class="hljs-subst">${nuevo.id}</span>`</span>);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</span>
<span class="hljs-keyword">const</span> router = <span class="hljs-title function_">useRouter</span>();
router.<span class="hljs-title function_">push</span>({ <span class="hljs-attr">path</span>: <span class="hljs-string">`/productos/<span class="hljs-subst">${nuevo.id}</span>`</span> });

<span class="hljs-comment">// 🅰 Angular</span>
private router = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">Router</span>);
<span class="hljs-variable language_">this</span>.<span class="hljs-property">router</span>.<span class="hljs-title function_">navigate</span>([<span class="hljs-string">&#x27;/productos&#x27;</span>, nuevo.<span class="hljs-property">id</span>]);
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="guardas-de-ruta-%C2%BFpuede-entrar">Guardas de ruta: ¿puede entrar?</h2>
<steps>
<step>
