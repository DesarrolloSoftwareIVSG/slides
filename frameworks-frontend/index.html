</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="el-problema-prop-drilling">El problema: <em>prop drilling</em></h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<pre><code class="language-text">App            (usuario) ─┐
 └ Layout      (usuario)  │  solo lo
    └ Encabezado(usuario) │  pasan…
       └ Menu  (usuario)  │
          └ Avatar ◄──────┘  …el único
                (usa usuario)  que lo usa
</code></pre>
</div>
<div>
<ul>
<li>Pasar un dato por <strong>cinco niveles</strong> de componentes que no lo necesitan</li>
<li>Cada nivel intermedio queda <strong>acoplado</strong> a algo que no le importa</li>
<li>Soluciones, de menor a mayor:
<ol>
<li><strong>Contexto / inyección</strong> (<code>useContext</code>, <code>provide/inject</code>, servicios)</li>
<li>Un <strong>store</strong> global con acciones y valores derivados</li>
</ol>
</li>
</ul>
</div>
</split-slide>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Sin librería</td>
<td style="text-align:left"><code>useState</code>, <code>useReducer</code>, <strong>Context</strong></td>
<td style="text-align:left"><code>ref</code>, <code>reactive</code>, <code>provide/inject</code></td>
<td style="text-align:left"><strong>Servicio + signals</strong></td>
</tr>
<tr>
<td style="text-align:left">Store recomendado</td>
<td style="text-align:left"><strong>Zustand</strong>, Redux Toolkit</td>
<td style="text-align:left"><strong>Pinia</strong> (oficial)</td>
<td style="text-align:left"><strong>NgRx SignalStore</strong>, NgRx Store</td>
</tr>
<tr>
<td style="text-align:left">Estado del servidor</td>
<td style="text-align:left">TanStack Query</td>
<td style="text-align:left">TanStack Query, Pinia Colada</td>
<td style="text-align:left"><code>httpResource</code>, TanStack Query</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="el-mismo-carrito-en-los-tres">El mismo carrito en los tres</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react--zustand"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — Zustand</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { create } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;zustand&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> useCarrito = <span class="hljs-title function_">create</span>(<span class="hljs-function">(<span class="hljs-params">set</span>) =&gt;</span> ({
  <span class="hljs-attr">items</span>: [],
  <span class="hljs-attr">agregar</span>: <span class="hljs-function">(<span class="hljs-params">p</span>) =&gt;</span> <span class="hljs-title function_">set</span>(<span class="hljs-function">(<span class="hljs-params">s</span>) =&gt;</span> ({ <span class="hljs-attr">items</span>: [...s.<span class="hljs-property">items</span>, p] })),      <span class="hljs-comment">// inmutable</span>
  <span class="hljs-attr">quitar</span>: <span class="hljs-function">(<span class="hljs-params">id</span>) =&gt;</span> <span class="hljs-title function_">set</span>(<span class="hljs-function">(<span class="hljs-params">s</span>) =&gt;</span> ({ <span class="hljs-attr">items</span>: s.<span class="hljs-property">items</span>.<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">i</span> =&gt;</span> i.<span class="hljs-property">id</span> !== id) })),
  <span class="hljs-attr">vaciar</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">set</span>({ <span class="hljs-attr">items</span>: [] }),
}));

<span class="hljs-comment">// En cualquier componente, sin Provider</span>
<span class="hljs-keyword">const</span> total = <span class="hljs-title function_">useCarrito</span>(<span class="hljs-function">(<span class="hljs-params">s</span>) =&gt;</span> s.<span class="hljs-property">items</span>.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">t, i</span>) =&gt;</span> t + i.<span class="hljs-property">precio</span>, <span class="hljs-number">0</span>));
<span class="hljs-keyword">const</span> agregar = <span class="hljs-title function_">useCarrito</span>(<span class="hljs-function">(<span class="hljs-params">s</span>) =&gt;</span> s.<span class="hljs-property">agregar</span>);
</code></pre>
<ul>
<li>En React el estado se <strong>reemplaza</strong>, no se muta: <code>[...items, p]</code>, nunca <code>items.push(p)</code></li>
</ul>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue--pinia-setup-store"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — Pinia (<em>setup store</em>)</h3>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { defineStore } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;pinia&#x27;</span>;
<span class="hljs-keyword">import</span> { ref, computed } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> useCarritoStore = <span class="hljs-title function_">defineStore</span>(<span class="hljs-string">&#x27;carrito&#x27;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> items = <span class="hljs-title function_">ref</span>([]);
  <span class="hljs-keyword">const</span> total = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> items.<span class="hljs-property">value</span>.<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">t, i</span>) =&gt;</span> t + i.<span class="hljs-property">precio</span>, <span class="hljs-number">0</span>));

  <span class="hljs-keyword">function</span> <span class="hljs-title function_">agregar</span>(<span class="hljs-params">p</span>) { items.<span class="hljs-property">value</span>.<span class="hljs-title function_">push</span>(p); }                     <span class="hljs-comment">// mutación reactiva</span>
  <span class="hljs-keyword">function</span> <span class="hljs-title function_">quitar</span>(<span class="hljs-params">id</span>) { items.<span class="hljs-property">value</span> = items.<span class="hljs-property">value</span>.<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">i</span> =&gt;</span> i.<span class="hljs-property">id</span> !== id); }

  <span class="hljs-keyword">return</span> { items, total, agregar, quitar };
});

<span class="hljs-comment">// En el componente</span>
<span class="hljs-keyword">const</span> carrito = <span class="hljs-title function_">useCarritoStore</span>();   <span class="hljs-comment">// carrito.total, carrito.agregar(p)</span>
</code></pre>
<ul>
<li>Pinia se integra con las <strong>Vue DevTools</strong>: historial de cambios y &quot;viaje en el tiempo&quot;</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--servicio-con-signals"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — servicio con signals</h3>
<pre><code class="language-ts"><span class="hljs-meta">@Service</span>()
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">CarritoStore</span> {
  <span class="hljs-keyword">private</span> <span class="hljs-keyword">readonly</span> _items = signal&lt;<span class="hljs-title class_">Producto</span>[]&gt;([]);

  <span class="hljs-keyword">readonly</span> items = <span class="hljs-variable language_">this</span>.<span class="hljs-property">_items</span>.<span class="hljs-title function_">asReadonly</span>();                       <span class="hljs-comment">// solo lectura afuera</span>
  <span class="hljs-keyword">readonly</span> total = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">this</span>.<span class="hljs-title function_">_items</span>().<span class="hljs-title function_">reduce</span>(<span class="hljs-function">(<span class="hljs-params">t, i</span>) =&gt;</span> t + i.<span class="hljs-property">precio</span>, <span class="hljs-number">0</span>));

  <span class="hljs-title function_">agregar</span>(<span class="hljs-params"><span class="hljs-attr">p</span>: <span class="hljs-title class_">Producto</span></span>) { <span class="hljs-variable language_">this</span>.<span class="hljs-property">_items</span>.<span class="hljs-title function_">update</span>(<span class="hljs-function"><span class="hljs-params">items</span> =&gt;</span> [...items, p]); }
  <span class="hljs-title function_">quitar</span>(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span></span>)   { <span class="hljs-variable language_">this</span>.<span class="hljs-property">_items</span>.<span class="hljs-title function_">update</span>(<span class="hljs-function"><span class="hljs-params">items</span> =&gt;</span> items.<span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">i</span> =&gt;</span> i.<span class="hljs-property">id</span> !== id)); }
}

<span class="hljs-comment">// En el componente</span>
carrito = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">CarritoStore</span>);      <span class="hljs-comment">// {{ carrito.total() | colones }}</span>
</code></pre>
<ul>
<li>Para apps grandes, <strong>NgRx SignalStore</strong> formaliza este patrón (<code>signalStore</code>, <code>withState</code>, <code>withMethods</code>)</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="persistir-el-estado">Persistir el estado</h2>
<ul>
<li>El estado en memoria <strong>se pierde al recargar</strong>. Para carrito o preferencias:</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// ⚛ Zustand</span>
<span class="hljs-title function_">create</span>(<span class="hljs-title function_">persist</span>(<span class="hljs-function">(<span class="hljs-params">set</span>) =&gt;</span> ({ <span class="hljs-comment">/* ... */</span> }), { <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;carrito&#x27;</span> }));

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Pinia + pinia-plugin-persistedstate</span>
<span class="hljs-title function_">defineStore</span>(<span class="hljs-string">&#x27;carrito&#x27;</span>, <span class="hljs-function">() =&gt;</span> { <span class="hljs-comment">/* ... */</span> }, { <span class="hljs-attr">persist</span>: <span class="hljs-literal">true</span> });

<span class="hljs-comment">// 🅰 Angular: un effect que sincroniza</span>
<span class="hljs-title function_">effect</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">setItem</span>(<span class="hljs-string">&#x27;carrito&#x27;</span>, <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(<span class="hljs-variable language_">this</span>.<span class="hljs-title function_">_items</span>())));
</code></pre>
<div class="grid">
<div>
<h3 id="%E2%9C%85-s%C3%AD-persistir"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Sí persistir</h3>
<p>Carrito, tema claro/oscuro, idioma, filtros recientes</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-no-persistir"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> No persistir</h3>
<p>Datos de la API (se vuelven <strong>viejos</strong>), información sensible, contraseñas</p>
</div>
</div>
</section>

<h2 id="la-pir%C3%A1mide-en-el-front-end">La pirámide en el front-end</h2>
<split-slide style="--left: 45%; --right: 55%;">
<div>
<pre><code class="language-text">                ▲
               ╱ ╲        E2E (Playwright)
              ╱   ╲       pocos · lentos · reales
             ╱─────╲
            ╱       ╲     Componentes / integración
           ╱         ╲    Testing Library, TestBed
          ╱───────────╲
         ╱             ╲  Unitarias
        ╱               ╲ pipes, funciones, stores
       ╱─────────────────╲
</code></pre>
</div>
<div>
<ul>
<li><strong>Unitarias</strong>: funciones puras, pipes, <em>stores</em>, validadores. Rápidas y muchas</li>
<li><strong>De componente</strong>: se monta el componente y se interactúa como <strong>una persona usuaria</strong> (clic, escribir, leer texto)</li>
<li><strong>E2E</strong>: un navegador real recorre un flujo completo contra la app levantada</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Pruebe <strong>comportamiento</strong>, no implementación: &quot;al hacer clic en <em>Agregar</em> el contador muestra 1&quot;, no &quot;se llamó a <code>setCuenta</code>&quot;</li>
</ul>
</div>

<tbody>
<tr>

<td style="text-align:left"><code>npm run test:unit</code></td>
<td style="text-align:left"><code>ng test</code></td>

</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Vitest ya lo usaron en el tema de JavaScript: <code>describe</code>, <code>it</code>, <code>expect</code> funcionan igual en los tres</li>
<li>Migrar un proyecto Angular viejo: <code>ng g @schematics/angular:refactor-jasmine-vitest</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="probar-el-contador">Probar el contador</h2>
<steps>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react-testing-library"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React Testing Library</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">import</span> { render, screen } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@testing-library/react&#x27;</span>;
<span class="hljs-keyword">import</span> userEvent <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@testing-library/user-event&#x27;</span>;
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Contador</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./Contador&#x27;</span>;

<span class="hljs-title function_">it</span>(<span class="hljs-string">&#x27;incrementa al hacer clic&#x27;</span>, <span class="hljs-title function_">async</span> () =&gt; {
  <span class="hljs-title function_">render</span>(<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Contador</span> <span class="hljs-attr">inicial</span>=<span class="hljs-string">{5}</span> /&gt;</span></span>);

  <span class="hljs-keyword">await</span> userEvent.<span class="hljs-title function_">click</span>(screen.<span class="hljs-title function_">getByRole</span>(<span class="hljs-string">&#x27;button&#x27;</span>, { <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;+1&#x27;</span> }));

  <span class="hljs-title function_">expect</span>(screen.<span class="hljs-title function_">getByText</span>(<span class="hljs-regexp">/6 \(doble: 12\)/</span>)).<span class="hljs-title function_">toBeInTheDocument</span>();
});
</code></pre>
<ul>
<li>Busca por <strong>rol y texto accesible</strong>, como lo haría una persona (o un lector de pantalla)</li>
</ul>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue-test-utils"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue Test Utils</h3>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { mount } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@vue/test-utils&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">Contador</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./Contador.vue&#x27;</span>;

<span class="hljs-title function_">it</span>(<span class="hljs-string">&#x27;incrementa al hacer clic&#x27;</span>, <span class="hljs-title function_">async</span> () =&gt; {
  <span class="hljs-keyword">const</span> wrapper = <span class="hljs-title function_">mount</span>(<span class="hljs-title class_">Contador</span>, { <span class="hljs-attr">props</span>: { <span class="hljs-attr">inicial</span>: <span class="hljs-number">5</span> } });

  <span class="hljs-keyword">await</span> wrapper.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;button&#x27;</span>).<span class="hljs-title function_">trigger</span>(<span class="hljs-string">&#x27;click&#x27;</span>);   <span class="hljs-comment">// await: espera el re-render</span>

  <span class="hljs-title function_">expect</span>(wrapper.<span class="hljs-title function_">text</span>()).<span class="hljs-title function_">toContain</span>(<span class="hljs-string">&#x27;6 (doble: 12)&#x27;</span>);
});
</code></pre>
</step>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular-testbed--vitest"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular TestBed + Vitest</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">TestBed</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@angular/core/testing&#x27;</span>;
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Contador</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./contador&#x27;</span>;

<span class="hljs-title function_">it</span>(<span class="hljs-string">&#x27;incrementa al hacer clic&#x27;</span>, <span class="hljs-title function_">async</span> () =&gt; {
  <span class="hljs-keyword">const</span> fixture = <span class="hljs-title class_">TestBed</span>.<span class="hljs-title function_">createComponent</span>(<span class="hljs-title class_">Contador</span>);
  fixture.<span class="hljs-property">componentRef</span>.<span class="hljs-title function_">setInput</span>(<span class="hljs-string">&#x27;inicial&#x27;</span>, <span class="hljs-number">5</span>);
  <span class="hljs-keyword">await</span> fixture.<span class="hljs-title function_">whenStable</span>();

  fixture.<span class="hljs-property">nativeElement</span>.<span class="hljs-title function_">querySelector</span>(<span class="hljs-string">&#x27;button&#x27;</span>).<span class="hljs-title function_">click</span>();
  <span class="hljs-keyword">await</span> fixture.<span class="hljs-title function_">whenStable</span>();                      <span class="hljs-comment">// zoneless: esperar la actualización</span>

  <span class="hljs-title function_">expect</span>(fixture.<span class="hljs-property">nativeElement</span>.<span class="hljs-property">textContent</span>).<span class="hljs-title function_">toContain</span>(<span class="hljs-string">&#x27;6 (doble: 12)&#x27;</span>);
});
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="probar-c%C3%B3digo-que-llama-a-la-api">Probar código que llama a la API</h2>
<steps>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--httptestingcontroller"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — <code>HttpTestingController</code></h3>
<pre><code class="language-ts"><span class="hljs-title function_">beforeEach</span>(<span class="hljs-function">() =&gt;</span> {
  <span class="hljs-title class_">TestBed</span>.<span class="hljs-title function_">configureTestingModule</span>({
    <span class="hljs-attr">providers</span>: [<span class="hljs-title function_">provideHttpClient</span>(), <span class="hljs-title function_">provideHttpClientTesting</span>()],
  });
});

<span class="hljs-title function_">it</span>(<span class="hljs-string">&#x27;lista productos&#x27;</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> service = <span class="hljs-title class_">TestBed</span>.<span class="hljs-title function_">inject</span>(<span class="hljs-title class_">ProductosService</span>);
  <span class="hljs-keyword">const</span> http = <span class="hljs-title class_">TestBed</span>.<span class="hljs-title function_">inject</span>(<span class="hljs-title class_">HttpTestingController</span>);

  service.<span class="hljs-title function_">listar</span>().<span class="hljs-title function_">subscribe</span>(<span class="hljs-function"><span class="hljs-params">lista</span> =&gt;</span> <span class="hljs-title function_">expect</span>(lista).<span class="hljs-title function_">toHaveLength</span>(<span class="hljs-number">2</span>));

  http.<span class="hljs-title function_">expectOne</span>(<span class="hljs-string">&#x27;/api/productos&#x27;</span>).<span class="hljs-title function_">flush</span>([{ <span class="hljs-attr">id</span>: <span class="hljs-number">1</span> }, { <span class="hljs-attr">id</span>: <span class="hljs-number">2</span> }]);   <span class="hljs-comment">// respuesta falsa</span>
  http.<span class="hljs-title function_">verify</span>();                                                     <span class="hljs-comment">// no quedaron pendientes</span>
});
</code></pre>
</step>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-%F0%9F%92%9A-msw--mock-service-worker-sirve-en-los-tres"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> MSW — Mock Service Worker (sirve en los tres)</h3>
<pre><code class="language-js"><span class="hljs-keyword">import</span> { http, <span class="hljs-title class_">HttpResponse</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;msw&#x27;</span>;
<span class="hljs-keyword">import</span> { setupServer } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;msw/node&#x27;</span>;

<span class="hljs-keyword">const</span> server = <span class="hljs-title function_">setupServer</span>(
  http.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;*/api/productos&#x27;</span>, <span class="hljs-function">() =&gt;</span> <span class="hljs-title class_">HttpResponse</span>.<span class="hljs-title function_">json</span>([{ <span class="hljs-attr">id</span>: <span class="hljs-number">1</span>, <span class="hljs-attr">nombre</span>: <span class="hljs-string">&#x27;Café&#x27;</span> }])),
  http.<span class="hljs-title function_">post</span>(<span class="hljs-string">&#x27;*/api/productos&#x27;</span>, <span class="hljs-function">() =&gt;</span>
    <span class="hljs-title class_">HttpResponse</span>.<span class="hljs-title function_">json</span>({ <span class="hljs-attr">errors</span>: { <span class="hljs-attr">nombre</span>: [<span class="hljs-string">&#x27;Requerido&#x27;</span>] } }, { <span class="hljs-attr">status</span>: <span class="hljs-number">422</span> })),
);

<span class="hljs-title function_">beforeAll</span>(<span class="hljs-function">() =&gt;</span> server.<span class="hljs-title function_">listen</span>());
<span class="hljs-title function_">afterEach</span>(<span class="hljs-function">() =&gt;</span> server.<span class="hljs-title function_">resetHandlers</span>());
<span class="hljs-title function_">afterAll</span>(<span class="hljs-function">() =&gt;</span> server.<span class="hljs-title function_">close</span>());
</code></pre>
<ul>
<li>Intercepta a nivel de <strong>red</strong>: el componente usa su <code>fetch</code> real. Ideal para probar los estados <strong>422</strong>, <strong>401</strong>, <strong>500</strong></li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="64" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="pruebas-e2e-con-playwright">Pruebas E2E con Playwright</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-js"><span class="hljs-comment">// e2e/carrito.spec.ts</span>
<span class="hljs-keyword">import</span> { test, expect } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@playwright/test&#x27;</span>;

<span class="hljs-title function_">test</span>(<span class="hljs-string">&#x27;agrega un producto al carrito&#x27;</span>, <span class="hljs-title function_">async</span> ({ page }) =&gt; {
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">goto</span>(<span class="hljs-string">&#x27;/productos&#x27;</span>);

  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">getByRole</span>(<span class="hljs-string">&#x27;button&#x27;</span>, { <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;Agregar&#x27;</span> }).<span class="hljs-title function_">first</span>().<span class="hljs-title function_">click</span>();

  <span class="hljs-keyword">await</span> <span class="hljs-title function_">expect</span>(page.<span class="hljs-title function_">getByTestId</span>(<span class="hljs-string">&#x27;contador-carrito&#x27;</span>)).<span class="hljs-title function_">toHaveText</span>(<span class="hljs-string">&#x27;1&#x27;</span>);
});
</code></pre>
<pre><code class="language-bash">npm init playwright@latest
npx playwright <span class="hljs-built_in">test</span> --ui
</code></pre>
</div>
<div>
<ul>
<li>Abre un navegador <strong>real</strong> (Chromium, Firefox, WebKit) y ejecuta el flujo de punta a punta</li>
<li>Es <strong>independiente del framework</strong>: la misma prueba sirve si migran de Vue a React</li>
<li>Más lentas y frágiles: reserve E2E para los <strong>flujos críticos</strong> (login, compra, registro)</li>
</ul>
<br />
<h3 id="%C2%BFqu%C3%A9-probar-como-m%C3%ADnimo">¿Qué probar como mínimo?</h3>
<ul>
<li>Un <em>store</em> / servicio (unitaria)</li>
<li>Un formulario con error <strong>422</strong> (componente + MSW)</li>
<li>El flujo principal (E2E)</li>
</ul>
</div>
</split-slide>
</section>

<h2 id="resumen-el-mismo-concepto-tres-sintaxis">Resumen: el mismo concepto, tres sintaxis</h2>
<table>

<tr>

<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular</th>

<h2 id="antipatrones-frecuentes">Antipatrones frecuentes</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9A%A9-componente-dios"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Componente &quot;Dios&quot;</h3>
<p>Un <code>App</code> de 800 líneas que pide datos, valida, dibuja y navega</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-todo-es-global"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Todo es global</h3>
<p>Meter en el <em>store</em> el valor de cada <em>input</em> &quot;por si acaso&quot;</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-fetch-en-cada-componente"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>fetch</code> en cada componente</h3>
<p>URLs duplicadas, sin token, sin manejo de errores: use <strong>un</strong> cliente / servicio</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-solo-el-camino-feliz"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Solo el camino feliz</h3>
<p>Sin <em>spinner</em>, sin mensaje de error, sin estado vacío</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-confiar-en-el-front-end"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Confiar en el front-end</h3>
<p>Validar o &quot;proteger&quot; solo en el cliente. La API <strong>siempre</strong> valida y autoriza</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-mutar-props-o-estado-de-react"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Mutar <em>props</em> o estado de React</h3>
<p><code>props.items.push(x)</code> o <code>estado.push(x)</code>: la vista no se entera</p>
</div>
</div>

<h2 id="referencias">Referencias</h2>
