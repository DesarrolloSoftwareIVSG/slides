<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--guardas-funcionales"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — guardas funcionales</h3>
<pre><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-attr">authGuard</span>: <span class="hljs-title class_">CanActivateFn</span> = <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">const</span> auth = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">AuthService</span>);
  <span class="hljs-keyword">return</span> auth.<span class="hljs-title function_">autenticado</span>() ? <span class="hljs-literal">true</span> : <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">Router</span>).<span class="hljs-title function_">createUrlTree</span>([<span class="hljs-string">&#x27;/login&#x27;</span>]);
};

{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;pedidos&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">Pedidos</span>, <span class="hljs-attr">canActivate</span>: [authGuard] }
</code></pre>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue--guarda-global-con-meta"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — guarda global con <code>meta</code></h3>
<pre><code class="language-js">{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/pedidos&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">Pedidos</span>, <span class="hljs-attr">meta</span>: { <span class="hljs-attr">requiereAuth</span>: <span class="hljs-literal">true</span> } }

router.<span class="hljs-title function_">beforeEach</span>(<span class="hljs-function">(<span class="hljs-params">to</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> auth = <span class="hljs-title function_">useAuthStore</span>();
  <span class="hljs-keyword">if</span> (to.<span class="hljs-property">meta</span>.<span class="hljs-property">requiereAuth</span> &amp;&amp; !auth.<span class="hljs-property">autenticado</span>) <span class="hljs-keyword">return</span> { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/login&#x27;</span> };
});
</code></pre>
</step>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react--componente-protector-o-loader-con-redirect"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — componente protector (o <code>loader</code> con <code>redirect</code>)</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">RutaProtegida</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> { usuario } = <span class="hljs-title function_">useAuth</span>();
  <span class="hljs-keyword">return</span> usuario ? <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Outlet</span> /&gt;</span></span> : <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Navigate</span> <span class="hljs-attr">to</span>=<span class="hljs-string">&quot;/login&quot;</span> <span class="hljs-attr">replace</span> /&gt;</span></span>;
}

{ <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">RutaProtegida</span> /&gt;</span></span>, <span class="hljs-attr">children</span>: [{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;pedidos&#x27;</span>, <span class="hljs-attr">element</span>: <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Pedidos</span> /&gt;</span></span> }] }
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Una guarda <strong>no es seguridad</strong>: solo mejora la experiencia. Quien protege los datos es la <strong>API</strong> (401 / 403)</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="carga-diferida-lazy-loading">Carga diferida (<em>lazy loading</em>)</h2>
<ul>
<li>Sin carga diferida, el usuario descarga <strong>toda</strong> la app aunque solo visite el inicio</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// ⚛ React</span>
{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;admin&#x27;</span>, <span class="hljs-attr">lazy</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;./admin/Admin&#x27;</span>) }

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</span>
{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/admin&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;./admin/Admin.vue&#x27;</span>) }

<span class="hljs-comment">// 🅰 Angular — un componente o un archivo de rutas completo</span>
{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;admin&#x27;</span>, <span class="hljs-attr">loadComponent</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;./admin/admin&#x27;</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">m</span> =&gt;</span> m.<span class="hljs-property">Admin</span>) }
{ <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;productos&#x27;</span>, <span class="hljs-attr">loadChildren</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;./features/productos/productos.routes&#x27;</span>) }
</code></pre>
<ul>
<li>El empaquetador (Vite / esbuild) crea un <strong>chunk</strong> separado por cada <code>import()</code> dinámico</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Medible con el análisis de bundle del tema <em>Rendimiento web</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-dN4TT6c5="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="35" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="pipes-y-directivas">Pipes y directivas</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Directivas: estructurales y de atributo</li>
<li>Directivas personalizadas</li>
<li>Pipes: transformar datos en la vista</li>
<li>Equivalentes en Vue y React</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="directivas-extender-el-html">Directivas: extender el HTML</h2>
<ul>
<li>Una <strong>directiva</strong> es una instrucción en la plantilla que agrega comportamiento a un elemento</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B1-estructurales"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Estructurales</h3>
<p>Agregan o quitan elementos del DOM</p>
<ul>
<li><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> <code>@if</code>, <code>@for</code>, <code>@switch</code> (antes <code>*ngIf</code>, <code>*ngFor</code>)</li>
<li><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> <code>v-if</code>, <code>v-for</code>, <code>v-show</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%A8-de-atributo"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> De atributo</h3>
<p>Cambian apariencia o comportamiento de un elemento existente</p>
<ul>
<li><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> <code>[class.x]</code>, <code>[style.x]</code>, <code>ngModel</code>, <code>routerLink</code></li>
<li><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> <code>v-bind</code>, <code>v-model</code>, <code>v-on</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%A7%A9-componentes-1"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Componentes</h3>
<p>En Angular, un componente <strong>es</strong> una directiva con plantilla</p>
</div>
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-%C2%BFy-react"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> ¿Y React?</h3>
<p><strong>No tiene directivas</strong>: usa JavaScript (<code>&amp;&amp;</code>, <code>map</code>) y <em>hooks</em> personalizados para reutilizar comportamiento</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="directiva-personalizada">Directiva personalizada</h2>
<steps>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--directive"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — <code>@Directive</code></h3>
<pre><code class="language-ts"><span class="hljs-meta">@Directive</span>({
  <span class="hljs-attr">selector</span>: <span class="hljs-string">&#x27;[appResaltar]&#x27;</span>,
  <span class="hljs-attr">host</span>: {
    <span class="hljs-string">&#x27;(mouseenter)&#x27;</span>: <span class="hljs-string">&#x27;activo.set(true)&#x27;</span>,
    <span class="hljs-string">&#x27;(mouseleave)&#x27;</span>: <span class="hljs-string">&#x27;activo.set(false)&#x27;</span>,
    <span class="hljs-string">&#x27;[style.backgroundColor]&#x27;</span>: <span class="hljs-string">&#x27;activo() ? color() : null&#x27;</span>,
  },
})
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Resaltar</span> {
  color = <span class="hljs-title function_">input</span>(<span class="hljs-string">&#x27;gold&#x27;</span>, { <span class="hljs-attr">alias</span>: <span class="hljs-string">&#x27;appResaltar&#x27;</span> });
  activo = <span class="hljs-title function_">signal</span>(<span class="hljs-literal">false</span>);
}
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">appResaltar</span>=<span class="hljs-string">&quot;lightblue&quot;</span>&gt;</span>Pase el mouse por aquí<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
</code></pre>
</step>
<step>
<h3 id="%F0%9F%92%9A-vue--objeto-con-hooks-de-directiva"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue — objeto con <em>hooks</em> de directiva</h3>
<pre><code class="language-ts">&lt;script setup&gt;
<span class="hljs-comment">// Cualquier variable vNombre se registra como directiva v-nombre</span>
<span class="hljs-keyword">const</span> vFoco = { <span class="hljs-attr">mounted</span>: <span class="hljs-function">(<span class="hljs-params">el</span>) =&gt;</span> el.<span class="hljs-title function_">focus</span>() };
<span class="hljs-keyword">const</span> vResaltar = {
  <span class="hljs-title function_">mounted</span>(<span class="hljs-params">el, { value = <span class="hljs-string">&#x27;gold&#x27;</span> }</span>) {
    el.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;mouseenter&#x27;</span>, <span class="hljs-function">() =&gt;</span> (el.<span class="hljs-property">style</span>.<span class="hljs-property">background</span> = value));
    el.<span class="hljs-title function_">addEventListener</span>(<span class="hljs-string">&#x27;mouseleave&#x27;</span>, <span class="hljs-function">() =&gt;</span> (el.<span class="hljs-property">style</span>.<span class="hljs-property">background</span> = <span class="hljs-string">&#x27;&#x27;</span>));
  },
};
&lt;/script&gt;

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">v-foco</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">&quot;Buscar…&quot;</span> /&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p</span> <span class="hljs-attr">v-resaltar</span>=<span class="hljs-string">&quot;&#x27;lightblue&#x27;&quot;</span>&gt;</span>Pase el mouse por aquí<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span></span>
</code></pre>
</step>
<step>
<h3 id="%E2%9A%9B%EF%B8%8F-react--un-hook-personalizado"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React — un <em>hook</em> personalizado</h3>
<pre><code class="language-jsx"><span class="hljs-keyword">function</span> <span class="hljs-title function_">useResaltar</span>(<span class="hljs-params">color = <span class="hljs-string">&#x27;gold&#x27;</span></span>) {
  <span class="hljs-keyword">const</span> [activo, setActivo] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">false</span>);
  <span class="hljs-keyword">return</span> {
    <span class="hljs-attr">onMouseEnter</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">setActivo</span>(<span class="hljs-literal">true</span>),
    <span class="hljs-attr">onMouseLeave</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">setActivo</span>(<span class="hljs-literal">false</span>),
    <span class="hljs-attr">style</span>: { <span class="hljs-attr">background</span>: activo ? color : <span class="hljs-literal">undefined</span> },
  };
}

<span class="hljs-keyword">function</span> <span class="hljs-title function_">Parrafo</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> resaltar = <span class="hljs-title function_">useResaltar</span>(<span class="hljs-string">&#x27;lightblue&#x27;</span>);
  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span> {<span class="hljs-attr">...resaltar</span>}&gt;</span>Pase el mouse por aquí<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>;
}
</code></pre>
<ul>
<li>Mismo resultado: la reutilización se hace con <strong>funciones</strong>, no con atributos mágicos</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="pipes-transformar-datos-en-la-vista">Pipes: transformar datos en la vista</h2>
<ul>
<li>Un <strong>pipe</strong> toma un valor y devuelve otro <strong>solo para mostrarlo</strong>, sin cambiar el dato original</li>
</ul>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- 🅰 Angular: pipes integrados --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ producto().precio | currency:&#x27;CRC&#x27;:&#x27;symbol-narrow&#x27;:&#x27;1.0-0&#x27; }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>   <span class="hljs-comment">&lt;!-- ₡12 500 --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ pedido().fecha | date:&#x27;dd/MM/yyyy&#x27; }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>                          <span class="hljs-comment">&lt;!-- 21/10/2026 --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ cliente().nombre | uppercase }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>{{ 0.135 | percent:&#x27;1.1-1&#x27; }}<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span>                                     <span class="hljs-comment">&lt;!-- 13,5 % --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">pre</span>&gt;</span>{{ respuesta() | json }}<span class="hljs-tag">&lt;/<span class="hljs-name">pre</span>&gt;</span>
</code></pre>
<table>
<thead>
<tr>
<th style="text-align:left">Pipe</th>
<th style="text-align:left">Uso</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>date</code>, <code>currency</code>, <code>number</code>, <code>percent</code></td>
<td style="text-align:left">Formatos con la configuración regional (<code>LOCALE_ID</code>)</td>
</tr>
<tr>
<td style="text-align:left"><code>uppercase</code>, <code>lowercase</code>, <code>titlecase</code>, <code>slice</code></td>
<td style="text-align:left">Texto y arreglos</td>
</tr>
<tr>
<td style="text-align:left"><code>async</code></td>
<td style="text-align:left">Se suscribe a un <strong>Observable / Promise</strong> y muestra el último valor</td>
</tr>
<tr>
<td style="text-align:left"><code>json</code>, <code>keyvalue</code></td>
<td style="text-align:left">Depuración y recorrer objetos</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="pipe-personalizado">Pipe personalizado</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// shared/pipes/colones.ts</span>
<span class="hljs-meta">@Pipe</span>({ <span class="hljs-attr">name</span>: <span class="hljs-string">&#x27;colones&#x27;</span> })
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ColonesPipe</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PipeTransform</span> {
  <span class="hljs-keyword">private</span> fmt = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">NumberFormat</span>(<span class="hljs-string">&#x27;es-CR&#x27;</span>, {
    <span class="hljs-attr">style</span>: <span class="hljs-string">&#x27;currency&#x27;</span>,
    <span class="hljs-attr">currency</span>: <span class="hljs-string">&#x27;CRC&#x27;</span>,
    <span class="hljs-attr">maximumFractionDigits</span>: <span class="hljs-number">0</span>,
  });

  <span class="hljs-title function_">transform</span>(<span class="hljs-attr">valor</span>: <span class="hljs-built_in">number</span> | <span class="hljs-literal">null</span>): <span class="hljs-built_in">string</span> {
    <span class="hljs-keyword">return</span> valor == <span class="hljs-literal">null</span> ? <span class="hljs-string">&#x27;—&#x27;</span> : <span class="hljs-variable language_">this</span>.<span class="hljs-property">fmt</span>.<span class="hljs-title function_">format</span>(valor);
  }
}
</code></pre>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Importar en el componente: imports: [ColonesPipe] --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">td</span>&gt;</span>{{ item.subtotal | colones }}<span class="hljs-tag">&lt;/<span class="hljs-name">td</span>&gt;</span>
</code></pre>
</div>
<div>
<ul>
<li>Los pipes son <strong>puros</strong> por defecto: solo se recalculan si cambia la <strong>entrada</strong>, no en cada ciclo</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> No ponga lógica de negocio en un pipe: solo <strong>presentación</strong></li>
</ul>
<br />
<h3 id="%F0%9F%92%9A-vue-y-%E2%9A%9B%EF%B8%8F-react"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue y <img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</h3>
<ul>
<li>Vue 2 tenía <em>filters</em> (<code>{{ x | moneda }}</code>); <strong>Vue 3 los eliminó</strong></li>
<li>En ambos se usa una <strong>función</strong> o un valor <strong>computado</strong>:</li>
</ul>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-title function_">colones</span> = (<span class="hljs-params">v</span>) =&gt; fmt.<span class="hljs-title function_">format</span>(v);
<span class="hljs-comment">// Vue:   {{ colones(item.subtotal) }}</span>
<span class="hljs-comment">// React: {colones(item.subtotal)}</span>
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-5SwWiJbQ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="40" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="decoradores-y-objetos-observables">Decoradores y objetos observables</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Decoradores en TypeScript y Angular</li>
<li>Inyección de dependencias</li>
<li>El patrón observador y RxJS</li>
<li>Observables, promesas y signals</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="decoradores">Decoradores</h2>
<ul>
<li>Un <strong>decorador</strong> (<code>@nombre(...)</code>) es una función que se aplica a una clase, método o propiedad para <strong>agregarle metadatos o comportamiento</strong> sin cambiar su código. Existe en TypeScript y se estandariza en JavaScript (TC39)</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular-vive-de-ellos"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular vive de ellos</h3>
<p><code>@Component</code>, <code>@Directive</code>, <code>@Pipe</code>, <code>@Injectable</code>, <code>@Service</code> (v22): le dicen al compilador <strong>qué es</strong> cada clase</p>
</div>
<div>
<h3 id="%F0%9F%92%9A-vue-2"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</h3>
<p>No los usa. El viejo <code>vue-class-component</code> está <strong>obsoleto</strong>; hoy todo son funciones (<code>defineProps</code>, <code>ref</code>)</p>
</div>
<div>
<h3 id="%E2%9A%9B%EF%B8%8F-react-2"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</h3>
<p>No los usa. Los componentes son <strong>funciones</strong>; los &quot;decoradores&quot; equivalen a <em>higher-order components</em> o <em>hooks</em></p>
</div>
<div>
<h3 id="%F0%9F%94%97-back-end"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Back-end</h3>
<p>Los mismos que vieron en <strong>NestJS</strong> (<code>@Controller</code>, <code>@Get</code>) y los <strong>atributos</strong> de Laravel 13 / C#</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Angular está moviendo los decoradores de propiedades a <strong>funciones</strong>: <code>@Input()</code> → <code>input()</code>, <code>@Output()</code> → <code>output()</code>, <code>@ViewChild()</code> → <code>viewChild()</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="decoradores-de-clase--inyecci%C3%B3n-de-dependencias">Decoradores de clase + inyección de dependencias</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// Angular ≤ 21</span>
<span class="hljs-meta">@Injectable</span>({ <span class="hljs-attr">providedIn</span>: <span class="hljs-string">&#x27;root&#x27;</span> })
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProductosService</span> { <span class="hljs-comment">/* ... */</span> }

<span class="hljs-comment">// Angular 22: atajo equivalente</span>
<span class="hljs-meta">@Service</span>()
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProductosService</span> {
  <span class="hljs-keyword">private</span> http = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">HttpClient</span>);

  <span class="hljs-title function_">listar</span>(<span class="hljs-params"></span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">http</span>.<span class="hljs-property">get</span>&lt;<span class="hljs-title class_">Producto</span>[]&gt;(<span class="hljs-string">&#x27;/api/productos&#x27;</span>);
  }
}

<span class="hljs-comment">// En cualquier componente</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ListaProductos</span> {
  <span class="hljs-keyword">private</span> productos = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">ProductosService</span>);
}
</code></pre>
</div>
<div>
<ul>
<li><code>providedIn: 'root'</code> → <strong>una sola instancia</strong> (singleton) para toda la app</li>
<li><code>inject()</code> pide la dependencia al <strong>inyector</strong>: el componente no hace <code>new</code></li>
<li>Ventaja: en pruebas se <strong>reemplaza</strong> el servicio por un falso sin tocar el componente</li>
</ul>
<br />
<table>
<thead>
<tr>
<th style="text-align:left"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>createContext</code> + <code>useContext</code></td>
<td style="text-align:left"><code>provide</code> / <code>inject</code></td>
</tr>
</tbody>
</table>
<ul>
<li>Misma idea, sin decoradores</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="el-patr%C3%B3n-observador">El patrón observador</h2>
<pre><code class="language-text">        Productor (Observable)                      Consumidores (Observers)
   ──●─────●─────●──────────●───────|──►           subscribe({
     &quot;a&quot;   &quot;ab&quot;  &quot;abc&quot;     &quot;abcd&quot;   fin              next:  v =&gt; ...,   ← cada valor
                                                     error: e =&gt; ...,   ← si falla
   tiempo ──────────────────────────────►            complete: () =&gt; ...← al terminar
                                                   })
</code></pre>
<ul>
<li>Un <strong>Observable</strong> representa un <strong>flujo de valores en el tiempo</strong>: teclas, clics, respuestas HTTP, mensajes de un WebSocket</li>
<li>Es <strong>perezoso</strong>: no hace nada hasta que alguien se <strong>suscribe</strong></li>
<li>Se puede <strong>cancelar</strong> (<code>unsubscribe</code>) — una promesa no</li>
<li>Angular usa la librería <strong>RxJS</strong> para esto (<code>HttpClient</code>, eventos del router, formularios reactivos)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="rxjs-operadores">RxJS: operadores</h2>
<ul>
<li>Los operadores se encadenan con <code>pipe()</code> y transforman el flujo — como <code>map</code> / <code>filter</code> de los arreglos, pero <strong>en el tiempo</strong></li>
</ul>
<pre><code class="language-ts"><span class="hljs-comment">// Buscador que no satura la API</span>
termino$ = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Subject</span>&lt;<span class="hljs-built_in">string</span>&gt;();

resultados$ = <span class="hljs-variable language_">this</span>.<span class="hljs-property">termino$</span>.<span class="hljs-title function_">pipe</span>(
  <span class="hljs-title function_">map</span>(<span class="hljs-function"><span class="hljs-params">t</span> =&gt;</span> t.<span class="hljs-title function_">trim</span>()),
  <span class="hljs-title function_">filter</span>(<span class="hljs-function"><span class="hljs-params">t</span> =&gt;</span> t.<span class="hljs-property">length</span> &gt;= <span class="hljs-number">3</span>),          <span class="hljs-comment">// ignora búsquedas cortas</span>
  <span class="hljs-title function_">debounceTime</span>(<span class="hljs-number">300</span>),                    <span class="hljs-comment">// espera a que deje de teclear</span>
  <span class="hljs-title function_">distinctUntilChanged</span>(),               <span class="hljs-comment">// no repite la misma búsqueda</span>
  <span class="hljs-title function_">switchMap</span>(<span class="hljs-function"><span class="hljs-params">t</span> =&gt;</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">api</span>.<span class="hljs-title function_">buscar</span>(t)),   <span class="hljs-comment">// cancela la petición anterior si llega otra</span>
  <span class="hljs-title function_">catchError</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">of</span>([])),
);
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">input</span> (<span class="hljs-attr">input</span>)=<span class="hljs-string">&quot;termino$.next($any($event.target).value)&quot;</span> /&gt;</span>
@for (p of resultados$ | async; track p.id) { <span class="hljs-tag">&lt;<span class="hljs-name">li</span>&gt;</span>{{ p.nombre }}<span class="hljs-tag">&lt;/<span class="hljs-name">li</span>&gt;</span> }
</code></pre>
<ul>
<li><code>| async</code> se suscribe y <strong>se desuscribe solo</strong> al destruir el componente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="observables-promesas-y-signals">Observables, promesas y signals</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left">Promise</th>
<th style="text-align:left">Observable (RxJS)</th>
<th style="text-align:left">Signal</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">Valores</td>
<td style="text-align:left"><strong>Uno</strong></td>
<td style="text-align:left"><strong>Muchos</strong> en el tiempo</td>
<td style="text-align:left"><strong>Uno actual</strong> (siempre tiene valor)</td>
</tr>
<tr>
<td style="text-align:left">Ejecución</td>
<td style="text-align:left">Inmediata</td>
<td style="text-align:left">Perezosa (al suscribirse)</td>
<td style="text-align:left">Síncrona al leer</td>
</tr>
<tr>
<td style="text-align:left">Cancelable</td>
<td style="text-align:left">No (<code>AbortController</code> aparte)</td>
<td style="text-align:left">Sí (<code>unsubscribe</code>)</td>
<td style="text-align:left">No aplica</td>
</tr>
<tr>
<td style="text-align:left">Ideal para</td>
<td style="text-align:left">Una petición</td>
<td style="text-align:left">Eventos, <em>streams</em>, WebSockets</td>
<td style="text-align:left"><strong>Estado</strong> de la interfaz</td>
</tr>
<tr>
<td style="text-align:left">Lectura</td>
<td style="text-align:left"><code>await p</code></td>
<td style="text-align:left"><code>subscribe()</code> / <code>| async</code></td>
<td style="text-align:left"><code>contador()</code></td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular moderno: <strong>signals para el estado</strong>, RxJS para <strong>eventos asíncronos complejos</strong>. Se convierten con <code>toSignal()</code> y <code>toObservable()</code></li>
<li><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue: <code>ref</code> y <code>computed</code> <strong>son</strong> signals desde siempre; el <code>watch</code> cumple el papel del observador</li>
<li><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React: no tiene signals; <code>useState</code> provoca un <strong>re-render</strong> del componente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="signals-en-los-tres-la-misma-idea">Signals en los tres: la misma idea</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// 🅰 Angular</span>
<span class="hljs-keyword">const</span> precio = <span class="hljs-title function_">signal</span>(<span class="hljs-number">1000</span>);
<span class="hljs-keyword">const</span> cantidad = <span class="hljs-title function_">signal</span>(<span class="hljs-number">2</span>);
<span class="hljs-keyword">const</span> total = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-title function_">precio</span>() * <span class="hljs-title function_">cantidad</span>());
<span class="hljs-title function_">effect</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Total&#x27;</span>, <span class="hljs-title function_">total</span>()));

cantidad.<span class="hljs-title function_">set</span>(<span class="hljs-number">3</span>);          <span class="hljs-comment">// total → 3000, el effect se ejecuta</span>
</code></pre>
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue</span>
<span class="hljs-keyword">const</span> precio = <span class="hljs-title function_">ref</span>(<span class="hljs-number">1000</span>);
<span class="hljs-keyword">const</span> cantidad = <span class="hljs-title function_">ref</span>(<span class="hljs-number">2</span>);
<span class="hljs-keyword">const</span> total = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> precio.<span class="hljs-property">value</span> * cantidad.<span class="hljs-property">value</span>);
<span class="hljs-title function_">watchEffect</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Total&#x27;</span>, total.<span class="hljs-property">value</span>));

cantidad.<span class="hljs-property">value</span> = <span class="hljs-number">3</span>;
</code></pre>
</div>
<div>
<pre><code class="language-jsx"><span class="hljs-comment">// ⚛ React</span>
<span class="hljs-keyword">const</span> [precio] = <span class="hljs-title function_">useState</span>(<span class="hljs-number">1000</span>);
<span class="hljs-keyword">const</span> [cantidad, setCantidad] = <span class="hljs-title function_">useState</span>(<span class="hljs-number">2</span>);
<span class="hljs-keyword">const</span> total = precio * cantidad;   <span class="hljs-comment">// se recalcula en cada render</span>
<span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;Total&#x27;</span>, total), [total]);

<span class="hljs-title function_">setCantidad</span>(<span class="hljs-number">3</span>);   <span class="hljs-comment">// vuelve a ejecutar TODO el componente</span>
</code></pre>
<ul>
<li><strong>Reactividad fina</strong> (Angular, Vue): el sistema sabe exactamente <strong>quién depende de quién</strong></li>
<li><strong>Re-render</strong> (React): se recalcula todo y se compara; el <strong>React Compiler</strong> memoriza automáticamente para evitar trabajo extra</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-marpit-scope-XQKIcsZZ="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="47" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="68">
<h1 id="consumo-de-servicios-web">Consumo de servicios web</h1>
<h2 id="contenidos-8">Contenidos</h2>
<ul>
<li>Los tres estados de una petición</li>
<li>HTTP en Angular, Vue y React</li>
<li>Interceptores y autenticación</li>
<li>CORS, proxies y variables de entorno</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="toda-petici%C3%B3n-tiene-tres-estados">Toda petición tiene tres estados</h2>
<split-slide style="--left: 50%; --right: 50%;">
<div>
<pre><code class="language-text">            ┌──────────────┐
  inicio ─► │  cargando…   │
            └──────┬───────┘
          ┌────────┴────────┐
          ▼                 ▼
   ┌────────────┐    ┌────────────┐
   │   datos    │    │   error    │
   │ (200/201)  │    │ (4xx/5xx)  │
   └────────────┘    └────────────┘
</code></pre>
</div>
<div>
<ul>
<li>La interfaz <strong>debe</strong> mostrar los tres: un <em>spinner</em>, el resultado o un mensaje útil</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> El error más común: solo programar el &quot;camino feliz&quot;</li>
<li>Errores esperables de la API del curso:
<ul>
<li><strong>401</strong> → redirigir a <em>login</em></li>
<li><strong>403</strong> → &quot;no tiene permiso&quot;</li>
<li><strong>422</strong> → mostrar errores <strong>por campo</strong> del formulario</li>
<li><strong>409</strong> → mensaje de regla de negocio</li>
</ul>
</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> Repase <code>fetch</code>, <code>async/await</code> y <code>AbortController</code> en el tema <em>Asincronía</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%F0%9F%85%B0%EF%B8%8F-angular-httpclient-y-httpresource"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular: <code>HttpClient</code> y <code>httpResource</code></h2>
<split-slide style="--left: 52%; --right: 48%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// app.config.ts</span>
<span class="hljs-attr">providers</span>: [<span class="hljs-title function_">provideHttpClient</span>(<span class="hljs-title function_">withInterceptors</span>([authInterceptor]))]

<span class="hljs-comment">// productos.service.ts — Observables</span>
<span class="hljs-meta">@Service</span>()
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ProductosService</span> {
  <span class="hljs-keyword">private</span> http = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">HttpClient</span>);
  <span class="hljs-keyword">private</span> url = <span class="hljs-string">`<span class="hljs-subst">${environment.apiUrl}</span>/productos`</span>;

  <span class="hljs-title function_">listar</span>(<span class="hljs-params"></span>)          { <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">http</span>.<span class="hljs-property">get</span>&lt;<span class="hljs-title class_">Producto</span>[]&gt;(<span class="hljs-variable language_">this</span>.<span class="hljs-property">url</span>); }
  <span class="hljs-title function_">obtener</span>(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span></span>) { <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">http</span>.<span class="hljs-property">get</span>&lt;<span class="hljs-title class_">Producto</span>&gt;(<span class="hljs-string">`<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.url}</span>/<span class="hljs-subst">${id}</span>`</span>); }
  <span class="hljs-title function_">crear</span>(<span class="hljs-params"><span class="hljs-attr">p</span>: <span class="hljs-title class_">NuevoProducto</span></span>) { <span class="hljs-keyword">return</span> <span class="hljs-variable language_">this</span>.<span class="hljs-property">http</span>.<span class="hljs-property">post</span>&lt;<span class="hljs-title class_">Producto</span>&gt;(<span class="hljs-variable language_">this</span>.<span class="hljs-property">url</span>, p); }
}
</code></pre>
<ul>
<li>Desde v22 <code>HttpClient</code> usa <strong><code>fetch</code></strong> por debajo (<code>withFetch()</code> queda obsoleto)</li>
</ul>
</div>
<div>
<pre><code class="language-ts"><span class="hljs-comment">// Componente — httpResource (estable en v22)</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">DetalleProducto</span> {
  id = input.<span class="hljs-property">required</span>&lt;<span class="hljs-built_in">number</span>&gt;();

  producto = httpResource&lt;<span class="hljs-title class_">Producto</span>&gt;(
    <span class="hljs-function">() =&gt;</span> <span class="hljs-string">`<span class="hljs-subst">${environment.apiUrl}</span>/productos/<span class="hljs-subst">${<span class="hljs-variable language_">this</span>.id()}</span>`</span>
  );
}
</code></pre>
<pre><code class="language-html">@if (producto.isLoading()) { <span class="hljs-tag">&lt;<span class="hljs-name">app-spinner</span> /&gt;</span> }
@else if (producto.error()) { <span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>No se pudo cargar<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span> }
@else if (producto.hasValue()) {
  <span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>{{ producto.value().nombre }}<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span>
}
</code></pre>
<ul>
<li>Si cambia <code>id()</code>, <strong>vuelve a pedir</strong> y cancela la anterior</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%F0%9F%92%9A-vue-un-composable-con-fetch"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> Vue: un <em>composable</em> con <code>fetch</code></h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-js"><span class="hljs-comment">// composables/useFetch.js</span>
<span class="hljs-keyword">import</span> { ref, toValue, watchEffect } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">useFetch</span>(<span class="hljs-params">url</span>) {
  <span class="hljs-keyword">const</span> datos = <span class="hljs-title function_">ref</span>(<span class="hljs-literal">null</span>);
  <span class="hljs-keyword">const</span> error = <span class="hljs-title function_">ref</span>(<span class="hljs-literal">null</span>);
  <span class="hljs-keyword">const</span> cargando = <span class="hljs-title function_">ref</span>(<span class="hljs-literal">false</span>);

  <span class="hljs-title function_">watchEffect</span>(<span class="hljs-title function_">async</span> (onCleanup) =&gt; {
    <span class="hljs-keyword">const</span> ctrl = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();
    <span class="hljs-title function_">onCleanup</span>(<span class="hljs-function">() =&gt;</span> ctrl.<span class="hljs-title function_">abort</span>());        <span class="hljs-comment">// cancela si cambia la URL</span>
    cargando.<span class="hljs-property">value</span> = <span class="hljs-literal">true</span>; error.<span class="hljs-property">value</span> = <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">try</span> {
      <span class="hljs-keyword">const</span> r = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-title function_">toValue</span>(url), { <span class="hljs-attr">signal</span>: ctrl.<span class="hljs-property">signal</span> });
      <span class="hljs-keyword">if</span> (!r.<span class="hljs-property">ok</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Error</span>(<span class="hljs-string">`HTTP <span class="hljs-subst">${r.status}</span>`</span>);
      datos.<span class="hljs-property">value</span> = <span class="hljs-keyword">await</span> r.<span class="hljs-title function_">json</span>();
    } <span class="hljs-keyword">catch</span> (e) {
      <span class="hljs-keyword">if</span> (e.<span class="hljs-property">name</span> !== <span class="hljs-string">&#x27;AbortError&#x27;</span>) error.<span class="hljs-property">value</span> = e;
    } <span class="hljs-keyword">finally</span> { cargando.<span class="hljs-property">value</span> = <span class="hljs-literal">false</span>; }
  });

  <span class="hljs-keyword">return</span> { datos, error, cargando };
}
</code></pre>
</div>
<div>
<pre><code class="language-vue">&lt;script setup&gt;
const props = defineProps(['id']);
const { datos, error, cargando } =
  useFetch(() =&gt; `${API}/productos/${props.id}`);
&lt;/script&gt;

&lt;template&gt;
  &lt;Spinner v-if=&quot;cargando&quot; /&gt;
  &lt;p v-else-if=&quot;error&quot;&gt;No se pudo cargar&lt;/p&gt;
  &lt;h2 v-else-if=&quot;datos&quot;&gt;{{ datos.nombre }}&lt;/h2&gt;
&lt;/template&gt;
</code></pre>
<ul>
<li>Un <strong>composable</strong> es la forma de reutilizar lógica con estado en Vue</li>
<li>Hay versiones listas: <code>useFetch</code> de <strong>VueUse</strong>, <strong>TanStack Query</strong> para Vue</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="%E2%9A%9B%EF%B8%8F-react-useeffect-o-mejor-tanstack-query"><img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> React: <code>useEffect</code>… o mejor TanStack Query</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.78rem;">
<div>
<pre><code class="language-jsx"><span class="hljs-comment">// A mano: hay que cuidar carreras y limpieza</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">DetalleProducto</span>(<span class="hljs-params">{ id }</span>) {
  <span class="hljs-keyword">const</span> [datos, setDatos] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">null</span>);
  <span class="hljs-keyword">const</span> [error, setError] = <span class="hljs-title function_">useState</span>(<span class="hljs-literal">null</span>);

  <span class="hljs-title function_">useEffect</span>(<span class="hljs-function">() =&gt;</span> {
    <span class="hljs-keyword">const</span> ctrl = <span class="hljs-keyword">new</span> <span class="hljs-title class_">AbortController</span>();
    <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`<span class="hljs-subst">${API}</span>/productos/<span class="hljs-subst">${id}</span>`</span>, { <span class="hljs-attr">signal</span>: ctrl.<span class="hljs-property">signal</span> })
      .<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-property">ok</span> ? r.<span class="hljs-title function_">json</span>() : <span class="hljs-title class_">Promise</span>.<span class="hljs-title function_">reject</span>(r.<span class="hljs-property">status</span>))
      .<span class="hljs-title function_">then</span>(setDatos)
      .<span class="hljs-title function_">catch</span>(<span class="hljs-function"><span class="hljs-params">e</span> =&gt;</span> e.<span class="hljs-property">name</span> !== <span class="hljs-string">&#x27;AbortError&#x27;</span> &amp;&amp; <span class="hljs-title function_">setError</span>(e));
    <span class="hljs-keyword">return</span> <span class="hljs-function">() =&gt;</span> ctrl.<span class="hljs-title function_">abort</span>();            <span class="hljs-comment">// limpieza</span>
  }, [id]);                               <span class="hljs-comment">// ⚠ dependencias</span>

  <span class="hljs-keyword">if</span> (error) <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>No se pudo cargar<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>;
  <span class="hljs-keyword">if</span> (!datos) <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Spinner</span> /&gt;</span></span>;
  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>{datos.nombre}<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span></span>;
}
</code></pre>
</div>
<div>
<pre><code class="language-jsx"><span class="hljs-comment">// Con TanStack Query: caché, reintentos, recarga</span>
<span class="hljs-keyword">function</span> <span class="hljs-title function_">DetalleProducto</span>(<span class="hljs-params">{ id }</span>) {
  <span class="hljs-keyword">const</span> { data, isPending, error } = <span class="hljs-title function_">useQuery</span>({
    <span class="hljs-attr">queryKey</span>: [<span class="hljs-string">&#x27;producto&#x27;</span>, id],
    <span class="hljs-attr">queryFn</span>: <span class="hljs-function">() =&gt;</span>
      <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`<span class="hljs-subst">${API}</span>/productos/<span class="hljs-subst">${id}</span>`</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-title function_">json</span>()),
  });

  <span class="hljs-keyword">if</span> (isPending) <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">Spinner</span> /&gt;</span></span>;
  <span class="hljs-keyword">if</span> (error) <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">p</span>&gt;</span>No se pudo cargar<span class="hljs-tag">&lt;/<span class="hljs-name">p</span>&gt;</span></span>;
  <span class="hljs-keyword">return</span> <span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">h2</span>&gt;</span>{data.nombre}<span class="hljs-tag">&lt;/<span class="hljs-name">h2</span>&gt;</span></span>;
}
</code></pre>
<ul>
<li>La documentación de React recomienda <strong>no</strong> hacer <em>fetching</em> a mano con <code>useEffect</code> en apps reales: use una librería o un <em>framework</em></li>
<li>React 19 agrega <code>use(promesa)</code> + <code>&lt;Suspense&gt;</code> para leer datos asíncronos</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="interceptores-el-token-en-cada-petici%C3%B3n">Interceptores: el token en cada petición</h2>
<ul>
<li>La API del tema de back-end usa <strong>Sanctum</strong> con <code>Authorization: Bearer &lt;token&gt;</code>. No lo repita en cada llamada: <strong>intercéptelo</strong></li>
</ul>
<steps>
<step>
<h3 id="%F0%9F%85%B0%EF%B8%8F-angular--httpinterceptorfn"><img class="emoji" draggable="false" alt="🅰️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f170.svg" data-marp-twemoji=""/> Angular — <code>HttpInterceptorFn</code></h3>
<pre><code class="language-ts"><span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> <span class="hljs-attr">authInterceptor</span>: <span class="hljs-title class_">HttpInterceptorFn</span> = <span class="hljs-function">(<span class="hljs-params">req, next</span>) =&gt;</span> {
  <span class="hljs-keyword">const</span> token = <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">AuthService</span>).<span class="hljs-title function_">token</span>();
  <span class="hljs-keyword">const</span> conToken = token ? req.<span class="hljs-title function_">clone</span>({ <span class="hljs-attr">setHeaders</span>: { <span class="hljs-title class_">Authorization</span>: <span class="hljs-string">`Bearer <span class="hljs-subst">${token}</span>`</span> } }) : req;

  <span class="hljs-keyword">return</span> <span class="hljs-title function_">next</span>(conToken).<span class="hljs-title function_">pipe</span>(
    <span class="hljs-title function_">catchError</span>(<span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">err</span>: <span class="hljs-title class_">HttpErrorResponse</span></span>) =&gt;</span> {
      <span class="hljs-keyword">if</span> (err.<span class="hljs-property">status</span> === <span class="hljs-number">401</span>) <span class="hljs-title function_">inject</span>(<span class="hljs-title class_">Router</span>).<span class="hljs-title function_">navigate</span>([<span class="hljs-string">&#x27;/login&#x27;</span>]);
      <span class="hljs-keyword">return</span> <span class="hljs-title function_">throwError</span>(<span class="hljs-function">() =&gt;</span> err);
    }),
  );
};
</code></pre>
</step>
<step>
<h3 id="%F0%9F%92%9A-%E2%9A%9B%EF%B8%8F-vue-y-react--un-cliente-http-propio"><img class="emoji" draggable="false" alt="💚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f49a.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="⚛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/269b.svg" data-marp-twemoji=""/> Vue y React — un cliente HTTP propio</h3>
<pre><code class="language-js"><span class="hljs-comment">// api/cliente.js — se usa en lugar de fetch directo</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">api</span>(<span class="hljs-params">ruta, opciones = {}</span>) {
  <span class="hljs-keyword">const</span> token = <span class="hljs-variable language_">localStorage</span>.<span class="hljs-title function_">getItem</span>(<span class="hljs-string">&#x27;token&#x27;</span>);
  <span class="hljs-keyword">const</span> r = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`<span class="hljs-subst">${<span class="hljs-keyword">import</span>.meta.env.VITE_API_URL}</span><span class="hljs-subst">${ruta}</span>`</span>, {
    ...opciones,
    <span class="hljs-attr">headers</span>: {
      <span class="hljs-string">&#x27;Content-Type&#x27;</span>: <span class="hljs-string">&#x27;application/json&#x27;</span>,
      <span class="hljs-title class_">Accept</span>: <span class="hljs-string">&#x27;application/json&#x27;</span>,
      ...(token &amp;&amp; { <span class="hljs-title class_">Authorization</span>: <span class="hljs-string">`Bearer <span class="hljs-subst">${token}</span>`</span> }),
      ...opciones.<span class="hljs-property">headers</span>,
    },
  });
  <span class="hljs-keyword">if</span> (r.<span class="hljs-property">status</span> === <span class="hljs-number">401</span>) <span class="hljs-variable language_">window</span>.<span class="hljs-property">location</span>.<span class="hljs-title function_">assign</span>(<span class="hljs-string">&#x27;/login&#x27;</span>);
  <span class="hljs-keyword">if</span> (!r.<span class="hljs-property">ok</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">await</span> r.<span class="hljs-title function_">json</span>();          <span class="hljs-comment">// { message, errors } de Laravel</span>
  <span class="hljs-keyword">return</span> r.<span class="hljs-property">status</span> === <span class="hljs-number">204</span> ? <span class="hljs-literal">null</span> : r.<span class="hljs-title function_">json</span>();
}
<span class="hljs-comment">// Con axios: axios.interceptors.request.use(...)</span>
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="68">
<h2 id="cors-proxy-y-variables-de-entorno">CORS, proxy y variables de entorno</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%F0%9F%8C%90-cors-en-desarrollo"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> CORS en desarrollo</h3>
<ul>
<li><code>localhost:5173</code> → <code>localhost:8000</code> son <strong>orígenes distintos</strong>: el navegador bloquea si la API no responde con <code>Access-Control-Allow-Origin</code></li>
<li>Solución 1: configurar CORS en Laravel (<code>config/cors.php</code>)</li>
<li>Solución 2: un <strong>proxy</strong> del servidor de desarrollo</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// vite.config.js (React y Vue)</span>
<span class="hljs-attr">server</span>: {
  <span class="hljs-attr">proxy</span>: { <span class="hljs-string">&#x27;/api&#x27;</span>: <span class="hljs-string">&#x27;http://localhost:8000&#x27;</span> },
}
</code></pre>
<pre><code class="language-json"><span class="hljs-comment">// proxy.conf.json (Angular) → ng serve --proxy-config proxy.conf.json</span>
<span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;/api&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span> <span class="hljs-attr">&quot;target&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;http://localhost:8000&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;secure&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-literal"><span class="hljs-keyword">false</span></span> <span class="hljs-punctuation">}</span> <span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<h3 id="%F0%9F%94%A7-variables-de-entorno"><img class="emoji" draggable="false" alt="🔧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f527.svg" data-marp-twemoji=""/> Variables de entorno</h3>
<pre><code class="language-bash"><span class="hljs-comment"># .env.development  (Vite: solo se exponen las que empiezan con VITE_)</span>
VITE_API_URL=http://localhost:8000/api
</code></pre>
<pre><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">API</span> = <span class="hljs-keyword">import</span>.<span class="hljs-property">meta</span>.<span class="hljs-property">env</span>.<span class="hljs-property">VITE_API_URL</span>;
</code></pre>
<pre><code class="language-ts"><span class="hljs-comment">// Angular: ng generate environments</span>
<span class="hljs-comment">// src/environments/environment.development.ts</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> environment = {
  <span class="hljs-attr">apiUrl</span>: <span class="hljs-string">&#x27;http://localhost:8000/api&#x27;</span>,
};
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Todo lo que llega al navegador es <strong>público</strong>: nunca ponga secretos ni claves privadas en el front-end</li>
</ul>
</div>
</split-slide>
</section>

<h2 id="no-todo-el-estado-es-igual">No todo el estado es igual</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8F%A0-local"><img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e0.svg" data-marp-twemoji=""/> Local</h3>
<p>Un <em>input</em>, si un menú está abierto. Vive <strong>en el componente</strong></p>
</div>
<div>
<h3 id="%F0%9F%91%AA-compartido"><img class="emoji" draggable="false" alt="👪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f46a.svg" data-marp-twemoji=""/> Compartido</h3>
<p>Lo usan unos pocos componentes cercanos. Se <strong>sube al padre</strong> común</p>
</div>
<div>
<h3 id="%F0%9F%8C%8D-global"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Global</h3>
<p>Usuario autenticado, carrito, tema. Lo usa <strong>media aplicación</strong> → <em>store</em></p>
</div>
<div>
<h3 id="%E2%98%81%EF%B8%8F-del-servidor"><img class="emoji" draggable="false" alt="☁️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2601.svg" data-marp-twemoji=""/> Del servidor</h3>

</div>
<div>
<h3 id="%F0%9F%94%97-de-la-url"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> De la URL</h3>

<div>
<h3 id="%F0%9F%93%9D-de-formulario"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> De formulario</h3>

</div>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Regla de oro: ponga cada dato <strong>lo más cerca posible</strong> de donde se usa. Global solo lo que realmente es global</li>
</ul>
