<li><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Enmascarar en pantalla: <code>**** **** **** 4242</code></li>
<li><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Bitácoras <strong>sin</strong> contraseñas, tokens ni datos personales</li>
<li><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Errores sin trazas de pila ni mensajes de la BD</li>
<li><img class="emoji" draggable="false" alt="🔎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50e.svg" data-marp-twemoji=""/> El front-end <strong>no</strong> debe recibir datos &quot;para filtrarlos después&quot;: lo que llega al cliente, el atacante lo ve en DevTools</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="datos-en-el-dispositivo-m%C3%B3vil">Datos en el dispositivo móvil</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%E2%9D%8C-inseguro"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Inseguro</h3>
<ul>
<li><code>localStorage</code> / <code>@capacitor/preferences</code>: texto plano</li>
<li>SQLite sin cifrar</li>
<li>Archivos en almacenamiento <strong>externo</strong> compartido</li>
<li>Datos sensibles en <strong>bitácoras</strong> (<code>console.log</code> → <code>adb logcat</code>)</li>
<li>Capturas automáticas al pasar a segundo plano</li>
<li>Portapapeles con datos sensibles</li>
</ul>
</div>
<div>
<h3 id="%E2%9C%85-seguro"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Seguro</h3>
<ul>
<li>Tokens y secretos en <strong>Keychain</strong> (iOS) / <strong>Keystore</strong> (Android) mediante un plugin de <em>secure storage</em></li>
<li>SQLite cifrado (SQLCipher) si hay datos sensibles offline</li>
<li>Ocultar la vista al ir a segundo plano (<code>FLAG_SECURE</code> en Android)</li>
<li>Borrar los datos al cerrar sesión</li>
<li>Biometría para <strong>desbloquear</strong> la clave del Keystore, no como contraseña</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Supón que el dispositivo puede <strong>perderse, rootearse o tener <em>malware</em></strong>: OWASP Mobile <strong>M9 — Almacenamiento inseguro de datos</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="privacidad-ley-8968-y-buenas-pr%C3%A1cticas">Privacidad: Ley 8968 y buenas prácticas</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%9D-consentimiento-informado"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> Consentimiento informado</h3>
<p>Explicar <strong>qué</strong> datos, <strong>para qué</strong> y <strong>por cuánto</strong> tiempo antes de recolectarlos</p>
</div>
<div>
<h3 id="%F0%9F%A7%BE-derechos-arco"><img class="emoji" draggable="false" alt="🧾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9fe.svg" data-marp-twemoji=""/> Derechos ARCO</h3>
<p>Acceso, Rectificación, Cancelación y Oposición: la app debe permitir ejercerlos</p>
</div>
<div>
<h3 id="%F0%9F%8F%9B%EF%B8%8F-prodhab"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> PRODHAB</h3>
<p>Agencia de Protección de Datos de los Habitantes: supervisa la Ley 8968 en Costa Rica</p>
</div>
<div>
<h3 id="%F0%9F%93%8D-permisos-m%C3%B3viles"><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> Permisos móviles</h3>
<p>Pedir <strong>solo</strong> los necesarios, <strong>cuando</strong> se necesitan, explicando el motivo (<code>Info.plist</code>, <code>AndroidManifest.xml</code>)</p>
</div>
<div>
<h3 id="%F0%9F%8C%8D-alcance-internacional"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Alcance internacional</h3>
<p>Usuarios en Europa → <strong>RGPD</strong>; tiendas de apps exigen <strong>política de privacidad</strong> y etiquetas de datos</p>
</div>
<div>
<h3 id="%F0%9F%95%B5%EF%B8%8F-seudonimizar">🕵️ Seudonimizar</h3>
<p>Analítica y pruebas con datos <strong>anonimizados</strong>, nunca con la copia de producción</p>
</div>
</div>
<ul>
<li>OWASP Mobile <strong>M6 — Controles de privacidad inadecuados</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-scope-6aZ7FQ8a="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="23" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="64-seguridad-en-el-c%C3%B3digo">6.4 Seguridad en el código</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Validación de entradas</li>
<li>Secretos fuera del código</li>
<li>Dependencias y cadena de suministro</li>
<li>Revisión y análisis estático</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="validaci%C3%B3n-entradas-y-salidas">Validación: entradas y salidas</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// Form Request: el controlador nunca ve datos sin validar</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">rules</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
</span>{
    <span class="hljs-keyword">return</span> [
        <span class="hljs-string">&#x27;cantidad&#x27;</span>  =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>, <span class="hljs-string">&#x27;integer&#x27;</span>, <span class="hljs-string">&#x27;between:1,100&#x27;</span>],
        <span class="hljs-string">&#x27;correo&#x27;</span>    =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>, <span class="hljs-string">&#x27;email:rfc,dns&#x27;</span>],
        <span class="hljs-string">&#x27;estado&#x27;</span>    =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>, <span class="hljs-title class_">Rule</span>::<span class="hljs-title function_ invoke__">in</span>([<span class="hljs-string">&#x27;borrador&#x27;</span>, <span class="hljs-string">&#x27;enviado&#x27;</span>])],
        <span class="hljs-string">&#x27;foto&#x27;</span>      =&gt; [<span class="hljs-string">&#x27;image&#x27;</span>, <span class="hljs-string">&#x27;mimes:jpg,png&#x27;</span>, <span class="hljs-string">&#x27;max:2048&#x27;</span>],
    ];
}

<span class="hljs-comment">// Solo los campos validados</span>
<span class="hljs-variable">$pedido</span> = <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">create</span>(<span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">validated</span>());
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>Lista blanca</strong> (qué se acepta) mejor que lista negra (qué se rechaza)</li>
<li>Validar <strong>tipo, longitud, rango y formato</strong></li>
<li>La validación del cliente es para la <strong>experiencia</strong>; la del servidor es para la <strong>seguridad</strong></li>
<li><strong>Codificar la salida</strong> según el contexto: HTML, URL, JS, SQL</li>
<li>OWASP Mobile <strong>M4 — Validación insuficiente de entradas/salidas</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="manejo-de-errores-y-condiciones-excepcionales">Manejo de errores y condiciones excepcionales</h2>
<ul>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> <strong>A10:2025</strong> — un error mal manejado puede dejar el sistema en un estado inseguro</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Falla ABIERTO: si el servicio cae, deja pasar</span>
<span class="hljs-keyword">try</span> {
    <span class="hljs-variable">$permitido</span> = <span class="hljs-variable">$autorizador</span>-&gt;<span class="hljs-title function_ invoke__">verificar</span>(<span class="hljs-variable">$user</span>);
} <span class="hljs-keyword">catch</span> (<span class="hljs-built_in">Throwable</span> <span class="hljs-variable">$e</span>) {
    <span class="hljs-variable">$permitido</span> = <span class="hljs-literal">true</span>;
}

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Falla CERRADO</span>
<span class="hljs-keyword">try</span> {
    <span class="hljs-variable">$permitido</span> = <span class="hljs-variable">$autorizador</span>-&gt;<span class="hljs-title function_ invoke__">verificar</span>(<span class="hljs-variable">$user</span>);
} <span class="hljs-keyword">catch</span> (<span class="hljs-built_in">Throwable</span> <span class="hljs-variable">$e</span>) {
    <span class="hljs-title function_ invoke__">report</span>(<span class="hljs-variable">$e</span>);
    <span class="hljs-variable">$permitido</span> = <span class="hljs-literal">false</span>;
}
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>Fallar cerrado</strong>: ante la duda, denegar</li>
<li><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Usar <strong>transacciones</strong>: o se hace todo o nada</li>
<li><img class="emoji" draggable="false" alt="🙊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64a.svg" data-marp-twemoji=""/> Al usuario, un mensaje genérico; el detalle, a la bitácora</li>
<li><img class="emoji" draggable="false" alt="🧯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ef.svg" data-marp-twemoji=""/> Manejador <strong>centralizado</strong> de excepciones (<code>bootstrap/app.php</code>)</li>
<li><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> <em>Timeouts</em> en llamadas externas</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="secretos-fuera-del-c%C3%B3digo">Secretos fuera del código</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># .gitignore</span>
.<span class="hljs-built_in">env</span>
.<span class="hljs-built_in">env</span>.*
!.env.example
*.pem
*.key
google-services.json   <span class="hljs-comment"># si contiene claves privadas</span>
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Detectar secretos antes de que lleguen al repo</span>
gitleaks detect --<span class="hljs-built_in">source</span> .
gitleaks protect --staged   <span class="hljs-comment"># en un hook pre-commit</span>
</code></pre>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Un secreto que llegó a Git <strong>está filtrado</strong>, aunque lo borres en el siguiente commit: hay que <strong>rotarlo</strong></li>
<li><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> <strong>En la app móvil no hay secretos</strong>: el APK/IPA se descompila en minutos. Cualquier clave en el bundle (<code>VITE_*</code>, <code>import.meta.env</code>) es <strong>pública</strong></li>
<li>Las claves privadas de terceros (pagos, correo) viven <strong>solo</strong> en el back-end</li>
<li>En producción: variables de entorno o un <strong>gestor de secretos</strong> (Vault, AWS Secrets Manager, GitHub Secrets)</li>
<li>OWASP Mobile <strong>M1 — Uso inadecuado de credenciales</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cadena-de-suministro-de-software">Cadena de suministro de software</h2>
<ul>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> <strong>A03:2025</strong> y Mobile <strong>M2</strong>: tu código incluye cientos de dependencias que <strong>no escribiste</strong></li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="ataques-reales">Ataques reales</h3>
<ul>
<li><strong>axios</strong> comprometido en npm (marzo 2026): versiones con troyano de acceso remoto</li>
<li><em>Typosquatting</em>: <code>expres</code> en vez de <code>express</code></li>
<li>Scripts <code>postinstall</code> que roban variables de entorno</li>
<li>Mantenedores que venden o abandonan el paquete</li>
</ul>
</div>
<div>
<h3 id="defensas">Defensas</h3>
<pre><code class="language-bash">pnpm audit          <span class="hljs-comment"># npm audit</span>
composer audit
</code></pre>
<pre><code class="language-yaml"><span class="hljs-comment"># pnpm-workspace.yaml — esperar 24 h</span>
<span class="hljs-attr">minimumReleaseAge:</span> <span class="hljs-number">1440</span>
</code></pre>
<ul>
<li>Confirmar el <strong>lockfile</strong> (<code>pnpm-lock.yaml</code>, <code>composer.lock</code>)</li>
<li>Instalar en CI con <code>--frozen-lockfile</code></li>
<li><strong>Dependabot</strong> / <strong>Renovate</strong> para actualizaciones</li>
<li><strong>SRI</strong> para scripts de CDN</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="integridad-sri-y-firmas">Integridad: SRI y firmas</h2>
<split-slide style="--left: 58%; --right: 42%; --font-size: 0.82rem;">
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Si el CDN es comprometido, el navegador NO ejecuta el archivo --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">script</span>
  <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js&quot;</span>
  <span class="hljs-attr">integrity</span>=<span class="hljs-string">&quot;sha384-...&quot;</span>
  <span class="hljs-attr">crossorigin</span>=<span class="hljs-string">&quot;anonymous&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Calcular el hash</span>
curl -s URL | openssl dgst -sha384 -binary | openssl <span class="hljs-built_in">base64</span> -A
</code></pre>
</div>
<div>
<ul>
<li><strong>A08:2025</strong> — integridad del software y de los datos</li>
<li>Firmar los artefactos: APK/AAB con la clave de la tienda, imágenes de contenedor con <strong>cosign</strong></li>
<li>Generar un <strong>SBOM</strong> (lista de componentes) en el pipeline</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Nunca deserializar objetos que vengan del cliente (<code>unserialize()</code> en PHP)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="revisi%C3%B3n-de-c%C3%B3digo-y-an%C3%A1lisis-est%C3%A1tico-sast">Revisión de código y análisis estático (SAST)</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%91%80-revisi%C3%B3n-entre-pares"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> Revisión entre pares</h3>
<p>Pull requests obligatorios. Lista de verificación: autorización, validación, secretos, consultas crudas</p>
</div>
<div>
<h3 id="%F0%9F%94%8D-sast"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> SAST</h3>
<p>Analiza el código fuente sin ejecutarlo: <strong>Semgrep</strong>, <strong>SonarQube</strong>, <strong>CodeQL</strong></p>
</div>
<div>
<h3 id="%F0%9F%A7%B9-linters-de-seguridad"><img class="emoji" draggable="false" alt="🧹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f9.svg" data-marp-twemoji=""/> Linters de seguridad</h3>
<p><code>eslint-plugin-security</code>, <strong>PHPStan</strong> / <strong>Larastan</strong>, <strong>Psalm</strong> (<em>taint analysis</em>)</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-pruebas-de-seguridad"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Pruebas de seguridad</h3>
<p>Pruebas que verifican <strong>403</strong> al acceder a recursos ajenos y <strong>429</strong> al superar el límite</p>
</div>
</div>
<pre><code class="language-bash">semgrep scan --config p/owasp-top-ten --config p/php
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <em>Shift left</em>: cuanto antes se detecta una falla, más barato es corregirla</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="seguridad-del-c%C3%B3digo-m%C3%B3vil">Seguridad del código móvil</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%A7%A9-protecci%C3%B3n-del-binario-m7"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Protección del binario (M7)</h3>
<ul>
<li>Activar <strong>ofuscación</strong> y <em>minify</em> en el build de release (R8 / ProGuard en Android)</li>
<li>Desactivar <code>debuggable</code> y el inspector del WebView en producción</li>
<li>Detectar <em>root</em> / <em>jailbreak</em> para funciones críticas (sin depender solo de eso)</li>
<li><strong>Play Integrity API</strong> / <strong>App Attest</strong> para que la API sepa que habla con la app legítima</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8C%90-webview-capacitor--ionic"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> WebView (Capacitor / Ionic)</h3>
<ul>
<li>Cargar <strong>solo</strong> contenido local de la app; no navegar a URLs arbitrarias</li>
<li><code>allowNavigation</code> restringido en <code>capacitor.config.ts</code></li>
<li><strong>CSP</strong> también dentro de la app</li>
<li>Validar los <em>deep links</em>: un enlace <code>miapp://</code> puede venir de cualquier sitio</li>
<li>Plugins nativos: revisar qué permisos agregan</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> La ofuscación <strong>retrasa</strong> al atacante, no lo detiene: la seguridad real sigue estando en el servidor</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-scope-DTYHtI8U="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="31" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="65-seguridad-en-las-apis">6.5 Seguridad en las APIs</h1>
<h2 id="contenidos-5">Contenidos</h2>
<ul>
<li>OWASP API Security Top 10:2023</li>
<li>Limitación de tasa y consumo de recursos</li>
<li>CORS y encabezados</li>
<li>Comunicación segura desde el móvil</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="owasp-api-security-top-102023">OWASP API Security Top 10:2023</h2>
<table>
<thead>
<tr>
<th style="text-align:left">#</th>
<th style="text-align:left">Riesgo</th>
<th style="text-align:left">Mitigación</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>API1</strong></td>
<td style="text-align:left">Autorización rota a nivel de <strong>objeto</strong> (BOLA)</td>
<td style="text-align:left">Política por recurso: <code>authorize('view', $pedido)</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>API2</strong></td>
<td style="text-align:left">Autenticación rota</td>
<td style="text-align:left">Sanctum/JWT bien configurado, <code>throttle</code> en login</td>
</tr>
<tr>
<td style="text-align:left"><strong>API3</strong></td>
<td style="text-align:left">Autorización rota a nivel de <strong>propiedad</strong></td>
<td style="text-align:left">Recursos de API + <code>$fillable</code> / <code>validated()</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>API4</strong></td>
<td style="text-align:left">Consumo de recursos sin restricción</td>
<td style="text-align:left"><em>Rate limiting</em>, tope de paginación, tamaño máximo</td>
</tr>
<tr>
<td style="text-align:left"><strong>API5</strong></td>
<td style="text-align:left">Autorización rota a nivel de <strong>función</strong> (BFLA)</td>
<td style="text-align:left"><code>DELETE /api/usuarios/7</code> solo para admin</td>
</tr>
<tr>
<td style="text-align:left"><strong>API6</strong></td>
<td style="text-align:left">Acceso sin restricción a flujos de negocio sensibles</td>
<td style="text-align:left">Anti-automatización en compra, registro, cupones</td>
</tr>
<tr>
<td style="text-align:left"><strong>API7</strong></td>
<td style="text-align:left"><em>Server-Side Request Forgery</em> (SSRF)</td>
<td style="text-align:left">Lista blanca de destinos</td>
</tr>
<tr>
<td style="text-align:left"><strong>API8</strong></td>
<td style="text-align:left">Configuración de seguridad incorrecta</td>
<td style="text-align:left">CORS explícito, sin <code>APP_DEBUG</code>, encabezados</td>
</tr>
<tr>
<td style="text-align:left"><strong>API9</strong></td>
<td style="text-align:left">Gestión inadecuada del inventario</td>
<td style="text-align:left">Retirar <code>/api/v1</code> viejas, documentar todo en OpenAPI</td>
</tr>
<tr>
<td style="text-align:left"><strong>API10</strong></td>
<td style="text-align:left">Consumo inseguro de APIs de terceros</td>
<td style="text-align:left">Validar sus respuestas como si vinieran del usuario</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="bola-la-vulnerabilidad-n%C2%BA-1-de-las-apis">BOLA: la vulnerabilidad n.º 1 de las APIs</h2>
<steps>
<step>
<pre><code class="language-http">GET /api/pedidos/42        Authorization: Bearer &lt;token de Ana&gt;   → 200 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> (es de Ana)
GET /api/pedidos/43        Authorization: Bearer &lt;token de Ana&gt;   → 200 <img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> (es de Luis)
</code></pre>
</step>
<step>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Opción 1 — política</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params">Pedido <span class="hljs-variable">$pedido</span></span>) </span>{
    <span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);      <span class="hljs-comment">// 403 si no es suya</span>
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(<span class="hljs-variable">$pedido</span>);
}

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Opción 2 — consultar siempre desde el dueño</span>
<span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">show</span>(<span class="hljs-params"><span class="hljs-keyword">int</span> <span class="hljs-variable">$id</span></span>) </span>{
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PedidoResource</span>(
        <span class="hljs-title function_ invoke__">auth</span>()-&gt;<span class="hljs-title function_ invoke__">user</span>()-&gt;<span class="hljs-title function_ invoke__">pedidos</span>()-&gt;<span class="hljs-title function_ invoke__">findOrFail</span>(<span class="hljs-variable">$id</span>)   <span class="hljs-comment">// 404 si no es suya</span>
    );
}
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Usar UUID en vez de enteros <strong>dificulta</strong> adivinar, pero <strong>no</strong> reemplaza la verificación</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="consumo-de-recursos-y-limitaci%C3%B3n-de-tasa">Consumo de recursos y limitación de tasa</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// AppServiceProvider</span>
<span class="hljs-title class_">RateLimiter</span>::<span class="hljs-keyword">for</span>(<span class="hljs-string">&#x27;api&#x27;</span>, <span class="hljs-function"><span class="hljs-keyword">fn</span> (<span class="hljs-params"><span class="hljs-variable">$r</span></span>) =&gt;</span>
    <span class="hljs-title class_">Limit</span>::<span class="hljs-title function_ invoke__">perMinute</span>(<span class="hljs-number">60</span>)-&gt;<span class="hljs-title function_ invoke__">by</span>(<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">user</span>()?-&gt;id ?: <span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">ip</span>()));

<span class="hljs-title class_">RateLimiter</span>::<span class="hljs-keyword">for</span>(<span class="hljs-string">&#x27;login&#x27;</span>, <span class="hljs-function"><span class="hljs-keyword">fn</span> (<span class="hljs-params"><span class="hljs-variable">$r</span></span>) =&gt;</span> [
    <span class="hljs-title class_">Limit</span>::<span class="hljs-title function_ invoke__">perMinute</span>(<span class="hljs-number">5</span>)-&gt;<span class="hljs-title function_ invoke__">by</span>(<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">ip</span>()),
    <span class="hljs-title class_">Limit</span>::<span class="hljs-title function_ invoke__">perMinute</span>(<span class="hljs-number">5</span>)-&gt;<span class="hljs-title function_ invoke__">by</span>(<span class="hljs-variable">$r</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;email&#x27;</span>)),
]);
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Tope de página</span>
<span class="hljs-variable">$porPagina</span> = <span class="hljs-title function_ invoke__">min</span>((<span class="hljs-keyword">int</span>) <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;per_page&#x27;</span>, <span class="hljs-number">15</span>), <span class="hljs-number">100</span>);
<span class="hljs-keyword">return</span> <span class="hljs-title class_">Pedido</span>::<span class="hljs-title function_ invoke__">paginate</span>(<span class="hljs-variable">$porPagina</span>);
</code></pre>
</div>
<div>
<ul>
<li>Respuesta <strong>429 Too Many Requests</strong> con <code>Retry-After</code></li>
<li>Limitar <strong>por usuario y por IP</strong></li>
<li>Tope a: tamaño del cuerpo, archivos, elementos por página, profundidad de consultas (GraphQL)</li>
<li><em>Timeouts</em> en consultas y trabajos</li>
<li>Protege contra <strong>fuerza bruta</strong>, <em>scraping</em> y costos inesperados en la nube</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cors-y-encabezados-de-seguridad">CORS y encabezados de seguridad</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.72rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// config/cors.php</span>
<span class="hljs-string">&#x27;paths&#x27;</span>                =&gt; [<span class="hljs-string">&#x27;api/*&#x27;</span>],
<span class="hljs-string">&#x27;allowed_origins&#x27;</span>      =&gt; [<span class="hljs-string">&#x27;https://proyecto.ucr.ac.cr&#x27;</span>,
                           <span class="hljs-string">&#x27;capacitor://localhost&#x27;</span>,
                           <span class="hljs-string">&#x27;https://localhost&#x27;</span>],
<span class="hljs-string">&#x27;allowed_methods&#x27;</span>      =&gt; [<span class="hljs-string">&#x27;GET&#x27;</span>,<span class="hljs-string">&#x27;POST&#x27;</span>,<span class="hljs-string">&#x27;PUT&#x27;</span>,<span class="hljs-string">&#x27;DELETE&#x27;</span>],
<span class="hljs-string">&#x27;allowed_headers&#x27;</span>      =&gt; [<span class="hljs-string">&#x27;Authorization&#x27;</span>,<span class="hljs-string">&#x27;Content-Type&#x27;</span>],
<span class="hljs-string">&#x27;supports_credentials&#x27;</span> =&gt; <span class="hljs-literal">false</span>,
</code></pre>
<pre><code class="language-http"><span class="hljs-attribute">Content-Security-Policy</span><span class="hljs-punctuation">: </span>default-src &#x27;self&#x27;; frame-ancestors &#x27;none&#x27;
<span class="hljs-attribute">Strict-Transport-Security</span><span class="hljs-punctuation">: </span>max-age=31536000; includeSubDomains
<span class="hljs-attribute">X-Content-Type-Options</span><span class="hljs-punctuation">: </span>nosniff
<span class="hljs-attribute">Referrer-Policy</span><span class="hljs-punctuation">: </span>strict-origin-when-cross-origin
<span class="hljs-attribute">Permissions-Policy</span><span class="hljs-punctuation">: </span>geolocation=(), camera=()
<span class="hljs-attribute">Cache-Control</span><span class="hljs-punctuation">: </span>no-store            ← respuestas con datos personales
</code></pre>
</div>
<div>
<h3 id="%F0%9F%9A%A9-malentendido-frecuente"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Malentendido frecuente</h3>
<blockquote>
<p><em>CORS <strong>no es un control de autorización</strong>: protege al navegador de la persona usuaria, no a la API. <code>curl</code> o Postman lo ignoran.</em></p>
</blockquote>
<br />
<ul>
<li><code>*</code> con credenciales es rechazado por los navegadores</li>
<li>Quitar encabezados que revelan versiones: <code>X-Powered-By</code>, <code>Server</code></li>
<li>Verifica tu sitio en <strong>securityheaders.com</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="comunicaci%C3%B3n-segura-desde-la-app-m%C3%B3vil">Comunicación segura desde la app móvil</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%F0%9F%94%90-m5--comunicaci%C3%B3n-insegura"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> M5 — Comunicación insegura</h3>
<ul>
<li><strong>Solo HTTPS</strong>: Android bloquea HTTP por defecto desde la API 28, iOS con <strong>ATS</strong></li>
<li>No desactivar la validación de certificados &quot;para que funcione en desarrollo&quot;</li>
</ul>
<pre><code class="language-xml"><span class="hljs-comment">&lt;!-- res/xml/network_security_config.xml --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">network-security-config</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">base-config</span> <span class="hljs-attr">cleartextTrafficPermitted</span>=<span class="hljs-string">&quot;false&quot;</span> /&gt;</span>
  <span class="hljs-comment">&lt;!-- solo en de<span class="hljs-doctag">bug:</span> 10.0.2.2 para el emulador --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">network-security-config</span>&gt;</span>
</code></pre>
</div>
<div>
<h3 id="%F0%9F%93%8C-certificate-pinning"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <em>Certificate pinning</em></h3>
<ul>
<li>La app solo acepta <strong>el</strong> certificado (o clave pública) del servidor propio</li>
<li>Protege contra proxies maliciosos y CA comprometidas</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Requiere plan de rotación: si el certificado cambia, la app deja de funcionar</li>
<li>Reservado para apps de alto riesgo (banca, salud)</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> La app es un cliente <strong>más</strong>: la API aplica <strong>las mismas</strong> reglas que a la web</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-scope-8ZrZ1uzs="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="37" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="66-seguridad-en-el-despliegue">6.6 Seguridad en el despliegue</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Configuración por entorno</li>
<li>Servidor, contenedores y red</li>
<li>CI/CD seguro (DevSecOps)</li>
<li>Registro, monitoreo y respuesta</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="configuraci%C3%B3n-por-entorno">Configuración por entorno</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-bash"><span class="hljs-comment"># .env de producción — no negociable</span>
APP_ENV=production
APP_DEBUG=<span class="hljs-literal">false</span>
APP_URL=https://proyecto.ucr.ac.cr
SESSION_SECURE_COOKIE=<span class="hljs-literal">true</span>
LOG_LEVEL=warning
</code></pre>
<pre><code class="language-bash"><span class="hljs-comment"># Despliegue de Laravel</span>
composer install --no-dev --optimize-autoloader
php artisan config:cache
php artisan route:cache
</code></pre>
</div>
<div>
<ul>
<li><strong>A02:2025 — Configuración incorrecta</strong> sube al <strong>2.º</strong> lugar</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>APP_DEBUG=true</code> muestra variables de entorno, rutas y consultas a cualquiera</li>
<li>Sin dependencias de desarrollo en producción</li>
<li>Documentación interactiva (Swagger UI, Telescope, phpMyAdmin) <strong>apagada o protegida</strong></li>
<li>Credenciales por defecto cambiadas</li>
<li>Entornos <strong>separados</strong>: datos, claves y BD distintos en desarrollo, pruebas y producción</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="servidor-contenedores-y-red">Servidor, contenedores y red</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-servidor-web"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Servidor web</h3>
<p>Solo <code>public/</code> es la raíz. <code>.env</code>, <code>storage/</code> y <code>.git/</code> <strong>nunca</strong> accesibles por URL</p>
</div>
<div>
<h3 id="%F0%9F%A7%B1-red"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Red</h3>
<p>Firewall: solo 80/443 abiertos. La BD <strong>no</strong> escucha en Internet</p>
</div>
<div>
<h3 id="%F0%9F%90%B3-contenedores"><img class="emoji" draggable="false" alt="🐳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f433.svg" data-marp-twemoji=""/> Contenedores</h3>
<p>Imagen base mínima y fijada por versión, usuario <strong>no root</strong>, sin secretos en la imagen</p>
</div>
<div>
<h3 id="%F0%9F%94%84-parches"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Parches</h3>
<p>Sistema operativo, PHP, Node y dependencias <strong>actualizados</strong>. Versiones con soporte de seguridad</p>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-waf--cdn"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> WAF / CDN</h3>
<p>Cloudflare u otro proxy filtra ataques comunes y absorbe DDoS</p>
</div>
<div>
<h3 id="%F0%9F%92%BE-respaldos"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4be.svg" data-marp-twemoji=""/> Respaldos</h3>
<p>Automáticos, cifrados, <strong>fuera</strong> del servidor y con restauración <strong>probada</strong></p>
</div>
</div>
<pre><code class="language-dockerfile"><span class="hljs-keyword">FROM</span> php:<span class="hljs-number">8.4</span>-fpm-alpine
<span class="hljs-keyword">RUN</span><span class="language-bash"> adduser -D app</span>
<span class="hljs-keyword">USER</span> app            <span class="hljs-comment"># nunca correr como root</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cicd-seguro-devsecops">CI/CD seguro: DevSecOps</h2>
<pre><code class="language-text"> commit ──► pre-commit ──► CI ───────────────────────────────► despliegue ──► producción
           gitleaks        ├─ pruebas (Pest / Vitest)          secretos del    DAST (ZAP)
                           ├─ SAST (Semgrep / CodeQL)          entorno, no     monitoreo
                           ├─ auditoría de dependencias        del repo        alertas
                           ├─ escaneo de imagen (Trivy)
                           └─ build firmado + SBOM
</code></pre>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<ul>
<li>Rama <code>main</code> <strong>protegida</strong>: PR + revisión + CI en verde</li>
<li>Secretos del pipeline en <strong>GitHub Secrets</strong>, con mínimo privilegio</li>
<li>Acciones de terceros fijadas por <strong>hash</strong> del commit</li>
</ul>
</div>
<div>
<ul>
<li><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Móvil: la <strong>clave de firma</strong> (keystore / certificado de Apple) nunca en el repo; usar <em>Play App Signing</em></li>
<li>Builds de release <strong>reproducibles</strong> desde el pipeline, no desde la laptop de alguien</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="registro-monitoreo-y-respuesta-a-incidentes">Registro, monitoreo y respuesta a incidentes</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%93%8B-qu%C3%A9-registrar-a09"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Qué registrar (A09)</h3>
<ul>
<li>Inicios de sesión exitosos <strong>y fallidos</strong></li>
<li>Accesos denegados (401 / 403)</li>
<li>Cambios de permisos y de contraseña</li>
<li>Errores 5xx y validaciones rechazadas en masa</li>
<li>Con fecha, usuario, IP y un <strong>ID de correlación</strong></li>
</ul>
<h3 id="%F0%9F%99%88-qu%C3%A9-no-registrar"><img class="emoji" draggable="false" alt="🙈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f648.svg" data-marp-twemoji=""/> Qué <strong>no</strong> registrar</h3>
<p>Contraseñas, tokens, números de tarjeta, datos personales completos</p>
</div>
<div>
<h3 id="%F0%9F%9A%A8-alertar"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> Alertar</h3>
<p>Un registro que nadie mira no sirve: alertas ante picos de 401, 429 o 5xx (Sentry, Grafana, Logtail)</p>
<h3 id="%F0%9F%A7%AF-plan-de-respuesta"><img class="emoji" draggable="false" alt="🧯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ef.svg" data-marp-twemoji=""/> Plan de respuesta</h3>
<ol>
<li><strong>Detectar</strong> y contener</li>
<li><strong>Rotar</strong> credenciales afectadas</li>
<li><strong>Corregir</strong> y desplegar</li>
<li><strong>Notificar</strong> a los afectados (PRODHAB si hay datos personales)</li>
<li><strong>Aprender</strong>: análisis post-incidente sin culpables</li>
</ol>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-marpit-scope-WrI3TOCN="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="42" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">

<h2 id="herramientas-de-an%C3%A1lisis">Herramientas de análisis</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Categoría</th>
<th style="text-align:left">Herramienta</th>
<th style="text-align:left">Para qué</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>DAST / proxy</strong></td>

</tr>
<tr>
<td style="text-align:left"><strong>SAST</strong></td>

<td style="text-align:left">Encontrar patrones inseguros en el código</td>
</tr>
<tr>
<td style="text-align:left"><strong>Dependencias</strong></td>
<td style="text-align:left"><code>pnpm audit</code>, <code>composer audit</code>, <a href="https://docs.github.com/code-security/dependabot">Dependabot</a>, <a href="https://snyk.io">Snyk</a>, <a href="https://google.github.io/osv-scanner/">OSV-Scanner</a></td>
<td style="text-align:left">Vulnerabilidades conocidas en librerías</td>
</tr>
<tr>
<td style="text-align:left"><strong>Secretos</strong></td>
<td style="text-align:left"><a href="https://github.com/gitleaks/gitleaks">Gitleaks</a>, <a href="https://github.com/trufflesecurity/trufflehog">TruffleHog</a>, <em>secret scanning</em> de GitHub</td>
<td style="text-align:left">Claves filtradas en el repositorio</td>
</tr>
<tr>
<td style="text-align:left"><strong>Contenedores</strong></td>
<td style="text-align:left"><a href="https://trivy.dev">Trivy</a></td>
<td style="text-align:left">Vulnerabilidades en imágenes y configuración</td>
</tr>
<tr>
<td style="text-align:left"><strong>Móvil</strong></td>
<td style="text-align:left"><a href="https://github.com/MobSF/Mobile-Security-Framework-MobSF">MobSF</a>, <a href="https://frida.re">Frida</a>, <a href="https://github.com/skylot/jadx">jadx</a></td>
<td style="text-align:left">Análisis estático/dinámico de APK e IPA</td>
</tr>
<tr>
<td style="text-align:left"><strong>API</strong></td>
<td style="text-align:left">Postman, <a href="https://www.usebruno.com">Bruno</a>, pruebas Pest</td>
<td style="text-align:left">Probar BOLA, 401/403/429 a mano y automatizado</td>
</tr>
</tbody>
</table>
</section>

<h2 id="lista-de-verificaci%C3%B3n-del-proyecto">Lista de verificación del proyecto</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%F0%9F%94%90-api"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> API</h3>
<ul>
<li>[ ] Toda ruta privada con <code>auth:sanctum</code></li>
<li>[ ] Política por recurso (prueba con el ID de otro usuario → 403/404)</li>
<li>[ ] <code>throttle</code> en login y en la API general</li>
<li>[ ] Form Requests + <code>validated()</code></li>
<li>[ ] Recursos de API, nunca el modelo</li>
<li>[ ] CORS con orígenes explícitos</li>
<li>[ ] Encabezados de seguridad</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%B1-cliente-y-despliegue"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Cliente y despliegue</h3>
<ul>
<li>[ ] Token en almacenamiento seguro, no en <code>localStorage</code></li>
<li>[ ] Ningún secreto en el bundle web/móvil</li>
<li>[ ] Sin <code>v-html</code> con datos del usuario</li>
<li>[ ] <code>.env</code> fuera del repo, <code>APP_DEBUG=false</code></li>
<li>[ ] <code>pnpm audit</code> / <code>composer audit</code> sin altas</li>
<li>[ ] HTTPS con HSTS</li>
<li>[ ] Bitácora de accesos denegados</li>
</ul>
</div>
