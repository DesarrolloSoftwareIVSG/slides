</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="%C2%BFpor-qu%C3%A9-un-tema-entero-de-seguridad">¿Por qué un tema entero de seguridad?</h2>
<ul>
<li>La seguridad <strong>no es una funcionalidad</strong> que se agrega al final: es una propiedad de <strong>todo</strong> el sistema</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%8C%90-web"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Web</h3>
<p>El navegador ejecuta código de terceros, guarda cookies y confía en lo que el servidor le envía</p>
</div>
<div>
<h3 id="%F0%9F%93%B1-m%C3%B3vil"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Móvil</h3>
<p>La app vive en un dispositivo que <strong>el atacante puede tener en la mano</strong>: se descompila, se inspecciona, se modifica</p>
</div>
<div>
<h3 id="%F0%9F%94%8C-api"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> API</h3>
<p>Es la puerta común de web y móvil: un fallo aquí afecta a <strong>todos</strong> los clientes</p>
</div>
<div>
<h3 id="%F0%9F%9A%80-despliegue"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Despliegue</h3>
<p>Un <code>.env</code> publicado o un puerto abierto anulan todo lo demás</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Regla de oro: <strong>nunca confíes en el cliente</strong>. Todo lo que llega por HTTP puede haber sido fabricado</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="principios-que-atraviesan-todo-el-tema">Principios que atraviesan todo el tema</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%F0%9F%A7%85-defensa-en-profundidad"><img class="emoji" draggable="false" alt="🧅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9c5.svg" data-marp-twemoji=""/> Defensa en profundidad</h3>
<p>Varias capas de control: si una falla, la siguiente detiene el ataque</p>
<h3 id="%F0%9F%8E%AF-m%C3%ADnimo-privilegio"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Mínimo privilegio</h3>
<p>Cada usuario, token, proceso y contenedor tiene <strong>solo</strong> los permisos que necesita</p>
<h3 id="%F0%9F%9A%AB-denegar-por-defecto"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> Denegar por defecto</h3>
<p>Lo que no está explícitamente permitido, está prohibido</p>
</div>
<div>
<h3 id="%F0%9F%94%92-seguro-por-defecto"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Seguro por defecto</h3>
<p>La configuración inicial debe ser la segura; abrir requiere una decisión consciente</p>
<h3 id="%F0%9F%A7%B1-reducir-la-superficie-de-ataque"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Reducir la superficie de ataque</h3>
<p>Menos endpoints, menos dependencias, menos permisos, menos datos</p>
<h3 id="%F0%9F%99%88-sin-seguridad-por-oscuridad"><img class="emoji" draggable="false" alt="🙈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f648.svg" data-marp-twemoji=""/> Sin seguridad por oscuridad</h3>
<p>Ocultar una URL o &quot;minificar&quot; el código <strong>no</strong> protege nada</p>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="advertencia-%C3%A9tica-y-legal">Advertencia ética y legal</h2>
<ul>
<li><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Todas las pruebas de este tema se realizan <strong>únicamente sobre la aplicación del propio equipo</strong>, en entorno <strong>local</strong> o de pruebas</li>
<li>Probar sistemas de terceros sin autorización escrita es una <strong>falta grave</strong> con consecuencias legales</li>
<li><img class="emoji" draggable="false" alt="🇨🇷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f1e8-1f1f7.svg" data-marp-twemoji=""/> En Costa Rica el <strong>Código Penal</strong> tipifica el acceso no autorizado a sistemas informáticos, y la <strong>Ley 8968</strong> protege los datos personales</li>
<li>Si encuentras una vulnerabilidad en un sistema ajeno: <strong>divulgación responsable</strong> al dueño (busca su <code>/.well-known/security.txt</code>)</li>
</ul>
<br />
<blockquote>
<p><em>&quot;Con autorización es una auditoría. Sin autorización es un delito.&quot;</em></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-scope-CFidg1VO="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="5" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="61-vulnerabilidades-comunes">6.1 Vulnerabilidades comunes</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>OWASP Top 10:2025</li>
<li>Inyección (SQL y comandos)</li>
<li>XSS, CSRF y SSRF</li>
<li>Asignación masiva y <em>clickjacking</em></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-lUZJ0SXN="" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="owasp-top-102025">OWASP Top 10:2025</h2>
<table>
<thead>
<tr>
<th style="text-align:left">#</th>
<th style="text-align:left">Categoría</th>
<th style="text-align:left">Ejemplo en el proyecto</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>A01</strong></td>
<td style="text-align:left">Pérdida de control de acceso</td>
<td style="text-align:left"><code>GET /api/pedidos/42</code> devuelve el pedido de otra persona</td>
</tr>
<tr>
<td style="text-align:left"><strong>A02</strong></td>
<td style="text-align:left">Configuración de seguridad incorrecta</td>
<td style="text-align:left"><code>APP_DEBUG=true</code> en producción, CORS <code>*</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>A03</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> Fallas en la cadena de suministro de software</td>
<td style="text-align:left">Un paquete de npm comprometido</td>
</tr>
<tr>
<td style="text-align:left"><strong>A04</strong></td>
<td style="text-align:left">Fallas criptográficas</td>
<td style="text-align:left">Contraseñas con <code>md5</code>, HTTP sin TLS</td>
</tr>
<tr>
<td style="text-align:left"><strong>A05</strong></td>
<td style="text-align:left">Inyección</td>
<td style="text-align:left">SQL construido por concatenación</td>
</tr>
<tr>
<td style="text-align:left"><strong>A06</strong></td>
<td style="text-align:left">Diseño inseguro</td>
<td style="text-align:left">Recuperar contraseña con &quot;pregunta secreta&quot;</td>
</tr>
<tr>
<td style="text-align:left"><strong>A07</strong></td>
<td style="text-align:left">Fallas de autenticación</td>
<td style="text-align:left">Sin límite de intentos, tokens eternos</td>
</tr>
<tr>
<td style="text-align:left"><strong>A08</strong></td>
<td style="text-align:left">Fallas en la integridad del software o de los datos</td>
<td style="text-align:left">CDN sin SRI, deserializar datos del cliente</td>
</tr>
<tr>
<td style="text-align:left"><strong>A09</strong></td>
<td style="text-align:left">Fallas en el registro, alerta y monitoreo</td>
<td style="text-align:left">Nadie se entera de 10 000 intentos de login</td>
</tr>
<tr>
<td style="text-align:left"><strong>A10</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> Manejo inadecuado de condiciones excepcionales</td>
<td style="text-align:left">Un error que deja la transacción a medias o &quot;falla abierto&quot;</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> La lista se actualiza cada ~4 años con datos reales. Cambios clave frente a 2021: la <strong>cadena de suministro</strong> sube al 3.º lugar y la <strong>configuración</strong> al 2.º</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="inyecci%C3%B3n-sql">Inyección SQL</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Vulnerable: el dato se vuelve código SQL</span>
<span class="hljs-variable">$email</span> = <span class="hljs-variable">$request</span>-&gt;<span class="hljs-title function_ invoke__">input</span>(<span class="hljs-string">&#x27;email&#x27;</span>);
DB::<span class="hljs-title function_ invoke__">select</span>(<span class="hljs-string">&quot;SELECT * FROM users WHERE email = &#x27;<span class="hljs-subst">$email</span>&#x27;&quot;</span>);

<span class="hljs-comment">// Entrada maliciosa:   &#x27; OR &#x27;1&#x27;=&#x27;1</span>
<span class="hljs-comment">// Resultado:           ... WHERE email = &#x27;&#x27; OR &#x27;1&#x27;=&#x27;1&#x27;</span>
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Parámetros vinculados</span>
DB::<span class="hljs-title function_ invoke__">select</span>(<span class="hljs-string">&#x27;SELECT * FROM users WHERE email = ?&#x27;</span>, [<span class="hljs-variable">$email</span>]);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Eloquent / Query Builder ya vinculan</span>
<span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">where</span>(<span class="hljs-string">&#x27;email&#x27;</span>, <span class="hljs-variable">$email</span>)-&gt;<span class="hljs-title function_ invoke__">first</span>();
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Aun con ORM se puede romper</span>
<span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">orderByRaw</span>(<span class="hljs-variable">$request</span>-&gt;orden)-&gt;<span class="hljs-title function_ invoke__">get</span>();      <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></span>
<span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">orderBy</span>(                                  <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></span>
    <span class="hljs-title function_ invoke__">in_array</span>(<span class="hljs-variable">$r</span>-&gt;orden, [<span class="hljs-string">&#x27;nombre&#x27;</span>,<span class="hljs-string">&#x27;fecha&#x27;</span>]) ? <span class="hljs-variable">$r</span>-&gt;orden : <span class="hljs-string">&#x27;id&#x27;</span>
)-&gt;<span class="hljs-title function_ invoke__">get</span>();
</code></pre>
</div>
<div>
<ul>
<li>El problema es <strong>mezclar datos con código</strong></li>
<li>La solución es <strong>separarlos</strong>: el motor recibe la consulta y los parámetros por canales distintos</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Los métodos <code>*Raw()</code> (<code>whereRaw</code>, <code>orderByRaw</code>, <code>DB::raw</code>) <strong>no</strong> escapan nada</li>
<li>Nombres de columnas y direcciones de orden <strong>no</strong> se pueden parametrizar: se validan contra una <strong>lista blanca</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Mismo patrón en <strong>inyección de comandos</strong> (<code>exec</code>, <code>shell_exec</code>) y <strong>NoSQL</strong>: nunca construyas la orden con texto del usuario</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cross-site-scripting-xss">Cross-Site Scripting (XSS)</h2>
<ul>
<li>El atacante logra que <strong>su JavaScript</strong> se ejecute en el navegador de otra persona, con su sesión</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="tres-variantes">Tres variantes</h3>
<ul>
<li><strong>Almacenado</strong> — el script queda en la base de datos (un comentario, un nombre de producto)</li>
<li><strong>Reflejado</strong> — viaja en la URL y el servidor lo devuelve</li>
<li><strong>Basado en DOM</strong> — el propio JavaScript del cliente lo inserta</li>
</ul>
<pre><code class="language-js"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Inserta HTML: ejecuta &lt;img src=x onerror=...&gt;</span>
div.<span class="hljs-property">innerHTML</span> = comentario.<span class="hljs-property">texto</span>;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Inserta texto plano</span>
div.<span class="hljs-property">textContent</span> = comentario.<span class="hljs-property">texto</span>;
</code></pre>
</div>
<div>
<h3 id="mitigaci%C3%B3n">Mitigación</h3>
<ul>
<li><strong>Escapar al mostrar</strong>: Blade <code>{{ $x }}</code>, Vue <code>{{ x }}</code> y React <code>{x}</code> ya escapan</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <code>{!! $x !!}</code>, <code>v-html</code> y <code>dangerouslySetInnerHTML</code> desactivan la protección</li>
<li>Si hay que mostrar HTML del usuario: <strong>sanear</strong> con <strong>DOMPurify</strong></li>
<li><strong>CSP</strong> como segunda línea: bloquea scripts <em>inline</em> y de orígenes no autorizados</li>
<li>Cookies de sesión <code>HttpOnly</code>: JavaScript no puede leerlas</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cross-site-request-forgery-csrf">Cross-Site Request Forgery (CSRF)</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- En sitio-malicioso.com --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">form</span> <span class="hljs-attr">action</span>=<span class="hljs-string">&quot;https://banco.com/transferir&quot;</span> <span class="hljs-attr">method</span>=<span class="hljs-string">&quot;POST&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;hidden&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;destino&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;atacante&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;hidden&quot;</span> <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;monto&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;100000&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">script</span>&gt;</span><span class="language-javascript"><span class="hljs-variable language_">document</span>.<span class="hljs-property">forms</span>[<span class="hljs-number">0</span>].<span class="hljs-title function_">submit</span>()</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<ul>
<li>El navegador <strong>adjunta las cookies</strong> de <code>banco.com</code> automáticamente</li>
<li>El servidor ve una petición <strong>legítima</strong> de la víctima</li>
</ul>
</div>
<div>
<h3 id="mitigaci%C3%B3n-1">Mitigación</h3>
<ul>
<li><strong>Token CSRF</strong> en cada formulario (<code>@csrf</code> en Blade)</li>
<li>Cookies <code>SameSite=Lax</code> o <code>Strict</code></li>
<li>Verificar el encabezado <code>Origin</code> (Laravel 13: <code>PreventRequestForgery</code>)</li>
<li>Nunca cambiar estado con <code>GET</code></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Una API con <strong>token Bearer</strong> en <code>Authorization</code> no es vulnerable a CSRF: el navegador <strong>no</strong> envía ese encabezado solo. Sí lo es si usa <strong>cookies</strong> (Sanctum SPA)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="ssrf-asignaci%C3%B3n-masiva-y-clickjacking">SSRF, asignación masiva y <em>clickjacking</em></h2>
<div class="grid">
<div>
<h3 id="%F0%9F%94%81-ssrf"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> SSRF</h3>
<p>El servidor descarga una URL que <strong>elige el usuario</strong>: <code>http://169.254.169.254/</code> expone credenciales de la nube.<br />
<strong>Mitigar</strong>: lista blanca de dominios, bloquear IP privadas, no seguir redirecciones</p>
</div>
<div>
<h3 id="%F0%9F%93%A6-asignaci%C3%B3n-masiva"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Asignación masiva</h3>
<p><code>User::create($request-&gt;all())</code> permite enviar <code>&quot;rol&quot;: &quot;admin&quot;</code>.<br />
<strong>Mitigar</strong>: <code>$fillable</code> + <code>$request-&gt;validated()</code></p>
</div>
<div>
<h3 id="%F0%9F%96%BC%EF%B8%8F-clickjacking"><img class="emoji" draggable="false" alt="🖼️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5bc.svg" data-marp-twemoji=""/> <em>Clickjacking</em></h3>
<p>Tu sitio cargado en un <code>&lt;iframe&gt;</code> invisible bajo un botón trampa.<br />
<strong>Mitigar</strong>: <code>frame-ancestors 'none'</code> en la CSP</p>
</div>
<div>
<h3 id="%F0%9F%94%80-redirecci%C3%B3n-abierta"><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> Redirección abierta</h3>
<p><code>/login?next=https://phishing.com</code>.<br />
<strong>Mitigar</strong>: redirigir solo a rutas internas</p>
</div>
<div>
<h3 id="%F0%9F%93%81-recorrido-de-rutas"><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Recorrido de rutas</h3>
<p><code>?archivo=../../.env</code>.<br />
<strong>Mitigar</strong>: nunca usar el nombre del usuario como ruta; usar identificadores</p>
</div>
<div>
<h3 id="%F0%9F%93%A4-carga-de-archivos"><img class="emoji" draggable="false" alt="📤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e4.svg" data-marp-twemoji=""/> Carga de archivos</h3>
<p>Un <code>.php</code> subido como &quot;foto&quot;.<br />
<strong>Mitigar</strong>: validar tipo real (<code>mimes</code>), renombrar, guardar fuera de <code>public/</code></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-scope-3xSXyIcX="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="11" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="62-autenticaci%C3%B3n-y-autorizaci%C3%B3n">6.2 Autenticación y autorización</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>
<li>¿Quién eres? vs. ¿qué puedes hacer?</li>
<li>Contraseñas, MFA y <em>passkeys</em></li>
<li>Sesiones, tokens y JWT</li>
<li>Roles, políticas y defensa en profundidad</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="autenticaci%C3%B3n-%E2%89%A0-autorizaci%C3%B3n">Autenticación ≠ Autorización</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.92rem;">
<div>
<h3 id="%F0%9F%AA%AA-autenticaci%C3%B3n--%C2%BFqui%C3%A9n-eres"><img class="emoji" draggable="false" alt="🪪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1faaa.svg" data-marp-twemoji=""/> Autenticación — <em>¿quién eres?</em></h3>
<ul>
<li>Verificar la identidad</li>
<li>Contraseña, token, <em>passkey</em>, biometría</li>
<li>Falla → <strong>401 Unauthorized</strong></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%91-autorizaci%C3%B3n--%C2%BFqu%C3%A9-puedes-hacer"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Autorización — <em>¿qué puedes hacer?</em></h3>
<ul>
<li>Verificar los permisos de una identidad <strong>ya conocida</strong></li>
<li>Roles, políticas, permisos por recurso</li>
<li>Falla → <strong>403 Forbidden</strong></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <em>A01 Pérdida de control de acceso</em> es la vulnerabilidad <strong>n.º 1</strong>: casi siempre es una autorización que <strong>no</strong> se verificó a nivel de recurso</li>
<li><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> El detalle con Sanctum, políticas y pruebas está en el tema <a href="../backend/">Desarrollo Backend</a></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="factores-de-autenticaci%C3%B3n">Factores de autenticación</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%A0-algo-que-sabes"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> Algo que sabes</h3>
<p>Contraseña, PIN. El factor más débil: se reutiliza, se filtra, se adivina</p>
</div>
<div>
<h3 id="%F0%9F%93%B1-algo-que-tienes"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Algo que tienes</h3>
<p>App TOTP (Google/Microsoft Authenticator), llave física (YubiKey), el teléfono</p>
</div>
<div>
<h3 id="%F0%9F%91%86-algo-que-eres"><img class="emoji" draggable="false" alt="👆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f446.svg" data-marp-twemoji=""/> Algo que eres</h3>
<p>Huella, rostro. En móvil, <strong>siempre</strong> a través del sistema operativo, nunca procesado por la app</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> <strong>MFA</strong> = combinar al menos dos factores <strong>distintos</strong>. Una contraseña + una pregunta secreta <strong>no</strong> es MFA</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> El SMS es el segundo factor más débil: vulnerable a <em>SIM swapping</em></li>
<li><img class="emoji" draggable="false" alt="🆕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f195.svg" data-marp-twemoji=""/> <strong>Passkeys (WebAuthn / FIDO2)</strong>: un par de claves por sitio, guardado en el dispositivo. <strong>Inmunes al <em>phishing</em></strong>: la clave solo responde al dominio legítimo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="contrase%C3%B1as-lo-que-dice-nist-sp-800-63b">Contraseñas: lo que dice NIST SP 800-63B</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%E2%9C%85-hacer"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Hacer</h3>
<ul>
<li>Mínimo <strong>8</strong> caracteres (15 si es el único factor), permitir hasta <strong>64</strong></li>
<li>Aceptar <strong>espacios, Unicode</strong> y pegar desde el gestor de contraseñas</li>
<li>Comparar contra listas de contraseñas <strong>filtradas</strong></li>
<li>Limitar intentos (<em>rate limiting</em>)</li>
<li>Guardar con <code>argon2id</code> o <code>bcrypt</code> (con sal)</li>
</ul>
</div>
<div>
<h3 id="%E2%9D%8C-no-hacer"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> No hacer</h3>
<ul>
<li>Forzar reglas de composición arbitrarias</li>
<li>Obligar a cambiarla <strong>periódicamente</strong> sin motivo</li>
<li>Preguntas de seguridad</li>
<li>Pistas de contraseña</li>
<li>Guardarla en texto plano, cifrada reversible o con <code>md5</code>/<code>sha1</code></li>
</ul>
</div>
</split-slide>
<pre><code class="language-php"><span class="hljs-string">&#x27;password&#x27;</span> =&gt; [<span class="hljs-string">&#x27;required&#x27;</span>, <span class="hljs-string">&#x27;confirmed&#x27;</span>, <span class="hljs-title class_">Password</span>::<span class="hljs-title function_ invoke__">min</span>(<span class="hljs-number">12</span>)-&gt;<span class="hljs-title function_ invoke__">uncompromised</span>()],
<span class="hljs-comment">// casts(): &#x27;password&#x27; =&gt; &#x27;hashed&#x27;     → bcrypt / argon2 automático</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="sesiones-tokens-y-jwt">Sesiones, tokens y JWT</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%8D%AA-cookie-de-sesi%C3%B3n"><img class="emoji" draggable="false" alt="🍪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f36a.svg" data-marp-twemoji=""/> Cookie de sesión</h3>
<ul>
<li>Ideal para la <strong>web del mismo dominio</strong></li>
<li>Atributos obligatorios:</li>
</ul>
<pre><code class="language-http"><span class="hljs-attribute">Set-Cookie</span><span class="hljs-punctuation">: </span>sesion=abc123;
  HttpOnly; Secure; SameSite=Lax;
  Path=/; Max-Age=7200
</code></pre>
<ul>
<li>Regenerar el ID al iniciar sesión (<em>session fixation</em>)</li>
</ul>
<h3 id="%F0%9F%8E%AB-token-opaco-sanctum"><img class="emoji" draggable="false" alt="🎫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ab.svg" data-marp-twemoji=""/> Token opaco (Sanctum)</h3>
<ul>
<li>Cadena aleatoria guardada en la BD</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Revocación inmediata</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%AA%99-jwt"><img class="emoji" draggable="false" alt="🪙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa99.svg" data-marp-twemoji=""/> JWT</h3>
<p><code>encabezado.carga.firma</code> en Base64URL</p>
<ul>
<li>La carga <strong>no está cifrada</strong>: cualquiera la lee en <a href="https://jwt.io">jwt.io</a></li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Nunca meter datos sensibles en la carga</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Rechazar <code>alg: none</code> y fijar el algoritmo esperado</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Validar <code>exp</code>, <code>iss</code> y <code>aud</code></li>
<li>Revocar es difícil: expiración <strong>corta</strong> (minutos) + <em>refresh token</em> con <strong>rotación</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>OAuth 2.0 / OpenID Connect</strong> para &quot;Iniciar sesión con…&quot;: en apps móviles y SPA, flujo <strong>Authorization Code + PKCE</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="autorizaci%C3%B3n-roles-pol%C3%ADticas-y-dos-capas">Autorización: roles, políticas y dos capas</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-php"><span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">PedidoPolicy</span>
</span>{
    <span class="hljs-keyword">public</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">view</span>(<span class="hljs-params">User <span class="hljs-variable">$user</span>, Pedido <span class="hljs-variable">$pedido</span></span>): <span class="hljs-title">bool</span>
    </span>{
        <span class="hljs-keyword">return</span> <span class="hljs-variable">$user</span>-&gt;<span class="hljs-title function_ invoke__">hasRole</span>(<span class="hljs-string">&#x27;admin&#x27;</span>)
            || <span class="hljs-variable">$pedido</span>-&gt;cliente-&gt;user_id === <span class="hljs-variable">$user</span>-&gt;id;
    }
}
</code></pre>
<pre><code class="language-php"><span class="hljs-comment">// Capa 1 — controlador</span>
<span class="hljs-variable language_">$this</span>-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);

<span class="hljs-comment">// Capa 2 — servicio</span>
<span class="hljs-title class_">Gate</span>::<span class="hljs-title function_ invoke__">forUser</span>(<span class="hljs-variable">$actor</span>)-&gt;<span class="hljs-title function_ invoke__">authorize</span>(<span class="hljs-string">&#x27;view&#x27;</span>, <span class="hljs-variable">$pedido</span>);
</code></pre>
</div>
<div>
<ul>
<li><strong>RBAC</strong> (por rol): <em>¿puede ver pedidos?</em></li>
<li><strong>Por recurso</strong> (política): <em>¿puede ver <strong>este</strong> pedido?</em></li>
<li><strong>ABAC</strong> (por atributos): hora, ubicación, estado del recurso</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🧅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9c5.svg" data-marp-twemoji=""/> Verificar en <strong>dos capas</strong>: un comando, una cola u otro controlador pueden llamar al servicio sin pasar por la ruta</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Ocultar el botón en el front-end <strong>no</strong> es autorización</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-scope-orF10Rlo="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="17" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="48">
<h1 id="63-seguridad-en-el-manejo-de-datos">6.3 Seguridad en el manejo de datos</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>Clasificación y minimización</li>
<li>Cifrado en tránsito y en reposo</li>
<li>Datos en el dispositivo móvil</li>
<li>Privacidad y Ley 8968</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="clasificar-antes-de-proteger">Clasificar antes de proteger</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Nivel</th>
<th style="text-align:left">Ejemplos</th>
<th style="text-align:left">Tratamiento</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> <strong>Público</strong></td>
<td style="text-align:left">Catálogo, precios</td>
<td style="text-align:left">Puede cachearse y exponerse</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> <strong>Interno</strong></td>
<td style="text-align:left">Estadísticas, configuración</td>
<td style="text-align:left">Solo usuarios autenticados</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🟠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e0.svg" data-marp-twemoji=""/> <strong>Confidencial</strong></td>
<td style="text-align:left">Nombre, correo, teléfono, dirección</td>
<td style="text-align:left">Control de acceso por recurso, no aparece en bitácoras</td>
</tr>
<tr>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>Sensible / restringido</strong></td>
<td style="text-align:left">Contraseñas, tokens, cédula, salud, tarjetas</td>
<td style="text-align:left">Derivación o cifrado, enmascarado, acceso auditado</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="🧹" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f9.svg" data-marp-twemoji=""/> <strong>Minimización</strong>: el dato más seguro es el que <strong>no se recolecta</strong>. ¿Realmente necesitas la fecha de nacimiento completa?</li>
<li><img class="emoji" draggable="false" alt="⏳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f3.svg" data-marp-twemoji=""/> <strong>Retención</strong>: define cuánto tiempo se guarda y bórralo después</li>
<li><img class="emoji" draggable="false" alt="💳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b3.svg" data-marp-twemoji=""/> Tarjetas: <strong>nunca</strong> las guardes tú; usa la pasarela (tokenización) y quedas fuera del alcance de PCI DSS</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">
<h2 id="cifrado-en-tr%C3%A1nsito-y-en-reposo">Cifrado en tránsito y en reposo</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%9A%9A-en-tr%C3%A1nsito"><img class="emoji" draggable="false" alt="🚚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f69a.svg" data-marp-twemoji=""/> En tránsito</h3>
<ul>
<li><strong>HTTPS en todo</strong>, también en desarrollo móvil contra la API</li>
<li>TLS <strong>1.2+</strong> (idealmente 1.3)</li>
<li><strong>HSTS</strong> obliga al navegador a usar HTTPS</li>
<li>Certificados gratuitos con <strong>Let's Encrypt</strong></li>
<li>Conexión <strong>cifrada</strong> también a la BD y a otros servicios internos</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%92%BE-en-reposo"><img class="emoji" draggable="false" alt="💾" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4be.svg" data-marp-twemoji=""/> En reposo</h3>
<ul>
<li>Contraseñas → <strong>derivación</strong> (<code>argon2id</code>, <code>bcrypt</code>), no cifrado</li>
<li>Datos que hay que leer después → <strong>cifrado simétrico</strong> (AES-256-GCM)</li>
<li>Respaldos cifrados y probados</li>
</ul>
<pre><code class="language-php"><span class="hljs-comment">// Laravel: cifrado transparente con APP_KEY</span>
<span class="hljs-keyword">protected</span> <span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">casts</span>(<span class="hljs-params"></span>): <span class="hljs-title">array</span>
</span>{
    <span class="hljs-keyword">return</span> [
        <span class="hljs-string">&#x27;cedula&#x27;</span>   =&gt; <span class="hljs-string">&#x27;encrypted&#x27;</span>,
        <span class="hljs-string">&#x27;telefono&#x27;</span> =&gt; <span class="hljs-string">&#x27;encrypted&#x27;</span>,
    ];
}
</code></pre>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> <strong>No inventes criptografía</strong>: usa las bibliotecas del framework. Derivar ≠ cifrar ≠ codificar (Base64 <strong>no</strong> es cifrado)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="48">

<pre><code class="language-php"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> Devuelve TODAS las columnas del modelo</span>
<span class="hljs-keyword">return</span> <span class="hljs-title class_">User</span>::<span class="hljs-title function_ invoke__">find</span>(<span class="hljs-variable">$id</span>);

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Recurso explícito: solo lo necesario</span>
<span class="hljs-class"><span class="hljs-keyword">class</span> <span class="hljs-title">UsuarioResource</span> <span class="hljs-keyword">extends</span> <span class="hljs-title">JsonResource</span>
