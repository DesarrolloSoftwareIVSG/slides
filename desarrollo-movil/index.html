<h2 id="%C2%BFqu%C3%A9-construimos-en-este-tema">¿Qué construimos en este tema?</h2>
<ul>
<li>Una <strong>aplicación móvil</strong> instalable en Android e iOS que consume la <strong>API REST en Laravel</strong> del tema anterior</li>
</ul>
<div class="grid">
<div>
<h3 id="%F0%9F%93%B1-introducci%C3%B3n"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Introducción</h3>
<p>Qué hace distinta a una app móvil y qué ecosistemas existen</p>
</div>
<div>
<h3 id="%E2%9A%96%EF%B8%8F-enfoques"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> Enfoques</h3>
<p>Nativo, multiplataforma, híbrido y PWA: cuándo elegir cada uno</p>
</div>
<div>
<h3 id="%E2%9A%A1-ionic--capacitor"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Ionic + Capacitor</h3>
<p>UI con componentes web + puente hacia el sistema operativo</p>
</div>
<div>
<h3 id="%F0%9F%94%8C-hardware"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> Hardware</h3>
<p>Cámara, GPS, almacenamiento, red y notificaciones desde TypeScript</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Al final del tema cada equipo tendrá una <strong>app móvil autenticada</strong> contra su API, con al menos <strong>un recurso de hardware</strong> integrado</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-scope-fPAxue3s="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="3" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">
<h1 id="introducci%C3%B3n-al-desarrollo-m%C3%B3vil">Introducción al desarrollo móvil</h1>
<h2 id="contenidos-1">Contenidos</h2>
<ul>
<li>Conceptos básicos</li>
<li>Ecosistemas móviles</li>
<li>Desarrollo nativo y multiplataforma</li>
<li>Lenguajes en tendencia</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="%C2%BFqu%C3%A9-es-una-aplicaci%C3%B3n-m%C3%B3vil">¿Qué es una aplicación móvil?</h2>
<ul>
<li>Software diseñado para ejecutarse en <strong>teléfonos y tabletas</strong>, aprovechando sus capacidades y respetando sus limitaciones</li>
</ul>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.92rem;">
<div>
<h3 id="%F0%9F%93%90-restricciones-del-medio"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> Restricciones del medio</h3>
<ul>
<li>Pantalla <strong>pequeña</strong> y de tamaños muy variados</li>
<li>Entrada <strong>táctil</strong>: dedos, gestos, teclado virtual</li>
<li><strong>Batería</strong> y memoria limitadas</li>
<li>Conectividad <strong>intermitente</strong> (Wi-Fi ↔ datos ↔ sin señal)</li>
<li><strong>Interrupciones</strong>: llamadas, notificaciones, cambio de app</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9A%80-oportunidades-del-medio"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> Oportunidades del medio</h3>
<ul>
<li><strong>Sensores</strong>: GPS, acelerómetro, giroscopio, brújula</li>
<li><strong>Cámara</strong>, micrófono, biometría</li>
<li><strong>Notificaciones</strong> push</li>
<li>Siempre <strong>con el usuario</strong>: uso frecuente y en movimiento</li>
<li><strong>Instalación</strong> en el dispositivo, ícono en la pantalla de inicio</li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Diseñar para móvil no es &quot;achicar la web&quot;: es diseñar para <strong>otro contexto de uso</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="conceptos-clave">Conceptos clave</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%A6-paquete"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> Paquete</h3>
<p>Android: <strong>APK</strong> / <strong>AAB</strong> (formato de publicación en Play) · iOS: <strong>IPA</strong></p>
</div>
<div>
<h3 id="%F0%9F%86%94-identificador-de-app"><img class="emoji" draggable="false" alt="🆔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f194.svg" data-marp-twemoji=""/> Identificador de app</h3>
<p>Único y permanente, estilo dominio invertido: <code>cr.ac.ucr.pedidos</code></p>
</div>
<div>
<h3 id="%E2%9C%8D%EF%B8%8F-firma">✍️ Firma</h3>
<p>Toda app se <strong>firma</strong> con un certificado del desarrollador. Sin firma no se instala ni se publica</p>
</div>
<div>
<h3 id="%F0%9F%94%90-permisos"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> Permisos</h3>
<p>El usuario <strong>autoriza</strong> el acceso a cámara, ubicación, contactos… y puede revocarlo</p>
</div>
<div>
<h3 id="%F0%9F%8F%AA-tienda"><img class="emoji" draggable="false" alt="🏪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ea.svg" data-marp-twemoji=""/> Tienda</h3>
<p>Google Play y App Store <strong>revisan</strong> las apps antes de publicarlas</p>
</div>
<div>
<h3 id="%F0%9F%A7%AA-emulador--simulador"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> Emulador / simulador</h3>
<p>Dispositivo virtual en la computadora para probar sin hardware físico</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="ciclo-de-vida-de-una-aplicaci%C3%B3n">Ciclo de vida de una aplicación</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.88rem;">
<div>
<pre><code class="language-text">   ┌──────────────┐
   │  No iniciada │
   └──────┬───────┘
          │ el usuario toca el ícono
          ▼
   ┌──────────────┐  llamada, cambio de app
   │  En primer   │ ───────────────┐
   │    plano     │                ▼
   └──────────────┘ ◀─────  ┌──────────────┐
          ▲   regresa       │  En segundo  │
          │                 │    plano     │
          │                 └──────┬───────┘
          │                        │ el SO necesita memoria
          └──── se relanza ── ┌────▼─────────┐
                              │  Terminada   │
                              └──────────────┘
</code></pre>
</div>
<div>
<ul>
<li>El <strong>sistema operativo</strong> decide cuándo pausar o matar la app, no el desarrollador</li>
<li>En segundo plano la app <strong>no debería</strong> consumir CPU, red ni batería</li>
<li>Si el SO la termina, el usuario espera <strong>volver donde estaba</strong>: hay que guardar el estado</li>
</ul>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">App</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/app&#x27;</span>;

<span class="hljs-title class_">App</span>.<span class="hljs-title function_">addListener</span>(<span class="hljs-string">&#x27;appStateChange&#x27;</span>, <span class="hljs-function">(<span class="hljs-params">{ isActive }</span>) =&gt;</span> {
  <span class="hljs-keyword">if</span> (!isActive) <span class="hljs-title function_">guardarBorrador</span>();
});
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="tipos-de-aplicaciones-m%C3%B3viles">Tipos de aplicaciones móviles</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B1-nativa"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Nativa</h3>
<p>Un proyecto por plataforma con el SDK oficial: <strong>Kotlin</strong> (Android) y <strong>Swift</strong> (iOS)</p>
</div>
<div>
<h3 id="%F0%9F%8E%A8-multiplataforma-con-ui-propia"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Multiplataforma con UI propia</h3>
<p>Un código, el framework <strong>dibuja</strong> o <strong>mapea</strong> sus componentes: <strong>Flutter</strong>, <strong>React Native</strong>, <strong>.NET MAUI</strong></p>
</div>
<div>
<h3 id="%F0%9F%8C%90-h%C3%ADbrida"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Híbrida</h3>
<p>App web dentro de un <strong>WebView</strong> nativo con acceso a APIs del SO: <strong>Ionic + Capacitor</strong>, Cordova</p>
</div>
<div>
<h3 id="%F0%9F%93%B2-pwa"><img class="emoji" draggable="false" alt="📲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f2.svg" data-marp-twemoji=""/> PWA</h3>
<p>App web <strong>instalable</strong> desde el navegador, con <em>service worker</em> y <em>manifest</em>. No pasa por la tienda (salvo empaquetado)</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Ya vimos en <em>Fundamentos de la Web</em> la comparación <strong>web vs. nativa</strong>; aquí profundizamos en el <strong>cómo</strong> se construye cada una</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">

<th style="text-align:left"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS / iPadOS</th>

<h2 id="ecosistemas-lo-que-no-se-ve-en-la-tabla">Ecosistemas: lo que no se ve en la tabla</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%F0%9F%A4%96-android"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android</h3>
<ul>
<li><strong>Fragmentación</strong>: miles de modelos, tamaños, versiones del SO y capas de fabricante</li>
<li>Muchos usuarios en versiones <strong>viejas</strong> del sistema</li>
<li>Instalación fuera de la tienda (<em>sideloading</em>) permitida</li>
<li>Probar en un <strong>gama baja</strong> es obligatorio: ahí aparecen los problemas de rendimiento</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8D%8E-ios"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS</h3>
<ul>
<li>Pocos modelos y <strong>adopción rápida</strong> de nuevas versiones</li>
<li>Revisión de la App Store <strong>más estricta</strong></li>
<li>Compilar y firmar requiere una <strong>Mac</strong> con Xcode</li>
<li>Usuarios con mayor disposición a <strong>pagar</strong> dentro de apps</li>
</ul>
<h3 id="%F0%9F%8C%8F-otros"><img class="emoji" draggable="false" alt="🌏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30f.svg" data-marp-twemoji=""/> Otros</h3>
<ul>
<li><strong>HarmonyOS NEXT</strong> (Huawei) en China, ya sin compatibilidad Android</li>
<li>Relojes, TV y autos: Wear OS, watchOS, Android Auto, CarPlay</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">

<th style="text-align:left"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Multiplataforma (Flutter, RN)</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Híbrido (Ionic + Capacitor)</th>

<h2 id="%C2%BFc%C3%B3mo-funciona-cada-enfoque-por-dentro">¿Cómo funciona cada enfoque por dentro?</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.78rem;">
<div>
<h3 id="%F0%9F%A7%B1-nativo"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Nativo</h3>
<pre><code class="language-text">  Código Kotlin / Swift
          │
          ▼
  SDK de la plataforma
          │
          ▼
  Componentes nativos
          │
          ▼
       Sistema
</code></pre>
</div>
<div>
<h3 id="%F0%9F%8E%A8-flutter--react-native"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Flutter / React Native</h3>
<pre><code class="language-text">   Código Dart / JS
          │
          ▼
  Motor del framework
 (dibuja o mapea vistas)
          │
          ▼
  Canales / JSI ──▶ APIs
          │
          ▼
       Sistema
</code></pre>
</div>
</split-slide>
<div style="font-size:0.78rem">
<h3 id="%F0%9F%8C%90-ionic--capacitor"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Ionic + Capacitor</h3>
<pre><code class="language-text">  HTML + CSS + TS (Angular / React / Vue)  →  WebView nativo  →  Puente de Capacitor  →  Plugin nativo (Kotlin / Swift)  →  Sistema
</code></pre>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> No hay un enfoque &quot;mejor&quot;: hay uno <strong>adecuado</strong> al equipo, al presupuesto y a lo que la app necesita del hardware</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="%C2%BFcu%C3%A1ndo-elegir-qu%C3%A9">¿Cuándo elegir qué?</h2>
<steps>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%A7%B1-nativo-si"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> Nativo si…</h3>
<p>Juegos, AR, procesamiento intensivo de audio/video, o necesitas la API de la plataforma <strong>el día que sale</strong></p>
</div>
<div>
<h3 id="%F0%9F%8E%A8-flutter--rn-si"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Flutter / RN si…</h3>
<p>Animaciones complejas, UI muy personalizada y un equipo dispuesto a aprender otro stack</p>
</div>
<div>
<h3 id="%F0%9F%8C%90-ionic--capacitor-si"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Ionic + Capacitor si…</h3>
<p>Apps de <strong>gestión, formularios, listas y datos de una API</strong>; el equipo ya domina la web y quiere <strong>un solo código</strong> para web, Android e iOS</p>
</div>
<div>
<h3 id="%F0%9F%93%B2-pwa-si"><img class="emoji" draggable="false" alt="📲" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f2.svg" data-marp-twemoji=""/> PWA si…</h3>
<p>No necesitas tienda ni APIs nativas avanzadas y priorizas el alcance por URL</p>
</div>
</div>
</step>
<step>
<ul>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>¿Por qué Ionic + Capacitor en este curso?</strong>
<ul>
<li>Reutiliza <strong>todo</strong> lo visto: HTML, CSS, JavaScript, módulos, componentes web, <code>fetch</code>, asincronía</li>
<li>El mismo proyecto genera la <strong>web</strong> y las apps <strong>Android/iOS</strong></li>
<li>Consume la <strong>misma API Laravel</strong> con tokens de Sanctum</li>
<li>Se puede bajar a <strong>Kotlin/Swift</strong> cuando un plugin no alcance</li>
</ul>
</li>
</ul>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="lenguajes-de-programaci%C3%B3n-en-tendencia">Lenguajes de programación en tendencia</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%9F%A3-kotlin"><img class="emoji" draggable="false" alt="🟣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e3.svg" data-marp-twemoji=""/> Kotlin</h3>
<p>Oficial de Android desde 2019. <strong>Jetpack Compose</strong> para UI y <strong>Kotlin Multiplatform</strong> para compartir lógica con iOS</p>
</div>
<div>
<h3 id="%F0%9F%9F%A0-swift"><img class="emoji" draggable="false" alt="🟠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e0.svg" data-marp-twemoji=""/> Swift</h3>
<p>Lenguaje de Apple; <strong>SwiftUI</strong> para UI declarativa. Seguro por defecto (opcionales, <em>concurrency</em> estricta)</p>
</div>
<div>
<h3 id="%F0%9F%94%B5-dart"><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> Dart</h3>
<p>Lenguaje de <strong>Flutter</strong>. Compila a código nativo ARM y a la web</p>
</div>
<div>
<h3 id="%F0%9F%9F%A6-typescript--javascript"><img class="emoji" draggable="false" alt="🟦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e6.svg" data-marp-twemoji=""/> TypeScript / JavaScript</h3>
<p><strong>React Native</strong>, <strong>Ionic</strong>, <strong>Capacitor</strong>, NativeScript. El lenguaje más usado del mundo llevado al móvil</p>
</div>
<div>
<h3 id="%F0%9F%9F%AA-c"><img class="emoji" draggable="false" alt="🟪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7ea.svg" data-marp-twemoji=""/> C#</h3>
<p><strong>.NET MAUI</strong> (sucesor de Xamarin) para quienes vienen del ecosistema Microsoft</p>
</div>
<div>
<h3 id="%E2%98%95-java--objective-c"><img class="emoji" draggable="false" alt="☕" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2615.svg" data-marp-twemoji=""/> Java / Objective-C</h3>
<p>Legado: aún hay muchísimo código existente, pero los proyectos nuevos usan Kotlin y Swift</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> La tendencia común: <strong>UI declarativa</strong> (Compose, SwiftUI, Flutter, React) y <strong>compartir lógica</strong> entre plataformas</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="actividad-1--elegir-el-enfoque">Actividad 1 — Elegir el enfoque</h2>
<div class="grid">

<h3 id="%F0%9F%8F%A5-caso-c"><img class="emoji" draggable="false" alt="🏥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e5.svg" data-marp-twemoji=""/> Caso C</h3>

<h1 id="dise%C3%B1o-de-aplicaciones-m%C3%B3viles">Diseño de aplicaciones móviles</h1>
<h2 id="contenidos-2">Contenidos</h2>
<ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="principios-de-dise%C3%B1o-m%C3%B3vil">Principios de diseño móvil</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="%F0%9F%91%86-dise%C3%B1o-para-el-dedo"><img class="emoji" draggable="false" alt="👆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f446.svg" data-marp-twemoji=""/> Diseño para el dedo</h3>
<ul>
<li>Objetivos táctiles de <strong>≥ 48 dp</strong> (Android) / <strong>≥ 44 pt</strong> (iOS)</li>
<li>Acciones principales en la <strong>zona del pulgar</strong> (mitad inferior)</li>
<li>Espacio entre elementos tocables para evitar errores</li>
</ul>
<h3 id="%F0%9F%8E%AF-una-tarea-por-pantalla"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Una tarea por pantalla</h3>
<ul>
<li>Jerarquía clara: <strong>un</strong> botón primario</li>
<li>Formularios cortos, con el <strong>teclado correcto</strong> (<code>type=&quot;email&quot;</code>, <code>inputmode=&quot;numeric&quot;</code>)</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%B1-respetar-el-dispositivo"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Respetar el dispositivo</h3>
<ul>
<li><strong>Áreas seguras</strong>: muesca, isla dinámica, barra de gestos</li>
<li>Orientación vertical y horizontal</li>
<li><strong>Modo oscuro</strong> y tamaño de letra del sistema</li>
</ul>
<h3 id="%E2%8F%B3-retroalimentaci%C3%B3n-inmediata"><img class="emoji" draggable="false" alt="⏳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f3.svg" data-marp-twemoji=""/> Retroalimentación inmediata</h3>
<ul>
<li><em>Skeletons</em> y <em>spinners</em> mientras se cargan datos</li>
<li>Mensajes de error <strong>accionables</strong></li>
<li>Estados vacíos con una acción sugerida</li>
<li><strong>Vibración</strong> (háptica) en confirmaciones importantes</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="material-design-vs-human-interface-guidelines">Material Design vs. Human Interface Guidelines</h2>
<table>
<thead>
<tr>
<th style="text-align:left"></th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Material Design 3 (Google)</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> Human Interface Guidelines (Apple)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Navegación principal</strong></td>
<td style="text-align:left"><em>Navigation bar</em> inferior o <em>drawer</em> lateral</td>
<td style="text-align:left"><em>Tab bar</em> inferior</td>
</tr>
<tr>
<td style="text-align:left"><strong>Acción principal</strong></td>
<td style="text-align:left"><strong>FAB</strong> (botón flotante)</td>
<td style="text-align:left">Botón en la barra de navegación</td>
</tr>
<tr>
<td style="text-align:left"><strong>Volver</strong></td>
<td style="text-align:left">Botón/gesto <strong>atrás del sistema</strong></td>
<td style="text-align:left">Botón &quot;‹ Atrás&quot; y deslizar desde el borde</td>
</tr>
<tr>
<td style="text-align:left"><strong>Títulos</strong></td>
<td style="text-align:left">Alineados a la izquierda</td>
<td style="text-align:left">Centrados; <em>large titles</em> que se encogen al hacer scroll</td>
</tr>
<tr>
<td style="text-align:left"><strong>Diálogos</strong></td>
<td style="text-align:left">Diálogos y <em>bottom sheets</em></td>
<td style="text-align:left"><em>Alerts</em> y <em>action sheets</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Personalización</strong></td>
<td style="text-align:left">Color dinámico desde el fondo de pantalla</td>
<td style="text-align:left">Colores del sistema y materiales translúcidos</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El usuario de cada plataforma <strong>espera</strong> las convenciones de la suya. Ionic las aplica automáticamente</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="patrones-de-navegaci%C3%B3n">Patrones de navegación</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%97%82%EF%B8%8F-pesta%C3%B1as-tabs"><img class="emoji" draggable="false" alt="🗂️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c2.svg" data-marp-twemoji=""/> Pestañas (tabs)</h3>
<p>3–5 secciones de <strong>igual importancia</strong> siempre visibles. El patrón más común en apps de consumo</p>
</div>
<div>
<h3 id="%F0%9F%93%9A-pila-stack"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> Pila (stack)</h3>
<p>Lista → detalle → edición. Cada pantalla se <strong>apila</strong> sobre la anterior y &quot;atrás&quot; la desapila</p>
</div>
<div>
<h3 id="%E2%98%B0-men%C3%BA-lateral-drawer">☰ Menú lateral (drawer)</h3>
<p>Muchas secciones o de uso poco frecuente. Esconde la navegación: úsalo con cuidado</p>
</div>
<div>
<h3 id="%F0%9F%AA%9F-modal"><img class="emoji" draggable="false" alt="🪟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa9f.svg" data-marp-twemoji=""/> Modal</h3>
<p>Tarea <strong>autocontenida</strong> que interrumpe el flujo: crear un registro, filtros, confirmar</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Lo normal es <strong>combinarlos</strong>: pestañas en la raíz y una pila dentro de cada pestaña</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="estilo-adaptativo-de-ionic">Estilo adaptativo de Ionic</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.88rem;">
<div>
<ul>
<li>Cada componente de Ionic tiene <strong>dos modos</strong>: <code>ios</code> y <code>md</code> (Material Design)</li>
<li>Por defecto se elige según la <strong>plataforma</strong> donde corre la app</li>
<li>El mismo HTML se ve <strong>&quot;nativo&quot;</strong> en cada sistema</li>
</ul>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- Igual en ambas plataformas --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ion-button</span>&gt;</span>Guardar<span class="hljs-tag">&lt;/<span class="hljs-name">ion-button</span>&gt;</span>

<span class="hljs-comment">&lt;!-- Forzar un modo en un componente --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ion-toolbar</span> <span class="hljs-attr">mode</span>=<span class="hljs-string">&quot;ios&quot;</span>&gt;</span>…<span class="hljs-tag">&lt;/<span class="hljs-name">ion-toolbar</span>&gt;</span>
</code></pre>
<pre><code class="language-ts"><span class="hljs-comment">// main.ts — forzar un modo global</span>
<span class="hljs-title function_">createApp</span>(<span class="hljs-title class_">App</span>).<span class="hljs-title function_">use</span>(<span class="hljs-title class_">IonicVue</span>, { <span class="hljs-attr">mode</span>: <span class="hljs-string">&#x27;md&#x27;</span> })
</code></pre>
</div>
<div>
<h3 id="qu%C3%A9-cambia-entre-modos">Qué cambia entre modos</h3>
<ul>
<li>Tipografía (San Francisco vs. Roboto)</li>
<li>Alineación de títulos</li>
<li>Animaciones de transición entre páginas</li>
<li>Forma de botones, <em>toggles</em> y <em>checkboxes</em></li>
<li>Gesto de <strong>deslizar para volver</strong> (activo en <code>ios</code>)</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> En el navegador se puede probar con <code>?ionic:mode=ios</code> en la URL</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-eyKTsjJv="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="20" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">
<h1 id="herramientas-y-entornos-de-desarrollo">Herramientas y entornos de desarrollo</h1>
<h2 id="contenidos-3">Contenidos</h2>
<ul>
<li>IDEs y SDKs</li>
<li>Emuladores y dispositivos físicos</li>
<li>Recarga en vivo y depuración remota</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="ides-y-herramientas">IDEs y herramientas</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%92%99-visual-studio-code"><img class="emoji" draggable="false" alt="💙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f499.svg" data-marp-twemoji=""/> Visual Studio Code</h3>
<p>Donde escribimos <strong>todo</strong> el código web. Extensión oficial <strong>Ionic</strong> para generar páginas, correr en dispositivos y gestionar plugins</p>
</div>
<div>
<h3 id="%F0%9F%A4%96-android-studio"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android Studio</h3>
<p>Trae el <strong>Android SDK</strong>, el JDK, el emulador (AVD) y el <em>Logcat</em>. Abre la carpeta <code>android/</code> generada por Capacitor</p>
</div>
<div>
<h3 id="%F0%9F%8D%8E-xcode"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> Xcode</h3>
<p>Simulador de iOS, firma y publicación. <strong>Solo en macOS</strong>. Abre <code>ios/App/App.xcodeproj</code></p>
</div>
<div>
<h3 id="%E2%8C%A8%EF%B8%8F-clis"><img class="emoji" draggable="false" alt="⌨️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2328.svg" data-marp-twemoji=""/> CLIs</h3>
<p><code>@ionic/cli</code> (crear, servir, generar) y <code>@capacitor/cli</code> (<code>npx cap …</code>) para sincronizar con los proyectos nativos</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🪟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa9f.svg" data-marp-twemoji=""/> En Windows/Linux se desarrolla <strong>Android</strong> completo; iOS requiere una Mac (propia, de laboratorio o en la nube)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="requisitos-del-entorno--capacitor-8">Requisitos del entorno — Capacitor 8</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="para-todos">Para todos</h3>
<ul>
<li><strong>Node.js 22</strong> o superior</li>
<li>VS Code + extensión Ionic</li>
<li>Ionic CLI:</li>
</ul>
<pre><code class="language-bash">npm i -g @ionic/cli
ionic --version
</code></pre>
<h3 id="%F0%9F%A4%96-android-1"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Android</h3>
<ul>
<li><strong>Android Studio 2025.2.1</strong> o superior</li>
<li>SDK Platform <strong>API 24+</strong> desde el <em>SDK Manager</em></li>
<li>Un dispositivo virtual (AVD) o un teléfono con <strong>depuración USB</strong> activada</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8D%8E-ios-1"><img class="emoji" draggable="false" alt="🍎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f34e.svg" data-marp-twemoji=""/> iOS</h3>
<ul>
<li><strong>Xcode 26</strong> o superior (macOS)</li>
<li><em>Command Line Tools</em> de Xcode</li>
<li>Cuenta de Apple para firmar en un dispositivo físico (gratuita para pruebas, USD 99/año para publicar)</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Las versiones mínimas suben con cada versión mayor de Capacitor. Verifique siempre la página <strong>Environment Setup</strong> de la documentación oficial</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="emuladores-dispositivos-y-depuraci%C3%B3n">Emuladores, dispositivos y depuración</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.85rem;">
<div>
<h3 id="%F0%9F%94%81-recarga-en-vivo"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Recarga en vivo</h3>
<pre><code class="language-bash"><span class="hljs-comment"># En el navegador (lo más rápido)</span>
ionic serve

<span class="hljs-comment"># En el emulador o teléfono, con recarga en vivo</span>
ionic <span class="hljs-built_in">cap</span> run android -l --external
ionic <span class="hljs-built_in">cap</span> run ios -l --external
</code></pre>
<ul>
<li><code>-l</code> = <em>livereload</em>: el WebView carga el servidor de desarrollo de la PC</li>
<li><code>--external</code> expone el servidor en la red local para que el teléfono lo alcance</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%8D-depuraci%C3%B3n-remota"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> Depuración remota</h3>
<ul>
<li><strong>Android</strong>: abrir <code>chrome://inspect</code> en Chrome → <em>Inspect</em> sobre el WebView de la app → DevTools completas</li>
<li><strong>iOS</strong>: Safari → menú <em>Desarrollo</em> → el simulador o el iPhone → Web Inspector</li>
<li><strong>Código nativo</strong>: <em>Logcat</em> en Android Studio, consola de Xcode</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> El 90 % del desarrollo se hace en <code>ionic serve</code>. El dispositivo se usa para <strong>hardware</strong>, rendimiento y gestos</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-LOVDitZa="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="24" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">
<h1 id="frameworks-para-desarrollo-m%C3%B3vil">Frameworks para desarrollo móvil</h1>
<h2 id="contenidos-4">Contenidos</h2>
<ul>
<li>Panorama de frameworks</li>
<li>Ionic Framework 9</li>
<li>Capacitor 8</li>
<li>Crear y estructurar un proyecto</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="panorama-de-frameworks">Panorama de frameworks</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Framework</th>
<th style="text-align:left">Empresa</th>
<th style="text-align:left">Lenguaje</th>
<th style="text-align:left">Cómo renderiza</th>
<th style="text-align:left">Destaca en</th>
</tr>
</thead>
<tbody>
<tr>

<td style="text-align:left">UI personalizada, animaciones</td>

</tr>

<td style="text-align:left"><strong>Ionic + Capacitor</strong></td>

</tr>
<tr>
<td style="text-align:left"><strong>.NET MAUI</strong></td>
<td style="text-align:left">Microsoft</td>
<td style="text-align:left">C# / XAML</td>

</tr>
<tr>
<td style="text-align:left"><strong>Kotlin Multiplatform</strong></td>
<td style="text-align:left">JetBrains</td>
<td style="text-align:left">Kotlin</td>
<td style="text-align:left">Nativo (+ Compose Multiplatform)</td>
<td style="text-align:left">Compartir lógica, UI nativa</td>
</tr>

<ul>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="ionic-framework">Ionic Framework</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.9rem;">
<div>
<ul>
<li><strong>Kit de componentes de UI</strong> para móvil: más de 100 componentes (<code>&lt;ion-button&gt;</code>, <code>&lt;ion-list&gt;</code>, <code>&lt;ion-modal&gt;</code>…)</li>
<li>Construidos como <strong>componentes web</strong> con <em>Stencil</em>: funcionan en <strong>Angular, React, Vue</strong> o JavaScript puro</li>
<li>Estilo adaptativo <code>ios</code> / <code>md</code>, gestos, animaciones y temas con <strong>variables CSS</strong></li>
<li><strong>No</strong> accede al hardware: de eso se encarga Capacitor</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> ¿Recuerdan el tema de <em>Web Components</em>? <code>&lt;ion-button&gt;</code> es exactamente eso: un <em>custom element</em> con <em>shadow DOM</em></li>
</ul>
</div>
<div>
<h3 id="ionic-9-agosto-2026">Ionic 9 (agosto 2026)</h3>
<ul>
<li>Angular <strong>18–22</strong>, React <strong>18+</strong> (React Router 6), Vue <strong>3.5+</strong> (Vue Router 5)</li>
<li>Requiere <strong>Capacitor 7+</strong></li>
<li>iOS <strong>16+</strong>, Chrome/Edge <strong>89+</strong>, Safari <strong>16+</strong></li>
<li>En Vue: paquetes <code>@ionic/vue</code> y <code>@ionic/vue-router</code></li>
<li>Se eliminó el <em>picker</em> legado; <code>ion-img</code> queda obsoleto (usar <code>&lt;img loading=&quot;lazy&quot;&gt;</code>)</li>
<li>Migración asistida:</li>
</ul>
<pre><code class="language-bash">npx @ionic/migrate
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="capacitor">Capacitor</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.9rem;">
<div>
<ul>
<li><strong>Runtime nativo multiplataforma</strong>: envuelve una app web en un proyecto <strong>Android</strong> y otro <strong>iOS</strong> reales</li>
<li>Expone APIs del dispositivo a JavaScript mediante <strong>plugins</strong></li>
<li>Los proyectos nativos son <strong>código fuente</strong> que se versiona y se puede editar en Android Studio / Xcode</li>
<li>Funciona con <strong>cualquier</strong> app web, no solo con Ionic</li>
<li>Sucesor moderno de <strong>Apache Cordova</strong> (compatible con la mayoría de sus plugins)</li>
</ul>
</div>
<div>
<h3 id="capacitor-8">Capacitor 8</h3>
<ul>
<li><strong>Swift Package Manager</strong> por defecto para iOS en proyectos nuevos (CocoaPods sigue soportado)</li>
<li>Soporte de <strong>edge-to-edge</strong> en Android con el plugin <em>SystemBars</em></li>
<li>8.5: soporte de <strong>UIScene</strong> en iOS</li>
<li>Última estable: <strong>8.5.x</strong> (octubre 2026); Capacitor 9 en <em>alpha</em></li>
</ul>
</div>
</split-slide>
<ul>
<li><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> Ionic pone la <strong>cara</strong>, Capacitor pone el <strong>cuerpo</strong>: juntos dan una app instalable con acceso al dispositivo</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="arquitectura-de-una-app-ionic--capacitor">Arquitectura de una app Ionic + Capacitor</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.88rem;">
<div>
<pre><code class="language-text">┌────────────────────────────────────────┐
│  App web (Vue + Ionic)                 │
│  views · components · composables      │
│                                        │
│  import { Camera } from                │
│         &#x27;@capacitor/camera&#x27;;           │
├────────────────────────────────────────┤
│  WebView nativo                        │
│  (Android System WebView / WKWebView)  │
├────────────────────────────────────────┤
│  Puente de Capacitor  (JS ⇄ nativo)    │
├──────────────────┬─────────────────────┤
│ Plugin Kotlin    │ Plugin Swift        │
├──────────────────┼─────────────────────┤
│ Android SDK      │ iOS SDK             │
└──────────────────┴─────────────────────┘
</code></pre>
</div>
<div>
<ul>
<li>La app web corre <strong>local</strong> dentro del WebView, servida desde <code>https://localhost</code> (Android) o <code>capacitor://localhost</code> (iOS)</li>
<li>Cada llamada a un plugin cruza el puente y devuelve una <strong>Promesa</strong></li>
<li>En el navegador, los plugins usan una <strong>implementación web</strong> cuando existe (p. ej. la cámara usa <code>&lt;input type=&quot;file&quot;&gt;</code>)</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Esos orígenes importan para <strong>CORS</strong> en la API Laravel</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="crear-un-proyecto">Crear un proyecto</h2>
<steps>
<step>
<pre><code class="language-bash"><span class="hljs-comment"># 1. Crear la app: plantilla &quot;tabs&quot;, Vue + Vite, con Capacitor</span>
ionic start pedidos-app tabs --<span class="hljs-built_in">type</span>=vue --capacitor

<span class="hljs-built_in">cd</span> pedidos-app
ionic serve                       <span class="hljs-comment"># http://localhost:8100</span>
</code></pre>
<ul>
<li>Plantillas: <code>blank</code>, <code>tabs</code>, <code>sidemenu</code>, <code>list</code> (ver todas con <code>ionic start --list</code>)</li>
<li><code>--type</code> acepta <code>angular</code>, <code>angular-standalone</code>, <code>react</code>, <code>vue</code></li>
</ul>
</step>
<step>
<pre><code class="language-bash"><span class="hljs-comment"># 2. Agregar plataformas nativas</span>
npm i @capacitor/android @capacitor/ios
npx <span class="hljs-built_in">cap</span> add android
npx <span class="hljs-built_in">cap</span> add ios                    <span class="hljs-comment"># solo en macOS</span>

<span class="hljs-comment"># 3. Compilar la web y copiarla a los proyectos nativos</span>
ionic build
npx <span class="hljs-built_in">cap</span> <span class="hljs-built_in">sync</span>

<span class="hljs-comment"># 4. Abrir el IDE nativo o correr directo</span>
npx <span class="hljs-built_in">cap</span> open android
npx <span class="hljs-built_in">cap</span> run android
</code></pre>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="el-ciclo-de-trabajo-con-capacitor">El ciclo de trabajo con Capacitor</h2>
<steps>
<step>
<pre><code class="language-text">  código web (src/)
        │  ionic build
        ▼
  dist/  (bundle de Vite)      ← webDir en capacitor.config.ts
        │  npx cap sync  =  copy + update
        ▼
  android/app/src/main/assets/public     ios/App/App/public
        │  npx cap run / Android Studio / Xcode
        ▼
  APK / AAB                              IPA
</code></pre>
</step>
<step>
<div class="grid">
<div>
<h3 id="npx-cap-copy"><code>npx cap copy</code></h3>
<p>Solo copia el <em>bundle</em> web a los proyectos nativos</p>
</div>
<div>
<h3 id="npx-cap-update"><code>npx cap update</code></h3>
<p>Actualiza dependencias nativas de los plugins</p>
</div>
<div>
<h3 id="npx-cap-sync"><code>npx cap sync</code></h3>
<p><code>copy</code> + <code>update</code>. Ejecútelo después de <strong>instalar un plugin</strong> o compilar</p>
</div>
<div>
<h3 id="%F0%9F%9A%A9-error-t%C3%ADpico"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Error típico</h3>
<p>&quot;Hice cambios y no se ven en el teléfono&quot; → olvidó <code>build</code> + <code>sync</code> (o no está usando <code>-l</code>)</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="estructura-del-proyecto">Estructura del proyecto</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<pre><code class="language-text">pedidos-app/
├── android/             ← proyecto Android Studio
├── ios/                 ← proyecto Xcode
├── public/
├── src/
│   ├── views/
│   │   ├── TabsPage.vue
│   │   ├── PedidosPage.vue
│   │   └── PedidoDetallePage.vue
│   ├── components/
│   ├── composables/     ← useAuth, usePedidos
│   ├── services/        ← api.ts (fetch)
│   ├── router/index.ts
│   ├── theme/variables.css
│   ├── App.vue
│   └── main.ts
├── .env                 ← VITE_API_URL
├── capacitor.config.ts
├── ionic.config.json
├── vite.config.ts
└── package.json
</code></pre>
</div>
<div>
<h3 id="capacitorconfigts"><code>capacitor.config.ts</code></h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> <span class="hljs-keyword">type</span> { <span class="hljs-title class_">CapacitorConfig</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/cli&#x27;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-attr">config</span>: <span class="hljs-title class_">CapacitorConfig</span> = {
  <span class="hljs-attr">appId</span>: <span class="hljs-string">&#x27;cr.ac.ucr.pedidos&#x27;</span>,

<h2 id="arranque-de-la-app--maints-y-appvue">Arranque de la app — <code>main.ts</code> y <code>App.vue</code></h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/main.ts</span>
<span class="hljs-keyword">import</span> { createApp } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">IonicVue</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">App</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./App.vue&#x27;</span>;
<span class="hljs-keyword">import</span> router <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./router&#x27;</span>;

<span class="hljs-comment">/* CSS obligatorio y utilidades de Ionic */</span>
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/core.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/normalize.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/structure.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/typography.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/padding.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/palettes/dark.system.css&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;./theme/variables.css&#x27;</span>;

<span class="hljs-keyword">const</span> app = <span class="hljs-title function_">createApp</span>(<span class="hljs-title class_">App</span>).<span class="hljs-title function_">use</span>(<span class="hljs-title class_">IonicVue</span>).<span class="hljs-title function_">use</span>(router);

router.<span class="hljs-title function_">isReady</span>().<span class="hljs-title function_">then</span>(<span class="hljs-function">() =&gt;</span> app.<span class="hljs-title function_">mount</span>(<span class="hljs-string">&#x27;#app&#x27;</span>));
</code></pre>
</div>
<div>
<pre><code class="language-vue">&lt;!-- src/App.vue --&gt;
&lt;template&gt;
  &lt;ion-app&gt;
    &lt;ion-router-outlet /&gt;
  &lt;/ion-app&gt;
&lt;/template&gt;

&lt;script setup lang=&quot;ts&quot;&gt;
import { IonApp, IonRouterOutlet } from '@ionic/vue';
&lt;/script&gt;
</code></pre>
<ul>
<li><code>IonicVue</code> es un <strong>plugin de Vue</strong>: registra la configuración global (modo, animaciones…)</li>
<li>Se monta <strong>cuando el router está listo</strong> para que la primera página se pinte sin parpadeo</li>
<li>Cada componente de Ionic se <strong>importa explícitamente</strong>: solo se empaqueta lo que se usa</li>
</ul>
</div>
</split-slide>
</section>

<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ion-page</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">ion-header</span> <span class="hljs-attr">:translucent</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">ion-toolbar</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">ion-title</span>&gt;</span>Pedidos<span class="hljs-tag">&lt;/<span class="hljs-name">ion-title</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">ion-buttons</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;end&quot;</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-button</span> @<span class="hljs-attr">click</span>=<span class="hljs-string">&quot;refrescar&quot;</span>&gt;</span>
            <span class="hljs-tag">&lt;<span class="hljs-name">ion-icon</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;icon-only&quot;</span> <span class="hljs-attr">:icon</span>=<span class="hljs-string">&quot;refresh&quot;</span> /&gt;</span>
          <span class="hljs-tag">&lt;/<span class="hljs-name">ion-button</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-buttons</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">ion-toolbar</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ion-header</span>&gt;</span>

    <span class="hljs-tag">&lt;<span class="hljs-name">ion-content</span> <span class="hljs-attr">:fullscreen</span>=<span class="hljs-string">&quot;true&quot;</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">ion-header</span> <span class="hljs-attr">collapse</span>=<span class="hljs-string">&quot;condense&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">ion-toolbar</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-title</span> <span class="hljs-attr">size</span>=<span class="hljs-string">&quot;large&quot;</span>&gt;</span>Pedidos<span class="hljs-tag">&lt;/<span class="hljs-name">ion-title</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-toolbar</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">ion-header</span>&gt;</span>
      <span class="hljs-comment">&lt;!-- contenido con scroll --&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ion-content</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ion-page</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>
</code></pre>
</div>
<div>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ts&quot;</span>&gt;</span><span class="language-javascript">
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">IonPage</span>, <span class="hljs-title class_">IonHeader</span>, <span class="hljs-title class_">IonToolbar</span>, <span class="hljs-title class_">IonTitle</span>,
  <span class="hljs-title class_">IonButtons</span>, <span class="hljs-title class_">IonButton</span>, <span class="hljs-title class_">IonIcon</span>, <span class="hljs-title class_">IonContent</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;
<span class="hljs-keyword">import</span> { refresh } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;ionicons/icons&#x27;</span>;
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<ul>
<li>Toda vista enrutada se envuelve en <strong><code>&lt;ion-page&gt;</code></strong>: sin él no hay transiciones ni ciclo de vida</li>
<li><code>ion-header</code> / <code>ion-footer</code> quedan <strong>fijos</strong>; solo <code>ion-content</code> hace scroll</li>
<li><code>slot=&quot;start&quot;</code> / <code>slot=&quot;end&quot;</code> ubican botones en la barra</li>
<li><code>collapse=&quot;condense&quot;</code> produce el <strong>título grande</strong> de iOS que se encoge al hacer scroll</li>
<li><code>ion-content</code> respeta las <strong>áreas seguras</strong></li>
</ul>
</div>

</section>

<h2 id="una-lista-real-pedidos-de-la-api">Una lista real: pedidos de la API</h2>

<div>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ion-content</span>&gt;</span>

        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-item-option</span>&gt;</span>

</div>
<div>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ts&quot;</span>&gt;</span><span class="language-javascript">
<span class="hljs-keyword">import</span> { ref } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;
<span class="hljs-keyword">import</span> { onIonViewWillEnter,
  type <span class="hljs-title class_">RefresherCustomEvent</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;
<span class="hljs-keyword">import</span> { pedidosApi, type <span class="hljs-title class_">Pedido</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@/services/pedidos&#x27;</span>;

<span class="hljs-keyword">const</span> pedidos = ref&lt;<span class="hljs-title class_">Pedido</span>[]&gt;([]);
<span class="hljs-keyword">const</span> colones = <span class="hljs-keyword">new</span> <span class="hljs-title class_">Intl</span>.<span class="hljs-title class_">NumberFormat</span>(<span class="hljs-string">&#x27;es-CR&#x27;</span>,

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">cargar</span>(<span class="hljs-params"></span>) {

<span class="hljs-title function_">onIonViewWillEnter</span>(cargar);

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">refrescar</span>(<span class="hljs-params">ev: RefresherCustomEvent</span>) {

}
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
