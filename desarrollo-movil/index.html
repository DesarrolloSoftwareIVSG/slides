        <span class="hljs-tag">&lt;<span class="hljs-name">ion-select</span> <span class="hljs-attr">label</span>=<span class="hljs-string">&quot;Estado&quot;</span> <span class="hljs-attr">v-model</span>=<span class="hljs-string">&quot;form.estado&quot;</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-select-option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;pendiente&quot;</span>&gt;</span>Pendiente<span class="hljs-tag">&lt;/<span class="hljs-name">ion-select-option</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-select-option</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;pagado&quot;</span>&gt;</span>Pagado<span class="hljs-tag">&lt;/<span class="hljs-name">ion-select-option</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-select</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">ion-item</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ion-list</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">ion-button</span> <span class="hljs-attr">expand</span>=<span class="hljs-string">&quot;block&quot;</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;submit&quot;</span>&gt;</span>Guardar<span class="hljs-tag">&lt;/<span class="hljs-name">ion-button</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">form</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ts&quot;</span>&gt;</span><span class="language-javascript">
<span class="hljs-keyword">const</span> form = <span class="hljs-title function_">reactive</span>({ <span class="hljs-attr">cliente</span>: <span class="hljs-string">&#x27;&#x27;</span>, <span class="hljs-attr">telefono</span>: <span class="hljs-string">&#x27;&#x27;</span>, <span class="hljs-attr">estado</span>: <span class="hljs-string">&#x27;pendiente&#x27;</span> });
<span class="hljs-keyword">const</span> errores = ref&lt;<span class="hljs-title class_">Record</span>&lt;string, string[]&gt;&gt;({});

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">guardar</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">try</span> {
    <span class="hljs-keyword">await</span> pedidosApi.<span class="hljs-title function_">crear</span>(form);
  } <span class="hljs-keyword">catch</span> (e) {
    <span class="hljs-keyword">if</span> (e <span class="hljs-keyword">instanceof</span> <span class="hljs-title class_">ErrorApi</span> &amp;&amp; e.<span class="hljs-property">status</span> === <span class="hljs-number">422</span>) errores.<span class="hljs-property">value</span> = e.<span class="hljs-property">cuerpo</span>.<span class="hljs-property">errors</span>;
  }
}
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
</div>
<div>
<ul>
<li><code>v-model</code> funciona directamente sobre <code>ion-input</code>, <code>ion-select</code>, <code>ion-toggle</code>…</li>
<li><code>ion-input</code> integra <strong>etiqueta</strong>, mensaje de <strong>error</strong> y ayuda</li>
<li><code>type</code> e <code>inputmode</code> deciden <strong>qué teclado</strong> abre el teléfono</li>
<li>Los errores <strong>422</strong> de Laravel (<code>errors.campo[]</code>) se pintan bajo cada campo: la API sigue siendo la <strong>autoridad</strong></li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Ionic 9: las etiquetas ya <strong>no flotan solas</strong> con contenido en <em>slots</em>; y en <code>ion-select</code>, <code>ionChange</code> solo se dispara si el valor <strong>cambia</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="overlays-alert-toast-modal-loading">Overlays: alert, toast, modal, loading</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { alertController, toastController,
  loadingController } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">cancelar</span>(<span class="hljs-params"><span class="hljs-attr">p</span>: <span class="hljs-title class_">Pedido</span></span>) {
  <span class="hljs-keyword">const</span> alert = <span class="hljs-keyword">await</span> alertController.<span class="hljs-title function_">create</span>({
    <span class="hljs-attr">header</span>: <span class="hljs-string">&#x27;¿Cancelar pedido?&#x27;</span>,
    <span class="hljs-attr">message</span>: <span class="hljs-string">`El pedido #<span class="hljs-subst">${p.id}</span> no se podrá recuperar`</span>,
    <span class="hljs-attr">buttons</span>: [
      { <span class="hljs-attr">text</span>: <span class="hljs-string">&#x27;No&#x27;</span>, <span class="hljs-attr">role</span>: <span class="hljs-string">&#x27;cancel&#x27;</span> },
      { <span class="hljs-attr">text</span>: <span class="hljs-string">&#x27;Sí, cancelar&#x27;</span>, <span class="hljs-attr">role</span>: <span class="hljs-string">&#x27;destructive&#x27;</span> },
    ],
  });
  <span class="hljs-keyword">await</span> alert.<span class="hljs-title function_">present</span>();
  <span class="hljs-keyword">const</span> { role } = <span class="hljs-keyword">await</span> alert.<span class="hljs-title function_">onDidDismiss</span>();
  <span class="hljs-keyword">if</span> (role !== <span class="hljs-string">&#x27;destructive&#x27;</span>) <span class="hljs-keyword">return</span>;

  <span class="hljs-keyword">const</span> spinner = <span class="hljs-keyword">await</span> loadingController.<span class="hljs-title function_">create</span>({ <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;Cancelando…&#x27;</span> });
  <span class="hljs-keyword">await</span> spinner.<span class="hljs-title function_">present</span>();
  <span class="hljs-keyword">try</span> {
    <span class="hljs-keyword">await</span> pedidosApi.<span class="hljs-title function_">cancelar</span>(p.<span class="hljs-property">id</span>);
    <span class="hljs-keyword">const</span> toast = <span class="hljs-keyword">await</span> toastController.<span class="hljs-title function_">create</span>({
      <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;Pedido cancelado&#x27;</span>, <span class="hljs-attr">duration</span>: <span class="hljs-number">2000</span> });
    <span class="hljs-keyword">await</span> toast.<span class="hljs-title function_">present</span>();
  } <span class="hljs-keyword">finally</span> {
    spinner.<span class="hljs-title function_">dismiss</span>();
  }
}
</code></pre>
</div>
<div>
<ul>
<li>Los <em>controllers</em> crean overlays <strong>desde código</strong>; también existen como etiquetas (<code>&lt;ion-modal :is-open=&quot;abierto&quot;&gt;</code>)</li>
<li><code>role</code> permite saber <strong>cómo</strong> se cerró el diálogo</li>
<li><strong>Alert</strong> → decisión que bloquea</li>
<li><strong>Toast</strong> → aviso que no bloquea</li>
<li><strong>Modal</strong> → tarea completa</li>
<li><strong>Action sheet</strong> → elegir entre varias acciones</li>
</ul>
<br />
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Confirmar siempre las acciones <strong>destructivas</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="temas-modo-oscuro-y-%C3%A1reas-seguras">Temas, modo oscuro y áreas seguras</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%8E%A8-colores-con-variables-css"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> Colores con variables CSS</h3>
<pre><code class="language-css"><span class="hljs-comment">/* src/theme/variables.css */</span>
<span class="hljs-selector-pseudo">:root</span> {
  <span class="hljs-attr">--ion-color-primary</span>: <span class="hljs-number">#00c0f3</span>;          <span class="hljs-comment">/* celeste UCR */</span>
  <span class="hljs-attr">--ion-color-primary-contrast</span>: <span class="hljs-number">#ffffff</span>;
  <span class="hljs-attr">--ion-font-family</span>: <span class="hljs-string">&#x27;Inter&#x27;</span>, sans-serif;
}
</code></pre>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ion-button</span> <span class="hljs-attr">color</span>=<span class="hljs-string">&quot;primary&quot;</span>&gt;</span>Guardar<span class="hljs-tag">&lt;/<span class="hljs-name">ion-button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ion-badge</span> <span class="hljs-attr">color</span>=<span class="hljs-string">&quot;warning&quot;</span>&gt;</span>Pendiente<span class="hljs-tag">&lt;/<span class="hljs-name">ion-badge</span>&gt;</span>
</code></pre>
<ul>
<li>Colores predefinidos: <code>primary</code>, <code>secondary</code>, <code>tertiary</code>, <code>success</code>, <code>warning</code>, <code>danger</code>, <code>light</code>, <code>medium</code>, <code>dark</code></li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8C%99-modo-oscuro"><img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> Modo oscuro</h3>
<pre><code class="language-ts"><span class="hljs-comment">// main.ts — sigue la preferencia del sistema</span>
<span class="hljs-keyword">import</span> <span class="hljs-string">&#x27;@ionic/vue/css/palettes/dark.system.css&#x27;</span>;
</code></pre>
<h3 id="%F0%9F%93%8F-%C3%A1reas-seguras"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> Áreas seguras</h3>
<pre><code class="language-css"><span class="hljs-selector-class">.barra-propia</span> {
  <span class="hljs-attribute">padding-top</span>: <span class="hljs-built_in">var</span>(--ion-safe-area-top);
  <span class="hljs-attribute">padding-bottom</span>: <span class="hljs-built_in">var</span>(--ion-safe-area-bottom);
}
</code></pre>
<ul>
<li>Con Capacitor 8 la app dibuja <strong>de borde a borde</strong> en Android: los componentes de Ionic ya lo resuelven, el CSS propio debe usar las variables de área segura</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-scope-iU8s4quh="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="40" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">
<h1 id="navegaci%C3%B3n">Navegación</h1>
<h2 id="contenidos-6">Contenidos</h2>
<ul>
<li>Rutas y <code>ion-router-outlet</code></li>
<li>Pestañas y pilas</li>
<li>Parámetros y ciclo de vida de páginas</li>
<li>Guardas y botón atrás</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="rutas-en-ionic--vue">Rutas en Ionic + Vue</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/router/index.ts</span>
<span class="hljs-keyword">import</span> { createRouter, createWebHistory } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue-router&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-keyword">type</span> { <span class="hljs-title class_">RouteRecordRaw</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue-router&#x27;</span>;
<span class="hljs-keyword">import</span> <span class="hljs-title class_">TabsPage</span> <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@/views/TabsPage.vue&#x27;</span>;

<span class="hljs-keyword">const</span> <span class="hljs-attr">routes</span>: <span class="hljs-title class_">RouteRecordRaw</span>[] = [
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/&#x27;</span>, <span class="hljs-attr">redirect</span>: <span class="hljs-string">&#x27;/tabs/pedidos&#x27;</span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/login&#x27;</span>,
    <span class="hljs-attr">component</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;@/views/LoginPage.vue&#x27;</span>) },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;/tabs/&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-title class_">TabsPage</span>,
    <span class="hljs-attr">meta</span>: { <span class="hljs-attr">requiereSesion</span>: <span class="hljs-literal">true</span> },
    <span class="hljs-attr">children</span>: [ <span class="hljs-comment">/* siguiente diapositiva */</span> ] },
];

<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-title function_">createRouter</span>({
  <span class="hljs-attr">history</span>: <span class="hljs-title function_">createWebHistory</span>(<span class="hljs-keyword">import</span>.<span class="hljs-property">meta</span>.<span class="hljs-property">env</span>.<span class="hljs-property">BASE_URL</span>),
  routes,
});
</code></pre>
</div>
<div>
<ul>
<li>Ionic usa <strong>Vue Router</strong>, pero <code>createRouter</code> se importa de <strong><code>@ionic/vue-router</code></strong>: así Ionic conoce la dirección de cada navegación</li>
<li><code>ion-router-outlet</code> reemplaza a <code>&lt;router-view&gt;</code> y agrega:
<ul>
<li><strong>animaciones</strong> de transición por plataforma</li>
<li>una <strong>pila</strong> de páginas que se conservan en memoria</li>
<li><strong>deslizar para volver</strong> (modo <code>ios</code>; propiedad <code>swipeGesture</code> desde Ionic 9)</li>
</ul>
</li>
<li><code>() =&gt; import(…)</code> carga cada vista <strong>bajo demanda</strong></li>
<li>Ionic 9 requiere <strong>Vue 3.5+</strong> y <strong>Vue Router 5</strong></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="pesta%C3%B1as-con-pilas-independientes">Pestañas con pilas independientes</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// hijos de &#x27;/tabs/&#x27; en router/index.ts</span>
<span class="hljs-attr">children</span>: [
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;&#x27;</span>, <span class="hljs-attr">redirect</span>: <span class="hljs-string">&#x27;/tabs/pedidos&#x27;</span> },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;pedidos&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;@/views/PedidosPage.vue&#x27;</span>) },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;pedidos/:id&#x27;</span>, <span class="hljs-attr">props</span>: <span class="hljs-literal">true</span>,
    <span class="hljs-attr">component</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;@/views/PedidoDetallePage.vue&#x27;</span>) },
  { <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;perfil&#x27;</span>, <span class="hljs-attr">component</span>: <span class="hljs-function">() =&gt;</span> <span class="hljs-keyword">import</span>(<span class="hljs-string">&#x27;@/views/PerfilPage.vue&#x27;</span>) },
],
</code></pre>
<pre><code class="language-html"><span class="hljs-comment">&lt;!-- src/views/TabsPage.vue --&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ion-page</span>&gt;</span>
    <span class="hljs-tag">&lt;<span class="hljs-name">ion-tabs</span>&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">ion-router-outlet</span> /&gt;</span>
      <span class="hljs-tag">&lt;<span class="hljs-name">ion-tab-bar</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;bottom&quot;</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">ion-tab-button</span> <span class="hljs-attr">tab</span>=<span class="hljs-string">&quot;pedidos&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/tabs/pedidos&quot;</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-icon</span> <span class="hljs-attr">:icon</span>=<span class="hljs-string">&quot;receipt&quot;</span> /&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">ion-label</span>&gt;</span>Pedidos<span class="hljs-tag">&lt;/<span class="hljs-name">ion-label</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-tab-button</span>&gt;</span>
        <span class="hljs-tag">&lt;<span class="hljs-name">ion-tab-button</span> <span class="hljs-attr">tab</span>=<span class="hljs-string">&quot;perfil&quot;</span> <span class="hljs-attr">href</span>=<span class="hljs-string">&quot;/tabs/perfil&quot;</span>&gt;</span>
          <span class="hljs-tag">&lt;<span class="hljs-name">ion-icon</span> <span class="hljs-attr">:icon</span>=<span class="hljs-string">&quot;person&quot;</span> /&gt;</span><span class="hljs-tag">&lt;<span class="hljs-name">ion-label</span>&gt;</span>Perfil<span class="hljs-tag">&lt;/<span class="hljs-name">ion-label</span>&gt;</span>
        <span class="hljs-tag">&lt;/<span class="hljs-name">ion-tab-button</span>&gt;</span>
      <span class="hljs-tag">&lt;/<span class="hljs-name">ion-tab-bar</span>&gt;</span>
    <span class="hljs-tag">&lt;/<span class="hljs-name">ion-tabs</span>&gt;</span>
  <span class="hljs-tag">&lt;/<span class="hljs-name">ion-page</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span>
</code></pre>
</div>
<div>
<ul>
<li>Cada pestaña mantiene <strong>su propia pila</strong>: si el usuario entra a un detalle en <em>Pedidos</em>, cambia a <em>Perfil</em> y regresa, sigue en el detalle</li>
<li>Las rutas de una pestaña comparten <strong>prefijo</strong> (<code>pedidos</code>, <code>pedidos/:id</code>) para que Ionic sepa a qué pila pertenecen</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> No navegue <strong>entre pestañas</strong> con <code>router-link</code> desde el contenido: use la barra de pestañas, o se mezclan las pilas</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="navegar-volver-y-pasar-par%C3%A1metros">Navegar, volver y pasar parámetros</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="desde-la-plantilla">Desde la plantilla</h3>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ion-item</span> <span class="hljs-attr">:router-link</span>=<span class="hljs-string">&quot;`/tabs/pedidos/${p.id}`&quot;</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">ion-button</span> <span class="hljs-attr">router-link</span>=<span class="hljs-string">&quot;/login&quot;</span> <span class="hljs-attr">router-direction</span>=<span class="hljs-string">&quot;root&quot;</span>&gt;</span>
</code></pre>
<h3 id="desde-c%C3%B3digo">Desde código</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { useIonRouter } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;
<span class="hljs-keyword">const</span> ionRouter = <span class="hljs-title function_">useIonRouter</span>();

ionRouter.<span class="hljs-title function_">push</span>(<span class="hljs-string">`/tabs/pedidos/<span class="hljs-subst">${id}</span>`</span>);         <span class="hljs-comment">// avanzar</span>
ionRouter.<span class="hljs-title function_">back</span>();                              <span class="hljs-comment">// volver</span>
ionRouter.<span class="hljs-title function_">navigate</span>(<span class="hljs-string">&#x27;/login&#x27;</span>, <span class="hljs-string">&#x27;root&#x27;</span>, <span class="hljs-string">&#x27;replace&#x27;</span>); <span class="hljs-comment">// nueva raíz</span>
</code></pre>
<h3 id="bot%C3%B3n-atr%C3%A1s">Botón atrás</h3>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">ion-buttons</span> <span class="hljs-attr">slot</span>=<span class="hljs-string">&quot;start&quot;</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">ion-back-button</span> <span class="hljs-attr">default-href</span>=<span class="hljs-string">&quot;/tabs/pedidos&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">ion-buttons</span>&gt;</span>
</code></pre>
</div>
<div>
<h3 id="leer-el-par%C3%A1metro">Leer el parámetro</h3>
<pre><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">script</span> <span class="hljs-attr">setup</span> <span class="hljs-attr">lang</span>=<span class="hljs-string">&quot;ts&quot;</span>&gt;</span><span class="language-javascript">
<span class="hljs-comment">// la ruta tiene props: true → :id llega como prop</span>
<span class="hljs-keyword">const</span> props = defineProps&lt;{ <span class="hljs-attr">id</span>: string }&gt;();
<span class="hljs-keyword">const</span> pedido = ref&lt;<span class="hljs-title class_">Pedido</span> | <span class="hljs-literal">null</span>&gt;(<span class="hljs-literal">null</span>);

<span class="hljs-title function_">onIonViewWillEnter</span>(<span class="hljs-title function_">async</span> () =&gt; {
  pedido.<span class="hljs-property">value</span> = <span class="hljs-keyword">await</span> pedidosApi.<span class="hljs-title function_">obtener</span>(<span class="hljs-title class_">Number</span>(props.<span class="hljs-property">id</span>));
});
</span><span class="hljs-tag">&lt;/<span class="hljs-name">script</span>&gt;</span>
</code></pre>
<ul>
<li><code>router-direction</code> y <code>useIonRouter</code> le dicen a Ionic <strong>qué animación</strong> usar: avanzar, volver o reemplazar la raíz</li>
<li><code>default-href</code> sirve cuando la app se abre <strong>directo</strong> en el detalle (enlace profundo) y no hay pila</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="ciclo-de-vida-de-las-p%C3%A1ginas">Ciclo de vida de las páginas</h2>
<split-slide style="--left: 45%; --right: 55%; --font-size: 0.85rem;">
<div>
<pre><code class="language-text">  navegar hacia la página
         │
   onMounted             ← solo la 1.ª vez
   onIonViewWillEnter    ← cada vez, antes de animar
   onIonViewDidEnter     ← cada vez, al terminar
         │
  navegar a otra página (se queda en la pila)
         │
   onIonViewWillLeave
   onIonViewDidLeave
         │
  sale de la pila (atrás)
         │
   onUnmounted
</code></pre>
</div>
<div>
<ul>
<li>Como <code>ion-router-outlet</code> <strong>conserva</strong> las páginas, <code>onMounted</code> <strong>no</strong> se vuelve a ejecutar al regresar</li>
<li><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> Error frecuente: cargar datos en <code>onMounted</code> y que la lista <strong>no se actualice</strong> al volver de editar</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Recargar datos en <code>onIonViewWillEnter</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Iniciar animaciones pesadas o mapas en <code>onIonViewDidEnter</code></li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Pausar video, GPS o <em>timers</em> en <code>onIonViewWillLeave</code></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Solo funcionan en vistas envueltas en <code>&lt;ion-page&gt;</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="guardas-y-bot%C3%B3n-atr%C3%A1s-de-android">Guardas y botón atrás de Android</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-proteger-rutas"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Proteger rutas</h3>
<pre><code class="language-ts"><span class="hljs-comment">// src/router/index.ts</span>
router.<span class="hljs-title function_">beforeEach</span>(<span class="hljs-title function_">async</span> (to) =&gt; {
  <span class="hljs-keyword">const</span> { cargarToken, estaAutenticado } = <span class="hljs-title function_">useAuth</span>();
  <span class="hljs-keyword">await</span> <span class="hljs-title function_">cargarToken</span>();
  <span class="hljs-keyword">if</span> (to.<span class="hljs-property">meta</span>.<span class="hljs-property">requiereSesion</span> &amp;&amp; !estaAutenticado.<span class="hljs-property">value</span>) {
    <span class="hljs-keyword">return</span> <span class="hljs-string">&#x27;/login&#x27;</span>;
  }
});
</code></pre>
<ul>
<li>El guard <strong>no es seguridad</strong>: solo evita mostrar pantallas inútiles. La API decide con <strong>401/403</strong></li>
</ul>
</div>
<div>
<h3 id="%E2%97%80%EF%B8%8F-bot%C3%B3n--gesto-atr%C3%A1s-del-sistema"><img class="emoji" draggable="false" alt="◀️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25c0.svg" data-marp-twemoji=""/> Botón / gesto atrás del sistema</h3>
<ul>
<li>Ionic lo integra con el router automáticamente</li>
<li>Para personalizarlo (p. ej. confirmar antes de salir de un formulario):</li>
</ul>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { useBackButton, useIonRouter } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">App</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/app&#x27;</span>;

<span class="hljs-keyword">const</span> ionRouter = <span class="hljs-title function_">useIonRouter</span>();

<span class="hljs-comment">// prioridad alta: se ejecuta primero</span>
<span class="hljs-title function_">useBackButton</span>(<span class="hljs-number">10</span>, <span class="hljs-function">(<span class="hljs-params">siguiente</span>) =&gt;</span> {
  <span class="hljs-keyword">if</span> (hayCambios.<span class="hljs-property">value</span>) <span class="hljs-title function_">confirmarSalida</span>();
  <span class="hljs-keyword">else</span> <span class="hljs-title function_">siguiente</span>();
});

<span class="hljs-comment">// prioridad -1: último recurso, en la raíz cierra la app</span>
<span class="hljs-title function_">useBackButton</span>(-<span class="hljs-number">1</span>, <span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">if</span> (!ionRouter.<span class="hljs-title function_">canGoBack</span>()) <span class="hljs-title class_">App</span>.<span class="hljs-title function_">exitApp</span>();
});
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-marpit-scope-YcwbPevI="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="46" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">
<h1 id="gesti%C3%B3n-de-datos">Gestión de datos</h1>
<h2 id="contenidos-7">Contenidos</h2>
<ul>
<li>Dónde viven los datos en una app móvil</li>
<li>Consumo de la API Laravel</li>
<li>Autenticación con tokens</li>
<li>Almacenamiento local y modo sin conexión</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="d%C3%B3nde-viven-los-datos">Dónde viven los datos</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Tipo de dato</th>
<th style="text-align:left">Ejemplo</th>
<th style="text-align:left">Dónde guardarlo</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Estado de pantalla</strong></td>
<td style="text-align:left">Filtro activo, formulario a medias</td>
<td style="text-align:left"><code>ref</code> / <code>reactive</code> del componente</td>
</tr>
<tr>
<td style="text-align:left"><strong>Estado compartido</strong></td>
<td style="text-align:left">Usuario actual, carrito</td>
<td style="text-align:left"><strong>Composable</strong> con estado de módulo o <strong>Pinia</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Preferencias pequeñas</strong></td>
<td style="text-align:left">Tema, idioma, último usuario</td>
<td style="text-align:left"><code>@capacitor/preferences</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Secretos</strong></td>
<td style="text-align:left">Token de acceso</td>
<td style="text-align:left">Almacenamiento <strong>seguro</strong> (Keychain / Keystore)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Datos estructurados locales</strong></td>
<td style="text-align:left">Catálogo sin conexión, cola de envíos</td>
<td style="text-align:left"><strong>SQLite</strong> (<code>@capacitor-community/sqlite</code>)</td>
</tr>
<tr>
<td style="text-align:left"><strong>Archivos</strong></td>
<td style="text-align:left">Fotos, PDFs descargados</td>
<td style="text-align:left"><code>@capacitor/filesystem</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Fuente de verdad</strong></td>
<td style="text-align:left">Pedidos, clientes</td>
<td style="text-align:left"><strong>La API Laravel</strong> en el servidor</td>
</tr>
</tbody>
</table>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> No use <code>localStorage</code> para datos importantes: el sistema operativo <strong>puede borrar</strong> el almacenamiento del WebView cuando falta espacio</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="consumir-la-api-laravel">Consumir la API Laravel</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.78rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/services/pedidos.ts</span>
<span class="hljs-keyword">import</span> { api } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;./api&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">interface</span> <span class="hljs-title class_">Pedido</span> {
  <span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span>; <span class="hljs-attr">cliente</span>: <span class="hljs-built_in">string</span>; <span class="hljs-attr">total</span>: <span class="hljs-built_in">number</span>; <span class="hljs-attr">estado</span>: <span class="hljs-built_in">string</span>;
}
<span class="hljs-keyword">export</span> <span class="hljs-keyword">type</span> <span class="hljs-title class_">NuevoPedido</span> = <span class="hljs-title class_">Omit</span>&lt;<span class="hljs-title class_">Pedido</span>, <span class="hljs-string">&#x27;id&#x27;</span> | <span class="hljs-string">&#x27;total&#x27;</span>&gt;;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> pedidosApi = {
  <span class="hljs-attr">listar</span>: <span class="hljs-function">(<span class="hljs-params">pagina = <span class="hljs-number">1</span></span>) =&gt;</span>
    api&lt;{ <span class="hljs-attr">data</span>: <span class="hljs-title class_">Pedido</span>[] }&gt;(<span class="hljs-string">`/pedidos?page=<span class="hljs-subst">${pagina}</span>`</span>)
      .<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-property">data</span>),

  <span class="hljs-attr">obtener</span>: <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span></span>) =&gt;</span>
    api&lt;{ <span class="hljs-attr">data</span>: <span class="hljs-title class_">Pedido</span> }&gt;(<span class="hljs-string">`/pedidos/<span class="hljs-subst">${id}</span>`</span>).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-property">data</span>),

  <span class="hljs-attr">crear</span>: <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">pedido</span>: <span class="hljs-title class_">NuevoPedido</span></span>) =&gt;</span>
    api&lt;{ <span class="hljs-attr">data</span>: <span class="hljs-title class_">Pedido</span> }&gt;(<span class="hljs-string">&#x27;/pedidos&#x27;</span>, {
      <span class="hljs-attr">method</span>: <span class="hljs-string">&#x27;POST&#x27;</span>, <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(pedido),
    }).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-property">data</span>),

  <span class="hljs-attr">cancelar</span>: <span class="hljs-function">(<span class="hljs-params"><span class="hljs-attr">id</span>: <span class="hljs-built_in">number</span></span>) =&gt;</span>
    api&lt;<span class="hljs-built_in">void</span>&gt;(<span class="hljs-string">`/pedidos/<span class="hljs-subst">${id}</span>`</span>, { <span class="hljs-attr">method</span>: <span class="hljs-string">&#x27;DELETE&#x27;</span> }),
};
</code></pre>
</div>
<div>
<ul>
<li>La app <strong>no conoce</strong> la base de datos: solo el <strong>contrato</strong> de la API (el documento OpenAPI del tema anterior)</li>
<li><code>.data</code> viene de los <strong>API Resources</strong> de Laravel</li>
<li>La vista llama al módulo de servicio; el servicio habla HTTP. Misma <strong>separación por capas</strong> que en el back-end</li>
</ul>
<pre><code class="language-bash"><span class="hljs-comment"># .env  (Vite expone solo las variables VITE_*)</span>
VITE_API_URL=http://10.0.2.2:8000/api
</code></pre>
<ul>
<li><code>10.0.2.2</code> es el <code>localhost</code> de la PC <strong>visto desde el emulador</strong> de Android</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="autenticaci%C3%B3n-con-tokens-de-sanctum">Autenticación con tokens de Sanctum</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.75rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/composables/useAuth.ts</span>
<span class="hljs-keyword">const</span> token = ref&lt;<span class="hljs-built_in">string</span> | <span class="hljs-literal">null</span>&gt;(<span class="hljs-literal">null</span>);   <span class="hljs-comment">// compartido: fuera de la función</span>

<span class="hljs-keyword">export</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">useAuth</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">login</span>(<span class="hljs-params"><span class="hljs-attr">email</span>: <span class="hljs-built_in">string</span>, <span class="hljs-attr">password</span>: <span class="hljs-built_in">string</span></span>) {
    <span class="hljs-keyword">const</span> r = <span class="hljs-keyword">await</span> api&lt;{ <span class="hljs-attr">token</span>: <span class="hljs-built_in">string</span> }&gt;(<span class="hljs-string">&#x27;/login&#x27;</span>, {
      <span class="hljs-attr">method</span>: <span class="hljs-string">&#x27;POST&#x27;</span>,
      <span class="hljs-attr">body</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ email, password, <span class="hljs-attr">device_name</span>: <span class="hljs-string">&#x27;app-movil&#x27;</span> }),
    });
    token.<span class="hljs-property">value</span> = r.<span class="hljs-property">token</span>;
    <span class="hljs-keyword">await</span> almacenSeguro.<span class="hljs-title function_">set</span>(<span class="hljs-string">&#x27;token&#x27;</span>, r.<span class="hljs-property">token</span>);
  }
  <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">cargarToken</span>(<span class="hljs-params"></span>) {
    token.<span class="hljs-property">value</span> ??= <span class="hljs-keyword">await</span> almacenSeguro.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;token&#x27;</span>);
  }
  <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">cerrarSesion</span>(<span class="hljs-params"></span>) {
    token.<span class="hljs-property">value</span> = <span class="hljs-literal">null</span>;
    <span class="hljs-keyword">await</span> almacenSeguro.<span class="hljs-title function_">remove</span>(<span class="hljs-string">&#x27;token&#x27;</span>);
  }
  <span class="hljs-keyword">const</span> estaAutenticado = <span class="hljs-title function_">computed</span>(<span class="hljs-function">() =&gt;</span> token.<span class="hljs-property">value</span> !== <span class="hljs-literal">null</span>);
  <span class="hljs-keyword">return</span> { token, login, cargarToken, cerrarSesion, estaAutenticado };
}
</code></pre>
</div>
<div>
<ul>
<li>Un <strong>composable</strong> con el <code>ref</code> <strong>fuera</strong> de la función: todas las vistas comparten el mismo token (sin necesidad de Pinia)</li>
<li><code>device_name</code> permite que Sanctum emita <strong>un token por dispositivo</strong> y revocarlo</li>
<li><code>cargarToken()</code> lo recupera al abrir la app: lo usa la guarda del router</li>
</ul>
<h3 id="%F0%9F%94%90-almacenseguro"><img class="emoji" draggable="false" alt="🔐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f510.svg" data-marp-twemoji=""/> <code>almacenSeguro</code></h3>
<ul>
<li><code>@capacitor/preferences</code> <strong>no está cifrado</strong>: no sirve para tokens</li>
<li>Use un plugin respaldado por <strong>Keychain</strong> (iOS) y <strong>Keystore</strong> (Android): plugins comunitarios de <em>secure storage</em> o <strong>Identity Vault</strong> (Ionic Enterprise)</li>
<li>Encapsúlelo en un módulo para poder cambiar de plugin sin tocar el resto</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="un-%C3%BAnico-cliente-http-api">Un único cliente HTTP: <code>api()</code></h2>
<split-slide style="--left: 60%; --right: 40%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/services/api.ts</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> api&lt;T&gt;(<span class="hljs-attr">ruta</span>: <span class="hljs-built_in">string</span>, <span class="hljs-attr">op</span>: <span class="hljs-title class_">RequestInit</span> = {}): <span class="hljs-title class_">Promise</span>&lt;T&gt; {
  <span class="hljs-keyword">const</span> { token, cerrarSesion } = <span class="hljs-title function_">useAuth</span>();
  <span class="hljs-keyword">const</span> res = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(<span class="hljs-string">`<span class="hljs-subst">${<span class="hljs-keyword">import</span>.meta.env.VITE_API_URL}</span><span class="hljs-subst">${ruta}</span>`</span>, { ...op,
    <span class="hljs-attr">headers</span>: { <span class="hljs-title class_">Accept</span>: <span class="hljs-string">&#x27;application/json&#x27;</span>,
      ...(<span class="hljs-keyword">typeof</span> op.<span class="hljs-property">body</span> === <span class="hljs-string">&#x27;string&#x27;</span> &amp;&amp; { <span class="hljs-string">&#x27;Content-Type&#x27;</span>: <span class="hljs-string">&#x27;application/json&#x27;</span> }),
      ...(token.<span class="hljs-property">value</span> &amp;&amp; { <span class="hljs-title class_">Authorization</span>: <span class="hljs-string">`Bearer <span class="hljs-subst">${token.value}</span>`</span> }) } });
  <span class="hljs-keyword">if</span> (res.<span class="hljs-property">status</span> === <span class="hljs-number">401</span>) { <span class="hljs-keyword">await</span> <span class="hljs-title function_">cerrarSesion</span>(); router.<span class="hljs-title function_">replace</span>(<span class="hljs-string">&#x27;/login&#x27;</span>); }
  <span class="hljs-keyword">if</span> (!res.<span class="hljs-property">ok</span>) <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">ErrorApi</span>(res.<span class="hljs-property">status</span>, <span class="hljs-keyword">await</span> res.<span class="hljs-title function_">json</span>());
  <span class="hljs-keyword">return</span> res.<span class="hljs-property">status</span> === <span class="hljs-number">204</span> ? (<span class="hljs-literal">undefined</span> <span class="hljs-keyword">as</span> T) : res.<span class="hljs-title function_">json</span>();
}
</code></pre>
</div>
<div>
<pre><code class="language-ts"><span class="hljs-comment">// src/services/errores.ts</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ErrorApi</span> <span class="hljs-keyword">extends</span> <span class="hljs-title class_ inherited__">Error</span> {
  <span class="hljs-title function_">constructor</span>(<span class="hljs-params"><span class="hljs-keyword">public</span> <span class="hljs-attr">status</span>: <span class="hljs-built_in">number</span>, <span class="hljs-keyword">public</span> <span class="hljs-attr">cuerpo</span>: <span class="hljs-built_in">any</span></span>) {
    <span class="hljs-variable language_">super</span>(<span class="hljs-string">`HTTP <span class="hljs-subst">${status}</span>`</span>);
  }
}
</code></pre>
</div>
<div>
<ul>
<li><code>api()</code> es el <strong>único lugar</strong> que conoce la URL base, los encabezados y el token: agrega <code>Authorization: Bearer …</code> a <strong>todas</strong> las peticiones</li>
<li>Hace el papel de un <em>interceptor</em>: sin dependencias, solo <code>fetch</code></li>
<li>Un <strong>401</strong> de la API → borrar el token y volver al login</li>
<li><code>ErrorApi</code> lleva el código y el cuerpo (p. ej. los errores <strong>422</strong>) hasta la vista</li>
<li><code>Accept: application/json</code> hace que Laravel responda errores en <strong>JSON</strong> y no en HTML</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="cors-http-y-la-red-del-dispositivo">CORS, HTTP y la red del dispositivo</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%F0%9F%8C%90-or%C3%ADgenes-de-la-app"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> Orígenes de la app</h3>
<p>La API Laravel debe aceptar los orígenes del WebView:</p>
<pre><code class="language-php"><span class="hljs-comment">// config/cors.php</span>
<span class="hljs-string">&#x27;allowed_origins&#x27;</span> =&gt; [
    <span class="hljs-string">&#x27;http://localhost:8100&#x27;</span>,  <span class="hljs-comment">// ionic serve</span>
    <span class="hljs-string">&#x27;https://localhost&#x27;</span>,      <span class="hljs-comment">// Capacitor Android</span>
    <span class="hljs-string">&#x27;capacitor://localhost&#x27;</span>,  <span class="hljs-comment">// Capacitor iOS</span>
],
</code></pre>
<h3 id="%F0%9F%94%81-alternativa-capacitorhttp"><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Alternativa: <code>CapacitorHttp</code></h3>
<pre><code class="language-ts"><span class="hljs-comment">// capacitor.config.ts</span>
<span class="hljs-attr">plugins</span>: { <span class="hljs-title class_">CapacitorHttp</span>: { <span class="hljs-attr">enabled</span>: <span class="hljs-literal">true</span> } }
</code></pre>
<ul>
<li>Envía <code>fetch</code>/<code>XMLHttpRequest</code> por la <strong>pila HTTP nativa</strong>: sin CORS</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%94%92-tr%C3%A1fico-en-claro"><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f512.svg" data-marp-twemoji=""/> Tráfico en claro</h3>
<ul>
<li>Android y iOS <strong>bloquean HTTP</strong> sin TLS por defecto</li>
<li>En desarrollo: permitir <em>cleartext</em> solo para el host local</li>
<li>En producción: <strong>siempre HTTPS</strong></li>
</ul>
<h3 id="%F0%9F%93%B6-estado-de-la-red"><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f6.svg" data-marp-twemoji=""/> Estado de la red</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Network</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/network&#x27;</span>;

<span class="hljs-keyword">const</span> { connected } = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Network</span>.<span class="hljs-title function_">getStatus</span>();

<span class="hljs-title class_">Network</span>.<span class="hljs-title function_">addListener</span>(<span class="hljs-string">&#x27;networkStatusChange&#x27;</span>, <span class="hljs-function"><span class="hljs-params">s</span> =&gt;</span> {
  <span class="hljs-keyword">if</span> (s.<span class="hljs-property">connected</span>) <span class="hljs-title function_">sincronizarPendientes</span>();
});
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="52" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="preferencias-y-almacenamiento-local">Preferencias y almacenamiento local</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.82rem;">
<div>
<h3 id="%E2%9A%99%EF%B8%8F-capacitorpreferences"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> <code>@capacitor/preferences</code></h3>
<pre><code class="language-bash">npm i @capacitor/preferences
npx <span class="hljs-built_in">cap</span> <span class="hljs-built_in">sync</span>
</code></pre>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Preferences</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/preferences&#x27;</span>;

<span class="hljs-keyword">await</span> <span class="hljs-title class_">Preferences</span>.<span class="hljs-title function_">set</span>({
  <span class="hljs-attr">key</span>: <span class="hljs-string">&#x27;ajustes&#x27;</span>,
  <span class="hljs-attr">value</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>({ <span class="hljs-attr">tema</span>: <span class="hljs-string">&#x27;oscuro&#x27;</span>, <span class="hljs-attr">idioma</span>: <span class="hljs-string">&#x27;es&#x27;</span> }),
});

<span class="hljs-keyword">const</span> { value } = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Preferences</span>.<span class="hljs-title function_">get</span>({ <span class="hljs-attr">key</span>: <span class="hljs-string">&#x27;ajustes&#x27;</span> });
<span class="hljs-keyword">const</span> ajustes = value ? <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">parse</span>(value) : <span class="hljs-literal">null</span>;

<span class="hljs-keyword">await</span> <span class="hljs-title class_">Preferences</span>.<span class="hljs-title function_">remove</span>({ <span class="hljs-attr">key</span>: <span class="hljs-string">&#x27;ajustes&#x27;</span> });
</code></pre>
<ul>
<li><code>SharedPreferences</code> en Android, <code>UserDefaults</code> en iOS</li>
<li>Solo <strong>cadenas</strong> y cantidades <strong>pequeñas</strong> de datos</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%97%84%EF%B8%8F-sqlite-para-datos-estructurados"><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> SQLite para datos estructurados</h3>
<ul>
<li><code>@capacitor-community/sqlite</code>: base de datos <strong>real</strong> en el dispositivo, con consultas SQL y transacciones</li>
<li>Útil para catálogos grandes y apps que deben funcionar <strong>sin conexión</strong></li>
</ul>
<h3 id="%F0%9F%93%81-archivos"><img class="emoji" draggable="false" alt="📁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c1.svg" data-marp-twemoji=""/> Archivos</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Filesystem</span>, <span class="hljs-title class_">Directory</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/filesystem&#x27;</span>;

<span class="hljs-keyword">await</span> <span class="hljs-title class_">Filesystem</span>.<span class="hljs-title function_">writeFile</span>({
  <span class="hljs-attr">path</span>: <span class="hljs-string">&#x27;recibos/123.json&#x27;</span>,
  <span class="hljs-attr">data</span>: <span class="hljs-title class_">JSON</span>.<span class="hljs-title function_">stringify</span>(recibo),
  <span class="hljs-attr">directory</span>: <span class="hljs-title class_">Directory</span>.<span class="hljs-property">Data</span>,
  <span class="hljs-attr">encoding</span>: <span class="hljs-string">&#x27;utf8&#x27;</span>,
  <span class="hljs-attr">recursive</span>: <span class="hljs-literal">true</span>,
});
</code></pre>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="estrategia-sin-conexi%C3%B3n-offline-first">Estrategia sin conexión (offline-first)</h2>
<steps>
<step>
<pre><code class="language-text">  Usuario crea un pedido
        │
        ▼
  ¿Hay red? ──── sí ───▶ POST /api/pedidos ──▶ 201 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/>
        │
        no
        ▼
  Guardar en la cola local (SQLite / Preferences)  ── estado &quot;pendiente de envío&quot;
        │
        ▼
  networkStatusChange → connected  ──▶  reenviar la cola en orden
        │
        ▼
  409 / 422 del servidor → marcar conflicto y avisar al usuario
</code></pre>
</step>
<step>
<div class="grid">
<div>
<h3 id="%F0%9F%94%91-idempotencia"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Idempotencia</h3>
<p>Enviar un identificador generado en el cliente para que un <strong>reintento</strong> no duplique el pedido</p>
</div>
<div>
<h3 id="%F0%9F%95%92-cach%C3%A9-de-lectura"><img class="emoji" draggable="false" alt="🕒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f552.svg" data-marp-twemoji=""/> Caché de lectura</h3>
<p>Mostrar la última copia local <strong>de inmediato</strong> y refrescar desde la API en segundo plano</p>
</div>
<div>
<h3 id="%E2%9A%94%EF%B8%8F-conflictos"><img class="emoji" draggable="false" alt="⚔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2694.svg" data-marp-twemoji=""/> Conflictos</h3>
<p>El servidor es la <strong>fuente de verdad</strong>: la app informa, no sobrescribe a ciegas</p>
</div>
<div>
<h3 id="%F0%9F%91%80-visibilidad"><img class="emoji" draggable="false" alt="👀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f440.svg" data-marp-twemoji=""/> Visibilidad</h3>
<p>El usuario debe <strong>ver</strong> qué está sincronizado y qué no</p>
</div>
</div>
</step>
</steps>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-marpit-scope-6p88j7Gi="" data-paginate="true" data-class="cover" data-theme="alo" lang="en-US" class="cover" data-marpit-pagination="54" style="--paginate:true;--class:cover;--theme:alo;" data-marpit-pagination-total="62">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="plugins-de-capacitor">Plugins de Capacitor</h2>
<div class="grid">
<div>
<h3 id="%F0%9F%93%B7-multimedia"><img class="emoji" draggable="false" alt="📷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f7.svg" data-marp-twemoji=""/> Multimedia</h3>
<p><code>@capacitor/camera</code>, <code>@capacitor/barcode-scanner</code>, <code>@capacitor/screen-reader</code></p>
</div>
<div>
<h3 id="%F0%9F%93%8D-ubicaci%C3%B3n-y-movimiento"><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> Ubicación y movimiento</h3>

</div>
<div>
<h3 id="%F0%9F%93%B1-dispositivo"><img class="emoji" draggable="false" alt="📱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f1.svg" data-marp-twemoji=""/> Dispositivo</h3>

</div>
<div>
<h3 id="%F0%9F%A7%B0-sistema"><img class="emoji" draggable="false" alt="🧰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f0.svg" data-marp-twemoji=""/> Sistema</h3>
<p><code>@capacitor/app</code>, <code>@capacitor/share</code>, <code>@capacitor/clipboard</code>, <code>@capacitor/keyboard</code>, <code>@capacitor/status-bar</code></p>
</div>
<div>
<h3 id="%F0%9F%8C%8D-comunidad"><img class="emoji" draggable="false" alt="🌍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30d.svg" data-marp-twemoji=""/> Comunidad</h3>
<p>Capacitor Community y Capawesome: biometría, SQLite, NFC, Bluetooth LE, Google Maps…</p>
</div>
</div>
<ul>
<li><img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> El patrón es siempre el mismo: <code>npm i @capacitor/&lt;plugin&gt;</code> → <code>npx cap sync</code> → configurar permisos → <code>import</code> y <code>await</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="permisos">Permisos</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="en-tiempo-de-ejecuci%C3%B3n">En tiempo de ejecución</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Geolocation</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/geolocation&#x27;</span>;

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">asegurarPermiso</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">let</span> estado = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Geolocation</span>.<span class="hljs-title function_">checkPermissions</span>();

  <span class="hljs-keyword">if</span> (estado.<span class="hljs-property">location</span> === <span class="hljs-string">&#x27;prompt&#x27;</span>) {
    estado = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Geolocation</span>.<span class="hljs-title function_">requestPermissions</span>();
  }
  <span class="hljs-keyword">if</span> (estado.<span class="hljs-property">location</span> === <span class="hljs-string">&#x27;denied&#x27;</span>) {
    <span class="hljs-comment">// explicar por qué se necesita y cómo</span>
    <span class="hljs-comment">// activarlo en Ajustes</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
  }
  <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
}
</code></pre>
<ul>
<li>Estados: <code>granted</code>, <code>denied</code>, <code>prompt</code>, <code>prompt-with-rationale</code></li>
</ul>
</div>
<div>
<h3 id="declarados-en-el-proyecto-nativo">Declarados en el proyecto nativo</h3>
<p><strong>iOS</strong> — <code>ios/App/App/Info.plist</code></p>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">key</span>&gt;</span>NSCameraUsageDescription<span class="hljs-tag">&lt;/<span class="hljs-name">key</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">string</span>&gt;</span>Para fotografiar el comprobante<span class="hljs-tag">&lt;/<span class="hljs-name">string</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">key</span>&gt;</span>NSLocationWhenInUseUsageDescription<span class="hljs-tag">&lt;/<span class="hljs-name">key</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">string</span>&gt;</span>Para calcular el envío<span class="hljs-tag">&lt;/<span class="hljs-name">string</span>&gt;</span>
</code></pre>
<p><strong>Android</strong> — <code>AndroidManifest.xml</code></p>
<pre><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">uses-permission</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;android.permission.ACCESS_COARSE_LOCATION&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">uses-permission</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;android.permission.ACCESS_FINE_LOCATION&quot;</span> /&gt;</span>
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> Sin la descripción en <code>Info.plist</code>, iOS <strong>cierra la app</strong> al pedir el permiso</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> Pida el permiso <strong>en contexto</strong>, cuando el usuario toca la función, no al abrir la app</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="c%C3%A1mara">Cámara</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts">&lt;script setup lang=<span class="hljs-string">&quot;ts&quot;</span>&gt;
<span class="hljs-keyword">import</span> { ref } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;vue&#x27;</span>;
<span class="hljs-keyword">import</span> { <span class="hljs-title class_">Camera</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/camera&#x27;</span>;

<span class="hljs-keyword">const</span> props = defineProps&lt;{ <span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span> }&gt;();
<span class="hljs-keyword">const</span> foto = ref&lt;<span class="hljs-built_in">string</span> | <span class="hljs-literal">null</span>&gt;(<span class="hljs-literal">null</span>);

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">tomarFoto</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> r = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Camera</span>.<span class="hljs-title function_">takePhoto</span>({ <span class="hljs-attr">quality</span>: <span class="hljs-number">80</span> });
  foto.<span class="hljs-property">value</span> = r.<span class="hljs-property">webPath</span>;            <span class="hljs-comment">// usable en &lt;img src&gt;</span>
}

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">elegirDeGaleria</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> { results } = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Camera</span>.<span class="hljs-title function_">chooseFromGallery</span>({ <span class="hljs-attr">quality</span>: <span class="hljs-number">80</span> });
  foto.<span class="hljs-property">value</span> = results[<span class="hljs-number">0</span>]?.<span class="hljs-property">webPath</span> ?? <span class="hljs-literal">null</span>;
}

<span class="hljs-keyword">async</span> <span class="hljs-keyword">function</span> <span class="hljs-title function_">subir</span>(<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> blob = <span class="hljs-keyword">await</span> <span class="hljs-title function_">fetch</span>(foto.<span class="hljs-property">value</span>!).<span class="hljs-title function_">then</span>(<span class="hljs-function"><span class="hljs-params">r</span> =&gt;</span> r.<span class="hljs-title function_">blob</span>());
  <span class="hljs-keyword">const</span> datos = <span class="hljs-keyword">new</span> <span class="hljs-title class_">FormData</span>();
  datos.<span class="hljs-title function_">append</span>(<span class="hljs-string">&#x27;comprobante&#x27;</span>, blob, <span class="hljs-string">&#x27;comprobante.jpg&#x27;</span>);
  <span class="hljs-keyword">await</span> <span class="hljs-title function_">api</span>(<span class="hljs-string">`/pedidos/<span class="hljs-subst">${props.id}</span>/comprobante`</span>,
    { <span class="hljs-attr">method</span>: <span class="hljs-string">&#x27;POST&#x27;</span>, <span class="hljs-attr">body</span>: datos });
}
&lt;/script&gt;

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">template</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">img</span> <span class="hljs-attr">v-if</span>=<span class="hljs-string">&quot;foto&quot;</span> <span class="hljs-attr">:src</span>=<span class="hljs-string">&quot;foto&quot;</span> <span class="hljs-attr">alt</span>=<span class="hljs-string">&quot;Comprobante&quot;</span> /&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">template</span>&gt;</span></span>
</code></pre>
</div>
<div>
<ul>
<li><strong>Desde <code>@capacitor/camera</code> 8.1</strong>: <code>takePhoto()</code> y <code>chooseFromGallery()</code></li>
<li><code>getPhoto()</code> y <code>pickImages()</code> quedan <strong>obsoletos</strong>; el diálogo &quot;Cámara o Galería&quot; ya no lo pone el plugin: use un <code>ion-action-sheet</code></li>
<li>El resultado trae <code>webPath</code> (para mostrar), <code>uri</code> (ruta nativa) y <code>thumbnail</code></li>
<li>En el navegador funciona con <code>&lt;input type=&quot;file&quot;&gt;</code> como respaldo</li>
<li>La subida al servidor es un <code>multipart/form-data</code> normal que Laravel recibe con <code>$request-&gt;file('comprobante')</code> (por eso <code>api()</code> no fija <code>Content-Type</code> cuando el cuerpo es <code>FormData</code>)</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="geolocalizaci%C3%B3n">Geolocalización</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.8rem;">
<div>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Geolocation</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/geolocation&#x27;</span>;

<span class="hljs-comment">// Una lectura</span>
<span class="hljs-keyword">const</span> pos = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Geolocation</span>.<span class="hljs-title function_">getCurrentPosition</span>({
  <span class="hljs-attr">enableHighAccuracy</span>: <span class="hljs-literal">true</span>,
  <span class="hljs-attr">timeout</span>: <span class="hljs-number">10_000</span>,
});
<span class="hljs-keyword">const</span> { latitude, longitude, accuracy } = pos.<span class="hljs-property">coords</span>;

<span class="hljs-comment">// Seguimiento continuo mientras la vista está activa</span>
<span class="hljs-keyword">let</span> <span class="hljs-attr">id</span>: <span class="hljs-built_in">string</span> | <span class="hljs-literal">undefined</span>;

<span class="hljs-title function_">onIonViewDidEnter</span>(<span class="hljs-title function_">async</span> () =&gt; {
  id = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Geolocation</span>.<span class="hljs-title function_">watchPosition</span>(
    { <span class="hljs-attr">enableHighAccuracy</span>: <span class="hljs-literal">true</span> },
    <span class="hljs-function">(<span class="hljs-params">pos, err</span>) =&gt;</span> { <span class="hljs-keyword">if</span> (pos) repartidor.<span class="hljs-property">value</span> = pos.<span class="hljs-property">coords</span>; },
  );
});

<span class="hljs-comment">// ¡Siempre detenerlo!</span>
<span class="hljs-title function_">onIonViewWillLeave</span>(<span class="hljs-function">() =&gt;</span> {
  <span class="hljs-keyword">if</span> (id) <span class="hljs-title class_">Geolocation</span>.<span class="hljs-title function_">clearWatch</span>({ id });
});
</code></pre>
</div>
<div>
<ul>
<li><code>enableHighAccuracy</code> usa el <strong>GPS</strong>: más preciso, más batería</li>
<li>Sin él se usa Wi-Fi y antenas: más rápido y barato</li>
<li><code>accuracy</code> indica el <strong>margen de error en metros</strong></li>
<li><code>watchPosition</code> sin <code>clearWatch</code> = batería drenada y usuarios molestos</li>
<li>La ubicación <strong>en segundo plano</strong> requiere permisos y plugins adicionales, y las tiendas la revisan con lupa</li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="otros-recursos-del-dispositivo">Otros recursos del dispositivo</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.8rem;">
<div>
<h3 id="%F0%9F%93%B3-h%C3%A1ptica"><img class="emoji" draggable="false" alt="📳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f3.svg" data-marp-twemoji=""/> Háptica</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Haptics</span>, <span class="hljs-title class_">ImpactStyle</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/haptics&#x27;</span>;
<span class="hljs-keyword">await</span> <span class="hljs-title class_">Haptics</span>.<span class="hljs-title function_">impact</span>({ <span class="hljs-attr">style</span>: <span class="hljs-title class_">ImpactStyle</span>.<span class="hljs-property">Medium</span> });
</code></pre>
<h3 id="%E2%84%B9%EF%B8%8F-dispositivo"><img class="emoji" draggable="false" alt="ℹ️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2139.svg" data-marp-twemoji=""/> Dispositivo</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Device</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/device&#x27;</span>;
<span class="hljs-keyword">const</span> info = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Device</span>.<span class="hljs-title function_">getInfo</span>();   <span class="hljs-comment">// platform, model, osVersion…</span>
<span class="hljs-keyword">const</span> bateria = <span class="hljs-keyword">await</span> <span class="hljs-title class_">Device</span>.<span class="hljs-title function_">getBatteryInfo</span>();
</code></pre>
<h3 id="%F0%9F%93%A4-compartir"><img class="emoji" draggable="false" alt="📤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e4.svg" data-marp-twemoji=""/> Compartir</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Share</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/share&#x27;</span>;
<span class="hljs-keyword">await</span> <span class="hljs-title class_">Share</span>.<span class="hljs-title function_">share</span>({ <span class="hljs-attr">title</span>: <span class="hljs-string">&#x27;Mi pedido&#x27;</span>, <span class="hljs-attr">url</span>: <span class="hljs-string">&#x27;https://…/pedidos/123&#x27;</span> });
</code></pre>
</div>
<div>
<h3 id="%F0%9F%A7%AD-movimiento"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Movimiento</h3>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Motion</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/motion&#x27;</span>;
<span class="hljs-title class_">Motion</span>.<span class="hljs-title function_">addListener</span>(<span class="hljs-string">&#x27;accel&#x27;</span>, <span class="hljs-function"><span class="hljs-params">e</span> =&gt;</span> {
  <span class="hljs-keyword">const</span> { x, y, z } = e.<span class="hljs-property">acceleration</span>;
});
</code></pre>
<h3 id="%F0%9F%94%94-notificaciones-push"><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> Notificaciones push</h3>
<ul>
<li><code>@capacitor/push-notifications</code> registra el dispositivo y entrega un <strong>token</strong> de FCM (Android) / APNs (iOS)</li>
<li>La app envía ese token a <strong>Laravel</strong>, que lo usa para notificar: &quot;Tu pedido está listo&quot;</li>
<li>Requiere configurar <strong>Firebase</strong> y la cuenta de Apple Developer</li>
</ul>
</div>
</split-slide>
</section>

<h2 id="web-vs-nativo-en-el-mismo-c%C3%B3digo">Web vs. nativo en el mismo código</h2>
<split-slide style="--left: 55%; --right: 45%; --font-size: 0.85rem;">
<div>
<pre><code class="language-ts"><span class="hljs-keyword">import</span> { <span class="hljs-title class_">Capacitor</span> } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@capacitor/core&#x27;</span>;

<span class="hljs-title class_">Capacitor</span>.<span class="hljs-title function_">getPlatform</span>();        <span class="hljs-comment">// &#x27;web&#x27; | &#x27;android&#x27; | &#x27;ios&#x27;</span>
<span class="hljs-title class_">Capacitor</span>.<span class="hljs-title function_">isNativePlatform</span>();   <span class="hljs-comment">// true en Android / iOS</span>

<span class="hljs-keyword">if</span> (!<span class="hljs-title class_">Capacitor</span>.<span class="hljs-title function_">isPluginAvailable</span>(<span class="hljs-string">&#x27;Camera&#x27;</span>)) {
  <span class="hljs-comment">// ofrecer subir un archivo en su lugar</span>
}
</code></pre>
<pre><code class="language-ts"><span class="hljs-comment">// Ionic también expone la plataforma</span>
<span class="hljs-keyword">import</span> { isPlatform } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@ionic/vue&#x27;</span>;

<span class="hljs-title function_">isPlatform</span>(<span class="hljs-string">&#x27;android&#x27;</span>);
<span class="hljs-title function_">isPlatform</span>(<span class="hljs-string">&#x27;hybrid&#x27;</span>);     <span class="hljs-comment">// corre dentro de Capacitor</span>
<span class="hljs-title function_">isPlatform</span>(<span class="hljs-string">&#x27;mobileweb&#x27;</span>);  <span class="hljs-comment">// navegador de un teléfono</span>
</code></pre>
</div>
<div>
<ul>
<li>La <strong>misma</strong> app corre en el navegador, Android e iOS: decida en tiempo de ejecución qué ofrecer</li>
<li>Diseñe una <strong>degradación elegante</strong>: si no hay cámara, un selector de archivo; si no hay GPS, un campo de dirección</li>
<li>¿No existe el plugin? Capacitor permite <strong>escribir uno propio</strong> en Kotlin y Swift con <code>npm init @capacitor/plugin</code></li>
</ul>
</div>
</split-slide>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="alo" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:alo;" data-marpit-pagination-total="62">
<h2 id="%F0%9F%93%8B-laboratorio--app-m%C3%B3vil-del-proyecto"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> Laboratorio — App móvil del proyecto</h2>
<split-slide style="--left: 50%; --right: 50%; --font-size: 0.9rem;">
<div>
<h3 id="qu%C3%A9-se-entrega">Qué se entrega</h3>
<ul>
<li>Proyecto <strong>Ionic 9 + Capacitor 8</strong> con plataforma <strong>Android</strong> (iOS opcional)</li>
<li><strong>Login</strong> contra la API Laravel con token de Sanctum guardado de forma <strong>segura</strong></li>
<li>Navegación con <strong>pestañas</strong> y al menos una pila <strong>lista → detalle → formulario</strong></li>
<li><strong>CRUD</strong> de una entidad del proyecto consumiendo la API</li>
<li>Manejo visible de <strong>errores</strong> (401, 422, sin conexión)</li>
</ul>
</div>
<div>
<h3 id="hardware-al-menos-uno">Hardware (al menos uno)</h3>
<ul>
<li><img class="emoji" draggable="false" alt="📷" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f7.svg" data-marp-twemoji=""/> Cámara: adjuntar una foto a un registro</li>
<li><img class="emoji" draggable="false" alt="📍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cd.svg" data-marp-twemoji=""/> Geolocalización: guardar o mostrar una ubicación</li>
<li><img class="emoji" draggable="false" alt="📶" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f6.svg" data-marp-twemoji=""/> Red: aviso y cola de envíos sin conexión</li>
<li><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> Notificación local al completar una acción</li>
</ul>
<h3 id="evidencia">Evidencia</h3>
<ul>
<li>APK de depuración instalable</li>
<li>Video corto en un <strong>dispositivo físico o emulador</strong></li>
<li>README con la versión de Node, Ionic y Capacitor usadas</li>
</ul>
</div>
</split-slide>
</section>
